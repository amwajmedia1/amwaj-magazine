egional price differences, job security and access to public services all affect disposable income, and a household with a regular salary may look stable on paper while having little left after essential expenses."},{"t":"p","html":"A welfare system designed mainly to prevent extreme poverty may therefore miss the gradual erosion of middle-class security. Families respond to rising costs by drawing down savings, postponing medical care or leisure, cutting spending or relying on relatives—including members of the diaspora—for support. Such adjustments may keep them above official poverty thresholds for a while, but the likely result is a gradual slide below the poverty line."},{"t":"p","html":"A core question is whether the new system can respond to the level of vulnerability. Better targeting may stretch limited public resources further, but trial-and-error measures of household circumstances can exclude people whose finances have deteriorated, while poorly targeted universal payments send scarce money to those who need it less. The aim should not be to extend every subsidy to every household indefinitely, but to ensure that eligibility rules reflect actual socio-economic vulnerability."},{"t":"h","text":"A vicious cycle"},{"t":"p","html":"The deeper limitation of direct transfers is that they leave untouched the main forces behind falling household incomes, as the wider economy is itself <a href=\"https://amwaj.media/en/article/deep-dive-irans-economy-of-depletion\" target=\"_blank\" rel=\"noopener\">eroding</a> under pressure. The World Bank has <a href=\"https://www.worldbank.org/en/country/iran\" target=\"_blank\" rel=\"noopener\">identified</a> budget deficits, monetary pressures and currency depreciation among the drivers of inflation in Iran, noting that sanctions and external shocks have compounded the country's economic difficulties. A weaker currency raises the cost of imports and production inputs alike, while uncertainty complicates decisions on investment, jobs and wages."},{"t":"graph","id":"23563754"},{"t":"p","html":"The result is a vicious cycle. Cash handouts offset the impact of rising prices, but if inflation persists, the value of that assistance declines. Keeping it effective then requires further increases in nominal payments, potentially adding pressure to an already stretched budget. The same cycle is the main reason for hesitation over the planned fuel subsidy reforms."},{"t":"p","html":"Well-designed assistance can protect consumption without undermining stability, but it cannot compensate households for inflation indefinitely. Direct handouts cannot restore confidence in the currency, stabilize prices or create the conditions for salary adjustments."},{"t":"p","html":"Yet the alternative is not an abrupt withdrawal of subsidies. Removing price supports without adequate compensation hits vulnerable households at once, particularly where food and energy take up much of their spending. Iran's earlier reforms show the value of pairing changes in administered prices with reliable, well-targeted assistance."},{"t":"p","html":"Within Iran's political economy, subsidy reform involves competing demands. Direct assistance softens the immediate social impact of rising prices, but the government must weigh its cost, the reliability of its funding and other claims on public resources. Where the cost is not covered, the result is a budget deficit that in turn feeds inflation."},{"t":"p","html":"This year's budget <a href=\"https://nezamat.ir/%d8%af%d8%b3%d8%aa%d9%88%d8%b1%d8%a7%d9%84%d8%b9%d9%85%d9%84-%d8%a7%d8%ac%d8%b1%d8%a7%db%8c%db%8c-%d9%85%d8%a7%d8%af%d9%87-%d9%a9%db%b5-%d8%b6%d9%88%d8%a7%d8%a8%d8%b7-%d8%a7%d8%ac%d8%b1%d8%a7%db%8c/\" target=\"_blank\" rel=\"noopener\">legislation</a>, drafted as a blueprint for a war economy, shows how much this balancing act still matters. It removed cash subsidies from higher-income deciles and redirected resources to poorer households, including through electronic cards used to buy essential goods."},{"t":"p","html":"The key challenge remains administrative classification, which will inevitably leave gaps. Yet maintaining broad subsidies regardless of their distributional effects can absorb resources that households in greater need could use. There is no simple choice between universal subsidies and targeted cash transfers. The real question is whether the system as a whole can provide predictable and adequate protection without reinforcing the economic pressures that undermine it."},{"t":"h","text":"Moving forward"},{"t":"p","html":"A sustainable approach would combine well-targeted transfers with regular assessments of purchasing power, transparent eligibility criteria and measures to ease inflation. It would also need better data on household spending and vulnerability, to tell families facing temporary hardship from those in sustained decline. The country's upcoming <a href=\"https://donya-e-eqtesad.com/%D8%A8%D8%AE%D8%B4-%D8%A8%D8%A7%D8%B2%D8%A7%D8%B1-%D9%BE%D9%88%D9%84-%D8%A7%D8%B1%D8%B2-116/4300329-%D8%B3%D8%B1%D8%B4%D9%85%D8%A7%D8%B1%DB%8C-%D8%AF%D8%A7%D8%AF%D9%87-%D9%85%D8%AD%D9%88%D8%B1\" target=\"_blank\" rel=\"noopener\">census</a> should be used to collect it."},{"t":"p","html":"Such measures would not remove the hard trade-offs the government faces, and whose options remain limited by fiscal constraints and external pressures. But they would allow social protection to be judged by its actual effect on households rather than by the nominal scale of spending, and integrated into a broader economic framework rather than expected to indefinitely make up for instability."},{"t":"p","html":"It remains to be seen whether social assistance will be matched by a credible effort to restore stability. For Iran's lower and middle classes, the difference between receiving assistance and achieving economic security will ultimately depend on whether policy can move beyond compensation to tackle the forces that make compensation necessary in the first place."}],"words":1201}]};

        + (canFull ? '<button class="arrow sm" id="full" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path id="fullp" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>' : '')
        + '</span></nav></div></div>';
      $('prev').onclick = function () { step(-1); };
      $('next').onclick = function () { step(1); };
      $('zout').onclick = function () { zoom(-1); };
      $('zin').onclick = function () { zoom(1); };
      $('zl').onclick = function () { zi = 0; size(); };
      if ($('full')) $('full').onclick = toggleFull;
      $('fdn').onclick = function () { textSize(-1); };
      $('fup').onclick = function () { textSize(1); };
      // the reader always opens with the contents drawer out (Editor, Nov. 11, 2026)
      setDrawer(true);
      // a swipe turns the page, unless the page is zoomed in (then a drag moves around it)
      var sx = null, sy = 0;
      $('stage').addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
      $('stage').addEventListener('pointerup', function (e) {
        if (sx == null || zi > 0) { sx = null; return; } var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
      });
    }
    if (!story || story.p !== p) openStory(p, m && m[2] ? +m[2] - 1 : 0);
    else if (m && m[2] && +m[2] - 1 !== story.at) showSpread(Math.min(+m[2] - 1, Math.ceil(story.pages.length / 2) - 1));
  }
  // the minimized drawer: a tab floating on the right edge brings it back
  $('dtab').onclick = function () { setDrawer(true); };
  // the header's button: "Open reader" (the contents spread) on the front page, "Front page" anywhere else (Editor, Nov. 11, 2026)
  function headerBtn() {
    var home = curKey === 'home', b = $('cbtn');
    b.href = home ? '#contents' : '#home';
    b.lastChild.textContent = home ? 'Open reader' : 'Front page';
  }
  // on a phone the drawer lies over the page: a tap outside it closes it
  document.addEventListener('click', function (e) {
    if (wide || !document.body.classList.contains('dopen') || !e.target.closest) return;
    if (e.target.closest('#drawer') || e.target.closest('#cbtn')) return;
    setDrawer(false);
  });
  // ---------- Subscribe: the Weekly newsletter through the app's subscribe.php (same Mailchimp audience and groups) ----------
  var SUB_API = 'https://readingtehran.com/app-api/subscribe.php';
  var dlg = $('subd'), form = $('subf'), msg = $('submsg');
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('[data-sub]')) return;
    msg.textContent = ''; msg.className = 'msg'; $('subgo').disabled = false; $('subgo').textContent = 'Subscribe';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    form.elements.name.focus();
  });
  $('subx').onclick = function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); };
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = form.elements, langs = [].filter.call(form.querySelectorAll('input[name=lang]'), function (i) { return i.checked; }).map(function (i) { return i.value; });
    var say = function (t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
    if (f.name.value.trim().length < 2) return say('Please enter your full name.');
    if (!/^\S+@\S+\.\S+$/.test(f.email.value.trim())) return say('Please enter a valid email address.');
    if (!langs.length) return say('Please choose at least one language.');
    if (!f.terms.checked) return say('Please accept the terms and conditions.');
    var go = $('subgo'); go.disabled = true; go.textContent = 'Signing you up…'; say('', true);
    fetch(SUB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.value.trim(), email: f.email.value.trim(), languages: langs, frequency: 'weekly', acceptTerms: true }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (x.ok) { say(x.j.message || 'You have been subscribed to our newsletter!', true); go.textContent = 'Done'; return; }
        go.disabled = false; go.textContent = 'Subscribe';
        say(x.j.error || 'We could not sign you up right now. Please try again later.');
        if (x.j.resubscribeUrl) { var a = document.createElement('a'); a.href = x.j.resubscribeUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = ' Open amwaj.media'; msg.appendChild(a); }
      }, function () { go.disabled = false; go.textContent = 'Subscribe'; say('We could not reach the sign-up. Please check your connection and try again.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (!story || (dlg && dlg.open) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoom(1); }
    if (e.key === '-') { e.preventDefault(); zoom(-1); }
    if (e.key === '0') { zi = 0; size(); }
    if (e.key === 'f' || e.key === 'F') toggleFull();
  });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      var p = $('fullp'); if (p) p.setAttribute('d', fullOn() ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
      if ($('full')) $('full').setAttribute('aria-label', fullOn() ? 'Leave full screen' : 'Full screen');
      setTimeout(size, 60);
    });
  });
  // "Browse all stories" scrolls to the story cards
  document.addEventListener('click', function (e) {
    var j = e.target.closest && e.target.closest('[data-jump]');
    if (j && $(j.dataset.jump)) $(j.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  window.addEventListener('hashchange', function () {
    var m = /^#story-(\d+)/.exec(location.hash);
    if (story && m && +m[1] === story.p.no) { var s = /-p(\d+)$/.exec(location.hash); if (s && +s[1] - 1 !== story.at) showSpread(+s[1] - 1); return; }
    route();
  });
  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var wasWide = wide, nowWide = window.matchMedia('(min-width:900px)').matches;
      if (story && wasWide && nowWide) size();
      else if (wasWide !== nowWide) { story = null; route(); }
    }, 180);
  });
  var fontsReady = document.fonts && document.fonts.load ? Promise.all([400, 700, 900].map(function (w) { return document.fonts.load(w + ' 16px Sombra'); })).catch(function () {}) : Promise.resolve();
  Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () { paginateAll(); route(); });
})();
</script>
