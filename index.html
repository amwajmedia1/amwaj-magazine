<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The week’s reporting and analysis from Amwaj.media on Iran, Iraq and the Arabian Peninsula. Issue 45: Can Zaidi keep Iraq from becoming Riyadh's battlefield?">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Amwaj Magazine">
<meta property="og:title" content="Amwaj Magazine, Issue 45">
<meta property="og:description" content="The week’s reporting and analysis from Amwaj.media on Iran, Iraq and the Arabian Peninsula. Issue 45: Can Zaidi keep Iraq from becoming Riyadh's battlefield?">
<meta property="og:url" content="https://magazine.amwaj.media/">
<meta property="og:image" content="https://magazine.amwaj.media/img/02.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@Amwajmedia">
<link rel="icon" href="logo.png">
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>Amwaj Magazine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@900&amp;display=swap">
<style>
/* Amwaj Magazine, v5 (Nov. 11, 2026), in the design Claude Desktop mocked up for the Editor
   (https://claude.ai/artifact/5pf4iWjbGsCLQnSi2UVBzQ): a web-style issue front page (turquoise wordmark cover,
   "Number of the week", "The week in a minute", "In this wave" by region, a turquoise footer); each story opens as
   paginated spreads on a computer and scrolls as one page on a phone. The wordmark's first "a" in Magazine is the joined
   Arabic ta marbuta. Reused blocks from reader2.html (openers, text flow, graphics) are inserted by inline3.js. */
:root{
  --ground:#F4F7F6; --desk:#E4EAE9; --paper:#FFFFFF; --ink:#2F3333; --ink2:#5C6567; --rule:#D9E1DF;
  --teal:#00A693; --teal-ink:#007D6E; --teal-deep:#06302A; --orange:#FFA333; --sand:#C09B5C; --brown:#64402E; --burg:#9B4F4F;
  --shade:rgba(20,40,36,.16); --chip:#E2F3F0; --tint:#F4F7F6; --paper-old:#F6F0E3;
  --display:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Medium.ttf) format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Black.ttf) format("truetype");font-weight:900;font-display:block}
body{background:var(--ground);color:var(--ink);font-family:var(--body)}
body.reading{background:var(--desk);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
/* ---------- openers ---------- */
.kick{display:flex;flex-wrap:wrap;gap:.6em 1.1em;font-size:2.3cqw;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.kick .r{color:var(--teal-ink)}.kick .y{opacity:.75}
.by{font-size:2.6cqw;margin-top:2.2cqw;opacity:.85}
.by b{font-weight:700}
/* A: the photo takes the page, the headline sits on it */
.op-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-a .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,13,.05) 35%,rgba(5,15,13,.9) 100%)}
.op-a .tx{position:absolute;left:7.5cqw;right:7.5cqw;bottom:7cqw;color:#fff;z-index:1}
.op-a .kick .r{color:#7FE3D4}
.op-a h1{font-family:var(--display);font-weight:900;font-size:7.6cqw;line-height:1.02;margin:2cqw 0 0;text-wrap:balance}
/* B: headline first, the photo below it */
.op-b .tx{padding:8cqw 7.5cqw 4cqw}
.op-b h1{font-family:var(--display);font-weight:900;font-size:8.4cqw;line-height:.98;letter-spacing:-.015em;margin:2.4cqw 0 0;text-wrap:balance}
.op-b .ph{flex:1;min-height:0;position:relative;margin:0 7.5cqw 7cqw}
.op-b .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-b .ph::before{content:"";position:absolute;left:-2.4cqw;top:-2.4cqw;width:22cqw;height:22cqw;background:var(--orange);z-index:0}
.op-b .ph img{z-index:1}
/* C: Media Monitor, a coloured band with the label, the photo as a strip */
.op-c .band{background:var(--brown);color:#fff;padding:7cqw 7.5cqw 6cqw}
.op-c .label{font-family:var(--display);font-weight:900;font-size:4.2cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.op-c h1{font-family:var(--display);font-weight:900;font-size:6.6cqw;line-height:1.04;margin:2.4cqw 0 0;text-wrap:balance}
.op-c .kick .r{color:#FFC98A}
.op-c .ph{position:relative;flex:1;min-height:0}
.op-c .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* D: a typographic opener; the photo goes into the text */
.op-d .tx{padding:9cqw 7.5cqw 0;display:flex;flex-direction:column;height:100%}
.op-d h1{font-family:var(--display);font-weight:900;font-size:10cqw;line-height:.95;letter-spacing:-.02em;margin:2.6cqw 0 0;text-wrap:balance}
.op-d .bl-big{margin-top:auto;margin-bottom:7cqw;border-top:4px solid var(--teal);padding-top:3cqw}
.op-d .bl-big h4{margin:0 0 1.6cqw;font-size:2.4cqw;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.op-d .bl-big p{margin:0;font-size:3.6cqw;line-height:1.38;font-weight:500}
/* Old News: the photo aged, an archive-paper band */
.op-o{background:#EFE6D3;color:#3A2A1C}
.op-o .ph{position:relative;height:56%}
.op-o .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.75) contrast(1.05) brightness(.95)}
.op-o .tx{padding:5cqw 7.5cqw 0}
.op-o .label{display:inline-block;border:2px solid #3A2A1C;font-weight:900;font-size:2.6cqw;letter-spacing:.16em;text-transform:uppercase;padding:.6cqw 1.6cqw}
.op-o h1{font-family:var(--display);font-weight:900;font-size:7cqw;line-height:1.02;margin:2.4cqw 0 0;text-wrap:balance}
.op-o .kick .r{color:var(--brown)}

/* ---------- the text flow ---------- */
.fview{flex:1;min-height:0;overflow:hidden;margin:6.5cqw 7.5cqw 0;position:relative}
.flow{height:100%;width:100%;column-gap:var(--gap,28px);column-fill:auto;line-height:1.56;hyphens:auto;-webkit-hyphens:auto;will-change:transform}
.flow.c1{column-count:1}.flow.c2{column-count:2;font-size:.9em}
.flow p{text-wrap:pretty}
.flow p{margin:0 0 .85em;orphans:3;widows:3}
.flow p.first::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.6em;line-height:.82;margin:.06em .1em 0 0;color:var(--teal)}
.flow h3{font-family:var(--display);font-weight:900;font-size:1.28em;line-height:1.15;margin:1.1em 0 .45em;break-after:avoid;text-wrap:balance;color:var(--teal-ink)}
.flow ul{margin:0 0 .9em;padding-left:1.1em}
.flow li{margin:0 0 .55em}
.flow li::marker{color:var(--orange)}
.flow a{color:var(--teal-ink);text-decoration-thickness:1px;text-underline-offset:2px}
.flow strong{font-weight:700}
.blbox{background:var(--chip);padding:1em 1.1em .4em;margin:0 0 1.2em;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blbox h4{margin:0 0 .6em;font-size:.78em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.blbox ul{padding-left:1.05em;margin:0}
.blbox li{line-height:1.45}
.fig{margin:.4em 0 1.1em;break-inside:avoid}
.fig img{display:block;width:100%;height:auto;max-height:var(--figmax,60vh);object-fit:contain;background:#fff}
.fig figcaption{font-size:.76em;line-height:1.35;color:var(--ink2);margin-top:.5em;padding-left:.7em;border-left:3px solid var(--orange)}
.fig.photo img{object-fit:cover;max-height:var(--figmax,60vh)}
.pull{break-inside:avoid;margin:.5em 0 1.1em;padding:.6em 0 .7em;border-top:3px solid var(--orange);border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:900;font-size:1.42em;line-height:1.16;color:var(--ink);text-wrap:balance}
.pull::before{content:"“";color:var(--orange);margin-right:.05em}
.pull::after{content:"”";color:var(--orange)}
.endmark{margin-top:1em;font-weight:700;font-size:.92em}
.endmark::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--teal);margin-right:.5em;vertical-align:.05em}
.folio .contd{margin-left:auto;margin-right:1.4em;text-transform:none;letter-spacing:.02em;font-weight:700;color:var(--ink2)}
.oldnews .flow{background:transparent}
.page.oldnews{background:#F6F0E3;color:#3A2A1C}
.page.oldnews .folio{border-color:#D9CCB3;color:#7a6650}

/* ---------- graphics drawn from the Flourish data ---------- */
.gx{font-size:.8em;line-height:1.3;color:var(--ink)}
.gx-h{margin-bottom:.6em;border-top:3px solid var(--teal);padding-top:.5em}
.gx-t{font-family:var(--display);font-weight:900;font-size:1.15em;line-height:1.15;text-wrap:balance}
.gx-s{color:var(--ink2);margin-top:.15em}
.gx-src{color:var(--ink2);font-size:.82em;margin-top:.5em}
.gx-svg{display:block;width:100%;height:auto;overflow:visible}
.gx-svg .ax{font-size:15px;fill:var(--ink2);font-family:var(--body)}
.gx-svg .lab{font-size:16px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .val{font-size:15px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .grid{stroke:var(--rule);stroke-width:1}
.gx-svg .base{stroke:var(--ink2);stroke-width:1}
.gx-leg{display:flex;flex-wrap:wrap;gap:.3em 1em;margin-bottom:.4em;font-size:.92em}
.gx-leg span{display:inline-flex;align-items:center;gap:.4em}
.gx-leg i{width:.8em;height:.8em;display:inline-block}
.gx-axt{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--ink2);margin-bottom:.2em}
.gx-facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:1em}
.gx-ft{font-weight:700;text-align:center;margin-bottom:.2em}
.gx-img{display:block;width:100%;height:auto;background:#fff}
.gx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.4em,1fr));gap:.9em .7em}
.gx-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35em}
.gx-card img{width:4.6em;height:4.6em;border-radius:50%;object-fit:cover;background:var(--tint);border:2px solid var(--orange)}
.gx-cards.logos .gx-card img{border-radius:0;border:0;object-fit:contain;background:#fff;padding:.3em}
.gx-card b{display:block;font-size:.95em;line-height:1.2}
.gx-card .sub{display:block;color:var(--teal-ink);font-weight:700;font-size:.85em;margin-top:.1em}
.gx-card .txt{display:block;color:var(--ink2);font-size:.85em;margin-top:.15em}
.gx-cards.wide{grid-template-columns:1fr;gap:.6em}
.gx-cards.wide .gx-card{flex-direction:row;align-items:flex-start;text-align:left;gap:.8em}
.gx-cards.wide .gx-card img{width:3.6em;height:3.6em;flex:none}
/* a timeline: text in the article's flow */
.tl{margin:.5em 0 1.2em}
.tl .gx-h{margin-bottom:.5em}
.tl .gx-t{font-size:1.05em}
.tl-e{display:grid;grid-template-columns:4.6em 1fr;gap:.7em;padding:.45em 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:.9em;line-height:1.42}
.flow.c2 .tl-e{break-inside:auto}   /* two columns never end early (Editor, Nov. 10, 2026) */
.tl-d{font-family:var(--display);font-weight:900;color:var(--teal-ink);font-size:.95em}
.tl-x b{font-weight:700}
/* in the text: a graph at most ~40% of the page tall */
.flow .fig .gx-svg,.flow .fig .gx-img{max-height:calc(var(--figmax,60vh) * .62)}
/* ---------- a graphic page ---------- */
.gpage{background:var(--paper)}
.gin{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6cqw;padding:7cqw 7.5cqw 3cqw;font-size:var(--fs)}
.gslot{min-height:0}
.gin .gx{font-size:.86em}
.gin .gx-svg,.gin .gx-img{max-height:calc(var(--ph) * .5);width:auto;max-width:100%;margin:0 auto}
.gin.two .gx-svg,.gin.two .gx-img{max-height:calc(var(--ph) * .26)}
.mk{display:block;height:0}

a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:40px;padding-right:40px}}
.ta{display:inline-block;font-family:"Noto Kufi Arabic",sans-serif;font-weight:900;font-size:.86em;line-height:.8;margin:0 .02em}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.pill.go{background:var(--teal);border-color:var(--teal);color:var(--teal-deep);font-weight:900}

/* the masthead bar */
.mh{background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.mh .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-block:12px}
.mh img{height:28px;width:auto;display:block}
.mh .logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mh .logo-l{display:none}:root:not([data-theme="light"]) .mh .logo-d{display:block}}
:root[data-theme="dark"] .mh .logo-l{display:none}:root[data-theme="dark"] .mh .logo-d{display:block}
.mh .mag{white-space:nowrap;font-weight:900;font-size:21px;color:var(--teal-ink);text-decoration:none;border-left:2px solid var(--rule);padding-left:14px}
.mh .iss{margin-left:auto;font-size:14px;color:var(--ink2)}
.mh .sub,#subgo{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:900}
@media (max-width:899px){.mh .wrap{flex-wrap:nowrap}.mh .iss{display:none}.mh .mag{font-size:18px;margin-right:auto}.mh img{height:24px}.mh .pill{min-height:40px;padding:0 14px;font-size:13px}}
@media (max-width:420px){.mh .wrap{gap:8px}.mh .mag{padding-left:8px;font-size:16px}.mh img{height:20px}.mh .pill{padding:0 10px;font-size:12px}}

/* the sign-up form: the existing Weekly newsletter (Week in Brief) in English, Arabic and/or Persian, through the app's
   subscribe.php, which sets the same Mailchimp groups as the website's form (Editor, Nov. 11, 2026) */
dialog.sub-d{border:0;padding:0;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog.sub-d::backdrop{background:rgba(6,30,26,.6)}
.sub-d .bar{height:8px;background:var(--brown)}
.sub-d form{padding:24px 24px 26px;display:flex;flex-direction:column;gap:14px}
.sub-d h2{margin:0;font-weight:900;font-size:26px;line-height:1.05;color:var(--brown)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sub-d h2{color:#E8C9A8}}
:root[data-theme="dark"] .sub-d h2{color:#E8C9A8}
.sub-d p{margin:0;font-size:15px;line-height:1.45;color:var(--ink2)}
.sub-d label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.sub-d input[type=text],.sub-d input[type=email]{font:inherit;font-size:16px;font-weight:400;min-height:46px;padding:0 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px}
.sub-d fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.sub-d legend{font-size:13px;font-weight:700;margin-bottom:7px;padding:0}
.sub-d .lang{position:relative}
.sub-d .lang input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sub-d .lang span{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;font-size:14px;font-weight:700}
.sub-d .lang input:checked+span{background:var(--teal);border-color:var(--teal);color:#06302A}
.sub-d .lang input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.sub-d .terms{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.sub-d .terms input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--teal);flex:none}
.sub-d .terms a{color:var(--teal-ink)}
.sub-d .row{display:flex;gap:10px;margin-top:4px}
.sub-d .row .pill{flex:1}
.sub-d .msg{font-size:14px;font-weight:700;min-height:1.2em}
.sub-d .msg.err{color:#B23B2A}.sub-d .msg.ok{color:var(--teal-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sub-d .msg.err{color:#F09A86}}
:root[data-theme="dark"] .sub-d .msg.err{color:#F09A86}

/* ---------- the front page ---------- */
.hero{padding-top:14px}
.hero .in{display:flex;flex-wrap:wrap;background:#00A693}
.hero .panel{flex:1 1 420px;min-width:0;padding:40px 44px;display:flex;flex-direction:column;gap:18px;color:#fff}
.word{display:flex;flex-direction:column;white-space:nowrap;font-weight:900;line-height:.84;letter-spacing:-.03em}
.word .ta{color:#FFE2BD}
.hero .word{font-size:clamp(64px,7vw,90px)}
.issline{display:flex;justify-content:space-between;gap:10px;border-top:2px solid #06302A;padding-top:10px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#06302A}
.tag{align-self:flex-start;background:var(--orange);color:#2A1A05;font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px}
.hero h1{margin:0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.02;text-wrap:balance}
/* the line under the headline: black on a peach strip, line by line, like the social media cards (Editor, Nov. 11, 2026) */
.hero .stand{margin:0;font-size:18px;line-height:1.75;font-weight:700;max-width:34em}
.hero .stand span{background:#FFE2BD;color:#4A2F22;padding:3px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero .act{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:auto;padding-top:10px}
.hero .act .pill{background:#fff;border-color:#fff;color:#00463D;font-weight:900;font-size:16px;min-height:50px;padding:0 24px}
.hero .act span{font-size:15px;color:#06302A}
.hero .shot{flex:1.3 1 480px;min-width:0;min-height:520px;position:relative}
.hero .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* on a phone the cover is one full screen: the wordmark band, then the photo with the cover story on it */
.hero .ph-story{display:none}
@media (max-width:899px){
  .hero{padding-top:0}.hero .wrap{padding:0}
  .hero .panel{padding:26px 22px 18px;gap:12px;flex-basis:100%}
  .hero .panel .tag,.hero .panel h1,.hero .panel .stand,.hero .panel .act,.hero .panel .cby{display:none}
  .hero .word{font-size:64px}
  .hero .shot{flex-basis:100%;min-height:clamp(520px,78vh,700px)}
  .hero .shot .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,22,19,0) 22%,rgba(3,22,19,.94) 70%)}
  .hero .ph-story{display:flex;position:absolute;left:22px;right:22px;bottom:22px;flex-direction:column;gap:10px;color:#fff}
  .hero .ph-story h2{margin:0;font-weight:900;font-size:30px;line-height:1.03;text-wrap:balance}

<script>
window.MAG = {"week":45,"from":"2026-11-02","to":"2026-11-08","pieces":[{"type":"Article","region":"Iraq","category":"Politics","title":"Old News: After overthrow of monarchy, Iraq's revolution turns on its own","authors":["Amwaj.media Staff"],"date":"2026-11-06","url":"https://amwaj.media/en/article/old-news-after-overthrow-of-monarchy-iraqs-revolution-turns-on-its-own","img":"img/01.jpg","iw":1400,"ih":933,"alt":"","bottomLine":["Iraqi former deputy premier Abdul Salam Arif has been arrested in Baghdad, after returning to Iraq without Prime Minister Abd Al-Karim Qasim’s authorization and refusing his post as ambassador to West Germany.","Although Arif and Qasim jointly led the July 1958 coup to overthrow Hashemite King Faisal II, they have diverged on whether Iraq should join President Gamal Abdel Nasser’s United Arab Republic.","The arrest has triggered civil unrest in Baghdad, with clashes between supporters of Arif and the pan-Arab Ba’ath Party versus pro-communist demonstrators who back Qasim.","Prime Minister Qasim has increasingly relied on communist groups who oppose joining the United Arab Republic (UAR) for public support, though stopping short of formally aligning himself with communist factions within Iraq or the USSR.","The political and personal rivalry between the premier and his former deputy came to a head earlier this month. Arif reportedly pointed a gun at Qasim during a heated argument over him losing his cabinet positions and being appointed as ambassador to West Germany—a move that some have regarded as a polite form of exile.","Arif now faces charges of allegedly endangering state security. Observers fear his arrest may foreshadow a wider split within the country along pro- and anti-Nasserist lines as well as a crackdown on the Ba’ath Party by Qasim’s government."],"pull":"","blocks":[{"t":"p","html":"<strong><em>Old News is a new initiative by Amwaj.media to connect the past to the present. Through “reporting” on pivotal moments in history, we aim to provide a richer backdrop for current dynamics in the region.</em></strong>"},{"t":"p","html":"<strong>The story:</strong> Barely a month after being appointed ambassador to West Germany, Iraqi former deputy premier Abdul Salam Arif has been <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">arrested</a> in Baghdad. The detention comes on the order of Prime Minister Abd Al-Karim Qasim after Arif reportedly <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">returned</a> home without authorization and refused to leave the country. He now faces charges of plotting against the state."},{"t":"p","html":"The arrest has raised eyebrows as Arif and Qasim earlier this year jointly <a href=\"https://adst.org/2014/07/the-iraqi-revolution-of-1958/\" target=\"_blank\" rel=\"noopener\">led</a> a coup to overthrow Hashemite King Faisal II. Tension between them has been brewing amid rising personal rivalry and their differing <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">stances</a> on whether the new Republic of Iraq should join the United Arab Republic (UAR) led by Egyptian leader Gamal Abdel Nasser."},{"t":"p","html":"<strong>The coverage: </strong>Baghdad Radio <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">announced</a> late on Nov. 4, 1958 that former deputy prime minister Arif has been arrested on charges of endangering state security."},{"t":"ul","items":["The ambassador, who holds the military rank of colonel, was arrested shortly after his <a href=\"https://history.state.gov/historicaldocuments/frus1958-60v12/d142\" target=\"_blank\" rel=\"noopener\">arrival</a> in the Iraqi capital. After being <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">spotted</a> at Baghdad’s airport by an army officer, Arif was escorted to Qasim’s office and detained on the orders of his old comrade after refusing to return to West Germany.","Arif was named as ambassador to West Germany by Qasim at the end of September—a move many view as a polite form of political <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">exile</a>. There are claims that he never <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">reported</a> for duty in Bonn and has instead been spotted in Belgium."]},{"t":"graph","id":"30821076"},{"t":"p","html":"The arrest comes on the back of days of <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">civil unrest</a> in Baghdad, where rival supporters of Prime Minister Qasim and his former deputy have taken to the streets."},{"t":"ul","items":["Pro-Arif demonstrations have been <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">led</a> by the Ba’ath Party, a pan-Arab movement <a href=\"https://www.britannica.com/topic/Baath-Party\" target=\"_blank\" rel=\"noopener\">founded</a> in Syria in 1947 that is growing in popularity in Iraq.","Supporters of the former deputy premier have been urging him to return home and work towards Iraq joining the UAR."]},{"t":"p","html":"After Arif’s arrest, rallies in support of Qasim’s “<a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">moderate</a>” nationalism have intensified. Clashes between the two factions have been <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">reported</a>, with police making multiple arrests."},{"t":"ul","items":["Many of Qasim’s supporters on the streets are members of communist groups, which the prime minister has increasingly come to <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">rely</a> on for shows of public support.","Unlike the Ba’ath Party and Nasserists, communist groups largely oppose joining the UAR. This puts the Soviet Union—which has had varyingly hot and cool <a href=\"https://www.jstor.org/stable/45069363?seq=4\" target=\"_blank\" rel=\"noopener\">relations</a> with Nasser—in an uneasy position. Moscow has avoided openly taking sides, though observers <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">note</a> an “independent Iraq as a counterweight to Nasser” is in the USSR’s best interests."]},{"t":"p","html":"Reporting on the ground has proved difficult, making it hard to ascertain reactions to the brewing split within Iraq about the future direction of the country."},{"t":"ul","items":["Qasim’s government is reported to be heightening censorship, <a href=\"https://www.nytimes.com/1958/11/06/archives/coup-is-reported-thwarted-in-iraq-pronasser-rioting-is-said-to-have.html\" target=\"_blank\" rel=\"noopener\">forbidding</a> foreign oil companies from relaying information about the unrest to headquarters."]},{"t":"p","html":"<strong>The context/analysis: </strong>On July 14, 1958, Colonel Arif and Brig. Gen. Qasim led a faction known as the Free Officers in a coup to <a href=\"https://www.nytimes.com/1963/11/20/archives/top-man-in-iraq-abdel-salam-arif-differed-on-nasser-father-an-imam.html\" target=\"_blank\" rel=\"noopener\">overthrow</a> King Faisal II and his pro-western government. After toppling the monarchy, Qasim <a href=\"https://www.britannica.com/biography/Abd-al-Karim-Qasim\" target=\"_blank\" rel=\"noopener\">became</a> prime minister and appointed his fellow coup leader as his deputy."},{"t":"p","html":"The downfall of Iraq’s monarch follows long-brewing <a href=\"http://news.bbc.co.uk/onthisday/hi/dates/stories/july/14/newsid_3736000/3736391.stm\" target=\"_blank\" rel=\"noopener\">anger</a> towards Hashemite rule and what some Iraqis see as outsized British influence."},{"t":"ul","items":["King Faisal II, Crown Prince Abd Al-llah and other members of the royal family were <a href=\"https://adst.org/2014/07/the-iraqi-revolution-of-1958/\" target=\"_blank\" rel=\"noopener\">assassinated</a> at the Al-Rihab Palace after surrendering to pro-Qasim forces.","The downfall of the Kingdom of Iraq leaves Faisal II’s cousin, Hussein bin Talal Al-Hashimi of Jordan, as the last remaining Hashemite <a href=\"http://news.bbc.co.uk/onthisday/hi/dates/stories/july/14/newsid_3736000/3736391.stm\" target=\"_blank\" rel=\"noopener\">monarch</a>.","Faisal II’s prime minister until May 1958, the pro-western Nuri Al-Said, managed to evade pro-Qasim forces on the night of the coup but was assassinated the next <a href=\"https://adst.org/2014/07/the-iraqi-revolution-of-1958/\" target=\"_blank\" rel=\"noopener\">day</a>. Said was <a href=\"https://www.sav.sk/?lang=en&amp;doc=journal-list&amp;part=article_response_page&amp;journal_article_no=10830\" target=\"_blank\" rel=\"noopener\">succeeded</a> as premier by Ahmad Mukhtar Baban only two months before the coup."]},{"t":"chart","src":"img/c-PvBD8.png","w":1220,"h":1110,"title":"Iraq between the Hashemites and Nasser","link":"https://datawrapper.dwcdn.net/PvBD8/"},{"t":"p","html":"Since seizing power, Arif and Qasim’s differing stances on whether to join the UAR have become increasingly difficult to reconcile. The prime minister is staunchly <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">opposed</a> to joining the Nasser-led project to unify Arab states."},{"t":"ul","items":["The new Iraqi provisional constitution <a href=\"https://www.britannica.com/place/Iraq/The-Republic-of-Iraq\" target=\"_blank\" rel=\"noopener\">notes</a> that “Arabs and Kurds are considered partners in this homeland.” In this context, observers say Qasim opposes joining a pan-Arab state because it may <a href=\"https://www.researchgate.net/publication/248951435_Abd_al-Karim_Qasim_and_the_kurds_of_Iraq_Centralization_resistance_and_revolt_1958-63\" target=\"_blank\" rel=\"noopener\">alienate</a> Kurds and other minorities in Iraq.","Experts also note Qasim may be concerned that joining the UAR could <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">compel</a> Iraq to share its lucrative oil revenues with Egypt, which is producing far less crude."]},{"t":"p","html":"Iraqi communist groups <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">back</a> Qasim and oppose a union with the UAR. This is <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">believed</a> to be supported by Moscow, which does not want Nasser’s influence to spread in the region."},{"t":"ul","items":["Last month, in Oct. 1958, Qasim <a href=\"https://www.researchgate.net/publication/248951435_Abd_al-Karim_Qasim_and_the_kurds_of_Iraq_Centralization_resistance_and_revolt_1958-63\" target=\"_blank\" rel=\"noopener\">permitted</a> Kurdish leader Mullah Mustafa Barzani to return to Iraq after more than a decade of exile in the USSR. Observers say the move may be a signal that the new authorities in Baghdad are pursuing a different path than their pro-western predecessors.","Qasim has, however, never formally or publicly <a href=\"https://time.com/archive/6612967/iraq-the-helpful-communists/\" target=\"_blank\" rel=\"noopener\">declared</a> association with any communist groups within Iraq or internationally."]},{"t":"p","html":"In contrast, Arif and his Ba’athist supporters have been rallying in support of merging with the UAR since almost immediately after the coup."},{"t":"ul","items":["In July, Arif <a href=\"https://www.nytimes.com/1963/11/20/archives/top-man-in-iraq-abdel-salam-arif-differed-on-nasser-father-an-imam.html\" target=\"_blank\" rel=\"noopener\">appeared</a> at a <a href=\"https://www.cambridge.org/core/books/envisioning-the-arab-future/peoples-court/C6B9D007DD845FA9C4B2BF9F52FA6AF0\" target=\"_blank\" rel=\"noopener\">rally</a> in Damascus with Nasser. Of note, Syria co-founded the UAR along with Egypt in February this year. The Iraqi colonel then traveled on to Cairo with the Egyptian leader before touring Iraq to campaign in favor of the pan-Arab cause.","Beyond their policy differences, some speculate that Arif’s outreach may have been viewed by Prime Minister Qasim as an <a href=\"https://rawabetcenter.com/archives/108623\" target=\"_blank\" rel=\"noopener\">attempt</a> by his deputy to overshadow him. This comes as observers say personal rivalry between the two coup leaders has intensified since they overthrew the monarchy."]},{"t":"p","html":"Tensions came to a head earlier this month, when Arif reportedly <a href=\"http://c6b9d007dd845fa9c4b2bf9f52fa6af0\" target=\"_blank\" rel=\"noopener\">pointed</a> a gun at Qasim during a heated argument over being stripped of his cabinet role and appointed as ambassador to West Germany."},{"t":"ul","items":["Qasim is said to have forgiven his former deputy for pulling the gun on him during the argument, <a href=\"https://www.nytimes.com/1963/02/11/archives/nassers-old-friend-abdelsalam-arif-appointed-by-kassim-sentenced-to.html\" target=\"_blank\" rel=\"noopener\">saying</a> to Arif, “My son, my child, my brother, it is for your sake that I do this so that you will not be influenced by those who want to mislead you.”"]},{"t":"p","html":"<strong>The future:</strong> The Ba’ath Party has existed in relative obscurity in Iraq since it first <a href=\"https://asfar.org.uk/a-brief-history-of-the-bath-party-introduction-to-michel-aflaqs-ideology/\" target=\"_blank\" rel=\"noopener\">opened</a> a chapter in Baghdad in 1952. However, the pan-Arab movement has recently been gaining traction, and Arif is said to <a href=\"https://www.cambridge.org/core/books/envisioning-the-arab-future/peoples-court/C6B9D007DD845FA9C4B2BF9F52FA6AF0\" target=\"_blank\" rel=\"noopener\">maintain</a> close ties with the leader of its Iraq chapter, Fuad Al-Rikabi."},{"t":"ul","items":["Observers fear the current clash between Qasim’s form of nationalism versus Arif’s pan-Arab ambitions may not be the last, and that the new authorities in Baghdad may take more decisive <a href=\"https://www.cia.gov/readingroom/document/06232634\" target=\"_blank\" rel=\"noopener\">steps</a> to curb Ba’athist influence and public visibility.","On the other hand, public support for the Ba’ath Party signals that a significant part of Iraqi society is <a href=\"https://www.nytimes.com/1963/05/28/archives/iraqi-police-arrest-arab-nationalist.html\" target=\"_blank\" rel=\"noopener\">dissatisfied</a> with the Qasim-led government."]},{"t":"p","html":"Little is known about the judicial proceedings against Arif."},{"t":"ul","items":["The former deputy premier faces charges of endangering the security of the state. However, as the investigation is in the early stages, the charges may either be <a href=\"https://www.nytimes.com/1963/02/11/archives/nassers-old-friend-abdelsalam-arif-appointed-by-kassim-sentenced-to.html\" target=\"_blank\" rel=\"noopener\">dropped</a> or even <a href=\"https://time.com/archive/6829199/iraq-death-for-a-brother/\" target=\"_blank\" rel=\"noopener\">expanded</a> depending on Arif’s dynamic with Qasim.","News of the detention has been accompanied by official broadcasts <a href=\"https://history.state.gov/historicaldocuments/frus1958-60v12/d142\" target=\"_blank\" rel=\"noopener\">against</a> “imperialist plots,” which many observers view as a thinly veiled reference to Arif’s alignment with Nasser’s pan-Arab project. Against this backdrop, informed sources say the former deputy premier’s arrest may be part of a wider <a href=\"https://www.cia.gov/readingroom/document/06232634\" target=\"_blank\" rel=\"noopener\">crackdown</a> on the Ba’ath Party."]},{"t":"p","html":"As the dust from the downfall of the Hashemite monarchy is still settling, the foreign policy direction of Iraq remains unclear."},{"t":"ul","items":["The current administration in Baghdad appears unlikely to adopt the pro-western approach of its predecessor.","At the same time, there are differences in the political elite about the extent of political non-alignment as various camps push for closer ties with the Soviet Union and the UAR respectively."]}],"words":525},{"type":"Article","region":"Iraq","category":"Security","title":"Can Zaidi keep Iraq from becoming Riyadh's battlefield?","authors":["Alabbas F. Alsudani"],"date":"2026-11-06","url":"https://amwaj.media/en/article/can-zaidi-keep-iraq-from-becoming-riyadhs-battlefield","img":"img/02.jpg","iw":1400,"ih":1031,"alt":"","bottomLine":["Iraq could become the main theater of any wider Saudi confrontation with Iran's regional allies, pitting Iraqis against one another. Yemen's Ansarullah movement, better known as the Houthis, killed at least 12 people at Riyadh's airport on Oct. 10. Baghdad condemned the attack, while Kata'ib Hezbollah, whose fighters make up several brigades of Iraq’s Popular Mobilization Units (PMU), <a href=\"https://en.964media.com/53634/\" target=\"_blank\" rel=\"noopener\">hailed</a> it.","On Oct. 14, Prime Minister Ali Al-Zaidi <a href=\"https://www.trtworld.com/article/9dc5e4e6711f\" target=\"_blank\" rel=\"noopener\">vowed</a> to Saudi Crown Prince Mohammed bin Salman that Iraqi territory would not be used to attack the Kingdom. Neither side's account named a faction, monitoring mechanism or penalty.","Saudi Arabia has not openly struck Iran, which lashed out at Gulf Arab states after Israeli-US strikes on it began on Feb. 28. Yet joint Saudi-US airstrikes on July 29 <a href=\"https://en.964media.com/53755\" target=\"_blank\" rel=\"noopener\">pounded</a> PMU positions in seven Iraqi governorates, at what appears to be a fraction of the risk of striking the Islamic Republic.","Attacks from Iraqi soil can be claimed by others or denied. US officials <a href=\"https://www.aljazeera.com/news/2019/6/28/us-says-saudi-pipeline-attacks-originated-in-iraq-report\" target=\"_blank\" rel=\"noopener\">attributed</a> the 2019 drone attacks on Saudi Arabia's East-West pipeline, which the Houthis had claimed, to southern Iraq.","Zaidi's assurance rests on a disarmament process now <a href=\"https://shafaq.com/en/Iraq/PM-Al-Zaidi-sets-June-2027-deadline-for-weapons-control\" target=\"_blank\" rel=\"noopener\">pushed</a> back to June 2027. Kata'ib Hezbollah <a href=\"https://thenationalnews.com/news/mena/2026/10/01/resistance-has-won-this-round-kataib-hezbollah-denies-disarmament-deal-after-us-troops-leave-iraq\" target=\"_blank\" rel=\"noopener\">insisted</a> on Oct. 1 that its weapons will stay with its fighters, and the premier relies on the ruling Shiite Coordination Framework, an alliance that includes parties with armed wings yet to disarm.","A senior Framework politician told Amwaj.media the alliance would oppose a pre-emptive Saudi strike on Iraqi soil. However, further strikes could force Baghdad to defend the PMU, at once state and faction. The question may be less what Zaidi has pledged to Riyadh than whether his administration can keep that promise."],"pull":"","blocks":[{"t":"p","html":"Within two days of a <a href=\"https://amwaj.media/en/article/houthi-strikes-shut-riyadh-airport-as-saudi-arabia-weighs-its-responsevnew\" target=\"_blank\" rel=\"noopener\">missile</a> from Yemen's Ansarullah movement, better known as the Houthis, <a href=\"https://aljazeera.com/news/2026/10/31/are-houthis-using-russian-satellites-as-saudi-arabia-faces-hits\" target=\"_blank\" rel=\"noopener\">killing</a> at least 12 people at Riyadh's main airport on Oct. 10, two verdicts on the attack appeared in Iraq. The government in Baghdad condemned it on Oct. 11. Kata'ib Hezbollah, whose fighters form part of the Popular Mobilization Units (PMU), <a href=\"https://en.964media.com/53634/\" target=\"_blank\" rel=\"noopener\">praised</a> the strike on Oct. 12 and dismissed official condemnation as \"discordant voices\" that did not speak for Iraqis. The armed group further urged the Houthis to keep up their attacks."},{"t":"p","html":"On Oct. 14, Prime Minister Ali Al-Zaidi sat with Saudi Crown Prince Mohammed bin Salman in Riyadh and assured him that Iraqi territory would not be used to attack the Kingdom. Yet the assurance sits uneasily with the fact that his government does not control all the weapons in Iraq. Kata'ib Hezbollah, which had just applauded the airport attack, is among the armed factions that have refused to hand theirs to the state."},{"t":"p","html":"That gap may define the country's exposure. If the confrontation between Saudi Arabia and Iran's regional allies widens, Iraq could well become its main theater, and the fight could pit Iraqis against one another more than the country against its neighbors."},{"t":"graph","id":"27028745"},{"t":"h","text":"Why Iraq, not Iran"},{"t":"p","html":"A senior politician in the ruling Shiite Coordination Framework, an alliance of mostly Iran-aligned Shiite parties, told Amwaj.media that how the bloc would respond to Saudi strikes inside Iraq may depend on whether Riyadh acts in retaliation for an attack or pre-emptively. Since Israel and the US began striking the Islamic Republic on Feb. 28, Tehran has <a href=\"https://www.thenationalnews.com/news/gulf/2026/03/04/saudi-arabia-intercepts-more-iranian-fire-but-daily-life-largely-undisturbed\" target=\"_blank\" rel=\"noopener\">lashed</a> out at Saudi Arabia and other Gulf Arab states, with drones and missiles targeting sites including Aramco's Ras Tanura refinery."},{"t":"p","html":"Saudi Arabia has not openly struck back at Iran. Reuters <a href=\"https://themedialine.org/headlines/saudi-arabia-secretly-struck-iran-after-iranian-attacks-reuters-reports/\" target=\"_blank\" rel=\"noopener\">reported</a> in May that the Kingdom carried out covert airstrikes inside Iran at the end of March in response to those attacks. Riyadh has not confirmed the strikes."},{"t":"p","html":"In Iraq, by contrast, Saudi Arabia has struck in the open. On July 29, joint Saudi-US strikes hit PMU positions in <a href=\"https://en.964media.com/53755\" target=\"_blank\" rel=\"noopener\">seven</a> governorates, killing at least 20 fighters. Riyadh and Washington <a href=\"https://amwaj.media/en/article/deep-dive-is-iraqs-disarmament-campaign-about-who-controls-the-process\" target=\"_blank\" rel=\"noopener\">called</a> the bombing retaliation for alleged drone attacks on Saudi oil facilities. Baghdad condemned the raids as a violation of sovereignty, and Zaidi <a href=\"https://shafaq.com/en/Iraq/Iraq-s-Al-Zaidi-calls-off-Saudi-visit\" target=\"_blank\" rel=\"noopener\">canceled</a> a planned visit. For the Kingdom, hitting Iran-allied factions in Iraq appears to carry a fraction of the escalation risk of striking the Islamic Republic itself."},{"t":"p","html":"On Sept. 11, Riyadh said drones <a href=\"https://www.aljazeera.com/news/2026/9/11/saudi-arabia-says-east-west-pipeline-hit-by-drones-launched-from-iraq\" target=\"_blank\" rel=\"noopener\">launched</a> from Iraq had hit its East-West pipeline, its export route around the Strait of Hormuz. Zaidi's government traced the attacks to Maysan Governorate, which borders Iran, and <a href=\"https://shafaq.com/en/Iraq/PM-Al-Zaidi-removes-Maysan-chief-over-Saudi-attack\" target=\"_blank\" rel=\"noopener\">removed</a> the provincial operations commander from his post. The Kingdom, while reserving the right to act, agreed to hold off on a response after the premier asked for an opportunity to prevent further attacks."},{"t":"chart","src":"img/c-Y7GmR.png","w":1220,"h":1158,"title":"Oil facilities in Saudi Arabia","link":"https://datawrapper.dwcdn.net/Y7GmR/"},{"t":"p","html":"It was not the first time the pipeline had reportedly been hit from Iraqi soil. Yemen's Houthis claimed attacks on it in May 2019, but US officials concluded that the drones had <a href=\"https://www.aljazeera.com/news/2019/6/28/us-says-saudi-pipeline-attacks-originated-in-iraq-report\" target=\"_blank\" rel=\"noopener\">originated</a> in southern Iraq, with intelligence pointing to Iran-backed armed groups."},{"t":"p","html":"Attacks launched from Iraq can be claimed by others or denied outright, which may help explain the country's appeal to Iran's allies. The events of July and September suggest that this cover has worn thin, since Riyadh answered alleged attacks in July by striking PMU positions and in September said plainly that the drones had come from Iraq."},{"t":"h","text":"An assurance in person"},{"t":"p","html":"Zaidi's answer to that exposure was to take his word to Riyadh himself. The Oct. 14 <a href=\"https://www.trtworld.com/article/9dc5e4e6711f\" target=\"_blank\" rel=\"noopener\">meeting</a> was his first visit to Saudi Arabia since taking office in May. According to the Iraqi readout, the premier told the crown prince that Iraq would not allow its territory to serve as a launchpad for attacks on the Kingdom."},{"t":"p","html":"Neither the Iraqi nor the Saudi readout names a faction, a monitoring mechanism or a consequence for violations. Zaidi's case appears to have rested instead on his own indispensability. A senior diplomat at the Iraqi Ministry of Foreign Affairs told Amwaj.media that the premier presented Iraq as a constructive state and disarmament as a process under way."},{"t":"p","html":"Saudi Arabia, the diplomat said, was told it had no alternative to working with the Iraqi government, since no other actor can contain the armed factions. With Washington behind Zaidi, the diplomat added, Riyadh opted for compromise and signaled its readiness to cooperate."},{"t":"h","text":"The enforcement gap"},{"t":"p","html":"Zaidi's assurance rests on a disarmament process that has already slipped. His original Sept. 30 deadline for the factions to disarm, the date of the US-led Coalition's scheduled departure, <a href=\"https://shafaq.com/en/Iraq/PM-Al-Zaidi-sets-June-2027-deadline-for-weapons-control\" target=\"_blank\" rel=\"noopener\">gave</a> way on Sept. 21 to a June 2027 target. The new plan opens with a 90-day phase in which factions refrain from attacks and US forces in the region hold off striking them. Saudi Arabia is not a party to that bargain."},{"t":"p","html":"The Coordination Framework backed the new <a href=\"https://shafaq.com/en/Iraq/Iraq-s-CF-backs-arms-control-timeline\" target=\"_blank\" rel=\"noopener\">timetable</a> on Oct. 2, and Zaidi said on Oct. 5 that <a href=\"https://shafaq.com/en/society/PM-Al-Zaidi-Five-Iraqi-factions-agree-to-disarm\" target=\"_blank\" rel=\"noopener\">three</a> unnamed factions had handed over their weapons and two more had agreed to do so. By contrast, Harakat Hezbollah Al-Nujaba and Kata'ib Hezbollah <a href=\"https://www.thenationalnews.com/news/mena/2026/09/29/iraq-prepares-for-new-chapter-after-us-troop-withdrawal-as-security-concerns-remain/\" target=\"_blank\" rel=\"noopener\">maintained</a> in late September that they would not disarm until foreign troops leave."},{"t":"p","html":"Yet after the Coalition's mission <a href=\"https://shafaq.com/en/Iraq/Al-Araji-Coalition-mission-ends-security-partnership-continues\" target=\"_blank\" rel=\"noopener\">ended</a> on Sept. 30, by the government's account, Kata'ib Hezbollah <a href=\"https://thenationalnews.com/news/mena/2026/10/01/resistance-has-won-this-round-kataib-hezbollah-denies-disarmament-deal-after-us-troops-leave-iraq\" target=\"_blank\" rel=\"noopener\">declared</a> on Oct. 1 that its weapons \"will remain as a trust in the hands of our mujahideen.\" The exit appears to have removed the factions' stated reason for keeping their arms without producing compliance."},{"t":"p","html":"As Amwaj.media has reported, the Aug. 5 <a href=\"https://amwaj.media/en/article/deep-dive-is-iraqs-disarmament-campaign-about-who-controls-the-process\" target=\"_blank\" rel=\"noopener\">session</a> of the State Administration Coalition, the governing alliance of Iraq's main Kurdish, Shiite and Sunni parties, turned on who controls disarmament, not whether it should happen."},{"t":"p","html":"That debate surfaced again in mid-August, when Mohammed Naji, head of the political office of the Badr Organization, a leading Coordination Framework party, <a href=\"https://www.thenationalnews.com/news/mena/2026/08/14/iran-aligned-iraq-militia-warns-government-of-internal-strife-if-forcibly-disarmed/\" target=\"_blank\" rel=\"noopener\">wrote</a> in a post on Twitter/X that any imposition of force on \"our brothers in the resistance\" would be a \"grave overstep\" opening \"the door to internal strife.\""},{"t":"p","html":"What such statements show is that Zaidi, who depends on the Coordination Framework for his mandate, cannot easily enforce his assurance to Riyadh against factions that sit inside the same political order."},{"t":"graph","id":"7605259"},{"t":"p","html":"In Riyadh, the premier appears to have turned that weakness into leverage. At the Aug. 5 session, he had reportedly <a href=\"https://amwaj.media/en/article/deep-dive-is-iraqs-disarmament-campaign-about-who-controls-the-process\" target=\"_blank\" rel=\"noopener\">threatened</a> to resign. Similar earlier reports had been <a href=\"https://shafaq.com/en/Iraq/Source-Iraq-PM-resignation-reports-are-false\" target=\"_blank\" rel=\"noopener\">rejected</a> on July 31 by a senior government source. Zaidi's case to the crown prince seems to have followed the same logic, that his value lies in the absence of an alternative. But the factions whose restraint he is offering are the same ones his government has not disarmed."},{"t":"h","text":"A clash between Iraqis"},{"t":"p","html":"The test of Zaidi's assurance is the next attack launched from Iraqi soil, and it may already have arrived. On Oct. 22, Saudi security sources told <a href=\"https://alhurra.com/en/47878\" target=\"_blank\" rel=\"noopener\">Alhurra</a> TV that drones launched from Iraq had been intercepted over the previous 20 days, a period that includes the Riyadh meeting. The sources did not say how many came after it. Saudi restraint in September was granted at the premier's request. A further strike on the Kingdom could suggest that Zaidi has spent the credit he asked for."},{"t":"p","html":"Renewed Saudi strikes would likely deepen a fault line inside Iraq, between the government and the factions. Established in 2014 to combat the Islamic State group (IS), the PMU was formally integrated into Iraq's armed forces in 2016. Each Saudi strike on its positions would oblige Baghdad to defend an institution that harbors the very factions Zaidi's assurance covers. Each act of coordination with Riyadh, in turn, could hand Kata'ib Hezbollah the argument that the government has taken a side against the \"resistance.\""},{"t":"p","html":"Whether that fault line breaks open may depend on timing. The Coordination Framework politician explained that a pre-emptive Saudi strike would provoke a major dispute, noting that the factions have significant reach toward northern Saudi Arabia. The Shiite alliance, the politician added, is working to contain the armed groups and would in that case stand against Riyadh. The alliance would not endorse the factions' unlawful actions, the source stressed, but a Saudi attack would undermine those efforts and complicate disarmament."},{"t":"p","html":"The distinction suggests the Coordination Framework may separate retaliation from pre-emption, which, by the politician's account, it would treat as a breach."},{"t":"p","html":"Zaidi's Oct. 14 visit appears to have bought time and reopened top-level contact that had stalled since July. A Gulf-Iran confrontation in Iraq would still run through the PMU, an institution that is at once state and faction, and a government that condemns attacks its own brigades celebrate. The question for Riyadh may be less what Baghdad promised than whether the Iraqi state is the party able to keep it."}],"words":1434},{"type":"Media Monitor","region":"Iran","category":"Politics","title":"Iran sees Trump’s midterm setback as opportunity, but not end to war","authors":["Amwaj.media Staff"],"date":"2026-11-05","url":"https://amwaj.media/en/media-monitor/iran-sees-trumps-midterm-setback-as-opportunity-but-not-end-to-war","img":"img/03.jpg","iw":1400,"ih":933,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Iranian officials and commentators have welcomed the Democrats’ gains in the US congressional elections, casting them as a rejection of President Donald Trump’s war on Iran. Yet the debate in Tehran over what comes next is divided. Some expect the new balance of power in Washington to constrain further US military action, while others warn that a politically weakened Trump could become more dangerous."},{"t":"p","html":"A senior Iranian political source underscored to Amwaj.media that Trump “is a wounded wild animal right now.” Emphasizing continued vigilance in the face of the threat of renewed war, the senior source added, “Our guard is not down.”"},{"t":"p","html":"<strong>The coverage:</strong> The Democrats <a href=\"https://www.aljazeera.com/news/2026/11/4/democrats-win-control-of-house-and-senate-key-us-midterms-takeaways\" target=\"_blank\" rel=\"noopener\">won</a> control of both chambers of Congress in the Nov. 3 midterms, dealing a major setback to Trump and his Republican Party."},{"t":"ul","items":["Trump has <a href=\"https://gulfbusiness.com/en/2026/north-america/trump-iran-war-republican-midterm-election-losses/\" target=\"_blank\" rel=\"noopener\">acknowledged</a> that the war on Iran contributed to the Republicans’ losses, while maintaining that his decision to attack the Islamic Republic was right."]},{"t":"p","html":"On Nov. 4, Iranian officials hailed the outcome as a rejection of the war launched by Israel and the United States in late February."},{"t":"ul","items":["Parliament Speaker Mohammad Baqer Qalibaf <a href=\"https://x.com/mb_ghalibaf/status/2117848485580128287\" target=\"_blank\" rel=\"noopener\">said</a> Americans had rejected war and that Tehran endorsed their message.","Mohsen Rezaee, secretary of the Supreme National Security Council (SNSC), <a href=\"https://www.tasnimnews.ir/fa/news/1405/08/13/3740785/\" target=\"_blank\" rel=\"noopener\">stated</a> that Iran had “inflicted a major strategic defeat on Trump on the battlefield and in the Strait of Hormuz” and “a heavy political defeat in Washington.”"]},{"t":"p","html":"Supreme Leader Ayatollah Mojtaba Khamenei <a href=\"https://rahbar.ir/speech?cid=2330\" target=\"_blank\" rel=\"noopener\">struck</a> a more skeptical note in a message marking the Nov. 4 anniversary of the 1979 seizure of the US Embassy in Tehran."},{"t":"ul","items":["Without mentioning the elections, Khamenei warned that anyone still hoping for a change in behavior or “party and factional shifts” in the “system of domination”—Tehran’s term for the US-led order—was “gravely mistaken.”","The Iranian leader argued that concessions would only embolden the “enemy” toward greater demands and future wars.","Khamenei also said that Iran’s management of the Strait of Hormuz and its push to remove American military bases from the region would take on “much wider dimensions” if aggression were repeated."]},{"t":"graph","id":"27962330"},{"t":"p","html":"Iranian media largely presented the results as a verdict on Trump’s Iran policy."},{"t":"ul","items":["Government-run news agency IRNA <a href=\"https://www.irna.ir/news/86311986\" target=\"_blank\" rel=\"noopener\">linked</a> the Republicans’ losses to the war’s economic fallout. It also <a href=\"https://www.irna.ir/news/86312260/%D8%A2%DB%8C%D8%A7-%DA%A9%D9%86%DA%AF%D8%B1%D9%87-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D9%85%DB%8C-%D8%AA%D9%88%D8%A7%D9%86%D8%AF-%D8%A8%D9%87-%D8%AC%D9%86%DA%AF-%D8%A8%D8%A7-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D9%BE%D8%A7%DB%8C%D8%A7%D9%86-%D8%AF%D9%87%D8%AF\" target=\"_blank\" rel=\"noopener\">cautioned</a> that ending the war would depend on the Democrats turning their opposition into concrete action.","Conservative news agency IMNA <a href=\"https://www.imna.ir/news/1017641/\" target=\"_blank\" rel=\"noopener\">argued</a> that budget disputes and waning support in Congress could make Washington’s confrontation with Tehran harder to sustain."]},{"t":"p","html":"Social media reactions the same day reflected a similar divide."},{"t":"ul","items":["Reformist analyst Fayyaz Zahed <a href=\"https://x.com/Fayyazzaahed/status/2117872959188500527?s=20\" target=\"_blank\" rel=\"noopener\">attributed</a> part of Trump’s “humiliation” to Iranian resistance, but cautioned that a powerful yet irrational adversary should be feared.","Former MP Jalal Rashidi Koochi hailed a “heavy, historic and humiliating defeat” for warmongers in the US, but <a href=\"https://x.com/jalalrashidi404/status/2117864461298004161\" target=\"_blank\" rel=\"noopener\">argued</a> that Trump was not wise enough to grasp why his predecessors had never taken such a risk."]},{"t":"p","html":"Some hardline voices sounded more defiant."},{"t":"ul","items":["Academic Mohammad Marandi <a href=\"https://x.com/s_m_marandi/status/2117847829213323271\" target=\"_blank\" rel=\"noopener\">went</a> further, declaring that the next phase of the war would lead to Trump’s overthrow.","Pundit Foad Izadi pointed to Iran’s asserted control of the Strait of Hormuz and its attacks on US bases in the region as a response that could widen if American military strikes on Iran are resumed."]},{"t":"chart","src":"img/c-MqfIS.png","w":1220,"h":1444,"title":"Transit corridors through the Strait of Hormuz, 2026","link":"https://datawrapper.dwcdn.net/MqfIS/"},{"t":"p","html":"Tehran-based analyst Ehsan Taghadosi <a href=\"https://x.com/demokracy/status/2117856467457921387?s=20\" target=\"_blank\" rel=\"noopener\">provided</a> a more nuanced take."},{"t":"ul","items":["Taghadosi argued that the defeat would neither change US policy toward Iran nor stop Trump ordering military action before leaving office. Limited strikes remain possible, but a long war would become harder to fund and sustain politically.","The analyst cautioned, however, that Democratic opposition to Trump does not necessarily mean opposition to pressuring Iran."]},{"t":"p","html":"Mostafa Najafi, a prolific commentator on foreign policy, <a href=\"https://x.com/Mostafa_Najafii/status/2118083058423197956\" target=\"_blank\" rel=\"noopener\">highlighted</a> the scenarios ahead."},{"t":"ul","items":["“The US election results have raised the political cost of war with Iran but have by no means eliminated the danger of war,” Najafi asserted, “Tehran must pursue two paths simultaneously: smart exploitation of the political rifts and opportunities in Washington, and strengthening readiness and deterrence against any new adventurism.”","The commentator continued, “If an agreement between Iran and the United States takes shape, Trump and [US Vice President JD] Vance will be ready to sideline [Israeli Prime Minister Benjamin] Netanyahu, but if the current situation persists, Trump will still need Netanyahu and will continue to support him.”"]},{"t":"p","html":"<strong>The context/analysis:</strong> The central question in Tehran appears to be whether a Democratic Congress will restrain Trump or sharpen his incentive for another confrontation before his room for maneuver narrows."},{"t":"ul","items":["The results are likely to <a href=\"https://www.reuters.com/legal/government/trump-is-still-charge-democrats-gain-leverage-coming-economic-debate-2026-11-04/\" target=\"_blank\" rel=\"noopener\">complicate</a> Trump’s domestic agenda, giving the Democrats more oversight powers and leverage over government funding. Yet they do not strip the president of his authority as commander-in-chief.","IRNA acknowledged this distinction, noting that the Democrats could investigate the Trump administration, challenge military spending and seek to curb the president’s war powers, but would struggle to force an end to hostilities, not least because of a presidential veto."]},{"t":"p","html":"The more immediate concern is the period before the new Congress takes office in January."},{"t":"ul","items":["Trita Parsi, co-founder and executive vice president of the Washington-based Quincy Institute, <a href=\"https://responsiblestatecraft.org/trump-war-midterms-iran/\" target=\"_blank\" rel=\"noopener\">argued</a> that pressure for war is now likely to rise. With “the political cost” already paid, he said, pro-war elements in Israel and the United States may see the next two months as a last window to push Trump toward renewed strikes.","Parsi also suggested that “vengeance” over the war’s political consequences could come to dominate Trump’s thinking."]},{"t":"p","html":"Some Iranian commentators have reached similar conclusions."},{"t":"ul","items":["Foreign-based pundit Ali Afshari argued that the results had made a return to war more difficult, but warned that failure in another confrontation could be politically devastating for Trump.","Hardline commentator Alireza Taqavinia similarly cautioned that Trump now has little left to lose politically."]},{"t":"p","html":"There is also the Israeli dimension to any escalation in the Iran-US confrontation."},{"t":"ul","items":["Some analysts <a href=\"https://www.i24news.tv/en/news/international/americas/artc-democrat-s-midterm-gains-put-trump-s-iran-war-and-us-israel-ties-under-pressure-analysis\" target=\"_blank\" rel=\"noopener\">expect</a> “a burst of military action in the lame duck period,” noting that Trump can veto war powers resolutions but not a cut in war funding.","Israeli advocates of renewed confrontation may therefore have an incentive to frame military action as a defining element of Trump’s <a href=\"https://x.com/FMNSOULII/status/2117962105706136041?a=xTZYP469gmxP6MUf3h4&amp;s=20\" target=\"_blank\" rel=\"noopener\">legacy</a> on Iran, particularly if they <a href=\"https://www.jpost.com/middle-east/iran-news/article-913812\" target=\"_blank\" rel=\"noopener\">see</a> the window for action narrowing."]},{"t":"graph","id":"15839127"},{"t":"p","html":"Not every reading is pessimistic, however."},{"t":"ul","items":["Esfandyar Batmanghelidj, founder of the Bourse &amp; Bazaar Foundation, <a href=\"https://x.com/yarbatman/status/2117861133528789315\" target=\"_blank\" rel=\"noopener\">argued</a> that the results “might set the stage for a deal to end the Iran war, both in Washington and Tehran,” adding that “the risk of major military escalation has diminished.”"]},{"t":"p","html":"<strong>The future:</strong> Tehran is preparing for both renewed diplomacy and a resumption of hostilities."},{"t":"ul","items":["President Masoud Pezeshkian <a href=\"https://www.isna.ir/news/1405081107286\" target=\"_blank\" rel=\"noopener\">said</a> on Nov. 2 that Khamenei had granted the government certain powers to pursue dialogue, while officials <a href=\"https://amwaj.media/en/media-monitor/iran-us-diplomacy-stepped-up-amid-signs-of-impending-escalation\" target=\"_blank\" rel=\"noopener\">continue</a> to insist on Iran’s conditions for any agreement.","At the same time, the supreme leader’s warning over Hormuz and his threat of a wider response to renewed attacks show that Tehran is not assuming the Republicans’ setback will prevent another war.","Once the new Congress convenes in January, Democratic moves on war powers and military spending will show how far Washington’s room for further escalation has narrowed."]}],"words":317},{"type":"Article","region":"Peninsula","category":"Security","title":"What Qatar hopes to gain from the Badr defense partnership","authors":["Francesco Salesio Schiavi"],"date":"2026-11-05","url":"https://amwaj.media/en/article/what-qatar-hopes-to-gain-from-the-badr-defense-partnership","img":"img/04.jpg","iw":1400,"ih":788,"alt":"","bottomLine":["Indonesia, Pakistan, Qatar and Turkiye signed the Badr Memorandum of Understanding (MOU) in Doha on Oct. 21, setting up a framework for military production, technical training and joint research and development.","Qatar has paid a harsh price for the Israeli-US war on Iran. By early April, barely a month into the conflict, the Iranian military had fired at least 227 missiles and 111 drones at the country, which hosts the forward headquarters of US Central Command (CENTCOM). Strikes on Ras Laffan in March knocked out about 17% of liquefied natural gas export capacity for up to five years.","Qatar’s upper-tier air and naval defenses are western-supplied, and none of the Badr MOU signatories offer no immediate replacement for those systems. The memorandum’s realistic contribution lies in short-range and counter-drone defenses, ammunition, maintenance and integration.","Khalid Al-Jufairi, an adjunct professor of international politics at Georgetown University in Qatar, said Badr’s success depends on whether it gives Qatar more control over equipment availability, maintenance and replenishment in a crisis. He urged the finalizing of agreed supply commitments, licensing arrangements and emergency logistics before a crisis emerges.","Turkish firms already work with Qatari-owned Barzan Holdings on remotely controlled weapons, air defense, explosives and unmanned systems. Umair Aslam, head of Global Defense Insight, sees Turkiye leading systems integration, Pakistan handling manufacturing and sustainment, Indonesia contributing industrial production and Qatar acting as financier, end user and regional maintenance hub.","Unlike the Mecca Joint Defense Agreement binding Pakistan and Turkiye to Saudi Arabia, the Badr MOU contains no mutual-defense clause. Independent analyst Barin Kayaoglu told Amwaj.media that a project involving all four partners would show whether it delivers, while Aslam pointed to funded feasibility studies, prototypes and signed production contracts as markers of progress."],"pull":"reduce equipment downtime and allow Qatar to sustain existing capabilities without relying exclusively on overseas servicing and replenishment,","blocks":[{"t":"p","html":"Qatar has joined Indonesia, Pakistan and Turkiye in a framework for military production, technical training and joint research and development. Already linked through procurement and industrial partnerships, the four states aim to turn those ties into a wider production network."},{"t":"p","html":"To this end, the partners <a href=\"https://qna.org.qa/en/news/news-details?date=21%2F10%2F2026&amp;id=qatar-indonesia-pakistan-and-turkiye-sign-badr-mou-to-promote-defense-industries-cooperation\" target=\"_blank\" rel=\"noopener\">signed</a> the Badr Memorandum of Understanding (MOU) in Doha on Oct. 21. For Qatar, the question is what the cooperation can deliver after months of regional conflict. Disrupted transport routes and competing demands on suppliers can leave weapons, spare parts and ammunition scarce when they are needed most. The MOU’s value depends on whether its signatories agree on projects that help Qatar sustain its defenses for years, while giving the other participants enough orders and industrial benefits."},{"t":"h","text":"Doha’s operational priorities"},{"t":"p","html":"Qatar has paid a harsh price for the Israeli-US war on Iran. By early April, barely a month into the conflict, the Iranian military had <a href=\"https://www.aa.com.tr/en/middle-east/iran-targeted-7-arab-countries-with-6-413-missiles-drones-over-past-41-days/3900771\" target=\"_blank\" rel=\"noopener\">fired</a> at least 227 missiles and 111 drones at the country, which is home to the forward headquarters of US Central Command (CENTCOM). It is also the only Gulf Arab state to have <a href=\"https://www.gulf-times.com/article/721700/qatar/qatar-shoots-down-two-iranian-jets-intercepts-drones-ballistic-missiles/amp\" target=\"_blank\" rel=\"noopener\">downed</a> Iranian fighter jets, two Su-24s."},{"t":"p","html":"Most threats were intercepted, but each interception uses costly imported missiles, which have <a href=\"https://abcnews.com/amp/Politics/crucial-us-missile-stockpiles-extremely-low-official/story?id=135428997\" target=\"_blank\" rel=\"noopener\">proved</a> hard to replenish. The few drones and missiles that got through have done lasting damage. Strikes on Ras Laffan in March <a href=\"https://www.aa.com.tr/en/economy/qatar-says-iranian-missile-strikes-cut-lng-export-capacity-by-17-/3872423\" target=\"_blank\" rel=\"noopener\">knocked</a> out about 17% of Qatar’s liquefied natural gas (LNG) export capacity for up to five years. For a country that has built its riches on gas, it is a major hit."},{"t":"chart","src":"img/c-RGz0Q.png","w":1220,"h":1158,"title":"Major oil and natural gas facilities in Qatar, 2024","link":"https://datawrapper.dwcdn.net/RGz0Q/"},{"t":"p","html":"The signing of the Badr MOU follows a reassessment of Qatar’s defenses. Speaking at the Global Security Forum on Oct. 19, Deputy Prime Minister and Minister of State for Defense Affairs Sheikh Saoud bin Abdulrahman Al Thani <a href=\"https://thepeninsulaqatar.com/article/20/10/2026/qatar-to-announce-new-regional-defence-partnership-and-hub\" target=\"_blank\" rel=\"noopener\">identified</a> air defense, counter-drone capabilities, cybersecurity and electronic warfare as priorities set by a 2025 defense review. He also outlined plans for a domestic defense hub and for ammunition production or investment abroad."},{"t":"p","html":"Qatar’s upper-tier defenses are western-supplied. On land, US-made Patriot batteries are backed by the US-Norwegian National Advanced Surface-to-Air Missile System (NASAMS). At sea, the Italian-built naval flagship Al Fulk reportedly <a href=\"https://www.navalnews.com/naval-news/2026/03/watch-qatars-al-fulk-lpd-launching-aster-missiles-against-iranian-threats/\" target=\"_blank\" rel=\"noopener\">fired</a> European Aster interceptors against Iranian threats in March. None of the Badr partners produces equivalent systems. The agreement’s realistic contribution lies beneath that layer, in short-range and counter-drone defenses, ammunition, maintenance and integration."},{"t":"p","html":"Officials have not said publicly how the memorandum relates to the proposed hub. Khalid Al-Jufairi, an adjunct professor of international politics at Georgetown University in Qatar and Al-Khaleej Fellow at the Fiker Institute, told Amwaj.media that the Badr MOU’s success depends on “whether industrial cooperation gives Qatar greater control over equipment availability, maintenance and replenishment during a crisis, while preserving interoperability with its existing western-supplied systems.”"},{"t":"p","html":"Jufairi said the priority should be maintenance, repair and overhaul, followed by selective assembly, systems integration and the production of critical components and suitable ammunition. These activities “reduce equipment downtime and allow Qatar to sustain existing capabilities without relying exclusively on overseas servicing and replenishment,” he added."},{"t":"graph","id":"13566870"},{"t":"p","html":"For a state whose revenues depend on energy infrastructure, protecting sites such as Ras Laffan requires surveillance, resilient communications and rapid recovery. That is why the <a href=\"https://www.aljazeera.com/news-analysis/2026/10/27/qatars-path-to-defence-autonomy\" target=\"_blank\" rel=\"noopener\">debate</a> over Qatar’s defense autonomy increasingly concerns national resilience as a whole."},{"t":"h","text":"Connecting the partners"},{"t":"p","html":"Barzan <a href=\"https://www.barzanholdings.com/\" target=\"_blank\" rel=\"noopener\">Holdings</a>, owned by the Qatari Ministry of Defense, provides an institutional base for the kind of cooperation set out by the Badr MOU. Its <a href=\"https://www.barzanholdings.com/our-mandate/\" target=\"_blank\" rel=\"noopener\">mandate</a> covers investment and localization, and its Barzan Maintenance <a href=\"https://www.barzanholdings.com/our-purpose/\" target=\"_blank\" rel=\"noopener\">Shield</a> links maintenance to readiness."},{"t":"p","html":"Importantly, Qatar’s ties with the Turkish defense sector predate the recent memorandum. BARQ, Barzan’s 2018 joint venture with Turkish firm ASELSAN, <a href=\"https://cdn.aselsan.com/aselsanweb-prod/documents/investor-relations/reports/faaliyet/en/report-faaliyet-2025-aselsan-annual-report-2025-en.pdf\" target=\"_blank\" rel=\"noopener\">covers</a> command-and-control systems, thermal cameras, cryptography and remotely controlled weapons. The partners announced an <a href=\"https://wwwcdn.aselsan.com/api/file/ASELSAN_a-bulten_92_o.pdf\" target=\"_blank\" rel=\"noopener\">expansion</a> at Doha’s DIMDEX defense exhibition in January."},{"t":"p","html":"Other agreements connect more directly to Qatar’s stated priorities. In January, Turkish manufacturer MKE <a href=\"https://mke.gov.tr/Haberler/MKE-ILE-KATARLI-BARZAN-HOLDING-ARASINDA-STRATEJIK-ORTAKLIK/118\" target=\"_blank\" rel=\"noopener\">announced</a> a memorandum with Barzan covering a Qatar-based joint venture, explosives production and the sale of its <a href=\"https://mketolga.com/en/index.html\" target=\"_blank\" rel=\"noopener\">TOLGA</a> short-range air-defense system. STM, another Turkish manufacturer, <a href=\"https://www.stm.com.tr/tr/haberler/stmden-katarda-insansiz-sistemler-alaninda-stratejik-birligi\" target=\"_blank\" rel=\"noopener\">signed</a> a separate MOU on local production and development of unmanned aerial and naval systems. None of these is yet a Badr MOU project, and the framework must still show what multilateral coordination adds."},{"t":"p","html":"According to the Turkish state-run <a href=\"https://www.aa.com.tr/en/world/turkiye-qatar-indonesia-and-pakistan-sign-defense-cooperation-pact/4095836\" target=\"_blank\" rel=\"noopener\">Anadolu</a> news agency, an executive board will identify joint programs and a strategic board will approve them and set timelines. Yet no projects, budgets or production sites have been announced."},{"t":"p","html":"In June 2025, Barzan <a href=\"https://qna.org.qa/en/news/news-details?date=14%2F06%2F2025&amp;id=barzan-holdings-signs-deals-to-supply-weapons-ammunition-to-indonesian-military\" target=\"_blank\" rel=\"noopener\">signed</a> agreements to supply rifles and ammunition to Indonesia and to develop a local ammunition factory with <a href=\"https://www.republikorp.com/\" target=\"_blank\" rel=\"noopener\">Republikorp</a>, Indonesia’s leading private defense holding company. Republikorp is also a partner of the Emirati <a href=\"https://edgegroup.ae/\" target=\"_blank\" rel=\"noopener\">EDGE</a> Group in a 7B USD <a href=\"https://amwaj.media/en/article/inside-the-emirati-indonesian-push-to-build-a-defense-ecosystem\" target=\"_blank\" rel=\"noopener\">program</a>—a reminder that Doha is competing with Abu Dhabi for the same industrial partners."},{"t":"p","html":"As for Pakistan, it is already engaged in defense production in collaboration with Turkiye. The MILGEM corvette <a href=\"https://pid.gov.pk/site/press_detail/8782\" target=\"_blank\" rel=\"noopener\">contract</a> provided for construction in both countries, while STM’s fleet <a href=\"https://www.stm.com.tr/en/pakistan-navy-fleet-tanker-project\" target=\"_blank\" rel=\"noopener\">tanker</a> was built in Karachi. Independent analyst and consultant Barin Kayaoglu told Amwaj.media that naval platforms offer a likely starting point, alongside air defense, radars and electronic warfare."},{"t":"p","html":"Umair Aslam, executive director of Global Defense Insight, said Pakistan should “begin with existing, proven capabilities rather than pursue entirely new and expensive defense platforms.” State-owned Pakistan Ordnance Factories could support licensed ammunition production and training in Qatar, while Pakistan Aeronautical Complex brings aviation maintenance. Drone maintenance, electronics assembly and ammunition packaging “would be more realistic initial activities than manufacturing sophisticated missiles locally,” Aslam said."},{"t":"p","html":"Kayaoglu also noted that Pakistan is “well versed with both western and Chinese systems” and could help the partners build a more network-centric approach. That cuts both ways for Doha. Equipment that mixes Chinese, Turkish and western components must still work with the Patriot and Aster networks Qatar depends on."},{"t":"p","html":"“Instead of individual systems, it is more important to observe what kind of ecosystem the four countries create and how they divide the labor,” Kayaoglu said. In this vein, Aslam sketched one possible split, with Turkiye leading systems integration, Pakistan handling manufacturing and sustainment, Indonesia contributing industrial production and Qatar serving as “financing partner, end user, and regional maintenance hub.” Yet Ankara and Islamabad could also compete in drones, armored vehicles and small arms. Savings depend on how much equipment the four armed forces need in common."},{"t":"p","html":"For Doha, local assembly would offer little reassurance if repairs still require overseas authorization or imported parts. What matters is who controls technical data, licensing and certification. “The existence of multiple manufacturing partners does not automatically guarantee availability during any conflict,” Jufairi cautioned. He called for agreed supply commitments, licensing arrangements and emergency logistics before a crisis emerges."},{"t":"h","text":"What regional cooperation means in practice"},{"t":"p","html":"Doha has <a href=\"https://www.qatar-tribune.com/article/260362/front/qatar-indonesia-pakistan-and-turkiye-sign-badr-mou-to-promote-defence-industries-cooperation\" target=\"_blank\" rel=\"noopener\">presented</a> the Badr MOU as strengthening multilateral cooperation in support of security and stability. At the Global Security Forum, the Qatari deputy prime minister announced a forthcoming partnership with regional partners, while <a href=\"https://www.qatar-tribune.com/article/259929/latest-news/qatar-to-announce-new-regional-defence-partnership-as-energy-shockwaves-yet-to-peak-deputy-pm\" target=\"_blank\" rel=\"noopener\">crediting</a> cooperation with Washington for preventing more than 90% of Iranian drone and missile attacks during the fighting earlier this year."},{"t":"chart","src":"img/c-lob09.png","w":1220,"h":986,"title":"","link":"https://datawrapper.dwcdn.net/lob09/"},{"t":"p","html":"That dual message defines Badr’s scope. Pakistan and Turkiye are also bound to Saudi Arabia through the <a href=\"https://amwaj.media/en/article/kuwait-defense-deal-deepens-pakistans-growing-role-in-gulf-security\" target=\"_blank\" rel=\"noopener\">Mecca</a> Joint Defense Agreement, a mutual-defense pact <a href=\"https://www.aljazeera.com/news/2026/10/5/mecca-alliance-agrees-to-activate-collective-deterrence-measures\" target=\"_blank\" rel=\"noopener\">activated</a> in early October. Badr contains no comparable clause. Qatar already hosts a Turkish military base alongside Al-Udeid Air Base, which is home to CENTCOM. The wealthy Gulf Arab state has additionally been a major <a href=\"https://www.ispionline.it/en/publication/future-qatar-major-non-nato-ally-us-33071\" target=\"_blan
