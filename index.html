re of the United States and its regional allies.","Conservative daily Farhikhtegan <a href=\"https://farhikhteganonline.ir/news/259899\" target=\"_blank\" rel=\"noopener\">argued</a> that the report’s logic could equally justify targeting water facilities serving US bases across the region, including Gulf Arab desalination plants.","Reformist daily Shargh <a href=\"https://www.sharghdaily.com/%D8%A8%D8%AE%D8%B4-%D8%B1%D9%88%D8%B2%D9%86%D8%A7%D9%85%D9%87-100/1142790-%D8%A7%D8%B2-%D8%B3%D8%AF-%D8%AA%D8%A7-%D9%85%D9%88%D8%B4%DA%A9-%D8%B3%D9%88%DA%98%D9%87-%D8%AA%D8%A7%D8%B2%D9%87-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AA%D9%88%D8%AC%DB%8C%D9%87-%D8%AD%D9%85%D9%84%D9%87\" target=\"_blank\" rel=\"noopener\">questioned</a> the evidence behind the article, stressing that geographic proximity does not establish an operational link between dams and military installations."]},{"t":"p","html":"On social media, severe criticism crossed political and geographical divides."},{"t":"ul","items":["UK-based analyst Esfandyar Batmanghelidj <a href=\"https://x.com/yarbatman/status/2122455821661712728\" target=\"_blank\" rel=\"noopener\">challenged</a> the Times report’s reasoning, noting that fewer than 50 of Iran’s more than 500 large dams have electricity-generating turbines.","Establishment critic Mojtaba Najafi <a href=\"https://x.com/mojtaba_najafi/status/2122602647236558949\" target=\"_blank\" rel=\"noopener\">stressed</a> that opposition to the Islamic Republic must not be confused with opposition to Iran itself, writing that critics reject the political system “not its dams and infrastructure, nor the Iranian people.”"]},{"t":"p","html":"In posts on Nov. 16–17, several experts cited in the New York Times article publicly distanced themselves from its implications."},{"t":"ul","items":["Environmentalist Kaveh Madani <a href=\"https://x.com/KavehMadani/status/2122402074096742414\" target=\"_blank\" rel=\"noopener\">said</a> “speculation is not evidence” and “spatial proximity is not causality,” dismissing the report’s “reductionist, sensationalist narrative.”","Researcher Nima Shokri <a href=\"https://x.com/NimaShokri_GHI/status/2122440135979749674\" target=\"_blank\" rel=\"noopener\">clarified</a> that his findings neither established why dams were built nor justified attacks on them, adding that he strongly opposes strikes on civilian water infrastructure."]},{"t":"p","html":"Other commentators were more openly alarmist."},{"t":"ul","items":["Iran-based political analyst Mostafa Najafi <a href=\"https://x.com/Mostafa_Najafii/status/2122440832246804532\" target=\"_blank\" rel=\"noopener\">argued</a> that the reports sought both to undermine domestic confidence in the Iranian defense establishment and to prepare international opinion for attacks on vital infrastructure.","Hardline academic Mohammad Marandi <a href=\"https://x.com/s_m_marandi/status/2122367443632800076\" target=\"_blank\" rel=\"noopener\">warned</a> that attacks on Iranian civilian infrastructure would prompt the destruction of critical infrastructure across Israel and Gulf Arab states."]},{"t":"p","html":"<strong>The context/analysis:</strong> Tehran’s pairing of the CNN and New York Times reports in its official messaging is significant."},{"t":"ul","items":["Officials have presented them as parts of one campaign, the first portraying Iran as preparing an unconventional attack on US soil and the second recasting civilian infrastructure as military targets."]},{"t":"p","html":"The comparison with the <a href=\"https://nsarchive2.gwu.edu/NSAEBB/NSAEBB234/index.htm\" target=\"_blank\" rel=\"noopener\">lead-up</a> to the 2003 US-led invasion of Iraq has been particularly prominent."},{"t":"ul","items":["Tehran is seemingly trying to cast doubt on intelligence-based allegations before they can become grounds for military action.","The message is also aimed at US audiences, among whom the memory of the Iraq War <a href=\"https://globalaffairs.org/commentary/columns/20-year-hindsight-public-opinion-and-iraq-war\" target=\"_blank\" rel=\"noopener\">remains</a> politically contentious.","Some commentators have <a href=\"https://x.com/AliR_Ahmadi/status/2122475557350944850?s=20\" target=\"_blank\" rel=\"noopener\">suggested</a> that the Trump administration drew the lesson from the recent midterm legislative elections that it needed to do more to “manufacture consent.”"]},{"t":"p","html":"The dam report controversy has again exposed the rare convergence between establishment supporters and critics of the Islamic Republic that emerged during the Israeli-US war on Iran."},{"t":"ul","items":["This does not mean that opposition to the reporting translates into support for the Islamic Republic.","Instead, it suggests that external military pressure could <a href=\"https://amwaj.media/en/media-monitor/debate-over-reform-grows-louder-in-iran-amid-push-for-post-war-unity\" target=\"_blank\" rel=\"noopener\">strengthen</a> national solidarity rather than weaken it, <a href=\"https://amwaj.media/en/article/deep-dive-in-shadow-of-israeli-assault-neo-nationalism-surges-in-iran\" target=\"_blank\" rel=\"noopener\">making</a> it harder for Israel and the United States to turn public discontent with the authorities to their advantage.","Attacks threatening drinking water, agriculture and civilian livelihoods could <a href=\"https://amwaj.media/en/media-monitor/trumps-threats-trigger-broad-backlash-in-iran-marginalize-supporters-of-war\" target=\"_blank\" rel=\"noopener\">reinforce</a> resentment of the attackers among Iranians across political divides."]},{"t":"p","html":"Qalibaf’s dual-use warning also carries a deterrent message."},{"t":"ul","items":["By extending the argument to infrastructure surrounding Israeli and US military installations, the speaker has signaled that attacks on Iranian water and energy facilities could invite reciprocal targeting.","The warning is particularly consequential for Gulf Arab governments, which <a href=\"https://amwaj.media/en/article/war-and-water-in-the-gulf\" target=\"_blank\" rel=\"noopener\">face</a> the prospect of their civilian infrastructure becoming entangled in any renewed confrontation.","Kuwaiti authorities blamed Iran for <a href=\"https://www.aljazeera.com/news/2026/3/30/iranian-attack-damages-kuwait-power-and-desalination-plant-kills-worker\" target=\"_blank\" rel=\"noopener\">attacks</a> on a power and desalination plant during the war, which Tehran denied, and in <a href=\"https://www.france24.com/en/middle-east/20260723-why-iran-targeting-kuwaits-desalination-plants\" target=\"_blank\" rel=\"noopener\">July</a> Iranian strikes hit Kuwaiti desalination plants again."]},{"t":"graph","id":"24298377"},{"t":"p","html":"<strong>The future:</strong> Diplomatic efforts to end the conflict are still <a href=\"https://amwaj.media/en/media-monitor/iran-warns-no-war-no-peace-will-not-last-amid-tension-over-compensation\" target=\"_blank\" rel=\"noopener\">facing</a> difficulties, keeping the risk of renewed fighting alive."},{"t":"ul","items":["Tehran’s response to the reports suggests it is preparing its domestic and international messaging for the possibility of renewed hostilities, presenting any future attack as built on manufactured pretexts.","Iran’s warnings also indicate that any future Israeli-US campaign targeting Iranian infrastructure could <a href=\"https://wanaen.com/what-does-irans-response-will-have-no-geographical-limits-mean/\" target=\"_blank\" rel=\"noopener\">carry</a> risks extending well beyond Iran itself, with Gulf Arab states hosting US forces the most exposed.","Whether these narratives translate into further escalation will depend on the course of diplomacy and on military activity in the region over the coming weeks."]}],"words":290},{"type":"Article","region":"Iraq","category":"Security","title":"Inside Iraq's backroom channels: who negotiates with Kata'ib Hezbollah?","authors":["Mohanad Faris"],"date":"2026-11-19","url":"https://amwaj.media/en/article/inside-iraqs-backroom-channels-who-negotiates-with-kataib-hezbollah","img":"img/04.jpg","iw":1400,"ih":933,"alt":"","bottomLine":["As Iraqi Prime Minister Ali Al-Zaidi <a href=\"https://x.com/SHAFAQNEWSENG/status/2122014779107684861\" target=\"_blank\" rel=\"noopener\">presses</a> Kata'ib Hezbollah to hand over its base at Jurf Al-Sakhar, south of Baghdad, talks appear to run through a crowded field of back channels. One source in the Prime Minister’s Office suggested to Amwaj.media that such engagement serves less to strike a comprehensive deal than to keep talks alive.","The most official mediation body is a committee of the ruling Shiite Coordination Framework, <a href=\"https://shafaq.com/en/Iraq/CF-committee-launches-talks-with-armed-factions-over-state-weapons-control\" target=\"_blank\" rel=\"noopener\">formed</a> in mid-August to lead talks with armed factions that refuse to disarm. Islamic Supreme Council of Iraq leader Humam Hamoudi is said to play a more substantive mediating role than Hikmah Movement chief Ammar Al-Hakim.","Badr Organization Secretary-General Hadi Al-Ameri is the committee's heavyweight. The veteran commander, who allegedly <a href=\"https://amwaj.media/en/article/deep-dive-is-iraqs-disarmament-campaign-about-who-controls-the-process\" target=\"_blank\" rel=\"noopener\">sparred</a> with Zaidi over disarmament in August, is said to favor a gradual handover at Jurf Al-Sakhar.","Rather than relying on the Coordination Framework committee, Zaidi prefers the economic, security and tribal channels inherited from his predecessor, a source in the Prime Minister's Office told Amwaj.media. The government has pressed companies that help finance the factions to ease tensions in return for keeping investigations into them closed.","Zaidi also sought help from Iranian Parliament Speaker Mohammad Baqer Qalibaf in persuading the factions when he <a href=\"https://www.middleeastmonitor.com/20261109-iraqi-prime-minister-made-unannounced-visit-to-tehran-for-talks-on-ending-iran-us-war-report/\" target=\"_blank\" rel=\"noopener\">traveled</a> unannounced to Tehran on Nov. 6, a diplomatic source says. However, nine days later, Baghdad ruled out any Iranian mediation. Accounts conflict over what followed Iranian Quds Force commander Esmail Qa’ani's <a href=\"https://www.alaraby.co.uk/politics/%D9%82%D8%A7%D8%A2%D9%86%D9%8A-%D9%81%D9%8A-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%84%D8%AA%D9%81%D8%A7%D8%AF%D9%8A-%D9%85%D8%B9%D8%B1%D9%83%D8%A9-%D8%AC%D8%B1%D9%81-%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D9%88%D8%B3%D8%B7-%D8%AE%D9%84%D8%A7%D9%81%D8%A7%D8%AA-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D8%AD%D8%A7%D8%AF%D8%A9\" target=\"_blank\" rel=\"noopener\">arrival</a> in the Iraqi capital the next evening.","On Nov. 18, a security committee chaired by Zaidi <a href=\"https://almasalah.com/archives/145029\" target=\"_blank\" rel=\"noopener\">ordered</a> the Energy Police to take over the disputed town's pipeline, a key issue amid oil smuggling allegations, and the force in the area to be replaced. An unconfirmed plan would split Jurf Al-Sakhar between the Iraqi Army, federal police and two Popular Mobilization Units brigades. As such, even a Kata'ib Hezbollah withdrawal would likely be only the start of wider talks over the faction's future."],"pull":"","blocks":[{"t":"p","html":"In Iraq, Prime Minister Ali Al-Zaidi has reportedly <a href=\"https://x.com/SHAFAQNEWSENG/status/2122014779107684861\" target=\"_blank\" rel=\"noopener\">given</a> Kata'ib Hezbollah until the end of this week to hand over its Jurf Al-Sakhar base to government forces. The Shiite armed faction has held the site, located south of Baghdad, since it was liberated from the Islamic State group (IS) in 2014. The state has since been barred from entering. The surrounding town’s mostly Sunni residents, who fled during the fighting, have not been <a href=\"https://iraq.iom.int/sites/g/files/tmzbdl1316/files/documents/2024-04/iom_babylon-areas-of-no-return_report_2024.pdf\" target=\"_blank\" rel=\"noopener\">allowed</a> back either. Amid the standoff, who is talking to Kata’ib Hezbollah, and on whose behalf?"},{"t":"p","html":"The answer seems to run through a crowded field of mediators, messengers and back channels, from a committee of the ruling Shiite Coordination Framework, to businessmen, tribal elders, security officers and brokers in Tehran."},{"t":"p","html":"Having said that, one source in the Prime Minister’s Office suggested to Amwaj.media that the overlapping channels serve less to strike a deal than to keep the talks from collapsing. However, reports point to an emerging agreement for other members of the Popular Mobilization Units (PMU) to take over Jurf Al-Sakhar."},{"t":"graph","id":"27028745"},{"t":"h","text":"Between mediation and mandate"},{"t":"p","html":"The most official of the channels to Kata’ib Hezbollah is a committee of the ruling Coordination Framework, <a href=\"https://shafaq.com/en/Iraq/CF-committee-launches-talks-with-armed-factions-over-state-weapons-control\" target=\"_blank\" rel=\"noopener\">announced</a> in mid-August to lead talks with armed factions that refuse to hand over their weapons. The committee is overall tasked with easing tensions between Zaidi and such actors. Badr Organization Secretary-General Hadi Al-Ameri and Hikmah Movement leader Ammar Al-Hakim were among its first <a href=\"https://shafaq.com/en/Iraq/CF-committee-launches-talks-with-armed-factions-over-state-weapons-control\" target=\"_blank\" rel=\"noopener\">members</a>, and later reports also named former prime ministers Nouri Al-Maliki (2006-14) and Muhammad Shia' Al-Sudani (2022-26)."},{"t":"p","html":"Islamic Supreme Council of Iraq (ISCI) leader Humam Hamoudi had <a href=\"https://shafaq.com/en/Iraq/Iraqi-PM-s-faction-talks-draw-committee-objections\" target=\"_blank\" rel=\"noopener\">joined</a> the committee by early November. A source from the Coordination Framework’s leadership told Amwaj.media that Maliki stepped back without leaving the task force, backing Hamoudi as a trusted stand-in who would support him. The same source said Hakim was brought in as a consensus figure. The Hikmah Movement leader is seen as a mediator who can soften positions when the alliance's leaders clash over disarmament, and can pass low-priority messages to some Iraqi figures in the Iran-backed 'Axis of Resistance' through his family and financial ties."},{"t":"graph","id":"18081279"},{"t":"p","html":"Indeed, as tension between Zaidi and Kata'ib Hezbollah mounted over Jurf Al-Sakhar, Hakim and Hamoudi on Nov. 8 reportedly began an urgent <a href=\"https://www.shafaq.com/ar/%D8%B3%DB%8C%D8%A7%D8%B3%D8%A9/%D8%A7%D9%84%D8%AD%D9%83%D9%8A%D9%85-%D9%88%D8%AD%D9%85%D9%88%D8%AF%D9%8A-%D9%8A%D9%82%D9%88%D8%AF%D8%A7%D9%86-%D9%88%D8%B3%D8%A7%D8%B7%D8%A9-%D8%B9%D8%A7%D8%AC%D9%84%D8%A9-%D9%84%D8%A7%D8%AD%D8%AA%D9%88%D8%A7-%D8%A7%D9%84%D8%AA%D9%88%D8%AA%D8%B1-%D8%A8%D9%8A%D9%86-%D8%A7%D9%84%D8%B2%D9%8A%D8%AF%D9%8A-%D9%88%D8%A7%D9%84%D9%83%D8%AA%D8%A7-%D8%A8\" target=\"_blank\" rel=\"noopener\">mediation</a> between the two sides."},{"t":"p","html":"The Coordination Framework source also said that Hamoudi's role in mediating between Zaidi's government and Shiite armed factions is more substantive than Hakim's. The ISCI leader takes part in meetings with the heads of ‘resistance’ groups and relays their responses to the ruling alliance's senior figures. At the same time, one senior figure in Abshir Ya Iraq—the electoral <a href=\"https://amwaj.media/en/article/iraq-s-coordination-framework-claims-election-victory-as-largest-parliamentary-bl\" target=\"_blank\" rel=\"noopener\">list</a> Hamoudi leads—cautioned Amwaj.media that the ISCI leader has no blank check to negotiate, sign or commit to any arrangement."},{"t":"h","text":"The heavyweight link"},{"t":"p","html":"Ameri is the mediation committee's heavyweight, and getting the whole Coordination Framework behind any deal means bringing the Badr Organization chief onside. An advisor to the ruling alliance said Shiite political leaders know how much sway Ameri holds over the decisions of armed groups, and consult him on every step they take toward the factions."},{"t":"p","html":"The source in the Prime Minister's Office told Amwaj.media that Ameri has helped calm the mounting tensions over Jurf Al-Sakhar, using his contacts with Kata'ib Hezbollah's leaders to clear the way for an inspection team to enter the town. The terms of the team’s Nov. 13 visit were separately <a href=\"https://en.964media.com/55272/\" target=\"_blank\" rel=\"noopener\">settled</a> in an understanding between Zaidi and PMU Chief of Staff Abdulaziz (Abu Fadak) Al-Muhammadawi."},{"t":"p","html":"Ameri and Zaidi have been at <a href=\"https://amwaj.media/en/article/deep-dive-is-iraqs-disarmament-campaign-about-who-controls-the-process\" target=\"_blank\" rel=\"noopener\">loggerheads</a> before. At an Aug. 5 meeting of the State Administration Coalition, a wider constellation that governs Iraq, Ameri allegedly told the prime minister that decisions on disarmament belonged to the coalition's leaders, and not to Zaidi alone. A Nov. 3 report named Ameri among several committee members who had <a href=\"https://shafaq.com/en/Iraq/Iraqi-PM-s-faction-talks-draw-committee-objections\" target=\"_blank\" rel=\"noopener\">objected</a> to the prime minister’s direct involvement in the talks."},{"t":"p","html":"Notably, the Badr Organization is both a force within the PMU and a member of the Coordination Framework, so its veteran secretary-general sits between Iraq’s armed factions and the government. A senior source in Ameri’s office told Amwaj.media that the Badr Organization chief believes an immediate, comprehensive handover of Jurf Al-Sakhar could set off a confrontation that would be hard to contain, so he favors a gradual approach. The source also suggested that Ameri wants a state that absorbs Shiite armed factions, yet allows such actors to keep their political and military standing."},{"t":"graph","id":"28312414"},{"t":"h","text":"Channels beyond the committee"},{"t":"p","html":"The source in the Prime Minister’s Office said Zaidi has inherited from his predecessor, Sudani, a network of economic, tribal and security channels that can be leveraged to engage with Iraq’s armed factions. All are now, in the view of the source, being mobilized in the standoff with Kata’ib Hezbollah."},{"t":"p","html":"Zaidi is said to prefer these channels to the Coordination Framework committee, the source in the Prime Minister’s Office explained, saying that the prime minister believes the factions are granted too much leverage in return for weak commitments. The economic channel runs through companies with interests on both sides, some of which broker calm unprompted because escalation would hurt their business."},{"t":"p","html":"The government has pressed some of those companies, using their role in financing the factions as leverage to secure their help in de-escalation in return for keeping investigations into them closed, the same source charged. The current escalation has sidelined many of these companies and put others under direct pressure, as part of a wider push to curb the factions' economic influence, the source added."},{"t":"p","html":"On Nov. 5, Zaidi <a href=\"https://shafaq.com/ar/%D8%A7%D9%82%D8%AA%D8%B5%D9%80%D8%A7%D8%AF/%D8%A7%D9%84%D8%B2%D9%8A%D8%AF%D9%8A-%D9%8A%D9%88%D8%AC%D9%87-%D8%A7%D9%84%D8%AA%D8%B5%D9%86%D9%8A%D8%B9-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8%D9%8A-%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82%D9%8A-%D8%A8%D8%A7%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B4%D8%B1-%D9%85%D8%B9-%D8%A7%D9%84%D8%B4%D8%B1%D9%83%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B5%D9%86%D8%B9%D8%A9-%D8%AF%D9%88%D9%86-%D9%88%D8%B3%D8%A7%D8%B7%D8%A9\" target=\"_blank\" rel=\"noopener\">directed</a> the Military Industrialization Authority, the state body that makes weapons and ammunition for Iraq's security forces, to deal only with manufacturers and never through intermediary companies. The government presented the order as a step against corruption in arms contracts, and it shuts out the kind of intermediary firm the source in the Prime Minister’s Office described."},{"t":"p","html":"Tribal channels, particularly those with ties inside the PMU and the factions in Babil, Dhi Qar and Maysan Governorates, offer members of Shiite armed groups guarantees against prosecution, a security advisor in the Office of the Commander-in-Chief of the Armed Forces told Amwaj.media. Security channels run through senior officers in the Army Chief of Staff's office, the Joint Operations Command and the PMU, who do not negotiate but pass messages between the two sides, the same source said."},{"t":"h","text":"The Iranian channel"},{"t":"p","html":"One diplomatic source close to the prime minister told Amwaj.media that during his unannounced <a href=\"https://www.middleeastmonitor.com/20261109-iraqi-prime-minister-made-unannounced-visit-to-tehran-for-talks-on-ending-iran-us-war-report/\" target=\"_blank\" rel=\"noopener\">visit</a> to Tehran on Nov. 6, Zaidi asked Iranian Parliament Speaker Mohammad Baqer Qalibaf to persuade Iran-backed armed factions to cooperate, to ease US pressure on Baghdad. The same source said Zaidi later repeated the request, prior to the Nov. 13 inspection of Jurf Al-Sakhar, to secure Kata'ib Hezbollah's agreement to it."},{"t":"p","html":"On Nov. 11, a Shiite politician close to the Coordination Framework reportedly <a href=\"https://almadapaper.net/460669/\" target=\"_blank\" rel=\"noopener\">linked</a> the trip to US demands, saying it was also meant to persuade Tehran to keep Iraqi factions out of any coming confrontation."},{"t":"p","html":"Qalibaf had reportedly <a href=\"https://english.aawsat.com/arab-world/5309299-sources-ghalibaf%E2%80%99s-baghdad-visit-fell-short-all-objectives\" target=\"_blank\" rel=\"noopener\">intervened</a> once before, during a <a href=\"https://www.al-monitor.com/originals/2026/08/irans-ghalibaf-makes-high-level-visit-iraq-ahead-disarmament-deadline\" target=\"_blank\" rel=\"noopener\">trip</a> to Baghdad in mid-August, to soften the prime minister’s position on enforcing the Sept. 30 deadline for disarming ‘resistance’ factions. The following month, Zaidi appears to have acquiesced by <a href=\"https://shafaq.com/en/Iraq/PM-Al-Zaidi-sets-June-2027-deadline-for-weapons-control\" target=\"_blank\" rel=\"noopener\">extending</a> the deadline for bringing all weapons under state control to June 30, 2027."},{"t":"graph","id":"16753823"},{"t":"p","html":"Officially, Baghdad denies any such role for Tehran. On Nov. 15, government spokesman Haidar Al-Aboudi <a href=\"https://almasalah.com/archives/144801\" target=\"_blank\" rel=\"noopener\">said</a> there was \"no Iranian interference through communication channels or mediation\" and that dealing with Jurf Al-Sakhar was an Iraqi responsibility."},{"t":"p","html":"The following evening, Esmail Qa’ani, commander of the Quds Force—the foreign operations arm of Iran's Islamic Revolutionary Guard Corps (IRGC)—<a href=\"https://www.alaraby.co.uk/politics/%D9%82%D8%A7%D8%A2%D9%86%D9%8A-%D9%81%D9%8A-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%84%D8%AA%D9%81%D8%A7%D8%AF%D9%8A-%D9%85%D8%B9%D8%B1%D9%83%D8%A9-%D8%AC%D8%B1%D9%81-%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D9%88%D8%B3%D8%B7-%D8%AE%D9%84%D8%A7%D9%81%D8%A7%D8%AA-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D8%AD%D8%A7%D8%AF%D8%A9\" target=\"_blank\" rel=\"noopener\">arrived</a> in Baghdad. Coordination Framework sources speaking to Al-Hurra <a href=\"https://alhurra.com/55227\" target=\"_blank\" rel=\"noopener\">claimed</a> that Qa’ani and Zaidi agreed that Kata'ib Hezbollah would leave the disputed town \"soon,\" with other PMU brigades and security forces filling the vacuum."},{"t":"p","html":"Other reports say Zaidi <a href=\"https://www.alaraby.co.uk/politics/%D9%82%D8%A7%D8%A2%D9%86%D9%8A-%D9%81%D9%8A-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%84%D8%AA%D9%81%D8%A7%D8%AF%D9%8A-%D9%85%D8%B9%D8%B1%D9%83%D8%A9-%D8%AC%D8%B1%D9%81-%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D9%88%D8%B3%D8%B7-%D8%AE%D9%84%D8%A7%D9%81%D8%A7%D8%AA-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D8%AD%D8%A7%D8%AF%D8%A9\" target=\"_blank\" rel=\"noopener\">refused</a> to meet Qa’ani and told mediators that the decision to send government forces into Jurf Al-Sakhar was final, while Ameri, Hamoudi and other Coordination Framework leaders warned the premier against intra-Shiite bloodshed. On Nov. 17, a Kata'ib Hezbollah leader <a href=\"https://www.france24.com/ar/%D8%A7%D9%84%D8%A3%D8%AE%D8%A8%D8%A7%D8%B1%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%85%D8%B1%D8%A9/20261117-%D9%82%D9%8A%D8%A7%D8%AF%D9%8A-%D9%81%D9%8A-%D9%83%D8%AA%D8%A7%D8%A6%D8%A8-%D8%AD%D8%B2%D8%A8-%D8%A7%D9%84%D9%84%D9%87-%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D9%84%D9%81%D8%B1%D8%A7%D9%86%D8%B3-%D8%A8%D8%B1%D8%B3-%D9%84%D9%86-%D9%86%D9%86%D8%B3%D8%AD%D8%A8-%D9%85%D9%86-%D8%AC%D8%B1%D9%81-%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D9%88%D9%84%D9%88-%D8%B9%D9%84%D9%89-%D8%A3%D8%AC%D8%B3%D8%A7%D8%AF%D9%86%D8%A7\" target=\"_blank\" rel=\"noopener\">insisted</a> the group would not withdraw."},{"t":"p","html":"On Nov. 18, a security committee chaired by Zaidi <a href=\"https://almasalah.com/archives/145029\" target=\"_blank\" rel=\"noopener\">decided</a> that the Energy Police would take over guarding the pipeline through Jurf Al-Sakhar and that the force holding the town would be replaced. On Nov. 9, a source reportedly <a href=\"https://amp.skynewsarabia.com/middle-east/1903607-%D8%AA%D9%87%D8%B1%D9%8A%D8%A8-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D8%AC%D8%B1%D9%81-%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D8%AA%D8%B3%D8%AA%D8%B7%D9%8A%D8%B9-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%85%D8%AD%D8%A7%D8%B3%D8%A8%D8%A9-%D8%A7%D9%84%D9%85%D8%AA%D9%88%D8%B1%D8%B7%D9%8A%D9%86\" target=\"_blank\" rel=\"noopener\">accused</a> Kata’ib Hezbollah of tapping the area’s oil pipelines. An unconfirmed <a href=\"https://en.964media.com/55547/\" target=\"_blank\" rel=\"noopener\">deployment</a> plan would split the town between the Iraqi Army, federal police and two PMU brigades. Coordination Framework leaders had reportedly <a href=\"https://en.964media.com/55547/\" target=\"_blank\" rel=\"noopener\">vetoed</a> sending in combat troops at a Nov. 16 meeting, agreeing instead to replace the force holding the town with other PMU units."},{"t":"p","html":"All in all, despite the many informal channels between Zaidi and Iraq’s Iran-backed armed factions, it remains unclear whether a comprehensive deal will emerge. If Kata’ib Hezbollah does leave Jurf Al-Sakhar by Zaidi’s deadline later this week, that will likely be only the start of wider and more contested negotiations over the powerful armed faction’s future."}],"words":1489},{"type":"Media Monitor","region":"Peninsula","category":"Security","title":"Mass sentencing of Shiite clerics puts Bahrain’s rights record in spotlight","authors":["Amwaj.media Staff"],"date":"2026-11-17","url":"https://amwaj.media/en/media-monitor/mass-sentencing-of-shiite-clerics-puts-bahrains-rights-record-in-spotlight","img":"img/05.jpg","iw":1400,"ih":1050,"alt":"Ayatollah Isa Qassim speaks at a ceremony marking the anniversary of Bahrain's 2011 uprising in Qom, Iran on Jan. 21, 2020. (Photo by Amir Hesamnejad via Tasnim News Agency)","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Bahrain has sentenced scores of Shiite Muslims—most of them clerics—to life in prison, taking its campaign against alleged Iranian influence into the country’s religious establishment."},{"t":"p","html":"The mass verdicts come amid a regional confrontation that has sharpened Manama’s longstanding concerns about Tehran’s sway over its Shiite-majority population. The island nation is the only Gulf Cooperation Council (GCC) member state yet to fully restore diplomatic ties with the Islamic Republic since the 2023 Iranian-Saudi <a href=\"https://amwaj.media/en/article/iran-saudi-deal-eyed-with-optimism-pessimism-and-skepticism\" target=\"_blank\" rel=\"noopener\">rapprochement</a>."},{"t":"p","html":"<strong>The coverage:</strong> The High Criminal Court in Manama on Nov. 16 convicted 69 clerics and activists in a mass trial, <a href=\"https://birdbh.org/2026/11/bahrain-sentences-64-defendants-to-life-imprisonment-and-five-to-15-years-in-mass-trial-of-shia-clerics-amid-allegations-of-torture-and-coerced-confessions/\" target=\"_blank\" rel=\"noopener\">according</a> to the London-based Bahrain Institute for Rights and Democracy (BIRD)."},{"t":"ul","items":["BIRD said the defendants were accused of forming a terrorist organization to overthrow Bahrain’s “constitutional regime” and of promoting Iran’s doctrine of Wilayat Al-Faqih—Guardianship of the Jurist—the religious and constitutional principle underpinning the Islamic Republic.","The court handed 64 defendants life sentences and five others 15-year prison terms. Some were tried in absentia and none was acquitted, according to BIRD. Religious eulogist Mahdi Sahwan, one of the five, was <a href=\"https://x.com/AB4_Ali3/status/2122237517596393519\" target=\"_blank\" rel=\"noopener\">allegedly</a> convicted over a poem he wrote against Israel’s ambassador to Bahrain.","BIRD condemned the rulings, citing “credible allegations of torture, coerced confessions, and severe restrictions on the defense.”"]},{"t":"p","html":"Among those sentenced to life in absentia is Ayatollah Isa Qassim, Bahrain’s most prominent Shiite religious authority. Stripped of citizenship in 2016, Qassim in 2018 left for medical treatment in Britain. In early 2019, he <a href=\"https://en.radiofarda.com/a/bahrain-shiite-leader-qassim-moves-to-mashhad-iran/29748500.html\" target=\"_blank\" rel=\"noopener\">moved</a> to Iran where he still resides."},{"t":"ul","items":["Iran’s AhlulBayt News Agency (ABNA) on Nov. 16 <a href=\"https://en.abna24.com/news/1891257/Al-Khalifa-regime-issues-life-sentence-for-Ayatollah-Sheikh-Isa\" target=\"_blank\" rel=\"noopener\">criticized</a> the verdict against Qassim, charging that it “has once again exposed the Al Khalifa regime’s repressive policies against religious figures,” in reference to Bahrain’s ruling family.","University lecturer Mohammad Yaser Ershadmanesh <a href=\"https://x.com/ERSHADMANESH100/status/2122254645951091176\" target=\"_blank\" rel=\"noopener\">wrote</a> on Twitter/X in Arabic the same day that the Bahraini government had “committed a grave mistake” by sentencing Qassim to life in prison, adding that it would “likely lead to instability and civil war.”"]},{"t":"graph","id":"13938738"},{"t":"p","html":"With no official reaction from Tehran, Iranian outlets and social media users weighed in on the verdicts on Nov. 16."},{"t":"ul","items":["The Persian-language account of Sabereen News, an online outlet reportedly tied to Iran’s Islamic Revolutionary Guard Corps (IRGC), <a href=\"https://x.com/SaberinFa/status/2122274068921483594\" target=\"_blank\" rel=\"noopener\">claimed</a> that “important decisions have been made in Tehran regarding Bahrain” without elaborating. It added that if a new conflict with the US breaks out, Bahrain’s “arrogant rulers will be severely punished.”","Hardline website Raja News <a href=\"https://t.me/rajanews_com/317312\" target=\"_blank\" rel=\"noopener\">amplified</a> calls for a protest outside the Bahraini embassy in Tehran that evening.","On X, one conservative user <a href=\"https://x.com/mry66y/status/2122244114712506686\" target=\"_blank\" rel=\"noopener\">slammed</a> seminaries in Iran and Iraq for staying silent on the verdicts, while hardline cleric Hamed Kashani <a href=\"https://x.com/hamedkashani__/status/2122319893177450684\" target=\"_blank\" rel=\"noopener\">vowed</a> that the “crimes of… Bahrain’s rulers will not go unanswered.”"]},{"t":"p","html":"<strong>The context/analysis:</strong> The mass trial of dozens of Shiite figures in Bahrain stems from a security operation <a href=\"https://www.aljazeera.com/news/2026/5/9/bahrain-rounds-up-dozens-over-alleged-links-to-irans-irgc\" target=\"_blank\" rel=\"noopener\">announced</a> in May, when authorities said 41 people accused of belonging to a group linked to the IRGC had been detained."},{"t":"ul","items":["Bahraini authorities subsequently announced further arrests in connection with the investigation."]},{"t":"p","html":"The timing of the rulings is significant, as Bahrain has been among the Gulf Arab states most directly exposed to the consequences of the Israeli-US war on Iran."},{"t":"ul","items":["Hosting the US Navy’s Fifth Fleet headquarters and occupying a strategic position in the Gulf, Bahrain has been rocked by Iranian attacks in retaliation for Israeli-US bombings.","The most recent Iranian <a href=\"https://amwaj.media/en/media-monitor/iran-warns-no-war-no-peace-will-not-last-amid-tension-over-compensation\" target=\"_blank\" rel=\"noopener\">strikes</a> took place on Nov. 13 and Nov. 15, when the IRGC claimed to have targeted a US <a href=\"https://fa.shafaqna.com/news/2399955\" target=\"_blank\" rel=\"noopener\">early-warning</a> radar and an air <a href=\"https://www.khabaronline.ir/news/2302237\" target=\"_blank\" rel=\"noopener\">defense</a> radar, respectively. Those operations followed reported US bombings of southern Iran."]},{"t":"p","html":"At the height of the war, Iranian hardliners such as Hossein Shariatmadari, editor of hardline daily Kayhan, <a href=\"https://www.asriran.com/fa/news/1171890\" target=\"_blank\" rel=\"noopener\">urged</a> Tehran to “return the province of Bahrain” to Iran."},{"t":"ul","items":["As treaties granting Britain outsized influence were coming to an end, a UN envoy in 1970 consulted Bahraini groups and organizations and <a href=\"https://digitallibrary.un.org/record/502605/files/S_9772-EN.pdf\" target=\"_blank\" rel=\"noopener\">found</a> that the “overwhelming majority” wanted a fully independent state rather than union with Iran. In May 1970, the UN Security Council unanimously <a href=\"https://digitallibrary.un.org/record/112440/files/S_RES_278%281970%29-EN.pdf\" target=\"_blank\" rel=\"noopener\">endorsed</a> those findings in Resolution 278.","Iran <a href=\"https://agsi.org/analysis/bahrain-reduced-to-province-of-iran-on-president-raisis-instagram/\" target=\"_blank\" rel=\"noopener\">claimed</a> Bahrain as a province in 1957 under Shah Mohammad Reza Pahlavi (1941-79) but renounced the claim following UN Security Council Resolution 278. Bahrain became independent in 1971."]},{"t":"p","html":"Manama has increasingly framed domestic security through the prism of alleged Iranian interference. Scores of individuals have been accused of espionage, terrorism and collaboration with the IRGC. The authorities have also revoked the citizenships of dozens of people of Iranian heritage, a move <a href=\"https://www.hrw.org/news/2026/06/11/authorities-strip-citizenship-from-dozens-of-bahrainis\" target=\"_blank\" rel=\"noopener\">condemned</a> by rights groups."},{"t":"ul","items":["The crackdown reflects a longstanding fear within Bahrain’s ruling Sunni establishment that Iran could exploit the country’s sectarian and political divisions to expand its influence.","That concern predates the current conflict. During the 2011 Arab Spring uprising, mainly Shiite protesters challenged the Sunni-led monarchy, demanding political reform and greater representation. The authorities accused Iran of seeking to exploit the unrest, an allegation Tehran denied.","Bahrain’s crackdown on Arab Spring protests—with the aid of several GCC states—was followed by the dissolution of the main opposition groups, deepening the political marginalization of much of the country’s Shiite-majority population."]},{"t":"graph","id":"13040111"},{"t":"p","html":"<strong>The future:</strong> The latest prosecutions suggest that the Iran-Israel-US war has further narrowed the space in which Bahrain’s authorities distinguish between domestic dissent, religious affiliation and suspected foreign interference."},{"t":"ul","items":["For Iran, the sentences offer another opportunity to portray Gulf Arab states as suppressing Shiite communities while aligning themselves with Washington and its military presence in the region.","The sentencing of Ayatollah Qassim in absentia is especially consequential, as his religious stature and residence in Iran tie Bahrain’s internal political tensions to one of the most important centers of Shiite political power and scholarship.","Yet Tehran’s ability to turn the case into political leverage has its limits. The war has given Manama a stronger security rationale for scrutinizing networks it considers connected to Tehran, whose military actions against GCC states have reinforced concerns about Iranian intentions."]}],"words":337},{"type":"Media Monitor","region":"Iran","category":"Security","title":"Iran warns ‘no war, no peace’ will not last amid tension over compensation","authors":["Amwaj.media Staff"],"date":"2026-11-16","url":"https://amwaj.media/en/media-monitor/iran-warns-no-war-no-peace-will-not-last-amid-tension-over-compensation","img":"img/06.jpg","iw":1400,"ih":933,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Iran's chief negotiator in talks with the US has warned that an indefinite state of \"neither war nor peace\" is unacceptable. This comes as Washington signals little appetite for either renewed major military operations or a settlement on Iranian terms."},{"t":"p","html":"Meanwhile, Tehran has rejected Gulf Arab demands for compensation over retaliatory strikes on their soil during the Israeli-US war on Iran. The Islamic Republic is arguing that countries which facilitated the bombing of Iran owe reparations themselves."},{"t":"p","html":"<strong>The coverage:</strong> Parliament Speaker Mohammad Baqer Qalibaf <a href=\"https://www.irna.ir/news/86321937\" target=\"_blank\" rel=\"noopener\">warned</a> on Nov. 15 that Tehran will not accept a prolonged state of \"neither war nor peace\" with Washington."},{"t":"ul","items":["Addressing a parliamentary session, Qalibaf said that should the US make another mistake, Iran's armed forces \"will determine\" the scope of any renewed confrontation.","The speaker—who doubles as chief negotiator—said it made little difference to Iran whether the US chooses negotiations or war, but that an agreement remains possible if Washington accepts <a href=\"https://amwaj.media/en/media-monitor/inside-story-iran-sets-conditions-for-talks-amid-warning-of-us-onslaught\" target=\"_blank\" rel=\"noopener\">conditions</a> set by Tehran.","\"If they accept our seven logical conditions, which are the result of the Iranian people's sacrifices and perseverance, the path to an agreement is open,\" Qalibaf said."]},{"t":"p","html":"Qalibaf's warning comes as the Islamic Revolutionary Guard Corps (IRGC) has stepped up drone strikes on US targets in Bahrain. The operations follow reported US bombings of southern Iran."},{"t":"ul","items":["The IRGC <a href=\"https://www.khabaronline.ir/news/2302237\" target=\"_blank\" rel=\"noopener\">claimed</a> on Nov. 15 that it had used six drones to target an American air-defense radar at the Al-Riffa helicopter base, calling the operation the second stage of its retaliation against US actions.","Bahrain said its air defenses had intercepted several Iranian drones and <a href=\"https://www.mofa.gov.bh/ar/bahrain-strongly-condemns-renewed-iranian-attacks-holds-iran-fully-responsible\" target=\"_blank\" rel=\"noopener\">added</a> that it \"holds Iran fully responsible\" for the consequences. Neither Manama nor Washington immediately confirmed that the radar had been hit.","The claim followed an IRGC <a href=\"https://fa.shafaqna.com/news/2399955\" target=\"_blank\" rel=\"noopener\">announcement</a> on Nov. 13 that it had \"destroyed\" a US early-warning radar in Bahrain. US Central Command (CENTCOM) <a href=\"https://x.com/CENTCOM/status/2121225254446018729\" target=\"_blank\" rel=\"noopener\">said</a> two Iranian one-way attack drones had been launched toward Bahrain and intercepted, with no injuries or damage reported."]},{"t":"graph","id":"12899270"},{"t":"p","html":"On the same day as the IRGC's second claimed attack, Tehran <a href=\"https://www.irna.ir/news/86321905\" target=\"_blank\" rel=\"noopener\">rejected</a> demands by Gulf Cooperation Council (GCC) member states that it <a href=\"https://www.gcc-sg.org/en/MediaCenter/News/Pages/news-2026-11-13-2.aspx\" target=\"_blank\" rel=\"noopener\">compensate</a> them for damage caused by its missile and drone attacks during the war."},{"t":"ul","items":["Foreign ministry spokesperson Esmail Baqaei said Iran, rather than GCC states, is entitled to reparations, and accused regional governments of facilitating Israeli and US military operations against Iranian territory.","\"We are the ones entitled to claim compensation, and we have documented all the instances in which regional countries played a role in assisting the US and the Zionist regime in their actions against Iran,\" Baqaei said. Tehran had formally conveyed its findings to the countries concerned through diplomatic channels, he added."]},{"t":"p","html":"<strong>The context/analysis:</strong> Qalibaf's rejection of “no war, no peace” comes as US President Donald Trump is signaling little interest in a negotiated settlement that would be palatable to Iran."},{"t":"ul","items":["On Nov. 12, Trump <a href=\"https://www.theguardian.com/us-news/2026/nov/12/trump-jd-vance-iran-war\" target=\"_blank\" rel=\"noopener\">wrote</a> on his Truth Social platform that Washington did not need a deal with Iran because \"those days have long since passed.\" He also redirected Vice President JD Vance, who met with Qalibaf in April, toward domestic issues."]},{"t":"p","html":"The US administration has indicated that it will maintain its pressure on Tehran without resuming major military operations."},{"t":"ul","items":["Trump <a href=\"https://www.bbc.com/news/articles/cq5yny4nl2d3o\" target=\"_blank\" rel=\"noopener\">told</a> reporters on Nov. 9 that Washington was \"just keeping it the status quo,\" while Secretary of State Marco Rubio <a href=\"https://www.nytimes.com/2026/11/10/us/politics/rubio-iran-war.html\" target=\"_blank\" rel=\"noopener\">argued</a> that economic pressure on Iran was working well enough to make further major combat operations unnecessary."]},{"t":"p","html":"GCC Secretary-General Jassim Mohammad Al-Budaiwi <a href=\"https://www.gcc-sg.org/en/MediaCenter/News/Pages/news-2026-11-13-2.aspx\" target=\"_blank\" rel=\"noopener\">called</a> on the UN Security Council on Nov. 13 to hold Iran accountable and require it to pay reparations."},{"t":"ul","items":["Budaiwi said GCC states had faced more than 7,000 Iranian missiles and drones since Israel and the US launched the war on Feb. 28, targeting airports, ports, energy, electricity and water desalination facilities, as well as residential areas."]},{"t":"p","html":"Iran has <a href=\"https://www.reuters.com/investigates/special-report/iran-crisis-infrastructure-attacks/\" target=\"_blank\" rel=\"noopener\">launched</a> a large number of munitions at all six GCC states—Bahrain, Kuwait, Oman, Qatar, Saudi Arabia and the United Arab Emirates—in retaliation for Israeli-US strikes on its territory."},{"t":"ul","items":["Although Tehran says it has targeted US military sites and facilities supporting the attack on Iranian soil, the strikes have also hit civilian infrastructure.","GCC air-defense interceptions <a href=\"https://www.everycrsreport.com/files/2026-06-03_R48971_a456a73ab9da287746f46a13f7363d7d9e0386dd.pdf\" target=\"_blank\" rel=\"noopener\">prevented</a> many projectiles from reaching their targets, but falling debris and successful strikes have caused casualties, disrupted air travel and affected energy and commercial operations."]},{"t":"chart","src":"img/c-D2tHb-plain.png","w":760,"h":682,"title":"","link":"https://datawrapper.dwcdn.net/D2tHb/"},{"t":"p","html":"US intelligence suggests that Iran has retained much of its pre-war missile arsenal despite months of Israeli-US strikes."},{"t":"ul","items":["Tehran is believed to possess between 1,500 and 2,500 missiles, according to a Nov. 14 <a href=\"https://www.wsj.com/world/middle-east/u-s-figures-iran-still-has-up-to-2-500-missiles-countering-trump-assertions-4c6f4d67\" target=\"_blank\" rel=\"noopener\">report</a> by The Wall Street Journal citing US officials. In congressional testimony in 2022, then-CENTCOM commander Gen. Kenneth McKenzie <a href=\"https://www.nytimes.com/2023/02/01/world/middleeast/iran-missile-program-israel.html\" target=\"_blank\" rel=\"noopener\">estimated</a> the arsenal at more than 3,000.","The assessment carries low confidence because of difficulties determining how many missiles are ready for launch and how many remain in storage, the report says. Tehran has continued to rebuild its arsenal using stockpiled components, although at a slower pace since Israeli-US strikes on its production facilities."]},{"t":"graph","id":"12914784"},{"t":"p","html":"<strong>The future:</strong> It is unclear how long the current Iran-US standoff can hold without another escalation."},{"t":"ul","items":["With negotiations stalled, the American naval blockade of Iranian ports in place and Tehran signaling that it can still threaten US interests in the region, the risk of miscalculation remains significant.","Tehran may use its military capabilities and the vulnerability of regional infrastructure to raise the cost of Washington's pressure campaign. The Trump administration, meanwhile, appears to be betting that economic constraints will eventually force Iran to reconsider its position.","Much will depend on whether regional mediators can bridge the gap over the sequencing of sanctions relief, security guarantees and the future of the Strait of Hormuz."]}],"words":305}]};

window.GRAPHS = {"6899424":{"title":"Iran's renewable water resources (per capita)","subtitle":"In cubic meters (m³), 1967-2021*","source":"Source: Knoema.com, Iranian expert","kind":"image","src":"img/f-6899424.png","w":1280,"h":986},"11435461":{"title":"Peshmerga affiliations","subtitle":"By party/entity","source":"Source: News agencies","kind":"image","src":"img/f-11435461.png","w":1280,"h":821},"12899270":{"title":"Iran's drone arsenal","subtitle":"Key Unmanned Aerial Vehicles (UAVs)","source":"Source: Global Security, USIP, news agencies","kind":"image","src":"img/f-12899270.png","w":1280,"h":966},"12914784":{"title":"Iran's missile arsenal","subtitle":"A selection of key projectiles","source":"Source: CSIS, Iran Watch","kind":"cards","logos":false,"cards":[{"img":"img/k-43d1f4454840.jpg","title":"Fateh-313","sub":"","text":"SRBM Solid fuel 500 km (311 miles)"},{"img":"img/k-a7383d6376b6.png","title":"Kheibar-Shekan","sub":"","text":"MRBM Solid fuel 1,450 km (901 miles)"},{"img":"img/k-a34895bf4c36.png","title":"Sejjil","sub":"","text":"MRBM Solid fuel 2,000 km (1,243 miles)"},{"img":"img/k-68482672be7d.png","title":"Shahab-3","sub":"","text":"MRBM Liquid fuel 1,300 km (808 miles)"},{"img":"img/k-1c669012c5c0.png","title":"Soumar","sub":"","text":"Cruise missile Turbofan 2,000-3,000 km (1,243-1,864 miles)"}]},"13040111":{"title":"Religious freedom in Bahrain, 2008-19","subtitle":"On a scale of 1 (low freedom) to 10 (highly free)","source":"Source: CATO Institute's Human Freedom Index","kind":"chart","type":"column_grouped","labels":["2008","2009","2010","2011","2012","2013","2014","2015","2016","2017","2018","2019"],"series":["Freedom of religion","Religious organization repression"],"values":[[5.8,5.8,5.8,3.3,3.4,3.4,3.4,3.4,3.4,3.4,3.4,4.1],[6.7,6.7,6.7,2,1.7,1.7,1.3,1.3,1.3,1.3,1.8,1.8]],"colors":["#00a693","#ffa333","#c09b5c"],"yTitle":"Score","y2Title":"","xTitle":"","facets":false,"labels_on":false},"13938738":{"title":"Prominent Bahraini opposition figures","subtitle":"","source":"Source: News agencies","kind":"cards","logos":true,"cards":[{"img":"img/k-13926d1eb91e.png","title":"Ayatollah Isa Qassim","sub":"","text":"1937 Islamic Enlightenment Institution Qom, Iran Revoked citizenship, suspended life sentence"},{"img":"img/k-931448047838.png","title":"Ali Salman","sub":"","text":"1968 Al-Wefaq National Islamic Society Jau Prison, Bahrain Jailed, life sentence"},{"img":"img/k-97ffdd580e00.png","title":"Abdulhadi Khawaja","sub":"","text":"1961 Bahrain Centre for Human Rights Jau Prison, Bahrain Jailed, life sentence"},{"img":"img/k-690fede2dafc.png","title":"Hasan Mushaima","sub":"","text":"1948 Haq Movement Jau Prison, Bahrain Jailed, life sentence"},{"img":"img/k-d20d404fe5fd.png","title":"Nabeel Rajab","sub":"","text":"1964 Bahrain Centre for Human Rights Bani Jamra, Bahrain Sentence served"},{"img":"img/k-c1e85921ef12.png","title":"Abdulwahab Hussain","sub":"","text":"1954 Al-Wafaa Islamic Movement Jau Prison, Bahrain Jailed, life sentence"},{"img":"img/k-e240ebb88054.png","title":"Abduljalil Al-Singace","sub":"","text":"1962 Haq Movement Jau Prison, Bahrain Jailed, life sentence"}]},"16753823":{"title":"\"Islamic Resistance in Iraq\"","subtitle":"Key units of the new umbrella organization","source":"Source: News agencies","kind":"cards","logos":false,"cards":[{"img":"img/k-9dff1b76a258.png","title":"Ashab Al-Kahf","sub":"","text":"Unknown"},{"img":"img/k-a5577dd38bca.jpg","title":"Harakat Hezbollah Al-Nujaba","sub":"","text":"Akram Al-Kaabi"},{"img":"img/k-9b70d0bed3e7.png","title":"Kata’ib Hezbollah","sub":"","text":"Ahmad (Abu Hussein) Al-Hamidawi"},{"img":"img/k-717da1b7912d.jpg","title":"Kata'ib Sayyid Al-Shuhada","sub":"","text":"Abu Ala Al-Walai"}]},"18081279":{"title":"Shiite Coordination Framework","subtitle":"An overview of the umbrella organization bringing together many of Iraq's Shiites.","source":"Source: News agencies, Collated by: Amwaj.media","kind":"cards","logos":false,"cards":[{"img":"img/k-f481b2bedea6.jpg","title":"State of Law","sub":"Nouri Al-Maliki","text":""},{"img":"img/k-140b38fd9e84.png","title":"Fatah Alliance","sub":"Hadi Al-Ameri","text":""},{"img":"img/k-b5972039cf61.png","title":"Hikmah Movement","sub":"Ammar Al-Hakim","text":""},{"img":"img/k-56d45fb185c7.jpg","title":"Nasr bloc","sub":"Haidar Al-Abadi","text":""},{"img":"img/k-bd2c9e982532.jpg","title":"Aqd Al-Watani","sub":"Falih Al-Fayyadh","text":""},{"img":"img/k-e21ef81dd3a4.jpg","title":"Hoquq Movement","sub":"Hussein Mounis","text":""},{"img":"img/k-3f478ec7ee26.jpg","title":"Iqtidar Watan","sub":"Abdulhussein Abtan","text":""},{"img":"img/k-85b8795a8283.jpg","title":"Al-Nahj Al-Watani","sub":"Ammar Ta'meh","text":""},{"img":"img/k-a1a775029d23.jpg","title":"Other Shiite groups","sub":"Individual MPs","text":""},{"img":"img/k-e76ec8c0eeab.jpg","title":"Sadrists","sub":"Muqtada Al-Sadr","text":"[Exited July 2021]"}]},"24298377":{"title":"Water stress in West Asia, 2021","subtitle":"Freshwater withdrawal as a proportion of available resources (%)","source":"Source: World Bank","kind":"image","src":"img/f-24298377.png","w":1280,"h":1018},"26949807":{"title":"The rise of Asa'ib Ahl Al-Haq","subtitle":"Overview of key events","source":"Source: News agencies","kind":"timeline","entries":[{"date":"2006","title":"Split and formation","text":"Asa'ib Ahl Al-Haq breaks from the insurgents in the Sadrist movement, led by young cleric Qais Al-Khazali."},{"date":"Jan. 2007","title":"Karbala raid","text":"The group carries out an attack on US forces in Karbala, establishing a reputation as a high-capability armed actor."},{"date":"Apr. 2014","title":"Entering parliament","text":"Through the Sadiqoon bloc, the group enters Iraq's federal legislature, institutionalizing its dual role as an armed group and political actor."},{"date":"June 2014","title":"PMU integration","text":"Khazali's group becomes a core Popular Mobilization Units faction during the fight against the Islamic State group, gaining legitimacy, resources and battlefield influence."},{"date":"Jan. 2020","title":"Terrorist designation","text":"The United States designates the group as a terrorist organization, intensifying international pressure and shaping its external posture."}]},"27028745":{"title":"The rise of Kata'ib Hezbollah","subtitle":"Overview of key events","source":"Source: News agencies","kind":"timeline","entries":[{"date":"2007","title":"Formation","text":"Kata’ib Hezbollah takes shape after the 2003 US-led invasion of Iraq, led by Iran-backed Shiite fighters."},{"date":"2009","title":"Terror listing","text":"The US designates the armed group as a foreign terrorist organization, marking its emergence as a key anti-American force."},{"date":"2014","title":"PMU integration","text":"The faction joins Iraq’s Popular Mobilization Units (PMU) to fight the Islamic State group, embedding it within Iraq's security apparatus."},{"date":"2019","title":"Conflict escalation","text":"The US bombs the group's bases in retaliation for a rocket attack that kills a contractor, escalating tension between Baghdad and Washington."},{"date":"2020","title":"Founder's killing","text":"The US kills PMU deputy chief Abu Mahdi Al-Muhandis, who is also head of Kata'ib Hezbollah, alongside Iranian commander Qasem Soleimani in Baghdad."},{"date":"2025","title":"Continued regional role","text":"The group issues warnings against US intervention in the Israel-Iran conflict, underlining ongoing Iran-aligned militancy."}]},"28312414":{"title":"Evolution of Iraq's Popular Mobilization Units","subtitle":"Evolution of Iraq's Popular Mobilization Units","source":"Source: News agencies","kind":"cards","logos":false,"cards":[{"img":"img/k-4868a12115ac.jpg","title":"Inception via fatwa","sub":"June 2014","text":"Amid the onslaught of the Islamic State group, Grand Ayatollah Ali Al-Sistani issues a fatwa calling on able-bodied citizens to defend Iraq, sparking mass mobilization."},{"img":"img/k-7df2f20587da.jpg","title":"Battle of Tikrit","sub":"Mar.-Apr. 2015","text":"The new umbrella entity provides essential ground forces to recapture Saddam Hussein’s hometown, marking a major milestone against IS."},{"img":"img/k-d1c0ac8783c3.jpg","title":"Formalization of PMU","sub":"Nov. 2016","text":"The Iraqi parliament passes a law recognizing the PMU as a formation within the armed forces that reports to the prime minister."},{"img":"img/k-c284046b817f.jpg","title":"Liberation of Mosul","sub":"July 2017","text":"PMU factions secure the western desert and supply lines, contributing to the final collapse of Mosul, the IS \"capital'' in Iraq."},{"img":"img/k-9acdcad29a98.jpg","title":"Leadership decapitation","sub":"Jan. 2020","text":"A US drone strike kills PMU deputy chief Abu Mahdi Al-Muhandis and Iranian Quds Force commander Qasem Soleimani near Baghdad's airport."},{"img":"img/k-92819c139ae3.jpg","title":"Stalled integration","sub":"2023-","text":"The PMU seeks independent ministry status, but political pushback leaves it as a security body under the prime minister."}]},"30987215":{"title":"Upheaval from Mecca to Tehran","subtitle":"Upheaval from Mecca to Tehran","source":"Source: News agencies, US embassy in Saudi Arabia","kind":"timeline","entries":[{"date":"Feb. 11, 1979","title":"Iran's monarchy falls","text":""},{"date":"Nov. 4, 1979","title":"US embassy in Tehran seized","text":""},{"date":"Nov. 20, 1979","title":"Gunmen seize the Grand Mosque","text":""},{"date":"Nov. 20, 1979","title":"Shootout and blackout","text":""},{"date":"Nov. 21, 1979","title":"Khomeini points to the US","text":""},{"date":"Nov. 21, 1979","title":"US embassy in Islamabad burned","text":""}]},"30987217":{"title":"Inside the Mecca siege, by the numbers","subtitle":"Inside the Mecca siege, by the numbers","source":"","kind":"cards","logos":false,"cards":[{"img":"","title":"40,000–50,000","sub":"Worshippers believed inside","text":"A Saudi minister's estimate. Not all are held hostage, but those trapped numbe     // People cards = photos (not logos), every card has a title line, and the names are long (not dates like "2010-17").
    var avg = g.cards.reduce(function (s, c) { return s + String(c.title || '').length; }, 0) / Math.max(1, g.cards.length);

  // a warm off-white card with a turquoise bar on top; a brown label (the piece's desk) and a turquoise kicker in spaced

  var HOUSE = ['#00A693', '#FFA333', '#C09B5C', '#64402E', '#4E6E81', '#9B4F4F'];

    fetch(SUB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.value.trim(), email: f.email.value.trim(), languages: langs, frequency: 'weekly', acceptTerms: true }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (x.ok) { say(x.j.message || 'You have been subscribed to our newsletter!', true); go.textContent = 'Done'; return; }
        go.disabled = false; go.textContent = 'Subscribe';
        say(x.j.error || 'We could not sign you up right now. Please try again later.');
        if (x.j.resubscribeUrl) { var a = document.createElement('a'); a.href = x.j.resubscribeUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = ' Open amwaj.media'; msg.appendChild(a); }
      }, function () { go.disabled = false; go.textContent = 'Subscribe'; say('We could not reach the sign-up. Please check your connection and try again.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (!story || (dlg && dlg.open) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoom(1); }
    if (e.key === '-') { e.preventDefault(); zoom(-1); }
    if (e.key === '0') { zi = 0; size(); }
    if (e.key === 'f' || e.key === 'F') toggleFull();
  });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      var p = $('fullp'); if (p) p.setAttribute('d', fullOn() ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
      if ($('full')) $('full').setAttribute('aria-label', fullOn() ? 'Leave full screen' : 'Full screen');
      setTimeout(size, 60);
    });
  });
  // "Browse all stories" scrolls to the story cards
  document.addEventListener('click', function (e) {
    var j = e.target.closest && e.target.closest('[data-jump]');
    if (j && $(j.dataset.jump)) $(j.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  window.addEventListener('hashchange', function () {
    var m = /^#story-(\d+)/.exec(location.hash);
    if (story && m && +m[1] === story.p.no) { var s = /-p(\d+)$/.exec(location.hash); if (s && +s[1] - 1 !== story.at) showSpread(+s[1] - 1); return; }
    route();
  });
  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var wasWide = wide, nowWide = window.matchMedia('(min-width:900px)').matches;
      if (story && wasWide && nowWide) size();
      // phone turned round (width changes; a height change is only the address bar): lay the story out again
      else if (story && !nowWide && !wasWide && !story.p.toc && Math.abs($('stage').clientWidth - phoneW) > 30) {
        var fr = story.at / Math.max(1, story.pages.length), sp = story.p; story = null; openStory(sp, 0);
        showSpread(Math.min(story.pages.length - 1, Math.floor(fr * story.pages.length)));
      }
      else if (wasWide !== nowWide) { story = null; route(); }
    }, 180);
  });
  var fontsReady = document.fonts && document.fonts.load ? Promise.all([400, 500, 700, 900].map(function (w) { return document.fonts.load(w + ' 16px Sombra'); })).catch(function () {}) : Promise.resolve();
  var laid = false;
  Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
    laid = true;
    window.__laidWithFonts = !!(document.fonts && [400, 500, 700, 900].every(function (w) { return document.fonts.check(w + ' 16px Sombra'); }));
    paginateAll(); route();
  });
  // on a slow phone Sombra can arrive after the first layout; the text is then shorter than measured, which leaves empty
  // pages and gaps (Editor, Nov. 12, 2026): lay everything out again once every font is in
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {
    if (!laid) return;
    var ok = [400, 500, 700, 900].every(function (w) { return document.fonts.check(w + ' 16px Sombra'); });
    if (!ok) return;
    if (window.__laidWithFonts) return; window.__laidWithFonts = true;
    PH.key = ''; paginateAll();
    if (story) { var fr = story.at / Math.max(1, story.pages.length), sp = story.p; story = null; openStory(sp, 0); showSpread(Math.min(story.pages.length - 1, Math.floor(fr * story.pages.length))); }
  });
})();
</script>
