<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Amwaj Magazine</title>
<style>
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Black.ttf) format("truetype");font-weight:900;font-display:swap}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
:root{--teal:#00A693;--orange:#FFA333}
html,body{height:100%;margin:0}
body{background:var(--teal);color:#fff;font-family:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;width:100%;display:grid;gap:22px}
img{width:min(320px,70%);height:auto}
h1{font-weight:900;font-size:clamp(48px,14vw,104px);line-height:.86;letter-spacing:-.02em;margin:0}
p{font-size:18px;line-height:1.5;margin:0;max-width:30em}
a{color:#fff;font-weight:900}
.line{height:3px;background:var(--orange);width:72px}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Amwaj.media" width="1440" height="512">
  <h1>Magazine</h1>
  <div class="line"></div>
  <p>The week's reporting and analysis on Iran, Iraq and the Arabian Peninsula, in one place. Coming soon.</p>
  <p><a href="https://amwaj.media">amwaj.media</a></p>
</main>
</body>
</html>
