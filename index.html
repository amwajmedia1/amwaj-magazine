<body>
<title>Amwaj Magazine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Amwaj Magazine, v5 (Nov. 11, 2026), in the design Claude Desktop mocked up for the Editor
   (https://claude.ai/artifact/5pf4iWjbGsCLQnSi2UVBzQ): a web-style issue front page (turquoise wordmark cover,
   "Number of the week", "The week in a minute", "In this wave" by region, a turquoise footer); each story opens as
   paginated spreads on a computer and scrolls as one page on a phone. The wordmark's first "a" in Magazine is the joined
   Arabic ta marbuta. Reused blocks from reader2.html (openers, text flow, graphics) are inserted by inline3.js. */
:root{
  --ground:#F4F7F6; --desk:#E4EAE9; --paper:#FFFFFF; --ink:#2F3333; --ink2:#5C6567; --rule:#D9E1DF;
  --teal:#00A693; --teal-ink:#007D6E; --teal-deep:#06302A; --orange:#FFA333; --sand:#C09B5C; --brown:#64402E; --burg:#9B4F4F;
  --shade:rgba(20,40,36,.16); --chip:#E2F3F0; --tint:#F4F7F6; --paper-old:#F6F0E3;
  --display:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Medium.ttf) format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Black.ttf) format("truetype");font-weight:900;font-display:block}
body{background:var(--ground);color:var(--ink);font-family:var(--body)}
body.reading{background:var(--desk);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
/* ---------- openers ---------- */
.kick{display:flex;flex-wrap:wrap;gap:.6em 1.1em;font-size:2.3cqw;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.kick .r{color:var(--teal-ink)}.kick .y{opacity:.75}
.by{font-size:2.6cqw;margin-top:2.2cqw;opacity:.85}
.by b{font-weight:700}
/* A: the photo takes the page, the headline sits on it */
.op-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-a .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,13,.05) 35%,rgba(5,15,13,.9) 100%)}
.op-a .tx{position:absolute;left:7.5cqw;right:7.5cqw;bottom:7cqw;color:#fff;z-index:1}
.op-a .kick .r{color:#7FE3D4}
.op-a h1{font-family:var(--display);font-weight:900;font-size:7.6cqw;line-height:1.02;margin:2cqw 0 0;text-wrap:balance}
/* B: headline first, the photo below it */
.op-b .tx{padding:8cqw 7.5cqw 4cqw}
.op-b h1{font-family:var(--display);font-weight:900;font-size:8.4cqw;line-height:.98;letter-spacing:-.015em;margin:2.4cqw 0 0;text-wrap:balance}
.op-b .ph{flex:1;min-height:0;position:relative;margin:0 7.5cqw 7cqw}
.op-b .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-b .ph::before{content:"";position:absolute;left:-2.4cqw;top:-2.4cqw;width:22cqw;height:22cqw;background:var(--orange);z-index:0}
.op-b .ph img{z-index:1}
/* C: Media Monitor, a coloured band with the label, the photo as a strip */
.op-c .band{background:var(--brown);color:#fff;padding:7cqw 7.5cqw 6cqw}
.op-c .label{font-family:var(--display);font-weight:900;font-size:4.2cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.op-c h1{font-family:var(--display);font-weight:900;font-size:6.6cqw;line-height:1.04;margin:2.4cqw 0 0;text-wrap:balance}
.op-c .kick .r{color:#FFC98A}
.op-c .ph{position:relative;flex:1;min-height:0}
.op-c .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* D: a big typographic headline, the photo filling the rest of the page (Nov. 11, 2026) */
.op-d .tx{padding:8cqw 7.5cqw 0}
.op-d h1{font-family:var(--display);font-weight:900;font-size:9cqw;line-height:.95;letter-spacing:-.02em;margin:2.6cqw 0 0;text-wrap:balance}
.op-d .ph{flex:1;min-height:0;position:relative;margin:5cqw 7.5cqw 7cqw}
.op-d .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Old News: the photo aged, an archive-paper band; the whole opener on the same cream as its text pages
   (".page.op-o": the plain .page background came later in the CSS and turned it white; Editor, Nov. 11, 2026) */
.op-o,.page.op-o{background:#F6F0E3;color:#3A2A1C}
.op-o .ph{position:relative;height:56%}
.op-o .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.75) contrast(1.05) brightness(.95)}
.op-o .tx{padding:5cqw 7.5cqw 0}
.op-o .label{display:inline-block;border:1px solid #333333;border-radius:3px;background:#333333;color:#FFFFFF;font-weight:900;font-size:2.6cqw;letter-spacing:.16em;text-transform:uppercase;padding:.6cqw 1.6cqw}   /* Badge Guide: ANALYSIS row */
.op-o h1{font-family:var(--display);font-weight:900;font-size:7cqw;line-height:1.02;margin:2.4cqw 0 0;text-wrap:balance}
.op-o .kick .r{color:var(--brown)}

/* ---------- the text flow ---------- */
/* setting F of the type test (Editor, Nov. 11, 2026): two columns, 13 px on the 560 px page, line spacing 1.4,
   left-aligned, smaller margins. The phone reader (one column) keeps its own text size. */
/* the text stops clear of the folio rule: 1.2cqw (~7px on a 560px page) under the last line, ~10px to the rule
   (Editor, Nov. 12, 2026: 3-6px was too close to the bottom; then 2.6cqw, ~18px, "too big now") */
.fview{flex:1;min-height:0;overflow:hidden;margin:4.5cqw 5.5cqw 1.2cqw;position:relative}
.flow{height:100%;width:100%;column-gap:var(--gap,22px);column-fill:auto;line-height:1.56;hyphens:auto;-webkit-hyphens:auto}
/* (no will-change:transform here: it made the browser paint the text once at the page's own size and stretch that
   image when the page is scaled up on a big screen, so text and graphics looked blurred; Editor, Nov. 11, 2026) */
.flow.c1{column-count:1}.flow.c2{column-count:2;font-size:.8125em;line-height:1.4}
.flow.c2 p{margin-bottom:.6em}
/* a band across the top of a two-column page: the Bottom Line (one column, set apart) or a graph */
.band{position:absolute;left:0;right:0;top:0;z-index:1;font-size:.8125em;line-height:1.45;background:var(--paper)}
.band .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
.band .fig{margin:0}
.band .gx{font-size:1.02em}
/* width 100% + height auto: an image not yet loaded still takes its height from its width/height attributes, so the
   band measures the same before and after loading (width:auto made it 0 high until the image arrived) */
.band .gx-svg,.band .gx-img{max-height:calc(var(--ph) * .42 * var(--gshrink, 1));width:100%;height:auto;object-fit:contain;margin:0 auto}
.band .fig.photo img{max-height:calc(var(--ph) * .42);width:100%;object-fit:cover}
.bsp{display:block;break-inside:avoid}
/* HARD RULE (Editor, Nov. 11, 2026): photos never crop people's heads. Every cropped photo keeps its upper part in view
   (no focal points are stored for these photos yet) */
.page img,.opb-ph img,.cv-ph img,.hero img,.card img,.ph-story img,.tcover img,.ti img,.lead img{object-position:50% 22%}
.gx-img,.gx-map img,.gx-card img{object-position:50% 50%}
/* the phone reader (one column): smaller lines, timelines and graphs compact, so a graph never fills a page */
.flow.c1 p{orphans:2;widows:2}
.flow.c1 .tl,.flow.c1 .gx{font-size:.86em}
.flow.c1 .ax-te{padding:.2em 0 .35em;line-height:1.34}
/* timeline: the dot and the rail sit in the middle of a fixed 30px gap, so they never touch the date or the entry
   (HARD RULE, Editor, Nov. 12, 2026: text and timeline graphic overlapped on phones) */
.ax-tl .ax-te{grid-template-columns:var(--tld,6.6em) 1fr;gap:0 30px}
.ax-tl .ax-te::before{left:calc(var(--tld,6.6em) + 14px)}
.ax-tl .ax-te::after{left:calc(var(--tld,6.6em) + 9px)}
.ax-tl .ax-te.last .ax-tx{margin-left:0}
/* HARD RULE (Editor, Nov. 12, 2026): timelines are left-aligned with their header and standfirst, never right-aligned:
   dates start at the left edge; the date column is as wide as the longest date (--tlw, set by graphs-render.js) */
.ax-tl .ax-te{--tld:var(--tlw,6.6em)}
.ax-tl .ax-td{text-align:left}
.flow.c1 .ax-tl .ax-te{--tld:min(var(--tlw,5em),5em)}
.flow.c1 .fig{margin:.5em 0 .9em}
/* phone sliders: four small cards a row, so a slider shares its page with text (Editor, Nov. 11, 2026: "the graph
   (slider) also looks terrible") */
.flow.c1 .gx.kind-cards{font-size:.74em}
.flow.c1 .gx-cards{gap:.7em .4em}
.flow.c1 .gx-cards:not(.wide) .gx-card{flex:0 0 calc(25% - .3em)}
.flow.c1 .gx-cards.one-row .gx-card{flex:1 1 0}
/* graphics adapt to every screen size (Editor, Nov. 12, 2026): on short phones the cards get smaller, so a big grid
   still shares its page with text */
@media (max-height:760px){
  .flow.c1 .gx-card img{width:2.7em;height:2.7em}
  .flow.c1 .gx-cards{gap:.45em .4em}
  .flow.c1 .gx.kind-cards{font-size:.7em}
}
.flow.c1 .gx-cards.per:not(.wide) .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * .4em) / var(--per))}
.flow.c1 .gx-card img{width:3.4em;height:3.4em}
/* phone: a long list of wide cards (6 or more, e.g. Issue 2's "US-designated Foreign Terrorist Organizations": 8 rows)
   goes into two columns with smaller pictures, so it shares its page with text instead of filling a page alone or
   pushing itself onto the next one (Nov. 13, 2026: 360x780 and 375x667 failed on it) */
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)){grid-template-columns:repeat(2,minmax(0,1fr));gap:.55em .8em}
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card{gap:.5em}
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card img{width:2.5em;height:2.5em}
.flow.c1 .gx-card b{font-size:.92em;line-height:1.15}
.flow.c1 .gx-card .sub,.flow.c1 .gx-card .txt{font-size:.82em;line-height:1.2}
/* maps: framed by two orange corner strokes, top left and bottom right (Editor, Nov. 11, 2026; replaces a full-width
   stroke on top) */
.gx-map{position:relative;padding:.7em;background:#fff;box-sizing:border-box}
/* in a band the frame is as wide as the map at its allowed height, so the corners sit on the map's own corners */
.band{--mapmax:calc(var(--ph) * .42)}
html.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
html.dens-2 .band{--mapmax:calc(var(--ph) * .31)}
html.dens-3 .band{--mapmax:calc(var(--ph) * .28)}
.band .gx-map{width:min(100%, calc(var(--mapmax) * var(--ar) + 1.4em));margin:0 auto}
.band .gx-map .gx-img{max-height:none;width:100%;height:auto}
.gx-map::before,.gx-map::after{content:"";position:absolute;width:3.2em;height:3.2em;border:0 solid #FFA333;pointer-events:none}
.gx-map::before{top:0;left:0;border-top-width:5px;border-left-width:5px}
.gx-map::after{bottom:0;right:0;border-bottom-width:5px;border-right-width:5px}
/* the opener on a computer (Nov. 11, 2026): photo edge to edge with the headline over it, across the top of the first
   text page; the Bottom Line under it when it fits */
.band.opband{left:0;right:0;top:0;z-index:2;font-size:inherit;line-height:normal;background:transparent}
.page.oldnews .band.opband{background:transparent}
/* every Old News page is cream, bands included (HARD RULE, Nov. 11) */
.page.oldnews .band{background:var(--paper-old,#F6F0E3)}
/* the Old News note sits above the Bottom Line (HARD RULE, Editor, Nov. 12, 2026) */
.onintro{margin:0 0 .9em}
.band .onintro{padding:0 .1em}
/* the photo is at least this tall and grows with the headline, so the kicker and headline are never cut off */
.opb-ph{position:relative;min-height:min(calc(var(--ph) * .4), calc(var(--pw) * .7));overflow:hidden;background:#06302A;display:flex;flex-direction:column;justify-content:flex-end}
.opb-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opb.old .opb-ph img{filter:sepia(.75) contrast(1.05) brightness(.95)}
.opb-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,12,.15) 0%,rgba(4,14,12,.35) 35%,rgba(4,14,12,.88))}
.opb-tx{position:relative;padding:5cqw 5.5cqw 4cqw;color:#fff}
.opb-tx .kick{color:#fff}
.opb-tx .kick .r{color:#FFE2BD}
.opb-tx h1{font-family:var(--display);font-weight:900;font-size:6.2cqw;line-height:1.02;margin:1.6cqw 0 0;text-wrap:balance}
/* badges per the Badge Guide (Editor, Nov. 11, 2026): MEDIA MONITOR = DEVELOPING row, OLD NEWS = ANALYSIS row */
.opb.mm .opb-tx .kick .y{background:#FBF3E4;border:1px solid #C09B5C;color:#64402E;border-radius:3px;padding:.3cqw 1.2cqw}
.opb.old .opb-tx .kick .y{background:#333333;border:1px solid #333333;color:#FFFFFF;border-radius:3px;padding:.3cqw 1.2cqw}
.opb-tx .by{font-size:2.3cqw;margin-top:1.6cqw;opacity:.9}
.opb-cap{font-size:1.9cqw;line-height:1.35;color:var(--ink2);padding:1.4cqw 5.5cqw 0}
/* HARD RULE (Editor, Nov. 12, 2026): text never covers a photo. On a phone the photo stands on its own at its own shape
   and the label, headline and byline go BELOW it (photo, caption, then the headline) */
@media (max-width:899px){
  .opb{display:flex;flex-direction:column}
  .opb-ph{display:contents}
  /* a fixed height (about a 3:2 photo's own shape), so the layout measures the same before the photo has loaded */
  .opb-ph img{position:static;order:1;display:block;width:100%;height:min(calc(var(--pw) * .66), calc(var(--ph) * .36));object-fit:cover}
  .opb-veil{display:none}
  .opb-cap{order:2}
  .opb-tx{order:3;color:var(--ink);padding:2.6cqw 5.5cqw 0}
  .opb-tx .kick{color:var(--ink2)}
  .opb-tx .kick .r{color:var(--teal-ink)}
  .opb-tx .by{opacity:1;color:var(--ink2)}
}
.page.oldnews .opb-cap{color:#7a6650}
.opb-bl{padding:3cqw 5.5cqw 0;font-size:.8125em;line-height:1.45}
.opb-bl .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
/* HARD RULE (Editor, Nov. 11, 2026): max 40 pages. When an issue is longer, the reader lays it out again one step
   tighter at a time (class dens-1..3 on <html>, set by paginateAll) until it fits */
html.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
html.dens-1 .band .gx-svg,html.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
/* one story at a time (Nov. 12, 2026, no page limit any more): when a story would end on an almost empty page, its
   photo and graph bands get a little smaller (never the text) and it is laid out again; kept only if it saves the page */
.page.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
.page.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
.page.dens-1 .band .gx-svg,.page.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
.page.dens-2 .band{--mapmax:calc(var(--ph) * .29)}
.page.dens-2 .opb-ph{min-height:calc(var(--ph) * .27)}
.page.dens-2 .band .gx-svg,.page.dens-2 .band .gx-img{max-height:calc(var(--ph) * .29)}
html.dens-2 .opb-ph{min-height:calc(var(--ph) * .28)}
html.dens-2 .band .gx-svg,html.dens-2 .band .gx-img{max-height:calc(var(--ph) * .31)}
html.dens-2 .flow.c2,html.dens-2 .band:not(.opband),html.dens-2 .opb-bl{font-size:.78em}
html.dens-3 .opb-ph{min-height:calc(var(--ph) * .25)}
html.dens-3 .band .gx-svg,html.dens-3 .band .gx-img{max-height:calc(var(--ph) * .28)}
html.dens-3 .flow.c2,html.dens-3 .band:not(.opband),html.dens-3 .opb-bl{font-size:.75em}
html.dens-3 .flow.c2{line-height:1.36}
.flow p{text-wrap:pretty}
.flow p{margin:0 0 .85em;orphans:3;widows:3}
.flow p.first::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.6em;line-height:.82;margin:.06em .1em 0 0;color:var(--teal)}
.flow h3{font-family:var(--display);font-weight:900;font-size:1.28em;line-height:1.15;margin:1.1em 0 .45em;break-after:avoid;text-wrap:balance;color:var(--teal-ink)}
.flow ul{margin:0 0 .9em;padding-left:1.1em}
.flow li{margin:0 0 .55em}
.flow li::marker{color:var(--orange)}
.flow a{color:var(--teal-ink);text-decoration-thickness:1px;text-underline-offset:2px}
.flow strong{font-weight:700}
.blbox{background:var(--chip);padding:1em 1.1em .4em;margin:0 0 1.2em;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blbox h4{margin:0 0 .6em;font-size:.78em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.blbox ul{padding-left:1.05em;margin:0}
.blbox li{line-height:1.45}
.fig{margin:.4em 0 1.1em;break-inside:avoid}
.fig img{display:block;width:100%;height:auto;max-height:var(--figmax,60vh);object-fit:contain;background:#fff}
.fig figcaption{font-size:.76em;line-height:1.35;color:var(--ink2);margin-top:.5em;padding-left:.7em;border-left:3px solid var(--orange)}
.fig.photo img{object-fit:cover;max-height:var(--figmax,60vh)}
.pull{break-inside:avoid;margin:.5em 0 1.1em;padding:.6em 0 .7em;border-top:3px solid var(--orange);border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:900;font-size:1.42em;line-height:1.16;color:var(--ink);text-wrap:balance}
.pull::before{content:"“";color:var(--orange);margin-right:.05em}
.pull::after{content:"”";color:var(--orange)}
.endmark{margin-top:1em;font-weight:700;font-size:.92em}
.endmark::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--teal);margin-right:.5em;vertical-align:.05em}
.folio .contd{margin-left:auto;margin-right:1.4em;text-transform:none;letter-spacing:.02em;font-weight:700;color:var(--ink2)}
.oldnews .flow{background:transparent}
.page.oldnews{background:#F6F0E3;color:#3A2A1C}
.page.oldnews .folio{border-color:#D9CCB3;color:#7a6650}

/* ---------- graphics drawn from the Flourish data ---------- */
.gx{font-size:.8em;line-height:1.3;color:var(--ink)}
.gx-h{margin-bottom:.6em;border-top:3px solid var(--teal);padding-top:.5em}
.gx-t{font-family:var(--display);font-weight:900;font-size:1.15em;line-height:1.15;text-wrap:balance}
.gx-s{color:var(--ink2);margin-top:.15em}
.gx-src{color:var(--ink2);font-size:.82em;margin-top:.5em}
.gx-svg{display:block;width:100%;height:auto;overflow:visible}
.gx-svg .ax{font-size:15px;fill:var(--ink2);font-family:var(--body)}
.gx-svg .lab{font-size:16px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .val{font-size:15px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .grid{stroke:var(--rule);stroke-width:1}
.gx-svg .base{stroke:var(--ink2);stroke-width:1}
.gx-leg{display:flex;flex-wrap:wrap;gap:.3em 1em;margin-bottom:.4em;font-size:.92em}
.gx-leg span{display:inline-flex;align-items:center;gap:.4em}
.gx-leg i{width:.8em;height:.8em;display:inline-block}
.gx-axt{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--ink2);margin-bottom:.2em}
.gx-facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:1em}
.gx-ft{font-weight:700;text-align:center;margin-bottom:.2em}
.gx-img{display:block;width:100%;height:auto;background:#fff}
/* card grids ("slider" graphics): rows centred; never one card alone on a row (fixCards puts them on one row)
   (HARD RULE, Editor, Nov. 11, 2026) */
.gx-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:.9em .7em}
.gx-cards:not(.wide) .gx-card{flex:0 0 6.6em;min-width:0}
/* one more card a row than fit at full size, so the rows come out even (reuse3.js fixCards, Nov. 27, 2026) */
.gx-cards.per-up:not(.wide) .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * .7em) / var(--per))}
.gx-cards.one-row{flex-wrap:nowrap}
.gx-cards.one-row .gx-card{flex:1 1 0}
.gx-cards.one-row .gx-card img{width:min(4.6em,100%);height:auto;aspect-ratio:1}
.gx-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35em}
.gx-card img{width:4.6em;height:4.6em;border-radius:50%;object-fit:cover;background:var(--tint);border:2px solid var(--orange)}
.gx-cards.logos .gx-card img{border-radius:0;border:0;object-fit:contain;background:#fff;padding:.3em}
.gx-card b{display:block;font-size:.95em;line-height:1.2}
.gx-card .sub{display:block;color:var(--teal-ink);font-weight:700;font-size:.85em;margin-top:.1em}
.gx-card .txt{display:block;color:var(--ink2);font-size:.85em;margin-top:.15em}
.gx-cards.wide{display:grid;grid-template-columns:1fr;gap:.6em}
.gx-cards.wide .gx-card{flex-direction:row;align-items:flex-start;text-align:left;gap:.8em}
.gx-cards.wide .gx-card img{width:3.6em;height:3.6em;flex:none}
/* a timeline: text in the article's flow */
.tl{margin:.5em 0 1.2em}
.tl .gx-h{margin-bottom:.5em}
.tl .gx-t{font-size:1.05em}
.tl-e{display:grid;grid-template-columns:4.6em 1fr;gap:.7em;padding:.45em 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:.9em;line-height:1.42}
.flow.c2 .tl-e{break-inside:auto}   /* two columns never end early (Editor, Nov. 10, 2026) */
.tl-d{font-family:var(--display);font-weight:900;color:var(--teal-ink);font-size:.95em}
.tl-x b{font-weight:700}
/* in the text: a graph at most ~40% of the page tall */
.flow .fig .gx-svg,.flow .fig .gx-img{max-height:calc(var(--figmax,60vh) * .62)}
/* ---------- a graphic page ---------- */
.gpage{background:var(--paper)}
.gin{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6cqw;padding:7cqw 7.5cqw 3cqw;font-size:var(--fs)}
.gslot{min-height:0}
.gin .gx{font-size:.86em}
.gin .gx-svg,.gin .gx-img{max-height:calc(var(--ph) * .5);width:auto;max-width:100%;margin:0 auto}
.gin.two .gx-svg,.gin.two .gx-img{max-height:calc(var(--ph) * .26)}
.mk{display:block;height:0}
/* ---------- Nov. 13, 2026 (Editor, Issue 2 at the smallest text size) ---------- */
/* a subhead that opens a column under a band (a forced column break keeps its top margin) starts level with the text
   in the next column, not lower ("Will Baghdad accept Masgarian?", p. 21) */
.flow .bsp + h3,.flow .bsp + .mk + h3{margin-top:0}
/* two columns: two lines may end or start a column (was three), so a column no longer ends 3-4 lines early before a
   subhead or a long paragraph (p. 15, under the Bottom Line) */
.flow.c2 p{orphans:2;widows:2}
/* Datawrapper maps are drawn at 400 px (build.js dwShot) and shown larger, so their labels are legible (pp. 25, 31) */
.band{--mapmax:calc(var(--ph) * .52)}
html.dens-1 .band,.page.dens-1 .band,html.dens-2 .band,html.dens-3 .band,.page.dens-2 .band{--mapmax:calc(var(--ph) * .5)}
.gx-map a{display:block}
/* computer: a long list of wide cards (6 or more, e.g. the 8 "US-designated Foreign Terrorist Organizations") in two
   columns, so it fits a band and shares its page with text instead of taking a page alone (p. 8) */
.band .gx-cards.wide:has(> .gx-card:nth-child(6)){grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em 1.2em}
.band .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card img{width:3em;height:3em}
/* people with their titles: the title above the photo, the name below, three to a row on a computer (Editor, Nov. 13,
   2026, "Leaders at the third GCC summit"); titles of one or two lines keep the photos level */
.gx-cards.roles .gx-card{flex:0 0 calc((100% - 2 * 1.4em) / 3);max-width:11em;gap:.3em}
.gx-cards.roles{gap:1em 1.4em}
.gx-cards.roles .gx-card .sub{margin:0;min-height:2.4em;display:flex;align-items:flex-end;justify-content:center;line-height:1.2}
.gx-cards.roles .gx-card b{line-height:1.2}
.flow.c1 .gx-cards.roles .gx-card{flex:0 0 calc((100% - 2 * .4em) / 3);max-width:none}
.flow.c1 .gx-cards.roles{gap:.7em .4em}
/* a roles grid whose three a row would leave one person alone (reuse3.js fixCards, Nov. 27, 2026) */
.gx-cards.roles.per-up .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * 1.4em) / var(--per));max-width:11em}
.flow.c1 .gx-cards.roles.per-up .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * .4em) / var(--per));max-width:none}
/* Nov. 14, 2026 (Editor: the maps on pp. 16 and 24 were messed up). A map's height is set by its band (--mapmax), never
   by the tighter-story rules (dens-1..3 capped the image but not its frame, so the frame stood wider than the map) */
.band .gx-map .gx-img{max-height:none!important}
/* a plain map (build.js): its title, description and source in the magazine's type inside the orange frame, clear of
   the corners; the frame is as wide as the map at its allowed height once the title block is taken off */
.gx-map.plain{padding:1.1em 1.1em .8em;font-size:calc(1em * .85 / var(--fsx, 1))}   /* its type stays at the 0.85 size: bigger text would squeeze the map */
.gx-map.plain .gx-h{border-top:0;padding-top:0;margin-bottom:.6em}
.gx-map.plain .gx-src{margin-top:.45em}
.band .gx-map.plain{width:min(100%, calc((var(--mapmax) - 8em) * var(--ar) + 2.2em))}
/* a timeline in two columns grows with the text only up to the 1.15 size: at 1.3-1.5 it was taller than a column, ran
   over a page turn and its last box ran into the next column (Nov. 14, 2026) */
.flow.c2 .tl{font-size:min(1em, calc(1em * 1.15 / var(--fsx, 1)))}

.hero{padding-top:14px}
.hero .in{display:flex;flex-wrap:wrap;background:#00A693}
.hero .panel{flex:1 1 420px;min-width:0;padding:40px 44px;display:flex;flex-direction:column;gap:18px;color:#fff}
/* the cover wordmark: enough line spacing that the "j" of Amwaj never touches the "i" of Mةgazine (Editor, Nov. 11, 2026) */
.word{display:flex;flex-direction:column;white-space:nowrap;font-weight:900;line-height:.965;letter-spacing:-.03em}
.hero .word{font-size:clamp(64px,7vw,90px)}
.issline{display:flex;justify-content:space-between;gap:10px;border-top:2px solid #06302A;padding-top:10px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#06302A}

<script>
window.MAG = {"week":4,"from":"2026-11-21","to":"2026-11-27","pieces":[{"type":"Article","region":"Peninsula","category":"Politics","title":"Deep Dive: Sovereignty arbitrage and the proxy question in Yemen","authors":["Yasmeen Al-Eryani"],"date":"2026-11-26","url":"https://amwaj.media/en/article/deep-dive-sovereignty-arbitrage-and-the-proxy-question-in-yemen","img":"img/01.jpg","iw":1400,"ih":871,"alt":"Houthi supporters carry a large Iranian flag at a rally in Sana'a on March 1, 2026. (Photo via Getty Images)","bottomLine":["In October, the military spokesperson of Yemen’s Ansarullah movement, better known as the Houthis, read out the names of Saudi commanders to frame the fighting as another war on Yemen. Days later, Yemen’s internationally-recognized government said 21 experts from Iran and Lebanon were directing Houthi operations.","Both moves are a form of sovereignty arbitrage. In a country whose sovereignty is contested on every front, each side casts itself as its protector and accuses its rivals of handing Yemen to foreign powers.","Asking whether the Houthis are an Iranian proxy is a trap, since every major Yemeni actor has tied its fate to a regional patron. The more useful question is how much political agency each holds within those ties, and what that agency serves.","Iran long kept up plausible deniability over the Houthis. But the Iran-Israel war in June 2025 and the Iran-Israel-US confrontation this year have empowered militant, war-hardened leaders in Tehran who share the Houthis’ high-risk approach. Moreover, Iran has had to take over a severely weakened Hezbollah’s role in Yemen.","The escalation in Yemen since July, from the Houthi naval blockade of Saudi Arabia to its seizure of the Yemeni west coast and the Bab Al-Mandab Strait, seemed to follow Iran’s needs more closely than in 2023. The two could still diverge, and the Houthis must sell their ties with Iran to Yemenis at home.","Neither the Houthis nor the Yemeni government are likely to decide on war or peace without deferring to their patrons. What matters is whether any of the Yemeni actors can exercise their agency to bring stability and peace to Yemen, rather than offer empty slogans of sovereignty."],"pull":"","blocks":[{"t":"p","html":"In late October, the military spokesperson of the Ansarullah movement, also known as the Houthis, <a href=\"https://alkhabaralyemeni.net/2026/10/30/361649/\" target=\"_blank\" rel=\"noopener\">read</a> out the names of Saudi commanders purportedly in charge of operations in Yemen, vowing to hunt them down. As part of its longstanding narrative, the group wanted to frame the escalation as another Saudi war on the country, with itself as the sovereign, legitimate authority, and to play down its fight against fellow Yemenis for territory and control."},{"t":"p","html":"Only days later, Yemen’s internationally-recognized government <a href=\"https://www.arabnews.com/middle-east/yemen-says-iranian-hezbollah-experts-directing-houthi-military-operations-3009631\" target=\"_blank\" rel=\"noopener\">said</a> 21 experts from Iran’s Islamic Revolutionary Guard Corps (IRGC) and Lebanon’s Hezbollah were directing Houthi military operations. The aim was to cast the Houthis as an Iranian proxy and their enemies as resisting Iranian intervention."},{"t":"p","html":"This is sovereignty arbitrage. In a country whose sovereignty is contested on every front, political actors pose as its protectors and accuse opponents of surrendering it. No one has done this more deliberately than the Houthis. Their 2023 Red Sea campaign, presented as solidarity with Palestine, cast them as the only sovereign actor in a region of states incapable of acting against genocide—or at least played on that perception. As some scholars have <a href=\"https://www.merip.org/2024/01/the-houthis-sovereign-solidarity-with-palestine-2/\" target=\"_blank\" rel=\"noopener\">noted</a>, it also let the Houthis claim a long Yemeni state legacy of “sovereign solidarity” with Palestine from a non-sovereign position in a civil war."},{"t":"h","text":"The proxy trap"},{"t":"p","html":"Asking whether the Houthis are a proxy is a trap. Every major actor in Yemen has Yemeni roots, and every one of them has tied its fate to a regional patron. Whichever way the proxy question is answered implies where legitimacy lies, who protects sovereignty and who hands the country to foreign powers."},{"t":"p","html":"If the Houthis are a proxy, deterring Iran will automatically solve the Houthi problem. If they are fully autonomous, they must be tackled directly, militarily or through a settlement, or even recognized as the only sovereign actor in Yemen—their aim in the recent advance towards Aden—as though this would resolve the crisis in the country. Yet this misses Iran’s weight not only in their rise but also in shaping their military strategy."},{"t":"graph","id":"27028719"},{"t":"p","html":"As such, neither reading is accurate. The more useful question is how much political agency these actors hold within those regional ties, where that agency comes from, what it serves and whether it matches Yemenis’ aspirations."},{"t":"p","html":"The Yemeni government and other opponents of the Houthi model <a href=\"https://x.com/7adramout_net/status/2118086124908220565?a=39ljqcz0oe9klUM_T24&amp;s=20\" target=\"_blank\" rel=\"noopener\">call</a> the group a ‘Persian tail’, branding it foreign and non-Arab. In the sixth century CE, as empires fought over Red Sea trade, the Yemeni prince Sayf bin Dhi Yazan invited the Persians to help drive out the Aksumites, and in the Yemeni telling they stayed on as occupiers. Such references play an operative role in the war narratives and appeal to popular sentiment, all the more because Houthi support draws on end-of-times stories, such as the idea that a righteous Yemeni army will liberate Palestine—even though this narrative is not rooted in Zaidi thought."},{"t":"p","html":"Regional patrons exploit this ambiguity. Iran maintained plausible deniability until its role grew so blatant that some analysts dubbed it (im)plausible deniability. In its Chinese-brokered normalization agreement with Saudi Arabia in 2023, Iran played the card of Houthi autonomy. Two years later, as the Red Sea campaign resumed in 2025, Iranian officials let it be <a href=\"https://www.reuters.com/world/middle-east/yemens-houthis-wont-dial-down-under-us-pressure-or-iranian-appeals-2025-03-18/\" target=\"_blank\" rel=\"noopener\">known</a> that they had asked the Houthis to cool tensions to no avail. Over a decade ago, in 2014, US officials <a href=\"https://www.huffpost.com/entry/iran-houthis-yemen_n_7101456\" target=\"_blank\" rel=\"noopener\">said</a> Iran had advised the group against taking Sana’a, and that it went ahead anyway."},{"t":"p","html":"Truth or theater, the deniability served both sides. By 2026, the Houthis have become a regional actor and the star member of the Iranian-led ‘Axis of Resistance’. In any deal that might emerge from the war in Yemen, they now see a benefit in being part of it through Iran."},{"t":"graph","id":"20818310"},{"t":"h","text":"A tighter embrace"},{"t":"p","html":"The Houthis owe Iran much of their military capability, and as their operations widen, they rely on Tehran and its regional network for know-how, supply chains, money, logistics and political weight. As they grow with their patron’s influence, helping it deflect threats serves them too. But a patron under immense pressure also depends on its client. As the Islamic Republic reworked its military strategy after coming under an all-out Israeli-US assault in late February, the Houthi move on the Bab Al-Mandab Strait became central to Tehran’s new deterrence."},{"t":"p","html":"For years, the Iranians <a href=\"https://newlinesmag.com/argument/inside-hezbollahs-two-decade-project-to-shape-the-houthis/\" target=\"_blank\" rel=\"noopener\">handled</a> much of their relationship with the Houthis through Lebanese Hezbollah, which shared their language and had more affinity with them. Tehran made little effort to understand Yemen’s history, tribal structures or culture. Still, Iran gave its Yemeni allies plenty of room to maneuver, which made them resilient and drew them willingly deeper into the common project."},{"t":"p","html":"Yet even after the regional wars that erupted in 2023, Iran tolerated much less risk than a young, deeply ideological non-state armed actor that had recently captured state structures and faced a weak adversary that paved the path for it to consolidate. Some in the Iranian political establishment may have seen the Houthis as unhinged, even a liability."},{"t":"p","html":"That calculation changed with the Iran-Israel confrontation in June 2025 and the Iran-Israel-US war this year, which swept away much of the Islamic Republic’s old leadership and <a href=\"https://www.foreignaffairs.com/iran/irans-theory-victory\" target=\"_blank\" rel=\"noopener\">empowered</a> militant, war-hardened leaders who share the Houthis’ high-risk approach. With Hezbollah severely weakened, the Iranians took over the Lebanese group’s role in Yemen. Once a state that projected power through proxies, Iran has <a href=\"https://www.irananalytica.org/p/how-iran-rewrote-its-war-strategy\" target=\"_blank\" rel=\"noopener\">rewritten</a> its war strategy to lean on its own military, with allies and proxies as strategic depth. Its methods and political aims have converged with those of the Houthis."},{"t":"graph","id":"30546774"},{"t":"p","html":"Since July 2026, the escalation between the Houthis and Saudi Arabia has climbed a severe but calibrated ladder; from a naval blockade of the Kingdom to the seizure of the Yemeni west coast and Bab Al-Mandab. Unlike in 2023, the Houthis seemed to <a href=\"https://www.reuters.com/world/middle-east/iran-tells-houthis-close-red-sea-gateway-if-us-hits-power-network-sources-say-2026-07-16/\" target=\"_blank\" rel=\"noopener\">follow</a> Iran’s needs more closely while pursuing their own aims at home. Iran’s stance on the advance on internal fronts is unclear. Tehran sees more clearly than the Houthis, intoxicated by a sudden victory, that fighting on many fronts may overstretch the group and that failure on one could set off a domino effect. Either way, Iran is now invested in its success."},{"t":"p","html":"The two may still diverge. Iran could eventually want to fold while the Houthis do not. Or the Houthis may decide that Iran needs them more than they need it, and the <a href=\"https://www.xcept-research.org/wp-content/uploads/2026/09/24-08-26_Houthis_in_Africa.pdf\" target=\"_blank\" rel=\"noopener\">network</a> they are building in Africa could delude them into thinking they are no longer the junior partner."},{"t":"h","text":"Selling Iran at home"},{"t":"p","html":"As ties with Tehran have tightened, the Houthis have had to sell them at home, since Iran does not appeal to Yemenis the way Hezbollah or Hamas do. They have recently promoted Iran more openly in areas they control, especially since Hezbollah’s weakening, and rallies in Sana’a during the Israeli-US attack on Iran in February featured Iranian flags."},{"t":"p","html":"Iran, in turn, publicized a Yemeni <a href=\"https://youtube.com/shorts/iTkzMuex880?si=p6j5WRRyLnEU9tp0\" target=\"_blank\" rel=\"noopener\">wedding</a> in a Tehran square as part of a charm offensive. The Islamic Republic has also lit up major monuments in its capital in honor of the Houthis. Every year, a delegation of Yemeni students travels to Iran on scholarships, tying the two nations and languages closer and giving the group cadres trained in Iranian colleges and universities."},{"t":"p","html":"The Yemeni government faces no such problem with its patron. Its dependence on Saudi Arabia has never been denied and costs it relatively little. For better or worse, Yemenis have normalized Saudi meddling since the 1960s, and the Kingdom sits closer to the Yemeni imagination. This is not to say it is fully accepted. Pushback peaked in the war’s early years a decade ago, during Saudi Arabia’s indiscriminate air campaign, and the Houthis still exploit it, denouncing their Yemeni enemies as Saudi mercenaries and mobilizing fighters on the pretext of fighting Riyadh."},{"t":"p","html":"Can any of them decide on war or peace without deferring to their patron? Very unlikely. The rest is detail, although detail that still matters—such as how much operational freedom they hold, whether the relationship runs on camaraderie or top-down command and whether they can take the initiative. To be recognized, even as a disruptor, to maneuver within restrictive structures and to exert influence through outreach and networks, this is what makes political agency. It is the more interesting question, and the one that will help us think seriously about how to transform this conflict."},{"t":"p","html":"Where do the Houthis draw their source of power from, and can it be disrupted? Whether a Yemeni actor is a proxy tells us little about what it offers Yemenis. What matters is whether any Yemeni player can exercise agency to bring stability and peace to Yemen and to Yemenis, instead of selling them empty slogans of sovereignty that do not survive a litmus test."}],"words":1448},{"type":"Media Monitor","region":"Iran","category":"Security","title":"Iran enlists epic heroes as missile claims grow","authors":["Amwaj.media Staff"],"date":"2026-11-24","url":"https://amwaj.media/en/media-monitor/iran-enlists-epic-heroes-as-missile-claims-grow","img":"img/02.jpg","iw":1400,"ih":933,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> An AI-generated video showing Rostam, the mythical hero of Iran's national epic, touring an underground missile base with an Islamic Revolutionary Guard Corps (IRGC) commander has spread across Iranian news sites. This comes days after the Guards claimed their missiles had already flown 4,500 km (2,800 miles), more than twice the self-imposed range limit announced in 2015."},{"t":"p","html":"The deployment of pre-Islamic, nationalist imagery along with a message of defiance comes as the IRGC says the long-standing cap on missile range has been lifted, and as Foreign Minister Abbas Araghchi signals flexibility over reopening the Strait of Hormuz."},{"t":"p","html":"<strong>The coverage:</strong> The widely circulated video, <a href=\"https://x.com/FarsNews_Agency/status/2124552867600032088\" target=\"_blank\" rel=\"noopener\">published</a> by the IRGC-affiliated Fars News Agency on Nov. 22 and shared by other outlets, shows Rostam and national poet Ferdowsi alongside Majid Mousavi, commander of the IRGC Aerospace Force."},{"t":"ul","items":["It is the latest in a <a href=\"https://amwaj.media/en/media-monitor/is-iran-weighing-a-tanker-convoy-to-challenge-the-us-blockade\" target=\"_blank\" rel=\"noopener\">series</a> of state-backed messages drawing on Ferdowsi’s Shahnameh—Iran’s national epic—and on pre-Islamic imagery the Islamic Republic long kept at a distance.","The Iran Metropolises News Agency (IMNA) <a href=\"https://www.imna.ir/news/1021992\" target=\"_blank\" rel=\"noopener\">presented</a> the video on Nov. 23 as openly imaginary, saying that with the help of artificial intelligence, Rostam and Ferdowsi \"have traveled to today's world\" to come face to face with \"part of the power of the epic-makers of today's Iran.\" The video carries the watermark \"XAVENAI,\" but it remains unclear who produced it.","The circulation of the clip follows the IRGC's <a href=\"https://donya-e-eqtesad.com/fa/tiny/news-4307650\" target=\"_blank\" rel=\"noopener\">unveiling</a> on Nov. 10 of what it described as a new underground missile base, which Mousavi toured with Maj. Gen. Ali Abdollahi, chief of staff of the armed forces."]},{"t":"graph","id":"12914784"},{"t":"p","html":"The message of defiance comes amid an ongoing stalemate between Iran and the United States, with plenty of war rhetoric and little movement on the diplomatic front—at least publicly. In an interview with the government-run daily Iran <a href=\"https://irannewspaper.ir/9180/4/168846\" target=\"_blank\" rel=\"noopener\">published</a> on Nov. 21, Araghchi said Tehran first passed a seven-day plan to Washington through Qatar in September."},{"t":"ul","items":["Under the original plan, the US would meet its commitments over five or six days, Iran would reopen the Strait of Hormuz and talks on a final deal would then begin on the seventh day.","As the US midterm elections approached, mediators urged a shorter timetable, and Iran presented a condensed two-day version ahead of the Nov. 3 vote. \"On the first day, the Americans would carry out their actions and commitments, and on the second day we would open the Strait of Hormuz and negotiations would begin,\" the Iranian foreign minister said.","Araghchi said the two-day plan remained on the table and that Iran remained flexible. \"If they want to change the two-day timetable to one day or even two hours, that is not an issue for us,\" he said, adding, \"What matters is that our demands are met.\""]},{"t":"p","html":"In the same interview, Araghchi weighed in on the <a href=\"https://amwaj.media/en/article/the-day-a-nuclear-iran-was-born\" target=\"_blank\" rel=\"noopener\">debate</a> in Iran over the country’s nuclear doctrine and whether the nuclear energy program should be weaponized, <a href=\"https://irannewspaper.ir/9180/4/168846\" target=\"_blank\" rel=\"noopener\">saying</a> he saw \"no problem\" with the discussion."},{"t":"ul","items":["Those calling for a change argue that membership in the Treaty on the Non-Proliferation of Nuclear Weapons (NPT) and International Atomic Energy Agency (IAEA) oversight \"failed to prevent the attack and bombing\" of Iran's nuclear facilities, Araghchi said. He added, however, that leaving that framework \"also does not have simple consequences.\"","Asked whether Beijing and Moscow would support a change in Iran's nuclear doctrine, Araghchi said, \"Russia and China also hold opposing positions in this regard. What matters is that, as of this moment, our doctrine has not changed.\""]},{"t":"p","html":"<strong>The context/analysis:</strong> For decades, the Islamic Republic kept its distance from royal and pre-Islamic symbols."},{"t":"ul","items":["In a 2011 speech, then-supreme leader Ayatollah Ali Khamenei (1989–2026) <a href=\"https://farsi.khamenei.ir/speech-content?id=17106\" target=\"_blank\" rel=\"noopener\">said</a> the country's expansion and \"great military victories\" all belonged to \"the periods after Islam.\" The pre-Islamic era had such achievements too, the late Khamenei said, but they were \"deficient\" by comparison."]},{"t":"p","html":"That rhetoric began to change around the 12-day war with Israel in June 2025."},{"t":"ul","items":["During the conflict, a billboard in Tehran <a href=\"https://x.com/propagandopolis/status/2096275488482189744\" target=\"_blank\" rel=\"noopener\">paired</a> missiles with the mythical archer Arash. Weeks later, the patriotic anthem \"Ey Iran\" was <a href=\"https://amwaj.media/en/media-monitor/khamenei-marks-public-return-with-push-for-iranian-islamic-identity\" target=\"_blank\" rel=\"noopener\">sung</a> at a state religious ceremony.","In Nov. 2025, a statue of the Sasanian king Shapur I with the kneeling Roman emperor Valerian was <a href=\"https://amwaj.media/en/media-monitor/iranians-divided-as-state-leans-into-pre-islamic-nationalism\" target=\"_blank\" rel=\"noopener\">unveiled</a> in Tehran's Enqelab Square beside a billboard reading \"You will kneel again before Iran.\" At the ceremony, an illustration showed an ancient Iranian soldier and an IRGC member holding a weapon together."]},{"t":"p","html":"The AI video currently making the rounds also accompanies a sharper military message."},{"t":"ul","items":["On Oct. 31, Supreme Leader Mojtaba Khamenei's office said he had <a href=\"https://www.etemadonline.com/fa/tiny/news-797667\" target=\"_blank\" rel=\"noopener\">instructed</a> senior commanders that \"every level and type of threat must be met with an immediate, effective response without geographic limitation.\"","On Nov. 7, IRGC spokesman Hossein Mohebbi <a href=\"https://www.mehrnews.com/news/7002597/\" target=\"_blank\" rel=\"noopener\">said</a> the self-imposed limit on missile range had been lifted. On Nov. 19, Mohebbi <a href=\"https://aftabnews.ir/fa/news/1078665\" target=\"_blank\" rel=\"noopener\">asserted</a> that Iranian missiles had previously flown about 4,500 km (2,800 miles), in the area of Diego Garcia.","Tehran had <a href=\"https://www.aljazeera.com/news/2026/3/22/did-iran-launch-missiles-at-us-uk-base-on-diego-garcia-heres-what-to-know\" target=\"_blank\" rel=\"noopener\">denied</a> involvement in the attempted Mar. 2026 <a href=\"https://www.wsj.com/livecoverage/iran-us-israel-war-updates-2026/card/iran-targeted-diego-garcia-base-with-ballistic-missiles-rb7MdZW1CfwRTauDYHOt\" target=\"_blank\" rel=\"noopener\">strike</a> on the joint UK-US base on the island, part of the Chagos archipelago. The IRGC spokesman now appears to be claiming it."]},{"t":"chart","src":"img/c-mjc2z-plain.png","w":800,"h":620,"title":"Range of Iranian missiles","link":"https://datawrapper.dwcdn.net/mjc2z/","head":"Range of Iranian missiles","desc":"Medium and long-range projectiles in the Islamic Republic's arsenal can reach all of Israel. However, short-range missiles cannot.","foot":"Map: Amwaj.media"},{"t":"p","html":"<strong>The future:</strong> Whether leaning into the Shahnameh and other national icons wins the Islamic Republic new loyalty is far from clear."},{"t":"ul","items":["The test is whether Iranians who rally around the nation while under attack will also mobilize behind a state that spent four decades sidelining that pre-Islamic history, or whether the Islamic Republic has embraced the likes of Rostam too late to make them its own.","So far, the pre-Islamic, nationalist imagery has been tied mostly to the IRGC's missiles, tankers and battlefield claims. That makes it a wartime brand, and it may not outlast the current conflict with Israel and the United States.","Once the external threat eases and economic grievances return to the fore, nationalism could just as easily be turned against a state seen as having failed to deliver for the nation it claims to embody and protect."]}],"words":287},{"type":"Article","region":"Iraq","category":"Politics","title":"After Jurf Al-Sakhar, Zaidi orders greater federal authority in Iraqi Kurdistan","authors":["Paul Iddon"],"date":"2026-11-27","url":"https://amwaj.media/en/article/after-jurf-al-sakhar-zaidi-orders-greater-federal-authority-in-iraqi-kurdistan","img":"img/03.jpg","iw":1400,"ih":933,"alt":"Vehicles cross the Ibrahim Khalil border gate between Iraqi Kurdistan and Turkiye on Oct. 31, 2017. (Photo via Getty Images)","bottomLine":["Iraqi Prime Minister Ali Al-Zaidi has <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">ordered</a> federal authorities to take over Iraqi Kurdistan’s border crossings and the oil ministry fields secured by Kurdish forces beyond it. Baghdad calls the Nov. 24 order the next step in an anti-smuggling <a href=\"https://amwaj.media/en/media-monitor/deep-dive-is-handover-of-jurf-al-sakhar-a-state-win-or-pmu-swap\" target=\"_blank\" rel=\"noopener\">campaign</a> begun at Jurf Al-Sakhar, a site long held by Shiite armed group Kata’ib Hezbollah.","Baghdad appears to have seen an opening in the <a href=\"https://erbilpolicyinstitute.org/blogs/analysis/iraqi-kurds-confront-the-grim-specter-of-division\" target=\"_blank\" rel=\"noopener\">rift</a> between the Kurdistan region’s ruling Kurdistan Democratic Party and Patriotic Union of Kurdistan. The two parties <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080294\" target=\"_blank\" rel=\"noopener\">closed</a> ranks after Zaidi’s order, but not for long.","On Nov. 25, the Federal Supreme Court <a href=\"https://peregraf.com/en/news/13108\" target=\"_blank\" rel=\"noopener\">ruled</a> that borders, crossings, customs and oil and gas oversight fall to Baghdad. The court tied the jurisdiction of the Kurdistan Regional Government (KRG) to the territory under its control on the eve of the 2003 US-led invasion of Iraq.","A federal audit <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">document</a> circulated on Nov. 23 put the damage from the KRG’s use of what it described as North Oil Company fields at nearly 123B USD between 2004 and 2023. Kurdistan Region Prime Minister Masrour Barzani has <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080292\" target=\"_blank\" rel=\"noopener\">called</a> Zaidi’s order “baffling” and “in no way acceptable.”","Analysts disagree over Baghdad’s motives. Iraqi analyst Ali Al-Mawlawi sees an effort to <a href=\"https://x.com/aalmawlawi/status/2125215427865243863\" target=\"_blank\" rel=\"noopener\">resolve</a> oil and customs disputes. Foreign Policy Research Institute fellow Mohammed A. Salih perceives likely US pressure but also the federal government’s “own scores to settle.” Independent analyst Lawk Ghafuri puts Washington in the lead.","Iraq’s top leaders have agreed to a national <a href=\"https://peregraf.com/en/news/13108\" target=\"_blank\" rel=\"noopener\">dialogue</a> on the dispute, due to open on Dec. 1. Ghafuri warns that a move without Erbil’s agreement risks a confrontation that could turn violent. The talks will test Zaidi’s assertiveness and the divisions among Kurdish leaders."],"pull":"We in the PUK support all of the federal government’s efforts to preserve public money,","blocks":[{"t":"p","html":"For more than three decades, Iraq’s Kurdistan region has run its own <a href=\"https://www.clingendael.org/pub/2018/fighting-for-kurdistan/2-the-evolution-of-the-peshmerga/\" target=\"_blank\" rel=\"noopener\">borders</a>, and since the 2003 US-led invasion Peshmerga forces have <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">guarded</a> territories and oil fields well beyond them. With the backing of the country’s top court, Baghdad is now moving to control both."},{"t":"p","html":"Iraqi Prime Minister Ali Al-Zaidi on Nov. 24 <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">ordered</a> federal authorities to take over all of the semi-autonomous region’s border crossings. His directive also put Baghdad in charge of oil ministry fields that Kurdish forces still guard in Diyala, Kirkuk, Nineveh and Salah Al-Din. Days earlier, the Zaidi administration had reportedly gone further, asking for every field the Kurdistan Regional Government (KRG) did not hold prior to 2003 to be <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080261\" target=\"_blank\" rel=\"noopener\">returned</a>, and for the entire oil sector to come under federal control."},{"t":"p","html":"Kurdish fighters <a href=\"https://www.meed.com/kurdistan-government-seizes-two-oil-fields-in-northern-iraq\" target=\"_blank\" rel=\"noopener\">took</a> the Bai Hassan and Avana fields near Kirkuk in July 2014, as the Iraqi Army collapsed in the face of the Islamic State (IS) group’s blitz. Federal security forces <a href=\"https://ca.news.yahoo.com/iraqi-forces-control-bai-hasan-avana-oil-fields-065415763.html\" target=\"_blank\" rel=\"noopener\">retook</a> them three years later. Erbil has kept others, among them <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">Khurmala</a>, which it has controlled since 2007. Notably, the oil minister on Nov. 23 <a href=\"https://peregraf.com/en/news/13064\" target=\"_blank\" rel=\"noopener\">said</a> the KRG had taken control of some North Oil Company fields, without naming them."},{"t":"chart","src":"img/c-F2yuW-plain.png","w":800,"h":652,"title":"Oil fields disputed between Baghdad, KRG","link":"https://datawrapper.dwcdn.net/F2yuW/","head":"Oil fields disputed between Baghdad, KRG","desc":"The region around Kirkuk—home to Arabs, Kurds and Turkmens—has long been disputed by the different communities as well as the federal and regional administrations.","foot":"Map: Amwaj.media"},{"t":"p","html":"Baghdad has presented Zaidi’s order as the next step in an anti-smuggling campaign that <a href=\"https://amwaj.media/en/media-monitor/deep-dive-is-handover-of-jurf-al-sakhar-a-state-win-or-pmu-swap\" target=\"_blank\" rel=\"noopener\">began</a> at Jurf Al-Sakhar, a town south of the capital held by the Shiite armed group Kata’ib Hezbollah since 2014. Government forces moved in on Nov. 20, after a tense standoff."},{"t":"p","html":"Under Zaidi’s plan, the Border Ports Authority is to run the Kurdistan region’s crossings, while Energy Police, national security personnel and oil ministry staff are to man checkpoints on the approaches to Duhok, Erbil and Sulaimaniyah. Joint Iraqi Army-Peshmerga <a href=\"https://shafaq.com/en/Kurdistan/Military-commander-Joint-Peshmerga-and-Iraqi-army-brigades-deployed-to-secure-disputed-areas\" target=\"_blank\" rel=\"noopener\">brigades</a> are to close informal routes between Iraqi Kurdistan and the four federal governorates bordering it."},{"t":"p","html":"The campaign comes as the two ruling Kurdish parties are increasingly split, with Baghdad seemingly seeing an opening in the break. The Patriotic Union of Kurdistan (PUK) in early November <a href=\"https://erbilpolicyinstitute.org/blogs/analysis/iraqi-kurds-confront-the-grim-specter-of-division\" target=\"_blank\" rel=\"noopener\">said</a> it would withdraw from the KRG after the rival Kurdistan Democratic Party (KDP) reactivated the Kurdistan Parliament without its approval."},{"t":"graph","id":"13908552"},{"t":"p","html":"Despite their dispute, the two Kurdish parties quickly closed ranks in the face of Zaidi’s order. In a joint <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080294\" target=\"_blank\" rel=\"noopener\">statement</a>, they called the directive “unexpected and deeply surprising” and that any undermining of the power of the Kurdish political entity was a “red line.” But the unity did not last the day. PUK member Ghazi Kakai <a href=\"https://ultrairaq.ultrasawt.com/%D8%AE%D8%A7%D8%B5-%D8%A8%D8%B9%D8%AF-%D8%AA%D9%88%D8%AC%D9%87-%D8%A7%D9%84%D8%B2%D9%8A%D8%AF%D9%8A-%D9%84%D9%84%D8%B3%D9%8A%D8%B7%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D9%85%D9%86%D8%A7%D9%81%D8%B0-%D9%83%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86-%D9%85%D8%A7%D8%B0%D8%A7-%D9%8A%D9%82%D9%88%D9%84-%D8%A7%D9%84%D8%AD%D8%B2%D8%A8%D8%A7%D9%86-%D8%A7%D9%84%D9%83%D8%B1%D8%AF%D9%8A%D8%A7%D9%86%D8%9F/%D9%81%D8%B1%D9%8A%D9%82-%D8%A7%D9%84%D8%AA%D8%AD%D8%B1%D9%8A%D8%B1/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9\" target=\"_blank\" rel=\"noopener\">blamed</a> the KDP’s “wrong policy” for bringing on the measures. “We in the PUK support all of the federal government’s efforts to preserve public money,” he said."},{"t":"p","html":"The following day, on Nov. 25, the Federal Supreme Court <a href=\"https://peregraf.com/en/news/13108\" target=\"_blank\" rel=\"noopener\">ruled</a> that Baghdad holds authority over Iraq’s international frontiers, border crossings and customs, as well as oversight of oil and gas operations. The ruling tied the Kurdistan region’s jurisdiction to the territory the KRG administered on Mar. 19, 2003, leaving the disputed territories to Article 140 of the constitution. Of note, two of the court’s judges dissented."},{"t":"p","html":"Shortly afterwards, Iraq’s president, prime minister, parliament speaker and Supreme Judicial Council head Faiq Zaidan agreed to hold a national dialogue on the dispute on Dec. 1, under Zaidan’s sponsorship. Whether it ends in a negotiated settlement or a standoff will test both Zaidi’s assertiveness and the divisions among Kurdish leaders."},{"t":"h","text":"Warning signs"},{"t":"p","html":"The Iraqi government publicly floated greater federal control the week before Zaidi’s Nov. 24 order. “There is a possibility of [Iraqi] Army forces entering areas of the Kurdistan region,” government spokesman Haidar Al-Aboudi <a href=\"https://rudaw.net/english/categories/iraq/1080181\" target=\"_blank\" rel=\"noopener\">told</a> state media on Nov. 16. “The commander-in-chief’s directives are not limited to pursuing oil smuggling in a specific area, but include all areas where suspected smuggling has been identified.”"},{"t":"p","html":"On Nov. 21, Popular Mobilization Units (PMU) Chairman Falih Al-Fayyadh visited Erbil and met KDP leader Masoud Barzani and the Kurdistan region’s president and prime minister. The trip took place as Fayyadh’s recommendation to send two PMU brigades to Jurf Al-Sakhar to defuse the standoff with Kata’ib Hezbollah had reportedly been <a href=\"https://x.com/aalmawlawi/status/2123038252240351702\" target=\"_blank\" rel=\"noopener\">taken</a> up. Asked the same day on Shams TV whether Iraqi Kurds feared an Iraqi Army advance now that US forces have left, Kurdistan Region Prime Minister Masrour Barzani said it was “very sad” that Iraqis should feel they <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080292\" target=\"_blank\" rel=\"noopener\">need</a> foreign protection from their own country’s forces."},{"t":"chart","src":"img/c-vTn78-plain.png","w":800,"h":620,"title":"Competing border posts in Iraqi Kurdistan","link":"https://datawrapper.dwcdn.net/vTn78/","head":"Competing border posts","desc":"Ankara and Baghdad want to create direct links through the Faysh Khabur crossing, but Erbil prefers the use of Ibrahim Khalil.","foot":"Map: Amwaj.media"},{"t":"p","html":"A day later, Rudaw <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080261\" target=\"_blank\" rel=\"noopener\">reported</a> that Iraqi Kurdish leaders had rejected four proposals conveyed by Baghdad. These are said to have included an international company to run the crossings with Iran and Turkiye, Iraqi Army units along the Kurdistan region’s international borders in coordination with the Peshmerga, reopening the question of the status of the disputed territories and federal control of oil fields."},{"t":"p","html":"However, the KRG promptly dismissed that account as <a href=\"https://gov.krd/arabic/news-and-announcements/posts/2026/november/%D8%AA%D9%88%D8%B6%D9%8A%D8%AD-%D8%B5%D8%A7%D8%AF%D8%B1-%D8%B9%D9%86-%D8%B1%D8%A6%D8%A7%D8%B3%D8%A9-%D9%85%D8%AC%D9%84%D8%B3-%D9%88%D8%B2%D8%B1%D8%A7%D8%A1-%D8%A5%D9%82%D9%84%D9%8A%D9%85-%D9%83%D9%88%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86/\" target=\"_blank\" rel=\"noopener\">unfounded</a>, and Baghdad has not confirmed it. Notably, Oil Minister Bassim Mohammed Khudair on Nov. 23 <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">stated</a> that fields the KRG had taken over from the North Oil Company “should be managed federally, by the ministry, just like the fields it manages in central and southern Iraq.”"},{"t":"h","text":"A takeover by decree"},{"t":"p","html":"While Erbil has called Baghdad’s move unacceptable, the federal government has cast the dispute as a matter of tackling oil smuggling. Zaidi’s order followed an investigation into suspected illicit activities at the state-owned North Oil Company, which answers to the oil ministry and runs the fields around the disputed Kirkuk area."},{"t":"p","html":"A Federal Board of Supreme Audit document circulated on Nov. 23 put the damage from the KRG’s use of fields it identified as belonging to the North Oil Company at nearly 123B USD between 2004 and Mar. 2023. The board’s acting head later <a href=\"https://www.rudaw.net/english/categories/iraq/1080288\" target=\"_blank\" rel=\"noopener\">confirmed</a> that the document was genuine."},{"t":"p","html":"Zaidi’s order also bars the KRG from approving crude or fuel exports except through the federal oil ministry. In addition, the Iraqi prime minister dismissed Kirkuk’s police and operations commanders, removed the head of the Border Ports Authority and suspended the North Oil Company’s director general and his deputies pending an investigation. Almost immediately, the Kurdistan region’s premier called the measures “baffling” and “in no way acceptable,” <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080292\" target=\"_blank\" rel=\"noopener\">telling</a> reporters on Nov. 24 that it “goes against the talks we have held with Baghdad’s authorities.”"},{"t":"p","html":"Lawk Ghafuri, an independent Iraqi political analyst, told Amwaj.media that “any attempt” to impose greater federal control “without an understanding with Erbil risks triggering a serious confrontation that could escalate into sectarian conflict.”"},{"t":"p","html":"Mohammed A. Salih, a non-resident senior fellow at the Foreign Policy Research Institute, said “the Shiite factions in power in Baghdad have long sought to assert their control over the Kurdistan Region.” Salih said the KDP and the PUK would likely resist a large-scale Iraqi Army deployment, which would “effectively undermine Kurdistan’s autonomy in a meaningful way.” Speaking before the Kurdish parties’ joint statement, he added nonetheless that “a limited deployment to certain areas, such as border areas or oil and gas fields, might be acceptable.”"},{"t":"p","html":"Observers disagree over what is driving Zaidi’s maneuvering. Iraqi analyst Ali Al-Mawlawi <a href=\"https://x.com/aalmawlawi/status/2125215427865243863\" target=\"_blank\" rel=\"noopener\">argued</a> on Twitter/X on Nov. 24 that the directives aim to settle two long-running disputes. One is how much oil the KRG produces and contributes to the federal budget, the other how much customs revenue it collects, half of which Erbil is legally obliged to pass on. As Mawlawi noted, Baghdad had wanted 450,000 barrels per day for the 2027 budget, a target Erbil said it could not meet."},{"t":"p","html":"Salih acknowledged that US pressure to curb oil smuggling is most likely a factor, but argued that federal authorities also have their “own scores to settle” with the KRG. Any investigation into alleged oil smuggling, he added, “might partly be an attempt to cover up the lack of genuine changes on the ground in the Jurf Al-Sakhar area.”"},{"t":"p","html":"Ghafuri sees it the other way round, with the US administration in the lead. “Zaidi is implementing what Washington is asking him to do,” the analyst said. “But moving the [Iraqi] military toward the KRG is something that Erbil will face if there is no prior agreement between Baghdad and Erbil, which I expect there will be.”"}],"words":1329},{"type":"Article","region":"Iran","category":"Politics","title":"Old News: Talk of ‘Big Three’ in Tehran as Iran seeks end to occupation","authors":["Amwaj.media Staff"],"date":"2026-11-27","url":"https://amwaj.media/en/article/old-news-talk-of-big-three-in-tehran-as-iran-seeks-end-to-occupation","img":"img/04.jpg","iw":1400,"ih":1120,"alt":"Soviet Premier Joseph Stalin, US President Franklin D. Roosevelt and British Prime Minister Winston Churchill at the Soviet Embassy in Tehran, Iran on Nov. 28, 1943. (Photo via US Army/Wikimedia Commons)","bottomLine":["US President Franklin Roosevelt, British Prime Minister Winston Churchill and Soviet Premier Joseph Stalin are <a href=\"https://timesmachine.nytimes.com/timesmachine/1943/12/01/85137785.html?pageNumber=1\" target=\"_blank\" rel=\"noopener\">rumored</a> to soon be gathering at the Soviet Embassy in Tehran. If it materializes, it would be the first meeting of the “Big Three,” who are expected to <a href=\"https://www.nytimes.com/1943/11/17/archives/big-3-talks-linked-to-final-assault-meeting-is-held-imminent.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">plan</a> next steps in their ongoing war against the Axis powers.","Speculation about a major meeting in the Iranian capital has grown amid unusually tight <a href=\"https://www.jstor.org/stable/3018096?aerror=NONCE_ALREADY_USED:login&amp;merror=nonce_lookup_none\" target=\"_blank\" rel=\"noopener\">security</a> in Tehran, the silence of Radio Tehran and a reported telecommunications blackout.","Talk of a summit comes amid the backdrop of the British and Soviet <a href=\"https://www.jstor.org/stable/3018096?googleloggedin=true&amp;seq=9\" target=\"_blank\" rel=\"noopener\">occupation</a> of Iran since 1941, after former Shah Reza Pahlavi refused to expel German nationals and cut economic ties with Berlin. London and Moscow forced Pahlavi to abdicate in favor of his son, Mohammad Reza, who <a href=\"https://www.nytimes.com/1941/09/21/archives/proallied-policy-announced-in-iran-proposed-reforms-regarded-as.html?searchResultPosition=5\" target=\"_blank\" rel=\"noopener\">pledged</a> close collaboration and has formally declared war on Germany.","Under the Tripartite Treaty of Alliance, signed by Iran, Britain and the Soviet Union in 1942, the new Shah has <a href=\"https://qdl.qa/en/archive/81055/vdc_100061616228.0x000088\" target=\"_blank\" rel=\"noopener\">agreed</a> to full cooperation with the Allied war effort. Among other things, Pahlavi has allowed the use of Iran’s railways through the “Persian Corridor”—a vital resupply <a href=\"https://www.jstor.org/stable/4283013?searchText=&amp;searchUri=&amp;ab_segments=&amp;searchKey=&amp;refreqid=fastly-default%3Ad8ba402baedbf14b09593b2c21d8564b&amp;initiator=recommender&amp;seq=9\" target=\"_blank\" rel=\"noopener\">route</a> running from the Gulf to the USSR.","The diversion of Iran’s railways, food and fuel to the war has fed sharp inflation and <a href=\"https://www.cambridge.org/core/journals/international-journal-of-middle-east-studies/article/anatomy-of-an-iranian-political-crowd-the-tehran-bread-riot-of-december-1942/FF80470B8A5468F6F10A84015DA5A233\" target=\"_blank\" rel=\"noopener\">shortages</a>, resulting in growing public anger at London and Moscow. This came to a head with deadly bread <a href=\"https://www.nytimes.com/1942/12/12/archives/rioting-in-iran-is-laid-to-axis-agitation-teheran-quiet-after.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">riots</a> reported in Tehran in Dec. 1942.","The Shah is expected to <a href=\"https://history.state.gov/historicaldocuments/frus1943v04/d484\" target=\"_blank\" rel=\"noopener\">press</a> for the United States to guarantee the withdrawal of occupying forces from Iran within six months of the war’s end, as specified in the Tripartite Treaty. A shift toward Washington could reshape Iran’s alliances and test the young monarch’s standing at home."],"pull":"","blocks":[{"t":"p","html":"<strong><em>Old News is a new initiative by Amwaj.media to connect the past to the present. Through “reporting” on pivotal moments in history, we aim to provide a richer backdrop for current dynamics in the region.</em> </strong>"},{"t":"p","html":"<strong>The story:</strong> The leaders of the Soviet Union, the United Kingdom and the United States are rumored to soon be gathering at the Soviet Embassy in Tehran. If it materializes, the meeting would be the first among the trio—and likely focused on planning next steps in their war against the Greater German Reich and its Axis allies. This comes as Iran has remained under British and Soviet occupation since 1941, when Shah Mohammad Reza Pahlavi was put into power."},{"t":"p","html":"Iran is serving as a key Allied supply corridor to the Soviet Union, which has proved vital to the fighting in eastern Europe. With Iranian opposition to the occupation rising, the speculated meeting in Tehran has raised hopes that the Shah may seek a US pledge to guarantee the removal of foreign forces after the war."},{"t":"p","html":"<strong>The coverage:</strong> Informed sources with knowledge of operational planning say the “Big Three”—US President Franklin D. Roosevelt, British Prime Minister Winston Churchill and Soviet Premier Joseph Stalin—are quietly <a href=\"https://www.ebsco.com/research-starters/diplomacy-and-international-relations/tehran-conference-promotes-allied/\" target=\"_blank\" rel=\"noopener\">traveling</a> to the Iranian capital. If confirmed, the meeting would be the first time the three have gathered in the same room."},{"t":"ul","items":["The rumors have been fueled by Tehran residents <a href=\"https://www.jstor.org/stable/3018096?aerror=NONCE_ALREADY_USED:login&amp;merror=nonce_lookup_none\" target=\"_blank\" rel=\"noopener\">noting</a> “unprecedented measures of security” in the capital, with major roads blocked."]},{"t":"ul","items":["Radio Tehran has also mysteriously gone <a href=\"https://www.jstor.org/stable/3018096?aerror=NONCE_ALREADY_USED%3Alogin&amp;merror=nonce_lookup_none&amp;seq=1\" target=\"_blank\" rel=\"noopener\">silent</a> over the past few days, with a telecommunications blackout reportedly in force."]},{"t":"graph","id":"31057187"},{"t":"p","html":"Talk of the meeting follows <a href=\"https://search.library.wisc.edu/digital/ADFRXSHIYSKS2S8Z/text/AVO6OAOKLLEADR8T\" target=\"_blank\" rel=\"noopener\">leaked</a> news of a Nov. 22-26 summit in Cairo gathering Churchill, Roosevelt and Generalissimo Chiang Kai-shek of China to discuss strategy in the Pacific Theater."},{"t":"ul","items":["A Reuters dispatch carrying news of the meeting on radio was <a href=\"https://search.library.wisc.edu/digital/ADFRXSHIYSKS2S8Z/text/AVO6OAOKLLEADR8T\" target=\"_blank\" rel=\"noopener\">aired</a> before Allied governments had agreed to release it. This has caused significant <a href=\"https://search.library.wisc.edu/digital/ADFRXSHIYSKS2S8Z/text/AVO6OAOKLLEADR8T\" target=\"_blank\" rel=\"noopener\">upset</a> among US officials."]},{"t":"p","html":"The director of the US Office of War Information, Elmer Holmes Davis, has reportedly <a href=\"https://search.library.wisc.edu/digital/ADFRXSHIYSKS2S8Z/text/AVO6OAOKLLEADR8T\" target=\"_blank\" rel=\"noopener\">written</a> to British Minister of Information Brendan Bracken calling the leak a “serious and perhaps perilous violation of security.”"},{"t":"ul","items":["Davis further <a href=\"https://search.library.wisc.edu/digital/ADFRXSHIYSKS2S8Z/text/AVO6OAOKLLEADR8T\" target=\"_blank\" rel=\"noopener\">insisted</a> that the “political warfare value” of the Cairo sessions and “the decisions made thereat will be materially lessened.” In the US official’s view, the leak “enables the Germans and the Japanese to blanket the world with their version of the story before the actual announcement is on the record.”"]},{"t":"ul","items":["Notably, some who listened to the Reuters broadcast say it also <a href=\"https://timesmachine.nytimes.com/timesmachine/1943/12/01/85137785.html?pageNumber=1\" target=\"_blank\" rel=\"noopener\">mentioned</a> an upcoming meeting between Churchill, Roosevelt and Stalin in Iran."]},{"t":"p","html":"Meanwhile, the New York Times <a href=\"https://www.nytimes.com/1943/11/17/archives/big-3-talks-linked-to-final-assault-meeting-is-held-imminent.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">reports</a> that the leaders of the UK, US and USSR will plan military moves for the next “decisive phase of the war.”"},{"t":"ul","items":["This includes planning for the long-awaited <a href=\"https://www.nytimes.com/1943/11/17/archives/big-3-talks-linked-to-final-assault-meeting-is-held-imminent.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">opening</a> of a Western Front in Europe, which is expected to relieve the slow-moving Eastern Front. The latter runs from the Baltic Sea to the Black Sea ports of the Ukrainian Soviet Socialist Republic."]},{"t":"ul","items":["The future borders of the Soviet Union and Poland, and the status of countries under the wider USSR, are also <a href=\"https://history.state.gov/milestones/1937-1945/tehran-conf\" target=\"_blank\" rel=\"noopener\">said</a> to be on the table."]},{"t":"p","html":"If the Tehran meeting goes ahead, Iran’s monarch is anticipated to greet the visiting leaders. It will be the first time that Pahlavi <a href=\"https://www.jstor.org/stable/3018096?googleloggedin=true&amp;seq=7\" target=\"_blank\" rel=\"noopener\">receives</a> Soviet and US leaders in the capital."},{"t":"ul","items":["Chief on the minds of the Shah and the Iranian government will be securing a guarantee that the British and Soviet occupation of Iran, in place since 1941, will end."]},{"t":"ul","items":["Iranian officials are expected to <a href=\"https://history.state.gov/historicaldocuments/frus1943v04/d484\" target=\"_blank\" rel=\"noopener\">lobby</a> for the United States to become a guarantor of the Tripartite Treaty of Alliance, an agreement which Britain, the Soviet Union and the newly enthroned Shah <a href=\"https://www.jstor.org/stable/3018096?googleloggedin=true&amp;seq=9\" target=\"_blank\" rel=\"noopener\">signed</a> last year."]},{"t":"p","html":"<strong>The context/analysis:</strong> Former Shah Reza Pahlavi <a href=\"https://encyclopedia.ushmm.org/content/en/article/iran-during-world-war-ii\" target=\"_blank\" rel=\"noopener\">declared</a> Iran’s neutrality when Germany invaded Poland in 1939."},{"t":"ul","items":["At the outset of the war, Iran enjoyed a close trade <a href=\"https://encyclopedia.ushmm.org/content/en/article/iran-during-world-war-ii\" target=\"_blank\" rel=\"noopener\">relationship</a> with Germany, with significant commercial exchanges in both directions."]},{"t":"ul","items":["The number of Germans <a href=\"https://www.iranicaonline.org/articles/germany-ix/\" target=\"_blank\" rel=\"noopener\">living</a> in Iran was estimated at around 1,000, although the USSR claimed it was as high as 10,000. Their presence gradually became a major point of <a href=\"https://timesmachine.nytimes.com/timesmachine/1941/09/16/87668742.html?pageNumber=12\" target=\"_blank\" rel=\"noopener\">contention</a> between Iran and its northern Soviet neighbor as well as Britain."]},{"t":"p","html":"Iran’s neutrality was broadly respected until Germany <a href=\"https://www.jstor.org/stable/3018096?googleloggedin=true&amp;seq=9\" target=\"_blank\" rel=\"noopener\">invaded</a> the Soviet Union in June 1941. Pahlavi refused to succumb to Allied pressure to expel German nationals and cut economic ties with Berlin, prompting a joint Anglo-Soviet invasion of Iran in August that year."},{"t":"ul","items":["The occupying British and Soviet forces forced Reza Pahlavi to abdicate in favor of his 21-year-old son, Mohammad Reza. The ousted monarch was taken into exile in <a href=\"https://www.nytimes.com/1941/10/18/archives/exshah-at-mauritius-british-say-former-iran-head-will-stay-there.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">Mauritius</a> by British forces and later moved to <a href=\"https://encyclopedia.ushmm.org/content/en/article/iran-during-world-war-ii\" target=\"_blank\" rel=\"noopener\">South Africa</a>, where he remains.","Iran’s new ruler has <a href=\"https://www.nytimes.com/1941/09/21/archives/proallied-policy-announced-in-iran-proposed-reforms-regarded-as.html?searchResultPosition=5\" target=\"_blank\" rel=\"noopener\">pledged</a> to work “in close collaboration with the governments of the countries whose interests are linked with ours,” referring to Britain and the Soviet Union."]},{"t":"ul","items":["Even so, the Iranian newspaper Ettelaat has publicly expressed “<a href=\"https://timesmachine.nytimes.com/timesmachine/1941/09/13/104302059.html?pageNumber=7\" target=\"_blank\" rel=\"noopener\">regret</a>” at the closing of the German legation in Tehran."]},{"t":"graph","id":"31057159"},{"t":"p","html":"After its change of monarch, Iran <a href=\"https://www.jstor.org/stable/3018096?aerror=NONCE_ALREADY_USED%3Alogin&amp;merror=nonce_lookup_none&amp;seq=1&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">signed</a> the Tripartite Treaty of Alliance with Britain and the Soviet Union last year, firmly aligning the three against the Axis powers."},{"t":"ul","items":["Under the treaty, the Shah has <a href=\"https://qdl.qa/en/archive/81055/vdc_100061616228.0x000088\" target=\"_blank\" rel=\"noopener\">agreed</a> “to cooperate with the Allied Powers with all the means at his command and in every way possible” in their war effort."]},{"t":"ul","items":["In return, the Allies have guaranteed that they will withdraw their forces from Iran within six months of the end of the conflict."]},{"t":"p","html":"The treaty also <a href=\"https://qdl.qa/en/archive/81055/vdc_100061616228.0x000088\" target=\"_blank\" rel=\"noopener\">grants</a> the Allies “unrestricted right to use” of Iran’s railways. Notably, the country’s strategic location has allowed it to form part of a vital resupply route known as the “Persian Corridor.”"},{"t":"ul","items":["Weapons, food and oil continue to be <a href=\"https://www.jstor.org/stable/4283013?searchText=&amp;searchUri=&amp;ab_segments=&amp;searchKey=&amp;refreqid=fastly-default%3Ad8ba402baedbf14b09593b2c21d8564b&amp;initiator=recommender&amp;seq=9\" target=\"_blank\" rel=\"noopener\">carried</a> on the Trans-Iranian Railway, now run by the Allies, from the Gulf to the Soviet republics.","Meanwhile, the Anglo-Iranian Oil Company’s refinery at Abadan has been <a href=\"https://www.bbc.co.uk/history/ww2peopleswar/timeline/factfiles/nonflash/a1130121.shtml\" target=\"_blank\" rel=\"noopener\">processing</a> a large share of the fuel for Britain’s war fleet. The complex is believed to be the Allies’ <a href=\"https://history.state.gov/historicaldocuments/frus1944v05/d628\" target=\"_blank\" rel=\"noopener\">only</a> source of aviation fuel outside the Western Hemisphere."]},{"t":"ul","items":["Though the Allies have never confirmed it, experts <a href=\"https://www.jstor.org/stable/23266442?seq=1\" target=\"_blank\" rel=\"noopener\">suspect</a> that control of
