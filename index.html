the supply corridor may have been a key reason for the occupation of Iran and the removal of Reza Pahlavi."]},{"t":"graph","id":"31057152"},{"t":"p","html":"As Iran’s resources have been <a href=\"https://www.jstor.org/stable/3018096?googleloggedin=true&amp;seq=9\" target=\"_blank\" rel=\"noopener\">redirected</a> to the war effort, and with Tehran declaring war on the Greater German Reich in Sept. 1943, shortages and famine have been reported."},{"t":"ul","items":["Soaring inflation and food shortages, particularly of bread, led to deadly <a href=\"https://www.nytimes.com/1942/12/12/archives/rioting-in-iran-is-laid-to-axis-agitation-teheran-quiet-after.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">riots</a> in the capital last December. Protesters <a href=\"https://www.cambridge.org/core/journals/international-journal-of-middle-east-studies/article/anatomy-of-an-iranian-political-crowd-the-tehran-bread-riot-of-december-1942/FF80470B8A5468F6F10A84015DA5A233\" target=\"_blank\" rel=\"noopener\">directed</a> much of their anger at what is perceived as outsized British and Soviet interference in Iran’s internal affairs."]},{"t":"ul","items":["These pressures have strained relations with Britain and the Soviet Union, with some Iranians turning to the United States in hopes that it will hold London and Moscow to their commitment to withdraw once the war is over."]},{"t":"p","html":"<strong>The future:</strong> Iran’s cooperation with the occupying Allied forces—including the use of its transport networks, food supplies and energy—has put a strain on its population and undermined the government."},{"t":"ul","items":["Much of the unrest over the past year has been directed at London and Moscow, whose occupation is drawing rising <a href=\"https://www.cambridge.org/core/journals/international-journal-of-middle-east-studies/article/anatomy-of-an-iranian-political-crowd-the-tehran-bread-riot-of-december-1942/FF80470B8A5468F6F10A84015DA5A233\" target=\"_blank\" rel=\"noopener\">resentment</a> from the Iranian public.","At the same time, Iran continues to <a href=\"https://www.aljazeera.com/features/2017/6/3/the-complex-story-of-polish-refugees-in-iran\" target=\"_blank\" rel=\"noopener\">welcome</a> tens of thousands of Polish refugees released from Soviet internment camps. The new arrivals have <a href=\"https://encyclopedia.ushmm.org/content/en/article/polish-refugees-in-iran-during-world-war-ii?parent=en%2F11744\" target=\"_blank\" rel=\"noopener\">established</a> communities complete with schools, cultural centres and more in Iran’s major cities."]},{"t":"p","html":"Amid the increasing tensions, there are speculations that the United States may come to play a key role as an effective guarantor of Iran’s sovereignty after the war."},{"t":"ul","items":["Observers note that a shift toward Washington—and away from London and Moscow—may shape Tehran’s future political orientation."]},{"t":"ul","items":["The young Shah has shown unwavering commitment to the Allied war effort. Combined with his installation on the throne through foreign intervention, that has left many observers wondering how long it may take for his reign to win public approval."]}],"words":546},{"type":"Article","region":"Iraq","category":"Politics","title":"Voter cards in drawers as trust crisis dogs electability of Iraq’s Shiite elites","authors":["Abbas Al-Maliki"],"date":"2026-11-25","url":"https://amwaj.media/en/article/voter-cards-in-drawers-as-trust-crisis-dogs-electability-of-iraqs-shiite-elites","img":"img/05.jpg","iw":1400,"ih":934,"alt":"Election posters fill the streets of Baghdad, Iraq on Oct 14, 2025. (Photo via Getty Images)","bottomLine":["Many Shiite voters in Iraq are putting their voter cards away. Testimonies from four governorates describe lost faith in the parties that have run the country for the past two decades, deepened by the recent devaluation of the dinar.","The loss of trust predates the currency crisis. Parliamentary turnout <a href=\"https://www.eremnews.com/news/1328245\" target=\"_blank\" rel=\"noopener\">slid</a> from 79% in 2005 to around 43% of registered voters in 2021, by the official <a href=\"https://arabicpost.net/%d8%a3%d8%ae%d8%a8%d8%a7%d8%b1/middle_east/2021/10/17/%d8%a7%d9%84%d9%85%d9%81%d9%88%d8%b6%d9%8a%d8%a9-%d8%a7%d9%84%d8%b9%d8%b1%d8%a7%d9%82%d9%8a%d8%a9-43-%d9%81%d9%8a-%d8%a7%d9%84%d9%85%d8%a6%d8%a9-%d9%86%d8%b3%d8%a8%d8%a9-%d8%a7%d9%84%d9%85%d8%b4/\" target=\"_blank\" rel=\"noopener\">tally</a>. By one <a href=\"https://www.washingtoninstitute.org/ar/policy-analysis/la-tnkhdwa-bnsbt-almsharkt-alantkhabyt-almlnt-thlyl-alantkhabat-alraqyt-balarqam\" target=\"_blank\" rel=\"noopener\">estimate</a>, participation in the most recent Nov. 2025 elections was no more than 41% of all adults, against an official 56% of voter card holders.","The currency devaluation last month <a href=\"https://www.omanobserver.om/article/1197378/business/iraq-central-bank-devalues-dinar-after-middle-east-war-hurts-oil-exports\" target=\"_blank\" rel=\"noopener\">raised</a> the public USD selling rate from 1,320 to 1,520 IQD, squeezing household budgets. The government blames the contentious measure on lost oil income. The Israeli-US war on Iran, which began in February, effectively closed the Strait of Hormuz for months and exposed the vulnerabilities of a state that <a href=\"https://al-ain.com/article/ministries-iraq-political-quota-economic-reform\" target=\"_blank\" rel=\"noopener\">depends</a> on oil for more than 90% of its revenue.","A Baghdad grocer will return to the polls only when the ruling blocs cut their own privileges, and a Basra worker accused politicians of stoking fears to harvest votes.","Luqman Al-Maliki of the Al-Bashaer Movement, part of the State of Law bloc led by former prime minister Nouri Al-Maliki (2006-14), admits hardship worries the ruling Shiite Coordination Framework. Yet he attributes most of the strain to outside factors, saying circumstances may not allow \"timeframes to be set.\"","The next provincial council elections, reportedly set for Oct. 2027, would be the first test of the lost trust, though a proposal to <a href=\"https://shafaq.com/en/Iraq/Al-Halbousi-rejects-proposal-to-delay-provincial-elections\" target=\"_blank\" rel=\"noopener\">delay</a> them to coincide with the 2029 parliamentary elections is being weighed. Further voter abstention will thin the blocs' legitimacy, with some analysts warning that voters' silent anger could become open opposition."],"pull":"","blocks":[{"t":"p","html":"In the Iraqi shrine city of Karbala, 42-year-old taxi driver Miqdad Amer has put his voter card back in the drawer for the last time. Having cast a ballot in Iraq’s Nov. 2025 parliamentary elections, as he has at every poll since 2005, the driver has decided not to take it out again. \"I have lost hope that elections make any difference. The economy and services in my area are the same as ever, and prices since the dinar was devalued have made life even harder,\" he said."},{"t":"p","html":"Amer is not alone. Testimonies gathered by Amwaj.media in Babil, Baghdad, Basra and Karbala point to a broad segment of Shiite voters who have lost faith in a political system run by Shiite political forces for two decades. Many of those interviewed said their attention has shifted from politics to the daily struggle to get by, underscoring that the currency devaluation last month has hit livelihoods."},{"t":"p","html":"Part of the frustration is a sense that the ruling elites revive the same failed solutions year after year. Shiite blocs have offered no convincing answers, another Karbala resident told Amwaj.media, and are still putting forward promises with no clear timeframes. The provincial council elections, provisionally set for Oct. 2027 under an agreement within the ruling Shiite Coordination Framework, would be the next test of this crisis of confidence."},{"t":"h","text":"Trust eroded before the dinar did"},{"t":"p","html":"The loss of trust among the public in Iraq has long been apparent at the ballot box. Turnout of registered voters in parliamentary polls has gradually <a href=\"https://www.eremnews.com/news/1328245\" target=\"_blank\" rel=\"noopener\">fallen</a> from 79% in Dec. 2005 to 44.5% in 2018, settling at <a href=\"https://arabicpost.net/%d8%a3%d8%ae%d8%a8%d8%a7%d8%b1/middle_east/2021/10/17/%d8%a7%d9%84%d9%85%d9%81%d9%88%d8%b6%d9%8a%d8%a9-%d8%a7%d9%84%d8%b9%d8%b1%d8%a7%d9%82%d9%8a%d8%a9-43-%d9%81%d9%8a-%d8%a7%d9%84%d9%85%d8%a6%d8%a9-%d9%86%d8%b3%d8%a8%d8%a9-%d8%a7%d9%84%d9%85%d8%b4/\" target=\"_blank\" rel=\"noopener\">around</a> 43% in 2021. Years of <a href=\"https://amwaj.media/en/media-monitor/sudanis-legacy-in-question-as-new-iraqi-pm-clamps-down-on-corruption\" target=\"_blank\" rel=\"noopener\">scandals</a> culminating in the \"heist of the century,\" the theft of 3.7T IQD (2.5B USD) in tax deposits uncovered in 2022, have only deepened the slide. Turnout did not exceed 41% in the 2023 provincial <a href=\"https://rudawrc.net/ar/pdf/article/arqam-wmoshrat-antxabat-mcals-mhafthat-alraq-2024-01-03\" target=\"_blank\" rel=\"noopener\">council</a> elections, the first such polls since 2013."},{"t":"graph","id":"10077450"},{"t":"p","html":"The announced turnout of about 56% in the most recent parliamentary vote, in Nov. 2025, is disputed. Following a policy <a href=\"https://amwaj.media/en/article/deep-data-will-localization-of-politics-shape-iraq-s-parliamentary-polls\" target=\"_blank\" rel=\"noopener\">shift</a> in 2021, the Independent High Electoral Commission (IHEC) <a href=\"https://amwaj.media/en/article/deep-dive-coalition-building-in-focus-as-iraq-declares-vote-results\" target=\"_blank\" rel=\"noopener\">counted</a> official turnout against the 21M Iraqis with voter cards, while some 30M are old enough to take part in elections. By that measure, one <a href=\"https://www.washingtoninstitute.org/ar/policy-analysis/la-tnkhdwa-bnsbt-almsharkt-alantkhabyt-almlnt-thlyl-alantkhabat-alraqyt-balarqam\" target=\"_blank\" rel=\"noopener\">estimate</a> put those who cast ballots at no more than 41% of all adults."},{"t":"p","html":"One scholar sees voter frustration as part of a wider pattern. Hisham Al-Sayyab, an academic at the University of Kufa, told Amwaj.media that \"what we clearly see in the performance of the political forces is a sharp decline in providing services and employment opportunities.” According to Sayyab, this “affects voters' decisions on whether to keep giving their trust to the same forces.\""},{"t":"p","html":"Sayyab attributes the electorate’s turn away from old slogans to the rise of what he calls the \"state generation,\" referring to those who grew up under the governments elected since the US-led overthrow of Ba’ath Party rule in 2003. These voters, in his view, hold parties to account for what they deliver, not what they say, and, as a result, \"Slogans have given way to a focus on tangible achievements.\""},{"t":"h","text":"The dinar hits daily bread"},{"t":"p","html":"Life for many Iraqis has not improved under Prime Minister Ali Al-Zaidi's government, raising the question of how low voter confidence could go. The cabinet's decision on Oct. 6 to <a href=\"https://kuwaittimes.com/article/51157/business/iraq-central-bank-devalues-dinar-as-war-hurts-oil-exports/\" target=\"_blank\" rel=\"noopener\">devalue</a> the dinar by 15% brought anger to every family's table, taking the public selling rate from 1,320 IQD to the US dollar, <a href=\"https://www.omanobserver.om/article/1197378/business/iraq-central-bank-devalues-dinar-after-middle-east-war-hurts-oil-exports\" target=\"_blank\" rel=\"noopener\">fixed</a> since Feb. 2023, to 1,520 IQD."},{"t":"p","html":"The move <a href=\"https://www.aljazeera.com/economy/2026/10/8/why-has-iraq-devalued-its-currency-and-why-are-some-mps-against-it\" target=\"_blank\" rel=\"noopener\">followed</a> a collapse in oil income, with exports <a href=\"https://thenationalnews.com/news/mena/2026/08/04/iraq-struggles-with-july-salary-payments-as-oil-revenue-fails-to-cover-budget\" target=\"_blank\" rel=\"noopener\">down</a> 68% from about 100M barrels a month in February to around 32M in May and June. The fall followed Israeli-US strikes on Iran in February and the effective closure of the Strait of Hormuz that followed. The conflict has exposed a deep structural weakness in Iraq’s economy, with its budget drawing more than 90% of <a href=\"https://al-ain.com/article/ministries-iraq-political-quota-economic-reform\" target=\"_blank\" rel=\"noopener\">revenue</a> from oil and no other industry large enough to make up the loss."},{"t":"graph","id":"23745359"},{"t":"p","html":"In Karbala, Maryam Hussein, a 47-year-old employee in the education sector, told Amwaj.media that her salary has shrunk \"twice, once because of the dinar's devaluation against the dollar and again because of the crazy price rises the market saw after the decision.\" On the other side of the counter, Hussein Abdulrahman Ashour, who owns a grocery shop in Baghdad's Al-Shuala working-class district, said the decision caused widespread \"fear and panic.\""},{"t":"p","html":"Ashour has not voted in any election since 2010. \"When I see the political blocs cut their own salaries and privileges and feel that they care about us more than about themselves, then I will go back to voting,\" the shopkeeper said. 27-year-old Riyam Omar Al-Khalidi has been waiting for a government job in the capital since graduating in computer engineering in 2022. \"We feel wronged, and we have lost hope, and we want our demands addressed quickly,\" Khalidi told Amwaj.media."},{"t":"p","html":"Luqman Al-Maliki, a leading figure in the Al-Bashaer Movement—part of the State of Law bloc led by former prime minister Nouri Al-Maliki (2006-14)—does not deny that \"living conditions shape voters' convictions, for better or worse,\" or that this \"is of great concern to the forces of the Coordination Framework.\" Yet, he attributes most of the pressure to outside factors. These range from regional instability to the way Iraq receives its oil revenues through the Federal Reserve Bank of New York, where they have been held since 2003, giving Washington a say over Iraq's access to its own petrodollars."},{"t":"p","html":"\"The solutions are often beyond Iraq's control,\" Maliki told Amwaj.media, urging citizens to \"understand measures they may not like\" and to recognize that \"the alternative to this system is chaos.\" He added that \"circumstances and pressures may not allow timeframes to be set.\""},{"t":"h","text":"The 2027 test"},{"t":"p","html":"In early September, the Coordination Framework <a href=\"https://almadapaper.net/451714/\" target=\"_blank\" rel=\"noopener\">reportedly</a> agreed to hold provincial council elections in Oct. 2027, though the date is not settled."},{"t":"p","html":"A source in the ruling alliance <a href=\"https://shafaq.com/en/Iraq/Al-Halbousi-rejects-proposal-to-delay-provincial-elections\" target=\"_blank\" rel=\"noopener\">told</a> Iraqi press on Oct. 14 that leading Shiite parties were urging their governing partners to delay the polls and merge them with the next 2029 parliamentary elections. Maliki of the Al-Bashaer Movement confirmed that proposal is \"under study\" because of \"regional challenges, the specter of war, and economic crises,\" but stressed that \"the fixed date is the one announced so far.\""},{"t":"p","html":"Some Shiite voters also blame outside factors. In the town of Al-Shomali in Babil (Babylon) Governorate, 39-year-old engineer Sami Subaih Lazim said he “realizes” that Iraq’s “problems are no longer a domestic matter,” indicating that “most of them stem from foreign interference.\""},{"t":"p","html":"Others blame the ruling political elite. In the southern Basra Governorate’s Al-Qibla, construction worker Bahjat Zaboun told Amwaj.media that he voted in the parliamentary elections last year only because he was \"influenced by the media.\" However, the 35-year-old said he quickly \"discovered that the political class deliberately stokes our fears to harvest our votes.\""},{"t":"p","html":"Zaboun’s vote, counted in the 2025 turnout, may be missing from the next ballot box, as may many others cast out of fear rather than conviction. Yet abstention is unlikely to overturn the political map. Khalid Al-Ardawi, professor of political thought at the University of Karbala's College of Law, said that with no alternative in sight, \"Any turnout will produce the same map we have now, and the change may be limited to individuals.\""},{"t":"graph","id":"26477288"},{"t":"p","html":"Eroding legitimacy is not the only challenge that incumbent parliamentary blocs are facing. The more dangerous question is how long this anger stays silent. Security and political analyst Taha Hassan Al-Arkawazi explained to Amwaj.media that the silence \"may be a stage before it turns into open opposition,\" and that accumulated frustration could \"recreate protest conditions similar to Oct. 2019,\" when anti-establishment rallies swept Baghdad and southern Iraq. The analyst cautioned, \"The anger of the hungry and the frustrated is not treated with promises, but with tangible outcomes.\""},{"t":"p","html":"Until those outcomes materialize, voter cards may remain shut away in drawers, while graduates wait to see what the draft budget may bring. Every coming vote, local or parliamentary, will test whether Iraq’s ruling blocs can convince voters that they still deserve their support."}],"words":1333},{"type":"Article","region":"Iran","category":"Economy","title":"Deep Data: Less orders, higher costs push down Iranian industry","authors":["Bijan Khajehpour"],"date":"2026-11-27","url":"https://amwaj.media/en/article/deep-data-less-orders-higher-costs-push-down-iranian-industry","img":"img/06.jpg","iw":1400,"ih":933,"alt":"Workers assemble cars at an Iran Khodro production line in Kermanshah, Iran on July 16, 2020. (Photo by Bahman Zarei via IRNA)","bottomLine":["Iranian manufacturers are facing a twin squeeze because of the war with Israel and the United States.Falling orders, dwindling raw-material stocks and record input costs point to a downturn that is becoming harder for businesses to manage—and for the economy to reverse.","Iran’s industrial Purchasing Managers’ Index (PMI) stood at 45.7 in October, according to leading economic daily Donya-e Eqtesad. It was the 12th consecutive month below the 50-point threshold that separates expansion from contraction.","The downturn is uneven. Non-metallic minerals and textiles grew, at 56.3 and 52.8, while oil and gas products stood at 33 and clothing and leather at 38.1. In September, export orders were below 50 for the 23rd consecutive month.","Currency constraints, customs and transport delays and weak demand reinforce one another. Industrial entrepreneurs told Amwaj.media that unpredictability is the key issue. With winter approaching, natural gas shortages are expected to fall hardest on industry as the authorities prioritize households.","The World Bank estimates that Iran’s industry contracted by 2% in 2025-26 and projects a further 17.1% contraction in 2026-27. Investment fell 12%, exports 13% and imports 28% year on year in the final quarter of 2025-26. In the first five months of 2026-27, non-oil exports fell 28% and imports 26%.","Weak orders, tight cash flow and uncertain deliveries are making the slowdown self-reinforcing, and a single month above 50 would not show that the constraints have eased. A lasting recovery depends on an end to the war and the lifting of western sanctions, bringing a return to some degree of normalcy."],"pull":"","blocks":[{"t":"p","html":"Iranian manufacturers are facing a twin squeeze because of the war with Israel and the United States. Customers are buying less while securing the supplies needed for production has become more difficult and expensive. Falling orders, dwindling raw-material stocks and record input costs point to a downturn that is becoming harder for businesses to manage—and for the economy to reverse."},{"t":"p","html":"The latest Purchasing Managers’ Index (PMI) <a href=\"https://donya-e-eqtesad.com/%D8%A8%D8%AE%D8%B4-%D8%B5%D9%86%D8%B9%D8%AA-%D8%AA%D8%AC%D8%A7%D8%B1%D8%AA-3/4308638-%D8%B1%DA%A9%D9%88%D8%AF-%D8%B5%D9%86%D8%B9%D8%AA-%DB%8C%DA%A9-%D8%B3%D8%A7%D9%84%D9%87-%D8%B4%D8%AF\" target=\"_blank\" rel=\"noopener\">report</a> shows contraction across industrial output, new orders and sales in October, with the raw-material purchase-price index at a seven-year high. It is the 12th consecutive month that PMI stood below the 50-point threshold for expansion."},{"t":"p","html":"Broader economic data points to high <a href=\"https://www.trend.az/iran/4247026.html\" target=\"_blank\" rel=\"noopener\">inflation</a>, falling investment, trade disruption and severe uncertainty over the outlook. The result is a cycle in which industrial units have less reason and less capacity to invest, restock or expand."},{"t":"h","text":"A year of warning signs"},{"t":"p","html":"The details in the latest PMI report suggest the downturn is hitting both sides of production. The output index fell to 44.5, its weakest reading in six months. New orders registered 43.9, sales 41.6 and raw-material inventories 41.3. These are diffusion indexes, in which a reading below 50 means more surveyed businesses reported a decline than an improvement. They do not measure the precise percentage by which industrial output has fallen."},{"t":"graph","id":"30939616"},{"t":"p","html":"Costs have moved in the opposite direction. The raw-material purchase-price index reached 94.3, its highest level in seven years. That reading shows how widespread reports of rising input prices have become, even as sales weaken and customers’ purchasing power comes under pressure. Businesses that cannot pass higher costs on to buyers may have to absorb them through lower margins or less cash for their next round of purchases. In an economy as imbalanced as Iran’s, such disruptions lead to lost capacity and jobs."},{"t":"p","html":"The PMI report also shows considerable variation by sector. Non-metallic minerals and textiles registered activity indexes above 50, at 56.3 and 52.8, respectively. Oil and gas products stood at 33, while clothing and leather recorded 38.1. The spread suggests the downturn is uneven, but it still points to a strained wider economy."},{"t":"p","html":"The previous September PMI <a href=\"https://otaghiranonline.ir/english/news/N-2026-94747374\" target=\"_blank\" rel=\"noopener\">report</a> had already shown the same pressures. Driven by the inflationary climate, the purchase-price index reached 93.3, then also a seven-year high. Export orders were weak too, with the export index at 42.1, its 23rd consecutive month below 50. The September <a href=\"https://www.taadolnewspaper.ir/fa/news/407014/%D9%85%D8%B9%D9%85%D8%A7%DB%8C-%D9%85%D9%88%D8%A7%D8%AF-%D8%A7%D9%88%D9%84%DB%8C%D9%87\" target=\"_blank\" rel=\"noopener\">survey</a> described manufacturers facing a combination of weak domestic demand, rising costs and difficulty obtaining inputs."},{"t":"graph","id":"30940730"},{"t":"p","html":"Stocks were running down as well. The industrial raw-material inventory index fell from 41.9 in <a href=\"https://www.taadolnewspaper.ir/fa/news/403728/%D8%B4%D8%A7%D9%85%D8%AE-%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF-%D8%AF%D8%B1-%D8%B1%DA%A9%D9%88%D8%AF-%D9%85%D8%A7%D9%86%D8%AF\" target=\"_blank\" rel=\"noopener\">August</a> to 36.7 in <a href=\"https://www.taadolnewspaper.ir/fa/news/407014/%D9%85%D8%B9%D9%85%D8%A7%DB%8C-%D9%85%D9%88%D8%A7%D8%AF-%D8%A7%D9%88%D9%84%DB%8C%D9%87\" target=\"_blank\" rel=\"noopener\">September</a>, far below the 50-point threshold. Experts <a href=\"https://www.iranintl.com/en/202609218799\" target=\"_blank\" rel=\"noopener\">warn</a> that continued depletion of inventories could become one of the most serious constraints on industrial production, in line with the broader <a href=\"https://amwaj.media/en/article/deep-dive-irans-economy-of-depletion\" target=\"_blank\" rel=\"noopener\">analysis</a> that Iran is facing an economy of depletion. The difficulties manufacturers report include limited access to foreign <a href=\"https://otaghiranonline.ir/news/N-2026-67544318?googsrc=ai-uk\" target=\"_blank\" rel=\"noopener\">currency</a>, import and customs delays, logistical disruption and higher procurement costs."},{"t":"p","html":"PMI surveys are a snapshot of the country’s industrial output, but their persistence is an alarm for the economy. A single weak month might reflect temporary disruption. Twelve consecutive months below the threshold for economic expansion points to a sustained crisis."},{"t":"h","text":"Pressures that feed on each other"},{"t":"p","html":"The PMI report for October does not identify a single cause for the contraction. Instead, its indicators are consistent with several pressures reinforcing one another. Currency constraints can make imported inputs more costly or harder to obtain. Delays at customs and in transport make delivery times unpredictable. And weak demand makes it harder for producers to recover those costs through sales."},{"t":"p","html":"In conversations with Amwaj.media, several Iranian industrial entrepreneurs emphasized that the key issue is persistent unpredictability, which complicates routine decisions. A factory that cannot predict when materials will arrive, or what they will cost, has less ability to schedule production, promise delivery dates or decide whether to hire. If orders are also falling, keeping spare inventories or investing in additional capacity becomes harder to justify. The October employment index, at 47.4, is another sign of caution among manufacturers."},{"t":"p","html":"Energy shortages add a longstanding vulnerability. Even before the renewed war this year, Iran’s industrial sector already faced recurring natural gas and electricity shortfalls, the result of years of <a href=\"https://carnegieendowment.org/sada/2025/06/irans-energy-dilemma-constraints-repercussions-and-policy-options?lang=en\" target=\"_blank\" rel=\"noopener\">underinvestment</a> and a growing mismatch between supply and demand. Earlier this month, President Masoud Pezeshkian <a href=\"https://amwaj.media/en/media-monitor/iran-faces-winter-trouble-as-war-damage-deepens-energy-shortfall\" target=\"_blank\" rel=\"noopener\">stated</a> that bombings had removed 240M cubic meters a day of gas production capacity, of which only 100M had been restored. By Pezeshkian’s account, about 140M cubic meters a day remains offline, adding to a previous daily deficit on peak-demand days that the government has estimated at 250-300M cubic meters."},{"t":"graph","id":"14158351"},{"t":"p","html":"With winter approaching amid damage to output from the war, natural gas shortages will add to the challenges as the authorities <a href=\"https://www.aljazeera.com/news/2026/11/16/iran-braces-for-natural-gas-shortages-during-winter-energy-imbalance\" target=\"_blank\" rel=\"noopener\">prioritize</a> households and public services, leaving industrial facilities to bear the impact of supply cuts."},{"t":"h","text":"A much broader shock"},{"t":"p","html":"The World Bank’s Oct. 2026 Macro Poverty <a href=\"https://documents.worldbank.org/curated/en/099012310212619341/null\" target=\"_blank\" rel=\"noopener\">Outlook</a> places the industrial figures within a much broader shock. It <a href=\"https://documents.worldbank.org/curated/en/099741010152618088/pdf/Bulk-841b8b5f-e748-4a6a-b608-89c43afd9235.pdf\" target=\"_blank\" rel=\"noopener\">estimates</a> that Iran’s industry contracted by 2% in 2025-26 and projects a 17.1% contraction in 2026-27. These are annual estimates and forecasts, not PMI readings, and rest on an exceptionally uncertain outlook."},{"t":"p","html":"The Bank also reports that investment fell 12% and exports 13% year on year in the final quarter of 2025-26, while imports fell 28%. In the first five months of 2026-27, non-oil exports dropped 28% and imports 26%. The Bank attributes these falls to collapsing confidence, disrupted trade and squeezed purchasing power. Damage to infrastructure has cut productive capacity, while difficulties repatriating export proceeds have fed a sharp depreciation of the national currency."},{"t":"graph","id":"14305151"},{"t":"p","html":"The same report highlights the consequences for investment. Persistent energy shortages, inflation, an undercapitalized banking system and currency depreciation were already constraining production and investment before the conflict, it says. With the outlook now depending partly on the duration of hostilities and the extent of infrastructure damage, businesses find it harder to decide whether to commit capital to equipment, repairs or expansion."},{"t":"p","html":"This is how a prolonged slowdown becomes self-reinforcing. Weak orders limit cash inflows, while tight cash flow makes it harder to replenish raw materials. Uncertain deliveries and rising costs complicate production schedules as subdued demand limits the return on new investment. The September PMI survey put Iranian manufacturers’ expectations for production in the coming month at 45.6, below the neutral threshold, a sign that businesses did not expect conditions to improve quickly."},{"t":"h","text":"What a recovery would take"},{"t":"p","html":"There are stronger and weaker industries within this picture, and monthly PMI survey readings can move. But an index return above 50 in one month would not, on its own, show that the underlying constraints have eased. A durable recovery would require a sustained improvement in orders alongside more reliable access to inputs, finance and energy. It would also depend on conditions that allow businesses to plan with greater confidence."},{"t":"p","html":"The Iranian government’s own financial difficulties complicate matters further. It is unable to invest in needed infrastructure, and it is shifting part of the pressure onto industry through <a href=\"https://ecoiran.com/fa/tiny/news-116764\" target=\"_blank\" rel=\"noopener\">taxation</a> and exchange-rate instability."},{"t":"p","html":"Iranian industry is dealing with more than a temporary dip in production. After a year of contraction, the combination of weak demand, high costs and uncertainty is narrowing manufacturers’ choices—and making an eventual recovery more difficult. Only an end to the war and the lifting of western sanctions, meaning a return to some degree of normalcy, could create the momentum Iran’s economy sorely needs."}],"words":1216}]};

  function yAxis(sc, L, R, T, B, right, color) {

    for (var v = 0; v <= sc.top + 1e-9; v += sc.step) {

  var gKey = function (g) { return 'g-' + g.toLowerCase().replace(/[^a-z]+/g, '-'); };
  function dItem(key, href, pg, kick, title, p, g) {
    var badge = p && (p.old || p.type === 'Media Monitor') ? '<em class="kb">' + (p.old ? 'Old News' : 'Media Monitor') + '</em>' : '';
    return '<a class="ti ' + gKey(g) + (p && p.old ? ' old' : '') + '" data-key="' + key + '" href="' + href + '"><span class="pg">' + pg + '</span>'
      + '<span class="tt"><small>' + badge + esc(kick) + '</small><b>' + esc(title) + '</b></span>' + (p ? '<img src="' + esc(p.img) + '" alt="">' : '') + '</a>';
  }
  function fillDrawer() {
    var last = null, head = function (g) { return '<div class="dg ' + gKey(g) + '"><span>' + esc(g) + '</span></div>'; };
    $('drawer').innerHTML = '<div class="dh"><div><b>In this issue</b><span>Issue ' + NO + ' · ' + LAST + ' pages · ' + esc(RANGE) + '</span></div>'
      + '<button class="xbtn" type="button" id="dclose" aria-label="Minimize contents" title="Minimize"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button></div>'
      + '<nav class="dl">' + head('Opening pages') + dItem('home', '#home', '', 'Issue ' + NO, 'Front page', null, 'Opening pages') + dItem('contents', '#contents', 1, 'Pages 1–2', 'Cover and contents', null, 'Opening pages')
      + P.map(function (p, i) {
        var g = i === 0 ? 'Cover story' : p.region, h = g !== last ? head(g) : '';
        last = g;
        var kick = i === 0 ? p.region + ' · ' + p.category : (p.old || p.type === 'Media Monitor') ? '' : p.category;
        return h + dItem('story-' + p.no, '#story-' + p.no, p.start, kick, p.short, p, g);
      }).join('') + '</nav>';
    $('dclose').onclick = function () { setDrawer(false, document.body.classList.contains('reading')); };
    markDrawer();
  }
  function markDrawer() {
    [].forEach.call(document.querySelectorAll('#drawer .ti'), function (t) {
      var on = t.dataset.key === curKey; t.classList.toggle('cur', on);
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    var c = document.querySelector('#drawer .ti.cur');
    if (c && document.body.classList.contains('dopen')) c.scrollIntoView({ block: 'nearest' });
  }
  function fullOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFull() {
    var d = document, el = d.documentElement;
    try {
      if (fullOn()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) {}
  }
  function step(d) {
    if (!story) return;
    var spreads = Math.ceil(story.pages.length / (wide ? 2 : 1)), s = story.at + d;
    if (s >= 0 && s < spreads) return showSpread(s, d);
    // past the last spread: the next story; before the first: the previous story's last spread (the contents come first;
    // on a phone the contents are their own page)
    var other = SEQ[SEQ.indexOf(story.p) + d];
    if (other && other.toc && !wide) { location.hash = '#contents'; return; }
    if (other) openStory(other, d > 0 ? 0 : -1, d);
  }
  function openStory(p, spread, dir) {
    if (!wide && !p.toc) phoneAll();
    story = { p: p, pages: (wide || p.toc) ? p.pages : PH.pages[p.no], at: 0 };
    var spreads = Math.ceil(story.pages.length / (wide ? 2 : 1));
    showSpread(spread < 0 ? spreads - 1 : Math.min(spread || 0, spreads - 1), dir);
  }

  // ---------- routing: #home, #story-N, #story-N-pS ----------
  // front page, phone and computer: body.mast-on while the masthead wordmark is in view below the header (CSS hides
  // the header logo; on a computer "from Amwaj.media" stays)
  var mastIO = null;
  function mastWatch() {
    if (mastIO) { mastIO.disconnect(); mastIO = null; }
    document.body.classList.remove('mast-on');
    var w = document.querySelector('.hero .panel .word'), mh = document.querySelector('.mh');
    if (!w || !mh || !('IntersectionObserver' in window)) return;
    mastIO = new IntersectionObserver(function (es) { document.body.classList.toggle('mast-on', es[0].isIntersecting); },
      { rootMargin: '-' + mh.offsetHeight + 'px 0px 0px 0px' });
    mastIO.observe(w);
  }
  function route() {
    var m = /^#story-(\d+)(?:-p(\d+))?$/.exec(location.hash), isToc = /^#contents/.test(location.hash), v = $('view');
    wide = window.matchMedia('(min-width:900px)').matches;
    mastWatch();                                      // off everywhere but the phone front page (set again below)
    // #cover: page 1 in the reader on a computer; a phone shows the front page instead
    var isCover = /^#cover/.test(location.hash) && wide;
    if (isCover) isToc = true;
    curKey = m ? 'story-' + (+m[1]) : isToc ? 'contents' : 'home';
    headerBtn();
    if (curKey !== 'home' && $('resume')) $('resume').remove();
    if (!wide) setDrawer(false);
    if (!m && !isToc) {
      markDrawer();
      story = null;
      document.body.classList.remove('reading');
      v.innerHTML = homeHtml();
      resumeBar();
      mastWatch();
      // the minute strip: arrows step one card; the count says which cards are in view
      var ml = $('mlist');
      if (ml) {
        var cards = ml.children, upd = function () {
          if (!document.body.contains(ml)) { window.removeEventListener('resize', upd); return; }
          var w = cards[0].getBoundingClientRect().width + parseFloat(getComputedStyle(ml).columnGap || 24);
          var first = Math.round(ml.scrollLeft / w), shown = Math.max(1, Math.round((ml.clientWidth + 24) / w));
          $('mcount').textContent = (first + 1) + (shown > 1 ? '–' + Math.min(cards.length, first + shown) : '') + ' of ' + cards.length;
          // phone: the strip is as tall as the card in view, not the tallest card (Editor, Nov. 11, 2026)
          ml.style.height = wide ? '' : (cards[Math.min(cards.length - 1, first)].offsetHeight + 16) + 'px';
          $('mprev').disabled = ml.scrollLeft < 4;
          $('mnext').disabled = ml.scrollLeft + ml.clientWidth > ml.scrollWidth - 4;
        };
        var by = function (d) { ml.scrollBy({ left: d * (cards[0].getBoundingClientRect().width + 24), behavior: 'smooth' }); };
        $('mprev').onclick = function () { by(-1); };
        $('mnext').onclick = function () { by(1); };
        ml.addEventListener('scroll', function () { requestAnimationFrame(upd); }, { passive: true });
        window.addEventListener('resize', upd);
        upd();
      }
      var f = $('fwd');
      if (f) f.onclick = function () {
        var u = location.href.split('#')[0];
        (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { f.textContent = 'Link copied'; }, function () { f.textContent = u; });
      };
      window.scrollTo(0, 0);
      return;
    }
    var p = isToc ? TOCP : (P[+m[1] - 1] || P[0]);
    // a phone shows the contents as their own scrolling page; stories open in the phone reader
    if (!wide && isToc) {
      story = null;
      document.body.classList.remove('reading');
      if ($('stage')) { v.outerHTML = '<div id="view"></div>'; v = $('view'); }
      v.innerHTML = phoneContentsHtml();
      window.scrollTo(0, 0);
      return;
    }
    document.body.classList.add('reading');
    if (!$('stage')) v.outerHTML = '<div id="view" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>';
    v = $('view');
    if (!$('stage')) {
      var canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      v.innerHTML = '<div class="rd" id="rd"><div class="rmain">'
        + '<main class="stage" id="stage"><div class="book" id="book" aria-live="polite"></div></main>'
        + '<nav class="nav" aria-label="Pages">'
        + '<span class="pager"><button class="arrow" id="prev" type="button" aria-label="Previous pages"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'
        + '<span class="where"><span class="lbl" id="lbl"></span><span class="track"><i id="bar"></i></span></span>'
        + '<button class="arrow" id="next" type="button" aria-label="Next pages"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></span>'
        + '<span class="tools"><button class="arrow sm txt" id="fdn" type="button" aria-label="Smaller text" title="Smaller text"><span>A</span><i>−</i></button>'
        + '<button class="arrow sm txt big" id="fup" type="button" aria-label="Larger text" title="Larger text"><span>A</span><i>+</i></button><span class="sep" aria-hidden="true"></span>'
        + '<button class="arrow sm" id="zout" type="button" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>'
        + '<button class="zl" id="zl" type="button" title="Fit to screen">100%</button>'
        + '<button class="arrow sm" id="zin" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>'
        + (canFull ? '<button class="arrow sm" id="full" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path id="fullp" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>' : '')
        + '<button id="ntoc" type="button" aria-label="Contents" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Contents</span></button>'
        + '</span></nav></div></div>';
      $('ntoc').onclick = function () { setDrawer(!document.body.classList.contains('dopen')); };
      // phone: a tap on the left or right quarter of the page turns it, like a magazine app
      $('stage').addEventListener('click', function (e) {
        if (wide || (e.target.closest && e.target.closest('a,button'))) return;
        var r = this.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
        if (x < 0.25) step(-1); else if (x > 0.75) step(1);
      });
      $('prev').onclick = function () { step(-1); };
      $('next').onclick = function () { step(1); };
      $('zout').onclick = function () { zoom(-1); };
      $('zin').onclick = function () { zoom(1); };
      $('zl').onclick = function () { zi = 0; size(); };
      if ($('full')) $('full').onclick = toggleFull;
      $('fdn').onclick = function () { textSize(-1); };
      $('fup').onclick = function () { textSize(1); };
      // the reader always opens with the contents drawer out on a computer (Editor, Nov. 11, 2026); a phone has no room
      setDrawer(wide);
      // a swipe turns the page, unless the page is zoomed in (then a drag moves around it)
      var sx = null, sy = 0;
      $('stage').addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
      $('stage').addEventListener('pointerup', function (e) {
        if (sx == null || zi > 0) { sx = null; return; } var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
      });
    }
    if (!story || story.p !== p) openStory(p, m && m[2] ? +m[2] - 1 : 0);
    else if (m && m[2] && +m[2] - 1 !== story.at) showSpread(Math.min(+m[2] - 1, Math.ceil(story.pages.length / (wide ? 2 : 1)) - 1));
  }
  // the minimized drawer: a tab floating on the right edge brings it back
  $('dtab').onclick = function () { setDrawer(true); };
  // the header's button: "Open reader" (the contents spread) on the front page, "Front page" anywhere else (Editor, Nov. 11, 2026)
  // the header's button: "Open reader" on the front page; inside the reader "Front page" on a computer and a clear
  // "Close" on a phone (Editor, Nov. 11, 2026: no gentle way out on a phone); the place is kept for "Continue reading"
  var ICON_BOOK = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.3 6-1.3 9 .5 3-1.8 6-1.8 9-.5V19c-3-1.3-6-1.3-9 .5-3-1.8-6-1.8-9-.5zM12 6v13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var ICON_X = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  function headerBtn() {
    var home = curKey === 'home', b = $('cbtn'), close = !home && !window.matchMedia('(min-width:900px)').matches;
    b.href = home ? (wide ? '#cover' : '#contents') : '#home';   // the reader opens at page 1, the cover
    b.classList.toggle('closing', close);
    b.innerHTML = (close ? ICON_X : ICON_BOOK) + '<span>' + (home ? 'Open reader' : close ? 'Close' : 'Front page') + '</span>';
    b.setAttribute('aria-label', home ? 'Open reader' : close ? 'Close the reader' : 'Front page');
  }
  // "Continue reading": the last page read, remembered in this browser only
  var LKEY = 'amwaj-magazine-last-' + NO;
  function saveLast(p, s) {
    if (p.toc) return;
    try { localStorage.setItem(LKEY, JSON.stringify({ no: p.no, s: s, n: (story && story.pages.length) || 1 })); } catch (e) {}
  }
  function resumeBar() {
    var old = $('resume'); if (old) old.remove();
    var last = null; try { last = JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) {}
    try { if (sessionStorage.getItem(LKEY + '-hide')) return; } catch (e) {}
    var p = last && P[last.no - 1]; if (!p) return;
    var el = document.createElement('div');
    el.id = 'resume'; el.className = 'resume-w wrap';
    el.innerHTML = '<div class="resume"><a href="#story-' + p.no + (last.s ? '-p' + (last.s + 1) : '') + '">' + ICON_BOOK + '<span><b>Continue reading</b><small>' + esc(p.short) + '</small></span></a>'
      + '<button type="button" aria-label="Dismiss">' + ICON_X + '</button></div>';
    var v = $('view'); v.insertBefore(el, v.firstChild);   // at the top of the front page, under the header
    el.querySelector('button').onclick = function () { try { sessionStorage.setItem(LKEY + '-hide', '1'); } catch (e) {} el.remove(); };
  }
  // on a phone the drawer lies over the page: a tap outside it closes it
  document.addEventListener('click', function (e) {
    if (wide || !document.body.classList.contains('dopen') || !e.target.closest) return;
    if (e.target.closest('#drawer') || e.target.closest('#cbtn') || e.target.closest('#ntoc')) return;
    setDrawer(false);
  });
  // ---------- Subscribe: the Weekly newsletter through the app's subscribe.php (same Mailchimp audience and groups) ----------
  var SUB_API = 'https://readingtehran.com/app-api/subscribe.php';
  var dlg = $('subd'), form = $('subf'), msg = $('submsg');
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('[data-sub]')) return;
    msg.textContent = ''; msg.className = 'msg'; $('subgo').disabled = false; $('subgo').textContent = 'Subscribe';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    form.elements.name.focus();
  });
  $('subx').onclick = function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); };
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = form.elements, langs = [].filter.call(form.querySelectorAll('input[name=lang]'), function (i) { return i.checked; }).map(function (i) { return i.value; });
    var say = function (t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
    if (f.name.value.trim().length < 2) return say('Please enter your full name.');
    if (!/^\S+@\S+\.\S+$/.test(f.email.value.trim())) return say('Please enter a valid email address.');
    if (!langs.length) return say('Please choose at least one language.');
    if (!f.terms.checked) return say('Please accept the terms and conditions.');
    var go = $('subgo'); go.disabled = true; go.textContent = 'Signing you up…'; say('', true);
    fetch(SUB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.value.trim(), email: f.email.value.trim(), languages: langs, frequency: 'weekly', acceptTerms: true }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (x.ok) { say(x.j.message || 'You have been subscribed to our newsletter!', true); go.textContent = 'Done'; return; }
        go.disabled = false; go.textContent = 'Subscribe';
        say(x.j.error || 'We could not sign you up right now. Please try again later.');
        if (x.j.resubscribeUrl) { var a = document.createElement('a'); a.href = x.j.resubscribeUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = ' Open amwaj.media'; msg.appendChild(a); }
      }, function () { go.disabled = false; go.textContent = 'Subscribe'; say('We could not reach the sign-up. Please check your connection and try again.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (!story || (dlg && dlg.open) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoom(1); }
    if (e.key === '-') { e.preventDefault(); zoom(-1); }
    if (e.key === '0') { zi = 0; size(); }
    if (e.key === 'f' || e.key === 'F') toggleFull();
  });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      var p = $('fullp'); if (p) p.setAttribute('d', fullOn() ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
      if ($('full')) $('full').setAttribute('aria-label', fullOn() ? 'Leave full screen' : 'Full screen');
      setTimeout(size, 60);
    });
  });
  // "Browse all stories" scrolls to the story cards
  document.addEventListener('click', function (e) {
    var j = e.target.closest && e.target.closest('[data-jump]');
    if (j && $(j.dataset.jump)) $(j.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  window.addEventListener('hashchange', function () {
    var m = /^#story-(\d+)/.exec(location.hash);
    if (story && m && +m[1] === story.p.no) { var s = /-p(\d+)$/.exec(location.hash); if (s && +s[1] - 1 !== story.at) showSpread(+s[1] - 1); return; }
    route();
  });
  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var wasWide = wide, nowWide = window.matchMedia('(min-width:900px)').matches;
      if (story && wasWide && nowWide) size();
      // phone turned round (width changes; a height change is only the address bar): lay the story out again
      else if (story && !nowWide && !wasWide && !story.p.toc && Math.abs($('stage').clientWidth - phoneW) > 30) {
        var fr = story.at / Math.max(1, story.pages.length), sp = story.p; story = null; openStory(sp, 0);
        showSpread(Math.min(story.pages.length - 1, Math.floor(fr * story.pages.length)));
      }
      else if (wasWide !== nowWide) { story = null; route(); }
    }, 180);
  });
  var fontsReady = document.fonts && document.fonts.load ? Promise.all([400, 500, 700, 900].map(function (w) { return document.fonts.load(w + ' 16px Sombra'); })).catch(function () {}) : Promise.resolve();
  var laid = false;
  Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
    laid = true;
    window.__laidWithFonts = !!(document.fonts && [400, 500, 700, 900].every(function (w) { return document.fonts.check(w + ' 16px Sombra'); }));
    paginateAll(); route();
  });
  // on a slow phone Sombra can arrive after the first layout; the text is then shorter than measured, which leaves empty
  // pages and gaps (Editor, Nov. 12, 2026): lay everything out again once every font is in
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {
    if (!laid) return;
    var ok = [400, 500, 700, 900].every(function (w) { return document.fonts.check(w + ' 16px Sombra'); });
    if (!ok) return;
    if (window.__laidWithFonts) return; window.__laidWithFonts = true;
    PH.key = ''; paginateAll();
    if (story) { var fr = story.at / Math.max(1, story.pages.length), sp = story.p; story = null; openStory(sp, 0); showSpread(Math.min(story.pages.length - 1, Math.floor(fr * story.pages.length))); }
  });
})();
