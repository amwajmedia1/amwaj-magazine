<body>
<title>Amwaj Magazine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Amwaj Magazine, v5 (Nov. 11, 2026), in the design Claude Desktop mocked up for the Editor
   (https://claude.ai/artifact/5pf4iWjbGsCLQnSi2UVBzQ): a web-style issue front page (turquoise wordmark cover,
   "Number of the week", "The week in a minute", "In this wave" by region, a turquoise footer); each story opens as
   paginated spreads on a computer and scrolls as one page on a phone. The wordmark's first "a" in Magazine is the joined
   Arabic ta marbuta. Reused blocks from reader2.html (openers, text flow, graphics) are inserted by inline3.js. */
:root{
  --ground:#F4F7F6; --desk:#E4EAE9; --paper:#FFFFFF; --ink:#2F3333; --ink2:#5C6567; --rule:#D9E1DF;
  --teal:#00A693; --teal-ink:#007D6E; --teal-deep:#06302A; --orange:#FFA333; --sand:#C09B5C; --brown:#64402E; --burg:#9B4F4F;
  --shade:rgba(20,40,36,.16); --chip:#E2F3F0; --tint:#F4F7F6; --paper-old:#F6F0E3;
  --display:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Medium.ttf) format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Black.ttf) format("truetype");font-weight:900;font-display:block}
body{background:var(--ground);color:var(--ink);font-family:var(--body)}
body.reading{background:var(--desk);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
/* ---------- openers ---------- */
.kick{display:flex;flex-wrap:wrap;gap:.6em 1.1em;font-size:2.3cqw;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.kick .r{color:var(--teal-ink)}.kick .y{opacity:.75}
.by{font-size:2.6cqw;margin-top:2.2cqw;opacity:.85}
.by b{font-weight:700}
/* A: the photo takes the page, the headline sits on it */
.op-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-a .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,13,.05) 35%,rgba(5,15,13,.9) 100%)}
.op-a .tx{position:absolute;left:7.5cqw;right:7.5cqw;bottom:7cqw;color:#fff;z-index:1}
.op-a .kick .r{color:#7FE3D4}
.op-a h1{font-family:var(--display);font-weight:900;font-size:7.6cqw;line-height:1.02;margin:2cqw 0 0;text-wrap:balance}
/* B: headline first, the photo below it */
.op-b .tx{padding:8cqw 7.5cqw 4cqw}
.op-b h1{font-family:var(--display);font-weight:900;font-size:8.4cqw;line-height:.98;letter-spacing:-.015em;margin:2.4cqw 0 0;text-wrap:balance}
.op-b .ph{flex:1;min-height:0;position:relative;margin:0 7.5cqw 7cqw}
.op-b .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-b .ph::before{content:"";position:absolute;left:-2.4cqw;top:-2.4cqw;width:22cqw;height:22cqw;background:var(--orange);z-index:0}
.op-b .ph img{z-index:1}
/* C: Media Monitor, a coloured band with the label, the photo as a strip */
.op-c .band{background:var(--brown);color:#fff;padding:7cqw 7.5cqw 6cqw}
.op-c .label{font-family:var(--display);font-weight:900;font-size:4.2cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.op-c h1{font-family:var(--display);font-weight:900;font-size:6.6cqw;line-height:1.04;margin:2.4cqw 0 0;text-wrap:balance}
.op-c .kick .r{color:#FFC98A}
.op-c .ph{position:relative;flex:1;min-height:0}
.op-c .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* D: a big typographic headline, the photo filling the rest of the page (Nov. 11, 2026) */
.op-d .tx{padding:8cqw 7.5cqw 0}
.op-d h1{font-family:var(--display);font-weight:900;font-size:9cqw;line-height:.95;letter-spacing:-.02em;margin:2.6cqw 0 0;text-wrap:balance}
.op-d .ph{flex:1;min-height:0;position:relative;margin:5cqw 7.5cqw 7cqw}
.op-d .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Old News: the photo aged, an archive-paper band; the whole opener on the same cream as its text pages
   (".page.op-o": the plain .page background came later in the CSS and turned it white; Editor, Nov. 11, 2026) */
.op-o,.page.op-o{background:#F6F0E3;color:#3A2A1C}
.op-o .ph{position:relative;height:56%}
.op-o .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.75) contrast(1.05) brightness(.95)}
.op-o .tx{padding:5cqw 7.5cqw 0}
.op-o .label{display:inline-block;border:1px solid #333333;border-radius:3px;background:#333333;color:#FFFFFF;font-weight:900;font-size:2.6cqw;letter-spacing:.16em;text-transform:uppercase;padding:.6cqw 1.6cqw}   /* Badge Guide: ANALYSIS row */
.op-o h1{font-family:var(--display);font-weight:900;font-size:7cqw;line-height:1.02;margin:2.4cqw 0 0;text-wrap:balance}
.op-o .kick .r{color:var(--brown)}

/* ---------- the text flow ---------- */
/* setting F of the type test (Editor, Nov. 11, 2026): two columns, 13 px on the 560 px page, line spacing 1.4,
   left-aligned, smaller margins. The phone reader (one column) keeps its own text size. */
/* the text stops clear of the folio rule: 1.2cqw (~7px on a 560px page) under the last line, ~10px to the rule
   (Editor, Nov. 12, 2026: 3-6px was too close to the bottom; then 2.6cqw, ~18px, "too big now") */
.fview{flex:1;min-height:0;overflow:hidden;margin:4.5cqw 5.5cqw 1.2cqw;position:relative}
.flow{height:100%;width:100%;column-gap:var(--gap,22px);column-fill:auto;line-height:1.56;hyphens:auto;-webkit-hyphens:auto}
/* (no will-change:transform here: it made the browser paint the text once at the page's own size and stretch that
   image when the page is scaled up on a big screen, so text and graphics looked blurred; Editor, Nov. 11, 2026) */
.flow.c1{column-count:1}.flow.c2{column-count:2;font-size:.8125em;line-height:1.4}
.flow.c2 p{margin-bottom:.6em}
/* a band across the top of a two-column page: the Bottom Line (one column, set apart) or a graph */
.band{position:absolute;left:0;right:0;top:0;z-index:1;font-size:.8125em;line-height:1.45;background:var(--paper)}
.band .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
.band .fig{margin:0}
.band .gx{font-size:1.02em}
/* width 100% + height auto: an image not yet loaded still takes its height from its width/height attributes, so the
   band measures the same before and after loading (width:auto made it 0 high until the image arrived) */
.band .gx-svg,.band .gx-img{max-height:calc(var(--ph) * .42 * var(--gshrink, 1));width:100%;height:auto;object-fit:contain;margin:0 auto}
.band .fig.photo img{max-height:calc(var(--ph) * .42);width:100%;object-fit:cover}
.bsp{display:block;break-inside:avoid}
/* HARD RULE (Editor, Nov. 11, 2026): photos never crop people's heads. Every cropped photo keeps its upper part in view
   (no focal points are stored for these photos yet) */
.page img,.opb-ph img,.cv-ph img,.hero img,.card img,.ph-story img,.tcover img,.ti img,.lead img{object-position:50% 22%}
.gx-img,.gx-map img,.gx-card img{object-position:50% 50%}
/* the phone reader (one column): smaller lines, timelines and graphs compact, so a graph never fills a page */
.flow.c1 p{orphans:2;widows:2}
.flow.c1 .tl,.flow.c1 .gx{font-size:.86em}
.flow.c1 .ax-te{padding:.2em 0 .35em;line-height:1.34}
/* timeline: the dot and the rail sit in the middle of a fixed 30px gap, so they never touch the date or the entry
   (HARD RULE, Editor, Nov. 12, 2026: text and timeline graphic overlapped on phones) */
.ax-tl .ax-te{grid-template-columns:var(--tld,6.6em) 1fr;gap:0 30px}
.ax-tl .ax-te::before{left:calc(var(--tld,6.6em) + 14px)}
.ax-tl .ax-te::after{left:calc(var(--tld,6.6em) + 9px)}
.ax-tl .ax-te.last .ax-tx{margin-left:0}
/* HARD RULE (Editor, Nov. 12, 2026): timelines are left-aligned with their header and standfirst, never right-aligned:
   dates start at the left edge; the date column is as wide as the longest date (--tlw, set by graphs-render.js) */
.ax-tl .ax-te{--tld:var(--tlw,6.6em)}
.ax-tl .ax-td{text-align:left}
.flow.c1 .ax-tl .ax-te{--tld:min(var(--tlw,5em),5em)}
.flow.c1 .fig{margin:.5em 0 .9em}
/* phone sliders: four small cards a row, so a slider shares its page with text (Editor, Nov. 11, 2026: "the graph
   (slider) also looks terrible") */
.flow.c1 .gx.kind-cards{font-size:.74em}
.flow.c1 .gx-cards{gap:.7em .4em}
.flow.c1 .gx-cards:not(.wide) .gx-card{flex:0 0 calc(25% - .3em)}
.flow.c1 .gx-cards.one-row .gx-card{flex:1 1 0}
/* graphics adapt to every screen size (Editor, Nov. 12, 2026): on short phones the cards get smaller, so a big grid
   still shares its page with text */
@media (max-height:760px){
  .flow.c1 .gx-card img{width:2.7em;height:2.7em}
  .flow.c1 .gx-cards{gap:.45em .4em}
  .flow.c1 .gx.kind-cards{font-size:.7em}
}
.flow.c1 .gx-cards.per:not(.wide) .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * .4em) / var(--per))}
.flow.c1 .gx-card img{width:3.4em;height:3.4em}
/* phone: a long list of wide cards (6 or more, e.g. Issue 2's "US-designated Foreign Terrorist Organizations": 8 rows)
   goes into two columns with smaller pictures, so it shares its page with text instead of filling a page alone or
   pushing itself onto the next one (Nov. 13, 2026: 360x780 and 375x667 failed on it) */
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)){grid-template-columns:repeat(2,minmax(0,1fr));gap:.55em .8em}
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card{gap:.5em}
.flow.c1 .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card img{width:2.5em;height:2.5em}
.flow.c1 .gx-card b{font-size:.92em;line-height:1.15}
.flow.c1 .gx-card .sub,.flow.c1 .gx-card .txt{font-size:.82em;line-height:1.2}
/* maps: framed by two orange corner strokes, top left and bottom right (Editor, Nov. 11, 2026; replaces a full-width
   stroke on top) */
.gx-map{position:relative;padding:.7em;background:#fff;box-sizing:border-box}
/* in a band the frame is as wide as the map at its allowed height, so the corners sit on the map's own corners */
.band{--mapmax:calc(var(--ph) * .42)}
html.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
html.dens-2 .band{--mapmax:calc(var(--ph) * .31)}
html.dens-3 .band{--mapmax:calc(var(--ph) * .28)}
.band .gx-map{width:min(100%, calc(var(--mapmax) * var(--ar) + 1.4em));margin:0 auto}
.band .gx-map .gx-img{max-height:none;width:100%;height:auto}
.gx-map::before,.gx-map::after{content:"";position:absolute;width:3.2em;height:3.2em;border:0 solid #FFA333;pointer-events:none}
.gx-map::before{top:0;left:0;border-top-width:5px;border-left-width:5px}
.gx-map::after{bottom:0;right:0;border-bottom-width:5px;border-right-width:5px}
/* the opener on a computer (Nov. 11, 2026): photo edge to edge with the headline over it, across the top of the first
   text page; the Bottom Line under it when it fits */
.band.opband{left:0;right:0;top:0;z-index:2;font-size:inherit;line-height:normal;background:transparent}
.page.oldnews .band.opband{background:transparent}
/* every Old News page is cream, bands included (HARD RULE, Nov. 11) */
.page.oldnews .band{background:var(--paper-old,#F6F0E3)}
/* the Old News note sits above the Bottom Line (HARD RULE, Editor, Nov. 12, 2026) */
.onintro{margin:0 0 .9em}
.band .onintro{padding:0 .1em}
/* the photo is at least this tall and grows with the headline, so the kicker and headline are never cut off */
.opb-ph{position:relative;min-height:min(calc(var(--ph) * .4), calc(var(--pw) * .7));overflow:hidden;background:#06302A;display:flex;flex-direction:column;justify-content:flex-end}
.opb-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opb.old .opb-ph img{filter:sepia(.75) contrast(1.05) brightness(.95)}
.opb-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,12,.15) 0%,rgba(4,14,12,.35) 35%,rgba(4,14,12,.88))}
.opb-tx{position:relative;padding:5cqw 5.5cqw 4cqw;color:#fff}
.opb-tx .kick{color:#fff}
.opb-tx .kick .r{color:#FFE2BD}
.opb-tx h1{font-family:var(--display);font-weight:900;font-size:6.2cqw;line-height:1.02;margin:1.6cqw 0 0;text-wrap:balance}
/* badges per the Badge Guide (Editor, Nov. 11, 2026): MEDIA MONITOR = DEVELOPING row, OLD NEWS = ANALYSIS row */
.opb.mm .opb-tx .kick .y{background:#FBF3E4;border:1px solid #C09B5C;color:#64402E;border-radius:3px;padding:.3cqw 1.2cqw}
.opb.old .opb-tx .kick .y{background:#333333;border:1px solid #333333;color:#FFFFFF;border-radius:3px;padding:.3cqw 1.2cqw}
.opb-tx .by{font-size:2.3cqw;margin-top:1.6cqw;opacity:.9}
.opb-cap{font-size:1.9cqw;line-height:1.35;color:var(--ink2);padding:1.4cqw 5.5cqw 0}
/* HARD RULE (Editor, Nov. 12, 2026): text never covers a photo. On a phone the photo stands on its own at its own shape
   and the label, headline and byline go BELOW it (photo, caption, then the headline) */
@media (max-width:899px){
  .opb{display:flex;flex-direction:column}
  .opb-ph{display:contents}
  /* a fixed height (about a 3:2 photo's own shape), so the layout measures the same before the photo has loaded */
  .opb-ph img{position:static;order:1;display:block;width:100%;height:min(calc(var(--pw) * .66), calc(var(--ph) * .36));object-fit:cover}
  .opb-veil{display:none}
  .opb-cap{order:2}
  .opb-tx{order:3;color:var(--ink);padding:2.6cqw 5.5cqw 0}
  .opb-tx .kick{color:var(--ink2)}
  .opb-tx .kick .r{color:var(--teal-ink)}
  .opb-tx .by{opacity:1;color:var(--ink2)}
}
.page.oldnews .opb-cap{color:#7a6650}
.opb-bl{padding:3cqw 5.5cqw 0;font-size:.8125em;line-height:1.45}
.opb-bl .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
/* HARD RULE (Editor, Nov. 11, 2026): max 40 pages. When an issue is longer, the reader lays it out again one step
   tighter at a time (class dens-1..3 on <html>, set by paginateAll) until it fits */
html.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
html.dens-1 .band .gx-svg,html.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
/* one story at a time (Nov. 12, 2026, no page limit any more): when a story would end on an almost empty page, its
   photo and graph bands get a little smaller (never the text) and it is laid out again; kept only if it saves the page */
.page.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
.page.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
.page.dens-1 .band .gx-svg,.page.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
.page.dens-2 .band{--mapmax:calc(var(--ph) * .29)}
.page.dens-2 .opb-ph{min-height:calc(var(--ph) * .27)}
.page.dens-2 .band .gx-svg,.page.dens-2 .band .gx-img{max-height:calc(var(--ph) * .29)}
html.dens-2 .opb-ph{min-height:calc(var(--ph) * .28)}
html.dens-2 .band .gx-svg,html.dens-2 .band .gx-img{max-height:calc(var(--ph) * .31)}
html.dens-2 .flow.c2,html.dens-2 .band:not(.opband),html.dens-2 .opb-bl{font-size:.78em}
html.dens-3 .opb-ph{min-height:calc(var(--ph) * .25)}
html.dens-3 .band .gx-svg,html.dens-3 .band .gx-img{max-height:calc(var(--ph) * .28)}
html.dens-3 .flow.c2,html.dens-3 .band:not(.opband),html.dens-3 .opb-bl{font-size:.75em}
html.dens-3 .flow.c2{line-height:1.36}
.flow p{text-wrap:pretty}
.flow p{margin:0 0 .85em;orphans:3;widows:3}
.flow p.first::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.6em;line-height:.82;margin:.06em .1em 0 0;color:var(--teal)}
.flow h3{font-family:var(--display);font-weight:900;font-size:1.28em;line-height:1.15;margin:1.1em 0 .45em;break-after:avoid;text-wrap:balance;color:var(--teal-ink)}
.flow ul{margin:0 0 .9em;padding-left:1.1em}
.flow li{margin:0 0 .55em}
.flow li::marker{color:var(--orange)}
.flow a{color:var(--teal-ink);text-decoration-thickness:1px;text-underline-offset:2px}
.flow strong{font-weight:700}
.blbox{background:var(--chip);padding:1em 1.1em .4em;margin:0 0 1.2em;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blbox h4{margin:0 0 .6em;font-size:.78em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.blbox ul{padding-left:1.05em;margin:0}
.blbox li{line-height:1.45}
.fig{margin:.4em 0 1.1em;break-inside:avoid}
.fig img{display:block;width:100%;height:auto;max-height:var(--figmax,60vh);object-fit:contain;background:#fff}
.fig figcaption{font-size:.76em;line-height:1.35;color:var(--ink2);margin-top:.5em;padding-left:.7em;border-left:3px solid var(--orange)}
.fig.photo img{object-fit:cover;max-height:var(--figmax,60vh)}
.pull{break-inside:avoid;margin:.5em 0 1.1em;padding:.6em 0 .7em;border-top:3px solid var(--orange);border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:900;font-size:1.42em;line-height:1.16;color:var(--ink);text-wrap:balance}
.pull::before{content:"“";color:var(--orange);margin-right:.05em}
.pull::after{content:"”";color:var(--orange)}
.endmark{margin-top:1em;font-weight:700;font-size:.92em}
.endmark::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--teal);margin-right:.5em;vertical-align:.05em}
.folio .contd{margin-left:auto;margin-right:1.4em;text-transform:none;letter-spacing:.02em;font-weight:700;color:var(--ink2)}
.oldnews .flow{background:transparent}
.page.oldnews{background:#F6F0E3;color:#3A2A1C}
.page.oldnews .folio{border-color:#D9CCB3;color:#7a6650}

/* ---------- graphics drawn from the Flourish data ---------- */
.gx{font-size:.8em;line-height:1.3;color:var(--ink)}
.gx-h{margin-bottom:.6em;border-top:3px solid var(--teal);padding-top:.5em}
.gx-t{font-family:var(--display);font-weight:900;font-size:1.15em;line-height:1.15;text-wrap:balance}
.gx-s{color:var(--ink2);margin-top:.15em}
.gx-src{color:var(--ink2);font-size:.82em;margin-top:.5em}
.gx-svg{display:block;width:100%;height:auto;overflow:visible}
.gx-svg .ax{font-size:15px;fill:var(--ink2);font-family:var(--body)}
.gx-svg .lab{font-size:16px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .val{font-size:15px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .grid{stroke:var(--rule);stroke-width:1}
.gx-svg .base{stroke:var(--ink2);stroke-width:1}
.gx-leg{display:flex;flex-wrap:wrap;gap:.3em 1em;margin-bottom:.4em;font-size:.92em}
.gx-leg span{display:inline-flex;align-items:center;gap:.4em}
.gx-leg i{width:.8em;height:.8em;display:inline-block}
.gx-axt{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--ink2);margin-bottom:.2em}
.gx-facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:1em}
.gx-ft{font-weight:700;text-align:center;margin-bottom:.2em}
.gx-img{display:block;width:100%;height:auto;background:#fff}
/* card grids ("slider" graphics): rows centred; never one card alone on a row (fixCards puts them on one row)
   (HARD RULE, Editor, Nov. 11, 2026) */
.gx-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:.9em .7em}
.gx-cards:not(.wide) .gx-card{flex:0 0 6.6em;min-width:0}
.gx-cards.one-row{flex-wrap:nowrap}
.gx-cards.one-row .gx-card{flex:1 1 0}
.gx-cards.one-row .gx-card img{width:min(4.6em,100%);height:auto;aspect-ratio:1}
.gx-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35em}
.gx-card img{width:4.6em;height:4.6em;border-radius:50%;object-fit:cover;background:var(--tint);border:2px solid var(--orange)}
.gx-cards.logos .gx-card img{border-radius:0;border:0;object-fit:contain;background:#fff;padding:.3em}
.gx-card b{display:block;font-size:.95em;line-height:1.2}
.gx-card .sub{display:block;color:var(--teal-ink);font-weight:700;font-size:.85em;margin-top:.1em}
.gx-card .txt{display:block;color:var(--ink2);font-size:.85em;margin-top:.15em}
.gx-cards.wide{display:grid;grid-template-columns:1fr;gap:.6em}
.gx-cards.wide .gx-card{flex-direction:row;align-items:flex-start;text-align:left;gap:.8em}
.gx-cards.wide .gx-card img{width:3.6em;height:3.6em;flex:none}
/* a timeline: text in the article's flow */
.tl{margin:.5em 0 1.2em}
.tl .gx-h{margin-bottom:.5em}
.tl .gx-t{font-size:1.05em}
.tl-e{display:grid;grid-template-columns:4.6em 1fr;gap:.7em;padding:.45em 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:.9em;line-height:1.42}
.flow.c2 .tl-e{break-inside:auto}   /* two columns never end early (Editor, Nov. 10, 2026) */
.tl-d{font-family:var(--display);font-weight:900;color:var(--teal-ink);font-size:.95em}
.tl-x b{font-weight:700}
/* in the text: a graph at most ~40% of the page tall */
.flow .fig .gx-svg,.flow .fig .gx-img{max-height:calc(var(--figmax,60vh) * .62)}
/* ---------- a graphic page ---------- */
.gpage{background:var(--paper)}
.gin{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6cqw;padding:7cqw 7.5cqw 3cqw;font-size:var(--fs)}
.gslot{min-height:0}
.gin .gx{font-size:.86em}
.gin .gx-svg,.gin .gx-img{max-height:calc(var(--ph) * .5);width:auto;max-width:100%;margin:0 auto}
.gin.two .gx-svg,.gin.two .gx-img{max-height:calc(var(--ph) * .26)}
.mk{display:block;height:0}
/* ---------- Nov. 13, 2026 (Editor, Issue 2 at the smallest text size) ---------- */
/* a subhead that opens a column under a band (a forced column break keeps its top margin) starts level with the text
   in the next column, not lower ("Will Baghdad accept Masgarian?", p. 21) */
.flow .bsp + h3,.flow .bsp + .mk + h3{margin-top:0}
/* two columns: two lines may end or start a column (was three), so a column no longer ends 3-4 lines early before a
   subhead or a long paragraph (p. 15, under the Bottom Line) */
.flow.c2 p{orphans:2;widows:2}
/* Datawrapper maps are drawn at 400 px (build.js dwShot) and shown larger, so their labels are legible (pp. 25, 31) */
.band{--mapmax:calc(var(--ph) * .52)}
html.dens-1 .band,.page.dens-1 .band,html.dens-2 .band,html.dens-3 .band,.page.dens-2 .band{--mapmax:calc(var(--ph) * .5)}
.gx-map a{display:block}
/* computer: a long list of wide cards (6 or more, e.g. the 8 "US-designated Foreign Terrorist Organizations") in two
   columns, so it fits a band and shares its page with text instead of taking a page alone (p. 8) */
.band .gx-cards.wide:has(> .gx-card:nth-child(6)){grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em 1.2em}
.band .gx-cards.wide:has(> .gx-card:nth-child(6)) .gx-card img{width:3em;height:3em}
/* people with their titles: the title above the photo, the name below, three to a row on a computer (Editor, Nov. 13,
   2026, "Leaders at the third GCC summit"); titles of one or two lines keep the photos level */
.gx-cards.roles .gx-card{flex:0 0 calc((100% - 2 * 1.4em) / 3);max-width:11em;gap:.3em}
.gx-cards.roles{gap:1em 1.4em}
.gx-cards.roles .gx-card .sub{margin:0;min-height:2.4em;display:flex;align-items:flex-end;justify-content:center;line-height:1.2}
.gx-cards.roles .gx-card b{line-height:1.2}
.flow.c1 .gx-cards.roles .gx-card{flex:0 0 calc((100% - 2 * .4em) / 3);max-width:none}
.flow.c1 .gx-cards.roles{gap:.7em .4em}
/* Nov. 14, 2026 (Editor: the maps on pp. 16 and 24 were messed up). A map's height is set by its band (--mapmax), never
   by the tighter-story rules (dens-1..3 capped the image but not its frame, so the frame stood wider than the map) */
.band .gx-map .gx-img{max-height:none!important}
/* a plain map (build.js): its title, description and source in the magazine's type inside the orange frame, clear of
   the corners; the frame is as wide as the map at its allowed height once the title block is taken off */
.gx-map.plain{padding:1.1em 1.1em .8em;font-size:calc(1em * .85 / var(--fsx, 1))}   /* its type stays at the 0.85 size: bigger text would squeeze the map */
.gx-map.plain .gx-h{border-top:0;padding-top:0;margin-bottom:.6em}
.gx-map.plain .gx-src{margin-top:.45em}
.band .gx-map.plain{width:min(100%, calc((var(--mapmax) - 8em) * var(--ar) + 2.2em))}
/* a timeline in two columns grows with the text only up to the 1.15 size: at 1.3-1.5 it was taller than a column, ran
   over a page turn and its last box ran into the next column (Nov. 14, 2026) */
.flow.c2 .tl{font-size:min(1em, calc(1em * 1.15 / var(--fsx, 1)))}

/* "Browse this week's edition": one compact header row, then a panel per desk in the desk's colour (Editor, Nov. 11, 2026) */
.mt-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 32px;margin-bottom:22px}
.mt-h .tw{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.mt-h h2{margin:8px 0 10px;font-weight:900;font-size:clamp(36px,4.4vw,56px);line-height:.95;letter-spacing:-.02em}
.mt-h .meta{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.mt-r .tlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;align-items:start}
.mt-r .tlist:has(.tr-big){grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.tr-rest{display:flex;flex-direction:column;gap:22px;min-width:0}
.mt-r .tr-g{border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--g) 9%,var(--paper));border:1px solid color-mix(in srgb,var(--g) 30%,transparent)}
.mt-r .tg{margin:0;padding:12px 20px;background:var(--g);color:#fff;font-size:14px;letter-spacing:.16em}
.mt-r .tg::after{display:none}
.mt-r .tg .cnt{margin-left:auto;font-size:11px;letter-spacing:.1em;opacity:.85}
.mt-r .tes{padding:4px 20px 8px}
.tr-big .tes{columns:2;column-gap:36px;column-rule:1px solid color-mix(in srgb,var(--g) 25%,transparent)}
.mt-r .te{border-bottom-color:color-mix(in srgb,var(--g) 22%,transparent)}
.mt-r .te:last-child{border-bottom:0}
.tr-big .te:last-child{border-bottom:1px solid transparent}
.mt-r .te .n,.mt-r .te.mm .n,.mt-r .te.old .n{color:var(--g)}
.mt-r .te .go{color:var(--g)}
.mt-r .te:hover b{color:var(--g)}
.te .kb{font-style:normal;display:inline-block;margin-right:7px;padding:1px 6px;border-radius:3px;background:#FBF3E4;border:1px solid #C09B5C;color:#64402E;font-weight:900;letter-spacing:.08em}
.te.old .kb{background:#333333;border-color:#333333;color:#FFFFFF}
.tr-g.g-iran{--g:#007D6E}.tr-g.g-iraq{--g:#4E6E81}.tr-g.g-peninsula{--g:#9B4F4F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tr-g.g-iran{--g:#1DA58F}:root:not([data-theme="light"]) .tr-g.g-iraq{--g:#6C8FA4}:root:not([data-theme="light"]) .tr-g.g-peninsula{--g:#B86A6A}}
@media (max-width:1099px){.mt-r .tlist:has(.tr-big){grid-template-columns:1fr}.tr-rest{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}}
@media (max-width:699px){.tr-big .tes{columns:1}.wave .te .n{width:44px;font-size:34px}.wave .te b{font-size:18px}.mt-r .tes{padding:2px 16px 6px}}
/* the desk headings in the contents: the drawer's desk colours */
.tg.g-iran{--g:#007D6E}.tg.g-iraq{--g:#4E6E81}.tg.g-peninsula{--g:#9B4F4F}
.tg[class*="g-"]{color:var(--g)}
.tg[class*="g-"]::after{background:var(--g)}
.mt-r .tg[class*="g-"]{color:#fff}
/* the reader's contents page: tighter, so every story fits on page 3 */
.page.toc{font-size:16px}
.page.toc.one .tlist{flex:1;min-height:0;padding:4cqw 7.5cqw 0}
.toc .te{padding:1.05cqw 0}
.toc .te b{font-size:2.75cqw}
.toc .tg{margin:2.4cqw 0 .2cqw}
.toc .tlist h2{font-size:5.6cqw}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tg.g-iran{--g:#4AD5C2}:root:not([data-theme="light"]) .tg.g-iraq{--g:#9FC0D3}:root:not([data-theme="light"]) .tg.g-peninsula{--g:#E8A0A0}}
/* slightly rounded corners on the front page (Editor, Nov. 11, 2026) */
.hero .in{border-radius:14px;overflow:hidden}
.num,.minute{border-radius:14px}
.card,.card .im{border-radius:12px}
.card .im{border-bottom-left-radius:0;border-bottom-right-radius:0}
@media (max-width:899px){.hero .in{border-radius:0}}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;overflow:auto;padding:8px 24px 8px;touch-action:pan-y}
/* the pages sit right under the header, not centred with a gap above (Editor, Nov. 11, 2026) */
.stage .book{margin:0 auto auto}
.stage.zoomed{touch-action:auto;cursor:grab}
.book{margin:auto;flex:none;display:flex;box-shadow:0 18px 50px var(--shade),0 2px 6px var(--shade);border-radius:3px;overflow:hidden;position:relative}
.page{width:var(--pw);height:var(--ph);flex:none;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;
  --fs:calc(16px * var(--fsx,1));font-size:var(--fs);container-type:inline-size}
.book.two .page:first-child::after{content:"";position:absolute;inset:0 0 0 auto;width:40px;background:linear-gradient(to left,var(--shade),transparent);pointer-events:none;z-index:3}
/* the cover, page 1 of the reader (Editor, Nov. 11, 2026) */
.page.coverp{background:#00A693;color:#fff}
.coverp .cv-top{padding:7cqw 7cqw 4.4cqw}
.coverp .cv-word{font-family:var(--display);font-weight:900;font-size:15cqw;line-height:.965;letter-spacing:-.03em}
.coverp .cv-iss{display:flex;justify-content:space-between;gap:2cqw;border-top:2px solid #06302A;margin-top:3.4cqw;padding-top:2cqw;font-weight:700;font-size:2.3cqw;letter-spacing:.1em;text-transform:uppercase;color:#06302A}
.coverp .cv-ph{flex:1;min-height:0;position:relative;display:block;color:#fff;text-decoration:none}
.coverp .cv-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coverp .cv-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,12,0) 35%,rgba(4,14,12,.82))}
.coverp .cv-tx{position:absolute;left:7cqw;right:7cqw;bottom:7cqw;display:flex;flex-direction:column;gap:2.4cqw}
.coverp .cv-tag{align-self:flex-start;background:#06302A;color:#FFE2BD;font-weight:900;font-size:2.1cqw;letter-spacing:.12em;text-transform:uppercase;padding:1cqw 1.8cqw}
.coverp .cv-tx b{font-family:var(--display);font-weight:900;font-size:7.6cqw;line-height:1.02;text-wrap:balance}
.coverp .cv-by{font-size:2.6cqw;opacity:.9}
/* cover + contents on one page: a shorter turquoise top and photo, the list below on paper */
.page.ctoc{background:var(--paper);color:var(--ink)}
.ctoc .cv-top{background:#00A693;color:#fff;padding:4cqw 6.5cqw 2.6cqw}
.ctoc .cv-word{font-size:8.6cqw}
.ctoc .cv-iss{margin-top:2cqw;padding-top:1.4cqw}
.ctoc .cv-ph{flex:none;height:calc(var(--ph) * .25)}
.ctoc .cv-tx{left:6.5cqw;right:6.5cqw;bottom:3.4cqw;gap:1.2cqw}
.ctoc .cv-tx b{font-size:5cqw}
.ctoc .tlist{flex:1;min-height:0;padding:1cqw 6.5cqw 0}
.ctoc .tg{margin:1.6cqw 0 0}
.ctoc .te{padding:.7cqw 0}
.ctoc .te b{font-size:2.5cqw}
.ctoc .te small{font-size:1.65cqw}
/* the back page (Editor, Nov. 11, 2026): turquoise, the front page's closing text */
.page.backp{background:#00A693;color:#06302A}
.backp .bk-in{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4.4cqw;padding:9cqw 8cqw 4cqw}
.backp .bk-word{font-family:var(--display);font-weight:900;font-size:12cqw;line-height:.965;letter-spacing:-.03em;color:#fff}
.backp .bk-say{font-family:var(--display);font-weight:900;font-size:7.2cqw;line-height:1.02;border-top:2px solid #06302A;padding-top:4cqw}
.backp p{margin:0;font-size:3.4cqw;line-height:1.45;max-width:34em}
.backp .bk-btns{display:flex;flex-wrap:wrap;gap:2.4cqw}
.backp .bk-btns .pill{min-height:0;padding:2.2cqw 4.2cqw;font-size:2.9cqw}
.backp .bk-btns .w{background:#fff;border-color:#fff;color:#00463D;font-weight:900}
.backp .bk-btns .o{background:transparent;border:2px solid #06302A;color:#06302A}
.backp .bk-soc{display:flex;flex-wrap:wrap;gap:4cqw;border-top:1px solid #06302A;padding-top:3cqw;font-size:2.7cqw;font-weight:700}
.backp .bk-soc a{color:#06302A;text-decoration:none}
.backp .folio,.backp .folio b{border-color:#06302A;color:#06302A}
.book.two .page:last-child::before{content:"";position:absolute;inset:0 auto 0 0;width:26px;background:linear-gradient(to right,var(--shade),transparent);pointer-events:none;z-index:3}
.turn-next{animation:inR .42s cubic-bezier(.2,.7,.2,1)}
.turn-prev{animation:inL .42s cubic-bezier(.2,.7,.2,1)}
@keyframes inR{from{opacity:.3;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.3;transform:translateX(-26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.turn-next,.turn-prev{animation:none}}
.folio{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);padding:9px 0 12px;border-top:1px solid var(--rule);margin:auto 7.5cqw 0;flex:none}
.folio b{color:var(--teal-ink);font-weight:700;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:16px;padding:6px 24px 14px}
.pager{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:14px}
.tools{display:flex;align-items:center;gap:6px}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
body:not(.dopen) .tbtn{background:var(--teal);border-color:var(--teal);color:#fff}
.arrow.txt{position:relative;font-weight:900;line-height:1}
.arrow.txt span{font-size:13px}.arrow.txt.big span{font-size:19px}
.arrow.txt i{position:absolute;right:5px;top:4px;font-style:normal;font-size:11px;font-weight:900;color:var(--teal-ink)}
.tools .sep{width:1px;height:24px;background:var(--rule);margin:0 6px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.arrow.sm{width:38px;height:38px}
.arrow:disabled{opacity:.35;cursor:default}
.arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.zl{min-width:52px;height:38px;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;cursor:pointer;border-radius:6px}
.zl:hover{background:var(--tint)}
.where{min-width:0;flex:0 1 420px;display:grid;gap:6px}
.where .lbl{font-size:12.5px;color:var(--ink2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:block;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
/* photo captions: a thin dark gradient over the photo's edge, the description in small white type and the credit in
   small capitals behind an orange square (the social cards' author mark); under the photo when it sits in the text */
.pcap{position:absolute;left:0;right:0;z-index:4;display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;padding:28px 16px 11px;
  font-size:11.5px;line-height:1.38;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none;text-align:left;font-weight:400;letter-spacing:0;text-transform:none}
.pcap.bottom{bottom:0;background:linear-gradient(180deg,rgba(4,14,12,0),rgba(4,14,12,.78) 62%)}
.pcap.top{top:0;padding:11px 16px 30px;background:linear-gradient(0deg,rgba(4,14,12,0),rgba(4,14,12,.72) 60%)}
.pcap .ct{flex:1 1 auto;min-width:0}
.pcap .cr{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:.84em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;white-space:nowrap}
.pcap .cr::before{content:"";width:7px;height:7px;background:var(--orange);flex:none}
.pcap.below{position:static;padding:8px 0 0;background:none;text-shadow:none;color:var(--ink2);font-size:.78em}
.pcap.below .cr{color:var(--ink)}
.page .pcap{font-size:max(10px,1.9cqw);padding-left:4cqw;padding-right:4cqw}
.page .pcap.top{padding-top:3cqw}
.op-a .pcap.top{padding-top:3.4cqw}
.op-b .ph .pcap{z-index:2}
.lead .im{display:block;overflow:hidden}
.lead .pcap{font-size:10.5px;padding:24px 12px 8px}
.lead.old .pcap{margin:0}
.hero .shot .pcap{text-align:left}
@media (max-width:899px){.hero .shot .pcap.bottom{display:none}.hero .shot .pcap.top{display:flex}}
@media (min-width:900px){.hero .shot .pcap.top{display:none}}
.ps .hero-im .pcap{font-size:11px}
/* house colours for the desks (Editor, Nov. 11, 2026): Iran turquoise #00A693, Iraq orange #FFA333, Peninsula light
   brown #C09B5C. Fills (headers, chips, edges) use them exactly; page numbers and links use a deeper tone of the same
   colour (--gt) so they stay readable on white; text on a fill uses --gon. The cover story moves to the cover's dark green. */
.g-iran,.ti.g-iran,.dg.g-iran,.tr-g.g-iran,.tg.g-iran,.minute .list a.g-iran,.minute .list a{--g:#00A693;--gt:#007D6E;--gon:#fff}
.g-iraq,.ti.g-iraq,.dg.g-iraq,.tr-g.g-iraq,.tg.g-iraq,.minute .list a.g-iraq{--g:#FFA333;--gt:#B8650A;--gon:#2A1A05}
.g-peninsula,.ti.g-peninsula,.dg.g-peninsula,.tr-g.g-peninsula,.tg.g-peninsula,.minute .list a.g-peninsula{--g:#C09B5C;--gt:#86662F;--gon:#2A1A05}
.minute .list a.g-old{--g:#64402E;--gt:#64402E}
.g-cover-story,.ti.g-cover-story,.dg.g-cover-story{--g:#06302A;--gt:#06302A;--gon:#FFE2BD}
.dg.g-cover-story span{background:#06302A;color:#FFE2BD}
.dg span{color:var(--gon,#fff)}
.ti .pg,.ti.cur .pg{color:var(--gt,var(--g))}
.minute .list a .bigp,.minute .list a b,.minute .list a i{color:var(--gt,var(--g))}
.mt-r .te .n,.mt-r .te.mm .n,.mt-r .te.old .n,.mt-r .te .go,.mt-r .te:hover b{color:var(--gt,var(--g))}
.tg[class*="g-"]{color:var(--gt,var(--g))}
.mt-r .tg[class*="g-"]{color:var(--gon,#fff)}
.mt-r .tr-g{background:color-mix(in srgb,var(--g) 10%,var(--paper))}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .g-iran,:root:not([data-theme="light"]) .tr-g.g-iran,:root:not([data-theme="light"]) .tg.g-iran,:root:not([data-theme="light"]) .minute .list a,:root:not([data-theme="light"]) .minute .list a.g-iran{--g:#00A693;--gt:#3FD3BF}
  :root:not([data-theme="light"]) .g-iraq,:root:not([data-theme="light"]) .tr-g.g-iraq,:root:not([data-theme="light"]) .tg.g-iraq,:root:not([data-theme="light"]) .minute .list a.g-iraq{--g:#FFA333;--gt:#FFB65C}
  :root:not([data-theme="light"]) .g-peninsula,:root:not([data-theme="light"]) .tr-g.g-peninsula,:root:not([data-theme="light"]) .tg.g-peninsula,:root:not([data-theme="light"]) .minute .list a.g-peninsula{--g:#C09B5C;--gt:#D9B87E}

  :root:not([data-theme="light"]) .dg.g-cover-story span{background:#FFE2BD;color:#06302A}}

<script>
window.MAG = {"week":3,"from":"2026-11-14","to":"2026-11-20","pieces":[{"type":"Article","region":"Iraq","category":"Security","title":"Who decides what counts as resistance in Iraq's disarmament drive?","authors":["Mohammed Namis"],"date":"2026-11-16","url":"https://amwaj.media/en/article/who-decides-what-counts-as-resistance-in-iraqs-disarmament-drive","img":"img/01.jpg","iw":1400,"ih":932,"alt":"","bottomLine":["Prime Minister Ali Al-Zaidi has given armed factions until June 30, 2027, to bring their weapons under state control. Who decides which forces already count as official remains unclear, even as Washington has reportedly <a href=\"https://shafaq.com/en/Iraq/Sources-US-warns-Iraq-of-terrorism-designation-sanctions\" target=\"_blank\" rel=\"noopener\">threatened</a> to treat Baghdad as a state sponsor of terrorism if it misses the deadline.","Sabah Al-Numan, spokesman for the commander-in-chief, told Amwaj.media that any weapon outside the chain of command, bar licensed personal arms, is illegal, and that handing over arms while keeping separate leadership is not compliance. The spokesman cited no official definition.","A 2016 <a href=\"https://shafaq.com/en/Iraq/PMF-restructuring-law-advances-in-Iraqi-Parliament\" target=\"_blank\" rel=\"noopener\">statute</a> made the Popular Mobilization Units (PMU), established in 2014 to fight the Islamic State group (IS), part of the state. Harakat Hezbollah Al-Nujaba <a href=\"https://rudaw.net/english/categories/iraq/1080024\" target=\"_blank\" rel=\"noopener\">dismissed</a> parliamentary amendments to a new draft PMU law in November, while Kata’ib Hezbollah accused the prime minister’s office of tampering with the bill.","Constitutional law professor Wael Munther calls the “resistance” label “a political term, not a legal one,” which no authority can confer since Iraq is not occupied. Article 9 of the constitution <a href=\"https://www.constituteproject.org/constitution/Iraq_2005\" target=\"_blank\" rel=\"noopener\">outlaws</a> groups bearing arms outside the military.","Some factions now echo the government’s terms. Asa’ib Ahl Al-Haq said in June that it had begun to <a href=\"https://www.newarab.com/news/iraqs-asaib-ahl-al-haq-announces-step-separate-pmf\" target=\"_blank\" rel=\"noopener\">split</a> from the PMU. Laith Al-Khazali, brother of leader Qais Al-Khazali, became deputy prime minister on Oct. 15 and on Nov. 5 called confining weapons to the state “a constitutional principle beyond debate.”","The Kurdistan region’s Peshmerga stand apart constitutionally. Erbil is <a href=\"https://www.kurdistan24.net/en/story/940852\" target=\"_blank\" rel=\"noopener\">consolidating</a> units tied to rival Kurdish parties. The test is whether the rules apply to all and whether the state controls not only the weapons but also who commands the fighters and decides when to use force."],"pull":"","blocks":[{"t":"p","html":"Iraq's push to bring weapons under state control is running into a question no deadline is likely to settle. Prime Minister Ali Al-Zaidi has <a href=\"https://shafaq.com/en/Iraq/PM-Al-Zaidi-sets-June-2027-deadline-for-weapons-control\" target=\"_blank\" rel=\"noopener\">given</a> armed factions until June 30, 2027, to complete the process, yet it remains unclear who will decide which forces already belong to the state and which are operating outside the law."},{"t":"p","html":"Baghdad counts the Popular Mobilization Units (PMU) as part of the state, while Harakat Hezbollah Al-Nujaba and Kata'ib Hezbollah, two of the most powerful factions within the umbrella force, have rejected the government's conditions for disarmament."},{"t":"p","html":"Many such actors have justified keeping their arms outside ordinary state control as \"resistance\" to foreign occupation, a status with no formal standing in Iraqi law. The stakes have also risen in recent weeks. On Nov. 3, <a href=\"https://shafaq.com/en/Iraq/Sources-US-warns-Iraq-of-terrorism-designation-sanctions\" target=\"_blank\" rel=\"noopener\">reports</a> emerged that Washington had warned Iraq that it could be treated as a state sponsor of terrorism if it fails to meet the 2027 deadline. That leaves the government little time to settle a question its own officials have so far answered only loosely."},{"t":"h","text":"A weapon outside the state"},{"t":"p","html":"The Iraqi government's standing definition of illegal arms appears to be broad. Sabah Al-Numan, who speaks for Zaidi as commander-in-chief of the armed forces, told Amwaj.media that any weapon not under the prime minister's command and outside the official structure of the security and military services is \"a weapon outside the state.\" Light personal firearms held within the law are exempt, he added."},{"t":"p","html":"The test turns on command as much as on weapons. A group that hands over its arms while its organizational structures and leadership remain outside the official forces has not complied with the law, Numan argued. Genuine integration, in his account, means \"complete absorption\" into those forces and cutting organizational and political ties with any non-governmental body."},{"t":"p","html":"Numan distinguished the PMU, set up in 2014 to fight the Islamic State group (IS) and made an official body by a 2016 law that <a href=\"https://shafaq.com/en/Iraq/PMF-restructuring-law-advances-in-Iraqi-Parliament\" target=\"_blank\" rel=\"noopener\">placed</a> it under the commander-in-chief, from formations that \"possess no legal or constitutional status.\" PMU spokesman Muhannad Al-Aqabi declined to comment, telling Amwaj.media that the umbrella force had stopped issuing statements on the issue."},{"t":"graph","id":"28312414"},{"t":"p","html":"Numan's distinction may sit uneasily with his own test, and he did not say directly whether the deadline would reach a faction that is nominally part of the PMU but keeps a separate leadership. Nor did he settle the gap between the government, which presents the deadline as agreed with the factions, and the groups that have declared themselves not bound by any timetable. \"The more accurate account is the state's account,\" he said."},{"t":"p","html":"After the June 2027 deadline, Numan warned, armed activity outside the official forces will be dealt with under existing law, including the Anti-Terrorism Law, \"regardless of any banners or fictitious labels.\""},{"t":"p","html":"That warning brushed aside \"banners\" and \"labels,\" yet Numan's answer on who decides whether a faction is \"resistance\" or outside the law appeared to treat \"resistance\" as a status the state can confer. The commander-in-chief makes that call in conjunction with the security agencies, he said, while the courts formalize decisions when the law is broken. Numan pointed to no official document setting out these definitions."},{"t":"h","text":"A political term"},{"t":"p","html":"While many armed factions rest their case for keeping arms on \"resistance,\" Iraqi law makes no provision for it. Critics have long <a href=\"https://www.washingtoninstitute.org/policy-analysis/militias-iraqs-security-forces-historical-context-and-us-options\" target=\"_blank\" rel=\"noopener\">cited</a> Article 9 of the 2005 <a href=\"https://www.constituteproject.org/constitution/Iraq_2005\" target=\"_blank\" rel=\"noopener\">constitution</a>, which was drafted after the 2003 US-led invasion and bans armed groups outside the armed forces. Wael Munther, a professor of constitutional law at the University of Baghdad, reads the article as setting three tests. A force needs a legal framework for service and discipline, a budget and arsenal under state control, and a place in the chain of command under the constitution's Article 78, which makes the prime minister commander-in-chief."},{"t":"p","html":"Munther noted that the 2016 law made the PMU a military formation, but stressed that \"no faction operating within the PMU should have an independent command or political leadership outside the scope of the commander-in-chief's orders.\""},{"t":"p","html":"The professor told Amwaj.media that the Anti-Terrorism Law could apply to groups holding weapons outside the umbrella force that refuse to surrender them, while military law would cover a PMU unit that turned its arms on the security forces. Beyond Numan's general reference to the Anti-Terrorism Law, the government has not set out officially how either case would be handled."},{"t":"p","html":"Complicating matters is the frequent use of \"resistance\" in the Iraqi context to describe armed factions operating in a legal gray zone. \"Resistance\" is \"a political term, not a legal one,\" Munther noted, stating that no authority can confer it, since Iraq is not an occupied country. That reasoning leaves open which law would make armed resistance legal even under occupation."},{"t":"p","html":"Several of today's factions fought US forces in the years after the 2003 invasion, and Asa'ib Ahl Al-Haq alone <a href=\"https://www.wilsoncenter.org/article/profiles-irans-militia-allies-iraq\" target=\"_blank\" rel=\"noopener\">claimed</a> more than 6,000 attacks on US-led forces between 2006 and 2011."},{"t":"graph","id":"26949807"},{"t":"p","html":"Some factions frame \"resistance\" as a matter beyond the state's reach. On May 30, Kata'ib Hezbollah security official Abu Mujahid Al-Assaf <a href=\"https://www.kurdistan24.net/en/story/917089/kataeb-hezbollah-vows-to-continue-armed-resistance-as-iraq-pushes-state-control-over-weapons\" target=\"_blank\" rel=\"noopener\">declared</a> that \"jihadist action is today a collective duty.\" The term \"collective duty\" comes from Islamic jurisprudence and describes an obligation on the community as a whole that is met if some of its members carry it out. In the same statement, Assaf added that the group would take up the duty on behalf of factions that had \"abandoned\" the responsibility."},{"t":"h","text":"No one exempt"},{"t":"p","html":"The vocabulary of disarmament now runs both ways. Some armed factions have adopted the government's language on keeping weapons in the hands of the state, while official definitions appear to leave room for factions that sit inside the PMU. Asa'ib Ahl Al-Haq said in June that it had begun unilaterally <a href=\"https://www.newarab.com/news/iraqs-asaib-ahl-al-haq-announces-step-separate-pmf\" target=\"_blank\" rel=\"noopener\">separating</a> from the umbrella force, though neither the group nor the government has spelled out what that has actually involved."},{"t":"p","html":"Laith Al-Khazali, the brother of the faction's leader, became deputy prime minister on Oct. 15. On Nov. 5, Khazali <a href=\"https://iraq.shafaqna.com/AR/669621/\" target=\"_blank\" rel=\"noopener\">called</a> confining weapons to the state \"a constitutional principle beyond debate.\""},{"t":"p","html":"Hussein Al-Shihani, the spokesperson for Asa’ib Ahl Al-Haq’s political wing, the Sadiqoon bloc, told Amwaj.media that \"the decision of war and peace rests with the state and its constitutional institutions.\" Shihani separated resistance as a political stance from the use of weapons. No group, \"regardless of its sacrifices\" in that resistance, may decide alone to use weapons outside the state, he argued."},{"t":"p","html":"Shihani said his party wants the disarmament process to apply to everyone, with a timetable for each force and every weapon registered. The severing of political ties should extend to the PMU, the Counter-Terrorism Service and the Iraqi Kurdish Peshmerga force, he said, so that all follow the commander-in-chief and not \"partisan or regional orders.\""},{"t":"p","html":"Kata'ib Hezbollah has gone further, in August <a href=\"https://www.shafaq.com/en/Iraq/Kataib-Hezbollah-sets-conditions-on-Iraq-weapons-talks\" target=\"_blank\" rel=\"noopener\">listing</a> the Iraqi Kurdish force's dissolution among its conditions for disarmament talks, while Harakat Hezbollah Al-Nujaba <a href=\"https://shafaq.com/en/Report/Iraq-s-weapons-debate-ensnares-the-Peshmerga-and-exposes-a-constitutional-fault-line\" target=\"_blank\" rel=\"noopener\">asked</a> in June why the pressure to disarm was falling on the weapons of Shiite armed factions, not on the Kurdish Peshmerga."},{"t":"p","html":"The holdouts reject both the government's approach and the parliamentary amendments to a new draft PMU law. On Nov. 3, Kata'ib Hezbollah's Assaf <a href=\"https://en.964media.com/54682/\" target=\"_blank\" rel=\"noopener\">denied</a> that the faction would join the government and accused Zaidi's office of tampering with the bill. The following day, Harakat Hezbollah Al-Nujaba <a href=\"https://rudaw.net/english/categories/iraq/1080024\" target=\"_blank\" rel=\"noopener\">rejected</a> those amendments \"in their entirety.\""},{"t":"graph","id":"27028745"},{"t":"h","text":"The Peshmerga question"},{"t":"p","html":"Iraqi Kurdish figures have roundly rejected bringing the Peshmerga into the disarmament debate, mainly on constitutional grounds. Farhad Atrushi, deputy speaker of the federal parliament, <a href=\"https://www.kurdistan24.net/en/story/936228\" target=\"_blank\" rel=\"noopener\">insisted</a> in late August that the force \"existed before the ratification of the Iraqi constitution in 2005\" and operates under Article 121, which allows regional governments to establish their own internal security forces, including what it calls the \"guards of the region.\""},{"t":"p","html":"In his comments to Amwaj.media, Munther noted that Article 121 has given the Peshmerga a status only a constitutional amendment could remove. For Erbil, the issue is unifying forces that answer to two parties, a process already under way, rather than handing over weapons."},{"t":"p","html":"On Sept. 21, the Kurdistan Regional Government's (KRG) Ministry of Peshmerga Affairs <a href=\"https://www.kurdistan24.net/en/story/940852\" target=\"_blank\" rel=\"noopener\">completed</a> a reorganization of its forces into 11 divisions, a step toward merging units long <a href=\"https://en.964media.com/52875/\" target=\"_blank\" rel=\"noopener\">tied</a> to the Kurdistan Democratic Party (KDP) and the Patriotic Union of Kurdistan (PUK)."},{"t":"graph","id":"11435461"},{"t":"p","html":"Munther told Amwaj.media that he expects any new law to regulate the surrender of weapons already banned under existing legislation. A challenge to such a law before the Federal Supreme Court could backfire on those bringing it, he warned. The top court would then examine Article 9, and the case could turn to the legality of all armed groups acting outside the state’s command and control structure. Zaidi <a href=\"https://www.kurdistan24.net/en/story/931894\" target=\"_blank\" rel=\"noopener\">ordered</a> a draft law on state control of weapons in August, but no text has so far appeared."},{"t":"p","html":"One deadline has already slipped. Zaidi had set the end of September for factions to <a href=\"https://amwaj.media/en/article/iraqi-factions-cosmetic-disarmament-masks-deep-institutional-limbo\" target=\"_blank\" rel=\"noopener\">integrate</a> before pushing it back to June 2027 later that month. The test is whether the rules apply to all, and whether state institutions end up controlling not only the weapons but also the command of the fighters who carry them and the decision to use force."}],"words":1508},{"type":"Article","region":"Peninsula","category":"Religion","title":"Old News: ‘Mahdi’ emerges as gunmen seize Mecca’s Grand Mosque","authors":["Amwaj.media Staff"],"date":"2026-11-20","url":"https://amwaj.media/en/article/old-news-mahdi-emerges-as-gunmen-seize-meccas-grand-mosque","img":"img/02.jpg","iw":1400,"ih":859,"alt":"Smoke rises from the Grand Mosque in Mecca, Saudi Arabia, after gunmen seized the site on Nov. 20, 1979. (Photo via Getty Images)","bottomLine":["Several hundred armed men <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">seized</a> the Grand Mosque in Mecca during dawn prayers on Nov. 20, 1979. They <a href=\"https://www.bbc.co.uk/news/stories-50852379\" target=\"_blank\" rel=\"noopener\">proclaimed</a> one of their members the Mahdi, a messianic figure, and have taken thousands of worshippers hostage. The gunmen have <a href=\"https://www.britannica.com/event/seizure-of-the-Great-Mosque-of-Mecca\" target=\"_blank\" rel=\"noopener\">deplored</a> the House of Saud's secularization of the Kingdom and pursuit of closer ties with the west.","A <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">shootout</a> between Saudi National Guard forces and the attackers has failed to end the occupation, and the death toll remains unconfirmed amid a communications <a href=\"https://www.nytimes.com/1979/11/22/archives/iranian-pilgrim-tells-of-mecca-attack-troops-arrive-and-clear.html?searchResultPosition=7\" target=\"_blank\" rel=\"noopener\">blackout</a> around Mecca.","Media outlets and governments are issuing competing accounts attributing the Mecca operation to Iranian, Saudi or US-backed groups. Saudi Arabia’s defense ministry has <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">confirmed</a> “a group of renegades to the Islamic religion” is behind the attack, with a US embassy cable <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">naming</a> the purported leader as a member of the Utayba tribe.","Iranian revolutionary leader Ayatollah Ruhollah Khomeini has <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v19/d375\" target=\"_blank\" rel=\"noopener\">suggested</a> that the United States and “Zionism” may be behind the attack. This has stoked widespread anger at the United States across the Muslim world—on Nov. 21, mobs <a href=\"https://www.nytimes.com/1979/11/22/archives/troops-rescue-100-in-islamabad-us-offices-are-burned-in-2-cities.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">stormed</a> and burned the US embassy in Islamabad.","Religious rules <a href=\"https://www.brookings.edu/events/terrorism-in-saudi-arabia-past-and-present/\" target=\"_blank\" rel=\"noopener\">forbid</a> bloodshed in Mecca, which complicates any military response. Saudi officials are reportedly <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">consulting</a> conservative religious scholars to issue a fatwa to allow for a new attempt to take back the Grand Mosque.","A a seizure of Islam’s holiest site poses a serious challenge for King Khalid bin Abdulaziz Al Saud. The House of Saud must decide whether to press on with modernization or embrace more conservative positions to <a href=\"https://www.brookings.edu/events/terrorism-in-saudi-arabia-past-and-present/\" target=\"_blank\" rel=\"noopener\">appease</a> the Kingdom’s traditionalist current."],"pull":"","blocks":[{"t":"p","html":"<strong><em>Old News is a new initiative by Amwaj.media to connect the past to the present. Through “reporting” on pivotal moments in history, we aim to provide a richer backdrop for current dynamics in the region.</em></strong>"},{"t":"p","html":"<strong>The story:</strong> Several hundred gunmen have seized the Grand Mosque in Mecca, proclaiming one of its leaders as the Mahdi, a messianic figure. The occupation of Islam’s holiest site began during dawn prayers, with thousands of worshippers now held hostage. There are reports of fatalities as Saudi security forces clashed with the militants during the takeover."},{"t":"p","html":"The seizure has drawn condemnation across the globe, while competing claims blaming Iranian, Saudi or US groups are spreading across the region. The Saudi government is on high alert, but religious stipulations on the use of force in Mecca complicate any attempt to end the siege."},{"t":"p","html":"<strong>The coverage</strong>: Gunmen occupied Mecca’s Grand Mosque during dawn prayers on Nov. 20, 1979. <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">Estimates</a> put the number of assailants at between 200 and 500."},{"t":"ul","items":["The militants mingled with worshippers, having <a href=\"https://www.arabnews.com/node/1586736/saudi-arabia\" target=\"_blank\" rel=\"noopener\">smuggled</a> rifles, pistols and submachine guns into the mosque in coffins, which are commonly brought in for funeral prayers.","When the imam finished, the assailants took out their weapons, seized the microphone and locked the 26 gates of the holy site, <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">posting</a> two guards at each entry point.","A <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">telegram</a> from the US embassy in Saudi Arabia, citing a cabinet minister, says the gunmen had earlier also \"been able to bring in trucks loaded with arms and dates for food.\""]},{"t":"p","html":"It is unclear how many people were in the mosque as the siege unfolded. One Saudi minister <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">estimates</a> the number at 40,000–50,000. Not all are being held hostage, however, with those trapped in the thousands."},{"t":"ul","items":["According to a Reuters wire, family members of Saudi Oil Minister Sheikh Ahmed Zaki Yamani are <a href=\"https://eresources.nlb.gov.sg/newspapers/digitised/issue/newnation19791122-1\" target=\"_blank\" rel=\"noopener\">among</a> the hostages."]},{"t":"graph","id":"30987217"},{"t":"p","html":"Reading a <a href=\"https://www.bbc.co.uk/news/stories-50852379\" target=\"_blank\" rel=\"noopener\">statement</a> as the microphone was seized, a member of the assailants was proclaimed as the Mahdi, a messianic figure in Islam."},{"t":"ul","items":["In the same statement, the group <a href=\"https://www.britannica.com/event/seizure-of-the-Great-Mosque-of-Mecca\" target=\"_blank\" rel=\"noopener\">denounced</a> the ruling House of Saud as corrupt, accusing it of secularizing the Kingdom and pursuing closer ties with the west.","An Iranian pilgrim who witnessed the attack <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">recounts</a> that the proclaimed Mahdi was “fishy” and had been wandering the area for days, stopping to <a href=\"https://www.nytimes.com/1979/11/22/archives/iranian-pilgrim-tells-of-mecca-attack-troops-arrive-and-clear.html?searchResultPosition=7\" target=\"_blank\" rel=\"noopener\">speak</a> to people in the streets."]},{"t":"p","html":"A <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">shootout</a> between Saudi National Guards and the gunmen broke out almost as soon as the siege began, but the occupiers have not been dislodged from the mosque compound."},{"t":"ul","items":["The death toll is unconfirmed. Pilgrims, gunmen and security personnel are <a href=\"https://www.nytimes.com/1979/11/22/archives/iranian-pilgrim-tells-of-mecca-attack-troops-arrive-and-clear.html?searchResultPosition=7\" target=\"_blank\" rel=\"noopener\">reported</a> to have been killed—including by militants who have <a href=\"https://www.bbc.co.uk/news/stories-50852379\" target=\"_blank\" rel=\"noopener\">scaled</a> the Grand Mosque’s minarets.","Little else is known about events inside the holy compound, as Saudi officials have <a href=\"https://www.nytimes.com/1979/11/22/archives/iranian-pilgrim-tells-of-mecca-attack-troops-arrive-and-clear.html?searchResultPosition=7\" target=\"_blank\" rel=\"noopener\">imposed</a> a communications blackout and cut telephone and telex lines to the area."]},{"t":"p","html":"The New York Times <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">reports</a> confusion about the affiliations of the militants."},{"t":"ul","items":["Some in the region <a href=\"https://www.nytimes.com/1979/11/22/archives/attack-in-mecca-attributed-to-khomeini-influence-cairo-sheik-warns.html?searchResultPosition=5\" target=\"_blank\" rel=\"noopener\">speculate</a> that the siege is tied to the Islamic Revolution in Iran led by Ayatollah Ruhollah Khomeini earlier this year, which overthrew Shah Mohammad Reza Pahlavi. “It is the atmosphere of fanaticism created by Khomeini that made this possible,” a Lebanese journalist <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">told</a> the Times, alluding to Shiite millenarianism.","While some early reports claimed that the gunmen are followers of Khomeini or tied to the Shiite Muslim community, those allegations have been quickly <a href=\"https://www.nytimes.com/1979/11/22/archives/attack-in-mecca-attributed-to-khomeini-influence-cairo-sheik-warns.html?searchResultPosition=5\" target=\"_blank\" rel=\"noopener\">discounted</a>."]},{"t":"p","html":"The Saudi Ministry of Defense <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">blames</a> the attack on “a group of renegades to the Islamic religion,” without naming any organization or individual."},{"t":"ul","items":["Meanwhile, a <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">telegram</a> from the US embassy backs accounts that point to local involvement, saying that the mosque seizure is led by a young “Saudi religious fanatic.”"]},{"t":"p","html":"Meanwhile, Iran is pointing at Israel and the United States. The conflicting claims are feeding a web of competing claims across the region."},{"t":"ul","items":["Radio Tehran has <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v19/d375\" target=\"_blank\" rel=\"noopener\">broadcast</a> a statement by Ayatollah Khomeini saying that “it is not farfetched to assume that this act has been perpetrated by the criminal American imperialism.”","Khomeini also <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v19/d375\" target=\"_blank\" rel=\"noopener\">alluded</a> to a purported role for “Zionism,” alleging that “certain criminal hands are trying to split the Muslims and make Islamic revolutions look ugly.”"]},{"t":"graph","id":"30987218"},{"t":"p","html":"Rumors of alleged Israeli and US involvement have been further fueled by witness <a href=\"https://www.nytimes.com/1979/11/22/archives/iranian-pilgrim-tells-of-mecca-attack-troops-arrive-and-clear.html?searchResultPosition=7\" target=\"_blank\" rel=\"noopener\">accounts</a> of the gunmen carrying Israeli Uzi submachine guns."},{"t":"ul","items":["Amid the competing claims, mobs in Pakistan have <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v19/d378\" target=\"_blank\" rel=\"noopener\">stormed</a> and set fire to the US embassy in Islamabad, <a href=\"https://www.nytimes.com/1979/11/22/archives/troops-rescue-100-in-islamabad-us-offices-are-burned-in-2-cities.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">killing</a> at least one US Marine. American cultural centers in Lahore and Rawalpindi have also been torched."]},{"t":"p","html":"<strong>The context/analysis:</strong> The timing of the attack <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">carries</a> importance. Nov. 20 is the first day of the Islamic lunar year 1400."},{"t":"ul","items":["“Traditional beliefs” <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">hold</a> that the Mahdi, a renewer of the faith, will appear in Mecca on the initial day of a new century. In this context, the militants appear to have timed their operation to lend weight to their messianic claims.","Shiite Muslims <a href=\"https://www.britannica.com/topic/Ashura-Islamic-holy-day\" target=\"_blank\" rel=\"noopener\">mark</a> the 680 CE martyrdom of Prophet Muhammad’s grandson Hussein during the first month of the Islamic calendar. This initially led some observers to <a href=\"https://www.nytimes.com/1979/11/21/archives/mecca-mosque-seized-by-gunmen-believed-to-be-militants-from-iran.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">link</a> the siege to Shiites with ties to the newly founded Islamic Republic of Iran.","Coming amid the ongoing crisis between Tehran and Washington that began with the <a href=\"https://www.britannica.com/event/Iran-hostage-crisis\" target=\"_blank\" rel=\"noopener\">seizure</a> of the US embassy in Tehran by Iranian radical students earlier this month, the occupation of Mecca’s Grand Mosque has put a possible Iranian connection at the front of many minds."]},{"t":"p","html":"The US embassy in Saudi Arabia has <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">named</a> 26-year-old “Muhammad Abdallah” as the leader of the mosque takeover."},{"t":"ul","items":["Among the few available <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">details</a> on the purported ringleader is that he attended three years of sharia classes in Riyadh, leaving the institute before finishing his studies. He has previously clashed with the authorities and spent four months in prison over activities \"inimical to the government.”","Abdallah is notably <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">described</a> as a member of the Utayba, a prominent tribe with close associations to the Saudi military.","Of the 13 militants captured by security forces on Nov. 20, one is said to have been a Pakistani national. However, witness <a href=\"https://history.state.gov/historicaldocuments/frus1977-80v18/d201\" target=\"_blank\" rel=\"noopener\">accounts</a> say most gunmen are members of the Utayba tribe."]},{"t":"p","html":"Armed intervention to bring an end to the mosque occupation is made more complex by religious stipulations relating to Mecca."},{"t":"ul","items":["The Qur’an and hadiths both treat Islam’s holiest site as a sanctuary, where bloodshed and fighting have long been <a href=\"https://www.brookings.edu/events/terrorism-in-saudi-arabia-past-and-present/\" target=\"_blank\" rel=\"noopener\">forbidden</a>—even <a href=\"https://www.encyclopedia.com/places/asia/arabian-peninsula-political-geography/mecca\" target=\"_blank\" rel=\"noopener\">prior</a> to the advent of Islam in the seventh century CE.","These dynamics have left the Saudi government in a bind, as it must avoid violating the sanctity of Mecca’s Grand Mosque, including through further bloodshed."]},{"t":"p","html":"<strong>The future:</strong> Despite the religious obstacles, Saudi officials are reportedly set to begin <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">discussions</a> with Islamic scholars to find a way to allow a military operation."},{"t":"ul","items":["The complexities of what is unfolding has left many observers wondering whether Riyadh might respond to the unprecedented seizure of the Grand Mosque by doubling down on modernization, or by embracing more conservatism to appease traditionalist currents.","The <a href=\"https://www.brookings.edu/events/terrorism-in-saudi-arabia-past-and-present/\" target=\"_blank\" rel=\"noopener\">clerics</a> who hold the power to issue a religious edict allowing a violent storming of Islam’s holiest site are notably traditionalists. Saudi authorities may have to allow such clergymen more influence over society and the state once the dust from the siege settles."]},{"t":"p","html":"There are also reports that Saudi reinforcements have been <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">sent</a> to the area. Military hospitals in Jeddah and Riyadh have been <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">instructed</a> to prepare to receive the wounded."},{"t":"ul","items":["Defense Minister Prince Sultan bin Abdulaziz Al Saud and Interior Minister Prince Nayef bin Abdulaziz Al Saud are reportedly on their <a href=\"https://www.nytimes.com/1979/11/22/archives/gunmen-still-hold-mecca-mosque-identity-and-motives-are-unclear.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">way</a> to Mecca to <a href=\"https://www.foreignexchanges.news/p/today-in-middle-eastern-history-the-7ff\" target=\"_blank\" rel=\"noopener\">oversee</a> the response to the crisis."]},{"t":"graph","id":"30987215"},{"t":"p","html":"Unsubstantiated claims of Israeli and US backing for the mosque siege are fueling anger across the region."},{"t":"ul","items":["Ayatollah Khomeini’s allegations, combined with the information blackout imposed by Saudi authorities, is stoking unrest <a href=\"https://mei.edu/commentary/traces-1979-assault-grand-mosque-still-roil-middle-east-today/\" target=\"_blank\" rel=\"noopener\">reported</a> in parts of India, Libya and Pakistan.","Some fear that further American cultural and diplomatic facilities in the region may become the <a href=\"https://www.nytimes.com/1979/11/25/archives/mecca-attack-provokes-riots-in-southern-india.html?searchResultPosition=6\" target=\"_blank\" rel=\"noopener\">target</a> of mob <a href=\"https://www.nytimes.com/1979/11/22/archives/troops-rescue-100-in-islamabad-us-offices-are-burned-in-2-cities.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">violence</a> in the coming days."]},{"t":"p","html":"For now, the most credible account attributes the occupation of the Grand Mosque to a Saudi group. That would pose a serious challenge to the authority of King Khalid bin Abdulaziz Al Saud."},{"t":"ul","items":["The alleged siege leader is said to have ties to puritanical Salafist ideology, long associated with the House of Saud. Notably, the Saudi National Guard is <a href=\"https://worldview.ranenetwork.com/content/analysis/2015-05-08/saudi-arabia-a-new-national-guard-for-a-new-king\" target=\"_blank\" rel=\"noopener\">rooted</a> in the Ikhwan, the religious tribal force that helped <a href=\"https://amwaj.media/en/article/old-news-mecca-falls-to-forces-loyal-to-ibn-saud\" target=\"_blank\" rel=\"noopener\">unite</a> the Kingdom earlier this century.","In recent years, the Saudi monarchy has sought to distance itself from more hardline religious positions in favor of a more <a href=\"https://www.bbc.co.uk/news/stories-50852379\" target=\"_blank\" rel=\"noopener\">moderate</a> approach to statecraft and religion."]}],"words":492},{"type":"Media Monitor","region":"Iran","category":"Security","title":"Iran casts reports on ‘dual-use’ dams, ‘dirty bomb’ as pretext for renewed war","authors":["Amwaj.media Staff"],"date":"2026-11-19","url":"https://amwaj.media/en/media-monitor/iran-casts-reports-on-dual-use-dams-dirty-bomb-as-pretext-for-renewed-war","img":"img/03.jpg","iw":1400,"ih":933,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Iran has slammed reports in western media about its dams being close to “missile cities” and an alleged plot to use a radioactive weapon in Washington. Tehran says the claims are part of a coordinated campaign to prepare public opinion for renewed Israeli-US attacks. The response has also underscored Iran’s readiness for reciprocal strikes on critical infrastructure, including in neighboring Gulf Arab states."},{"t":"p","html":"<strong>The coverage:</strong> A New York Times report, published on Nov. 16, <a href=\"https://www.nytimes.com/2026/11/16/world/middleeast/iran-dams-missile-sites-environmentalists.html\" target=\"_blank\" rel=\"noopener\">suggested</a> that some Iranian dams and water projects may have been built partly to supply underground missile sites, citing their proximity to sites struck during the war."},{"t":"ul","items":["The piece noted that the link remained speculative and that many dams serve essential civilian needs."]},{"t":"p","html":"The same day, CNN <a href=\"https://edition.cnn.com/2026/11/16/politics/us-intelligence-iran-dirty-bomb\" target=\"_blank\" rel=\"noopener\">cited</a> US officials as saying that intelligence indicated Iran was planning to target senior members of the Donald Trump administration in Washington with a dirty bomb or chemical weapon."},{"t":"ul","items":["Unnamed sources said the plans gave Tehran options rather than signaling an imminent attack, while the White House said there were no credible threats to the homeland."]},{"t":"p","html":"On Nov. 17, Iranian Foreign Ministry spokesman Esmail Baqaei <a href=\"https://x.com/IRIMFA_SPOX/status/2122634425808601327\" target=\"_blank\" rel=\"noopener\">linked</a> the two reports, accusing Washington of seeking to manufacture a justification for further aggression."},{"t":"ul","items":["Baqaei described the allegations as a “malicious campaign” to legitimize attacks on Iranian infrastructure, citing Israeli-US <a href=\"https://www.aljazeera.com/news/2026/3/30/schools-water-industry-what-civilian-targets-have-us-israel-iran-hit\" target=\"_blank\" rel=\"noopener\">strikes</a> on water reservoirs and desalination facilities during the fighting between late February and April.","Foreign Minister Abbas Araghchi <a href=\"https://x.com/araghchi/status/2122719887659311376\" target=\"_blank\" rel=\"noopener\">dismissed</a> the allegations as “rubbish,” invoking “Iraq War-era <a href=\"https://www.youtube.com/watch?v=DhWlPo3qxak\" target=\"_blank\" rel=\"noopener\">propaganda</a>” and warning against what he described as “Israeli fingerprints” in the reporting, adding, “Nobody is buying it.”","Mohammad Baqer Qalibaf, the speaker of the parliament, <a href=\"https://x.com/mb_ghalibaf/status/2122713966334066728\" target=\"_blank\" rel=\"noopener\">described</a> the reports as “same false flags, same war mongering, new logos,” accusing CNN and the New York Times of taking part in a messaging operation. Qalibaf separately <a href=\"https://x.com/mb_ghalibaf/status/2122556761442058610\" target=\"_blank\" rel=\"noopener\">warned</a> that by the Times report’s logic, dams, ports and power plants near Israeli or US bases would be legitimate dual-use targets."]},{"t":"graph","id":"6899424"},{"t":"p","html":"Iranian newspapers have been equally scathing."},{"t":"ul","items":["Hardline daily Kayhan <a href=\"https://kayhan.ir/fa/news/342337/\" target=\"_blank\" rel=\"noopener\">portrayed</a> the New York Times article as groundwork for attacks on water infrastructure, warning of retaliation against the infrastructu
