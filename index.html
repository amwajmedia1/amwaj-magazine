<body>
<title>Amwaj Magazine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Amwaj Magazine, v5 (Nov. 11, 2026), in the design Claude Desktop mocked up for the Editor
   (https://claude.ai/artifact/5pf4iWjbGsCLQnSi2UVBzQ): a web-style issue front page (turquoise wordmark cover,
   "Number of the week", "The week in a minute", "In this wave" by region, a turquoise footer); each story opens as
   paginated spreads on a computer and scrolls as one page on a phone. The wordmark's first "a" in Magazine is the joined
   Arabic ta marbuta. Reused blocks from reader2.html (openers, text flow, graphics) are inserted by inline3.js. */
:root{
  --ground:#F4F7F6; --desk:#E4EAE9; --paper:#FFFFFF; --ink:#2F3333; --ink2:#5C6567; --rule:#D9E1DF;
  --teal:#00A693; --teal-ink:#007D6E; --teal-deep:#06302A; --orange:#FFA333; --sand:#C09B5C; --brown:#64402E; --burg:#9B4F4F;
  --shade:rgba(20,40,36,.16); --chip:#E2F3F0; --tint:#F4F7F6; --paper-old:#F6F0E3;
  --display:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Sombra",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1211; --desk:#0D1211; --paper:#182020; --ink:#E6ECEB; --ink2:#A4AFAD; --rule:#2B3533;
  --teal:#1DC0AB; --teal-ink:#4AD5C2; --shade:rgba(0,0,0,.5); --chip:#123A35; --tint:#1E2827; --paper-old:#2A251C; color-scheme:dark}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Medium.ttf) format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:"Sombra";src:url(fonts/Sombra-Black.ttf) format("truetype");font-weight:900;font-display:block}
body{background:var(--ground);color:var(--ink);font-family:var(--body)}
body.reading{background:var(--desk);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
/* ---------- openers ---------- */
.kick{display:flex;flex-wrap:wrap;gap:.6em 1.1em;font-size:2.3cqw;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.kick .r{color:var(--teal-ink)}.kick .y{opacity:.75}
.by{font-size:2.6cqw;margin-top:2.2cqw;opacity:.85}
.by b{font-weight:700}
/* A: the photo takes the page, the headline sits on it */
.op-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-a .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,13,.05) 35%,rgba(5,15,13,.9) 100%)}
.op-a .tx{position:absolute;left:7.5cqw;right:7.5cqw;bottom:7cqw;color:#fff;z-index:1}
.op-a .kick .r{color:#7FE3D4}
.op-a h1{font-family:var(--display);font-weight:900;font-size:7.6cqw;line-height:1.02;margin:2cqw 0 0;text-wrap:balance}
/* B: headline first, the photo below it */
.op-b .tx{padding:8cqw 7.5cqw 4cqw}
.op-b h1{font-family:var(--display);font-weight:900;font-size:8.4cqw;line-height:.98;letter-spacing:-.015em;margin:2.4cqw 0 0;text-wrap:balance}
.op-b .ph{flex:1;min-height:0;position:relative;margin:0 7.5cqw 7cqw}
.op-b .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-b .ph::before{content:"";position:absolute;left:-2.4cqw;top:-2.4cqw;width:22cqw;height:22cqw;background:var(--orange);z-index:0}
.op-b .ph img{z-index:1}
/* C: Media Monitor, a coloured band with the label, the photo as a strip */
.op-c .band{background:var(--brown);color:#fff;padding:7cqw 7.5cqw 6cqw}
.op-c .label{font-family:var(--display);font-weight:900;font-size:4.2cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.op-c h1{font-family:var(--display);font-weight:900;font-size:6.6cqw;line-height:1.04;margin:2.4cqw 0 0;text-wrap:balance}
.op-c .kick .r{color:#FFC98A}
.op-c .ph{position:relative;flex:1;min-height:0}
.op-c .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* D: a big typographic headline, the photo filling the rest of the page (Nov. 11, 2026) */
.op-d .tx{padding:8cqw 7.5cqw 0}
.op-d h1{font-family:var(--display);font-weight:900;font-size:9cqw;line-height:.95;letter-spacing:-.02em;margin:2.6cqw 0 0;text-wrap:balance}
.op-d .ph{flex:1;min-height:0;position:relative;margin:5cqw 7.5cqw 7cqw}
.op-d .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Old News: the photo aged, an archive-paper band; the whole opener on the same cream as its text pages
   (".page.op-o": the plain .page background came later in the CSS and turned it white; Editor, Nov. 11, 2026) */
.op-o,.page.op-o{background:#F6F0E3;color:#3A2A1C}
.op-o .ph{position:relative;height:56%}
.op-o .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.75) contrast(1.05) brightness(.95)}
.op-o .tx{padding:5cqw 7.5cqw 0}
.op-o .label{display:inline-block;border:1px solid #333333;border-radius:3px;background:#333333;color:#FFFFFF;font-weight:900;font-size:2.6cqw;letter-spacing:.16em;text-transform:uppercase;padding:.6cqw 1.6cqw}   /* Badge Guide: ANALYSIS row */
.op-o h1{font-family:var(--display);font-weight:900;font-size:7cqw;line-height:1.02;margin:2.4cqw 0 0;text-wrap:balance}
.op-o .kick .r{color:var(--brown)}

/* ---------- the text flow ---------- */
/* setting F of the type test (Editor, Nov. 11, 2026): two columns, 13 px on the 560 px page, line spacing 1.4,
   left-aligned, smaller margins. The phone reader (one column) keeps its own text size. */
/* the text stops clear of the folio rule: 1.2cqw (~7px on a 560px page) under the last line, ~10px to the rule
   (Editor, Nov. 12, 2026: 3-6px was too close to the bottom; then 2.6cqw, ~18px, "too big now") */
.fview{flex:1;min-height:0;overflow:hidden;margin:4.5cqw 5.5cqw 1.2cqw;position:relative}
.flow{height:100%;width:100%;column-gap:var(--gap,22px);column-fill:auto;line-height:1.56;hyphens:auto;-webkit-hyphens:auto}
/* (no will-change:transform here: it made the browser paint the text once at the page's own size and stretch that
   image when the page is scaled up on a big screen, so text and graphics looked blurred; Editor, Nov. 11, 2026) */
.flow.c1{column-count:1}.flow.c2{column-count:2;font-size:.8125em;line-height:1.4}
.flow.c2 p{margin-bottom:.6em}
/* a band across the top of a two-column page: the Bottom Line (one column, set apart) or a graph */
.band{position:absolute;left:0;right:0;top:0;z-index:1;font-size:.8125em;line-height:1.45;background:var(--paper)}
.band .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
.band .fig{margin:0}
.band .gx{font-size:1.02em}
/* width 100% + height auto: an image not yet loaded still takes its height from its width/height attributes, so the
   band measures the same before and after loading (width:auto made it 0 high until the image arrived) */
.band .gx-svg,.band .gx-img{max-height:calc(var(--ph) * .42);width:100%;height:auto;object-fit:contain;margin:0 auto}
.band .fig.photo img{max-height:calc(var(--ph) * .42);width:100%;object-fit:cover}
.bsp{display:block;break-inside:avoid}
/* HARD RULE (Editor, Nov. 11, 2026): photos never crop people's heads. Every cropped photo keeps its upper part in view
   (no focal points are stored for these photos yet) */
.page img,.opb-ph img,.cv-ph img,.hero img,.card img,.ph-story img,.tcover img,.ti img,.lead img{object-position:50% 22%}
.gx-img,.gx-map img,.gx-card img{object-position:50% 50%}
/* the phone reader (one column): smaller lines, timelines and graphs compact, so a graph never fills a page */
.flow.c1 p{orphans:2;widows:2}
.flow.c1 .tl,.flow.c1 .gx{font-size:.86em}
.flow.c1 .ax-te{padding:.2em 0 .35em;line-height:1.34}
/* timeline: the dot and the rail sit in the middle of a fixed 30px gap, so they never touch the date or the entry
   (HARD RULE, Editor, Nov. 12, 2026: text and timeline graphic overlapped on phones) */
.ax-tl .ax-te{grid-template-columns:var(--tld,6.6em) 1fr;gap:0 30px}
.ax-tl .ax-te::before{left:calc(var(--tld,6.6em) + 14px)}
.ax-tl .ax-te::after{left:calc(var(--tld,6.6em) + 9px)}
.ax-tl .ax-te.last .ax-tx{margin-left:0}
/* HARD RULE (Editor, Nov. 12, 2026): timelines are left-aligned with their header and standfirst, never right-aligned:
   dates start at the left edge; the date column is as wide as the longest date (--tlw, set by graphs-render.js) */
.ax-tl .ax-te{--tld:var(--tlw,6.6em)}
.ax-tl .ax-td{text-align:left}
.flow.c1 .ax-tl .ax-te{--tld:min(var(--tlw,5em),5em)}
.flow.c1 .fig{margin:.5em 0 .9em}
/* phone sliders: four small cards a row, so a slider shares its page with text (Editor, Nov. 11, 2026: "the graph
   (slider) also looks terrible") */
.flow.c1 .gx.kind-cards{font-size:.74em}
.flow.c1 .gx-cards{gap:.7em .4em}
.flow.c1 .gx-cards:not(.wide) .gx-card{flex:0 0 calc(25% - .3em)}
.flow.c1 .gx-cards.one-row .gx-card{flex:1 1 0}
/* graphics adapt to every screen size (Editor, Nov. 12, 2026): on short phones the cards get smaller, so a big grid
   still shares its page with text */
@media (max-height:760px){
  .flow.c1 .gx-card img{width:2.7em;height:2.7em}
  .flow.c1 .gx-cards{gap:.45em .4em}
  .flow.c1 .gx.kind-cards{font-size:.7em}
}
.flow.c1 .gx-cards.per:not(.wide) .gx-card{flex:0 0 calc((100% - (var(--per) - 1) * .4em) / var(--per))}
.flow.c1 .gx-card img{width:3.4em;height:3.4em}
.flow.c1 .gx-card b{font-size:.92em;line-height:1.15}
.flow.c1 .gx-card .sub,.flow.c1 .gx-card .txt{font-size:.82em;line-height:1.2}
/* maps: framed by two orange corner strokes, top left and bottom right (Editor, Nov. 11, 2026; replaces a full-width
   stroke on top) */
.gx-map{position:relative;padding:.7em;background:#fff;box-sizing:border-box}
/* in a band the frame is as wide as the map at its allowed height, so the corners sit on the map's own corners */
.band{--mapmax:calc(var(--ph) * .42)}
html.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
html.dens-2 .band{--mapmax:calc(var(--ph) * .31)}
html.dens-3 .band{--mapmax:calc(var(--ph) * .28)}
.band .gx-map{width:min(100%, calc(var(--mapmax) * var(--ar) + 1.4em));margin:0 auto}
.band .gx-map .gx-img{max-height:none;width:100%;height:auto}
.gx-map::before,.gx-map::after{content:"";position:absolute;width:3.2em;height:3.2em;border:0 solid #FFA333;pointer-events:none}
.gx-map::before{top:0;left:0;border-top-width:5px;border-left-width:5px}
.gx-map::after{bottom:0;right:0;border-bottom-width:5px;border-right-width:5px}
/* the opener on a computer (Nov. 11, 2026): photo edge to edge with the headline over it, across the top of the first
   text page; the Bottom Line under it when it fits */
.band.opband{left:0;right:0;top:0;z-index:2;font-size:inherit;line-height:normal;background:transparent}
.page.oldnews .band.opband{background:transparent}
/* every Old News page is cream, bands included (HARD RULE, Nov. 11) */
.page.oldnews .band{background:var(--paper-old,#F6F0E3)}
/* the Old News note sits above the Bottom Line (HARD RULE, Editor, Nov. 12, 2026) */
.onintro{margin:0 0 .9em}
.band .onintro{padding:0 .1em}
/* the photo is at least this tall and grows with the headline, so the kicker and headline are never cut off */
.opb-ph{position:relative;min-height:min(calc(var(--ph) * .4), calc(var(--pw) * .7));overflow:hidden;background:#06302A;display:flex;flex-direction:column;justify-content:flex-end}
.opb-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opb.old .opb-ph img{filter:sepia(.75) contrast(1.05) brightness(.95)}
.opb-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,12,.15) 0%,rgba(4,14,12,.35) 35%,rgba(4,14,12,.88))}
.opb-tx{position:relative;padding:5cqw 5.5cqw 4cqw;color:#fff}
.opb-tx .kick{color:#fff}
.opb-tx .kick .r{color:#FFE2BD}
.opb-tx h1{font-family:var(--display);font-weight:900;font-size:6.2cqw;line-height:1.02;margin:1.6cqw 0 0;text-wrap:balance}
/* badges per the Badge Guide (Editor, Nov. 11, 2026): MEDIA MONITOR = DEVELOPING row, OLD NEWS = ANALYSIS row */
.opb.mm .opb-tx .kick .y{background:#FBF3E4;border:1px solid #C09B5C;color:#64402E;border-radius:3px;padding:.3cqw 1.2cqw}
.opb.old .opb-tx .kick .y{background:#333333;border:1px solid #333333;color:#FFFFFF;border-radius:3px;padding:.3cqw 1.2cqw}
.opb-tx .by{font-size:2.3cqw;margin-top:1.6cqw;opacity:.9}
.opb-cap{font-size:1.9cqw;line-height:1.35;color:var(--ink2);padding:1.4cqw 5.5cqw 0}
/* HARD RULE (Editor, Nov. 12, 2026): text never covers a photo. On a phone the photo stands on its own at its own shape
   and the label, headline and byline go BELOW it (photo, caption, then the headline) */
@media (max-width:899px){
  .opb{display:flex;flex-direction:column}
  .opb-ph{display:contents}
  /* a fixed height (about a 3:2 photo's own shape), so the layout measures the same before the photo has loaded */
  .opb-ph img{position:static;order:1;display:block;width:100%;height:min(calc(var(--pw) * .66), calc(var(--ph) * .36));object-fit:cover}
  .opb-veil{display:none}
  .opb-cap{order:2}
  .opb-tx{order:3;color:var(--ink);padding:2.6cqw 5.5cqw 0}
  .opb-tx .kick{color:var(--ink2)}
  .opb-tx .kick .r{color:var(--teal-ink)}
  .opb-tx .by{opacity:1;color:var(--ink2)}
}
.page.oldnews .opb-cap{color:#7a6650}
.opb-bl{padding:3cqw 5.5cqw 0;font-size:.8125em;line-height:1.45}
.opb-bl .blbox{margin:0;font-size:1.06em;padding:1em 1.3em .5em}
/* HARD RULE (Editor, Nov. 11, 2026): max 40 pages. When an issue is longer, the reader lays it out again one step
   tighter at a time (class dens-1..3 on <html>, set by paginateAll) until it fits */
html.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
html.dens-1 .band .gx-svg,html.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
/* one story at a time (Nov. 12, 2026, no page limit any more): when a story would end on an almost empty page, its
   photo and graph bands get a little smaller (never the text) and it is laid out again; kept only if it saves the page */
.page.dens-1 .band{--mapmax:calc(var(--ph) * .35)}
.page.dens-1 .opb-ph{min-height:calc(var(--ph) * .32)}
.page.dens-1 .band .gx-svg,.page.dens-1 .band .gx-img{max-height:calc(var(--ph) * .35)}
.page.dens-2 .band{--mapmax:calc(var(--ph) * .29)}
.page.dens-2 .opb-ph{min-height:calc(var(--ph) * .27)}
.page.dens-2 .band .gx-svg,.page.dens-2 .band .gx-img{max-height:calc(var(--ph) * .29)}
html.dens-2 .opb-ph{min-height:calc(var(--ph) * .28)}
html.dens-2 .band .gx-svg,html.dens-2 .band .gx-img{max-height:calc(var(--ph) * .31)}
html.dens-2 .flow.c2,html.dens-2 .band:not(.opband),html.dens-2 .opb-bl{font-size:.78em}
html.dens-3 .opb-ph{min-height:calc(var(--ph) * .25)}
html.dens-3 .band .gx-svg,html.dens-3 .band .gx-img{max-height:calc(var(--ph) * .28)}
html.dens-3 .flow.c2,html.dens-3 .band:not(.opband),html.dens-3 .opb-bl{font-size:.75em}
html.dens-3 .flow.c2{line-height:1.36}
.flow p{text-wrap:pretty}
.flow p{margin:0 0 .85em;orphans:3;widows:3}
.flow p.first::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.6em;line-height:.82;margin:.06em .1em 0 0;color:var(--teal)}
.flow h3{font-family:var(--display);font-weight:900;font-size:1.28em;line-height:1.15;margin:1.1em 0 .45em;break-after:avoid;text-wrap:balance;color:var(--teal-ink)}
.flow ul{margin:0 0 .9em;padding-left:1.1em}
.flow li{margin:0 0 .55em}
.flow li::marker{color:var(--orange)}
.flow a{color:var(--teal-ink);text-decoration-thickness:1px;text-underline-offset:2px}
.flow strong{font-weight:700}
.blbox{background:var(--chip);padding:1em 1.1em .4em;margin:0 0 1.2em;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blbox h4{margin:0 0 .6em;font-size:.78em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.blbox ul{padding-left:1.05em;margin:0}
.blbox li{line-height:1.45}
.fig{margin:.4em 0 1.1em;break-inside:avoid}
.fig img{display:block;width:100%;height:auto;max-height:var(--figmax,60vh);object-fit:contain;background:#fff}
.fig figcaption{font-size:.76em;line-height:1.35;color:var(--ink2);margin-top:.5em;padding-left:.7em;border-left:3px solid var(--orange)}
.fig.photo img{object-fit:cover;max-height:var(--figmax,60vh)}
.pull{break-inside:avoid;margin:.5em 0 1.1em;padding:.6em 0 .7em;border-top:3px solid var(--orange);border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:900;font-size:1.42em;line-height:1.16;color:var(--ink);text-wrap:balance}
.pull::before{content:"“";color:var(--orange);margin-right:.05em}
.pull::after{content:"”";color:var(--orange)}
.endmark{margin-top:1em;font-weight:700;font-size:.92em}
.endmark::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--teal);margin-right:.5em;vertical-align:.05em}
.folio .contd{margin-left:auto;margin-right:1.4em;text-transform:none;letter-spacing:.02em;font-weight:700;color:var(--ink2)}
.oldnews .flow{background:transparent}
.page.oldnews{background:#F6F0E3;color:#3A2A1C}
.page.oldnews .folio{border-color:#D9CCB3;color:#7a6650}

/* ---------- graphics drawn from the Flourish data ---------- */
.gx{font-size:.8em;line-height:1.3;color:var(--ink)}
.gx-h{margin-bottom:.6em;border-top:3px solid var(--teal);padding-top:.5em}
.gx-t{font-family:var(--display);font-weight:900;font-size:1.15em;line-height:1.15;text-wrap:balance}
.gx-s{color:var(--ink2);margin-top:.15em}
.gx-src{color:var(--ink2);font-size:.82em;margin-top:.5em}
.gx-svg{display:block;width:100%;height:auto;overflow:visible}
.gx-svg .ax{font-size:15px;fill:var(--ink2);font-family:var(--body)}
.gx-svg .lab{font-size:16px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .val{font-size:15px;fill:var(--ink);font-family:var(--body);font-weight:700}
.gx-svg .grid{stroke:var(--rule);stroke-width:1}
.gx-svg .base{stroke:var(--ink2);stroke-width:1}
.gx-leg{display:flex;flex-wrap:wrap;gap:.3em 1em;margin-bottom:.4em;font-size:.92em}
.gx-leg span{display:inline-flex;align-items:center;gap:.4em}
.gx-leg i{width:.8em;height:.8em;display:inline-block}
.gx-axt{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--ink2);margin-bottom:.2em}
.gx-facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:1em}

<script>
window.MAG = {"week":2,"from":"2026-11-07","to":"2026-11-13","pieces":[{"type":"Article","region":"Iraq","category":"Politics","title":"Deep Dive: Why Khazali’s road to Washington runs through Tehran","authors":["Arran Robert Walshe"],"date":"2026-11-13","url":"https://amwaj.media/en/article/deep-dive-why-khazalis-road-to-washington-runs-through-tehran","img":"img/01.jpg","iw":1400,"ih":933,"alt":"Asa'ib Ahl Al-Haq leader Qais Al-Khazali at a rally in Baghdad, Iraq on Oct. 7, 2021. (Photo via Getty Images)","bottomLine":["Asa'ib Ahl Al-Haq founder Qais Al-Khazali appears to want to lead Iraq's Shiite political establishment. Doing so would take a genuine partnership with Iran as well as room to build a working relationship with the US. This tall order is something few Iraqi leaders have managed to hold together.","Khazali’s distance from Tehran's ‘Unity of Fronts’ strategy has grown since 2023. At a meeting with Iran's then-supreme leader, Ayatollah Ali Khamenei (1989–2026), he is said to have unsuccessfully <a href=\"https://amwaj.media/en/article/inside-story-the-secret-arab-visitors-in-iran-and-the-liberation-of-jerusalem\" target=\"_blank\" rel=\"noopener\">pressed</a> for a reshuffle at the top of Iraq's Popular Mobilization Units (PMU). His group later stayed out of the attacks other Iraqi factions launched on US forces and Israel during the Gaza war.","Khazali's restraint may have started to pay off. Washington appears to have kept the faction, accused of <a href=\"https://www.army.mil/article/3890/iran_arming_training_directing_terror_groups_in_iraq_us_official_says\" target=\"_blank\" rel=\"noopener\">killing</a> US soldiers and blacklisted since 2020, out of the Iraqi cabinet in May. However, in October, Khazali's brother Laith became deputy prime minister with <a href=\"https://www.naharnet.com/stories/en/323153\" target=\"_blank\" rel=\"noopener\">reported</a> American acquiescence, after Baghdad lobbied for him, citing the group's commitment to disarm. Political insiders say Supreme Judicial Council President Faiq Zidan helped broker the arrangement.","Talk in Iraqi media of a 'Sharaa scenario' for the Khazalis overlooks the differences. Syrian President Ahmed Al-Sharaa already ran his country before securing buy-in from the Donald Trump administration, enjoyed Saudi and Turkish backing and had cut Syria’s ties with Tehran. Asa'ib Ahl Al-Haq has no major regional supporter except Iran, and appears to have no interest in a break with the Islamic Republic.","Iraq's new deputy premier is still a designated terrorist, which limits any cooperation with Washington. What Asa'ib Ahl Al-Haq has actually handed over amid the Iraqi government’s disarmament push, reportedly a key stipulation of its political recognition in Baghdad, remains unclear.","Iran may not object to an Iraqi Shiite leader who can act as a bridge to the White House, and a 'resistance' faction inside the government could become a template for others. For Khazali, the road to the statesman status Sharaa now enjoys runs through Washington via Tehran, while any renewed Iran-US war could test whether he can stay out of the crossfire."],"pull":"","blocks":[{"t":"p","html":"It is hard to pinpoint precisely when Qais Al-Khazali, the founder of Iraqi armed group Asa’ib Ahl Al-Haq, may have seen a real chance to lead the country’s Shiite political establishment. For any Iraqi actor to achieve that aim, they would need a genuine partnership with Iran, and through that process, the political space to forge a working relationship with the United States."},{"t":"p","html":"Khazali may have seen an opening in the summer of 2023, when he was <a href=\"https://amwaj.media/en/article/inside-story-the-secret-arab-visitors-in-iran-and-the-liberation-of-jerusalem\" target=\"_blank\" rel=\"noopener\">invited</a> to meet with Iran’s then-supreme leader, Ayatollah Ali Khamenei (1989–2026), in Tehran. The purpose of the meeting, which also gathered other Iraqi ‘resistance’ leaders, was to prepare a coordinated response to potential escalation with Israel and the US. Khazali is said to have instead been focused on getting his hosts to help reshuffle the leadership of Iraq’s Popular Mobilization Units (PMU). His maneuvering apparently did not sit well with Khamenei, nor Quds Force commander Esmail Qa’ani. A few months later, Asa’ib Ahl Al-Haq did not join Iraqi attacks on US forces and Israel amid the Gaza war—staying away from the ‘Unity of Fronts’ strategy that had been discussed in Tehran. That decision, observers say, helped precipitate the emergence of the “Islamic Resistance in Iraq,” where Khazali and his group have no presence. At the same time, Khazali has been careful about being seen as openly distancing himself from Iran. For its part, the Islamic Republic has also made an effort to place him in a position of prominence, at least during public events. For instance, during a visit to Tehran in Oct. 2024, he was <a href=\"https://www.washingtoninstitute.org/policy-analysis/qais-tehran-prominently-seated-behind-khamenei\" target=\"_blank\" rel=\"noopener\">placed</a> in the row behind Khamenei at Friday prayers—a rare occurrence for foreign leaders."},{"t":"p","html":"Those dynamics may have been an opportunity for opponents of Iranian influence in Iraq to invest in a young leader in a Shiite establishment dominated by aging veterans. Given that Asa’ib Ahl Al-Haq has been accused of <a href=\"https://www.army.mil/article/3890/iran_arming_training_directing_terror_groups_in_iraq_us_official_says\" target=\"_blank\" rel=\"noopener\">killing</a> US soldiers and been on the State Department's terrorist blacklist for the past six years, it would certainly have been a tough pill for Washington to swallow. And until a few months ago, the Donald Trump administration continued to refuse engagement, reportedly keeping the political wing of Khazali’s group out of the Iraqi government."},{"t":"p","html":"But in a reversal, Khazali's brother, Laith, was on Oct. 15 confirmed as deputy prime minister of Iraq with <a href=\"https://www.naharnet.com/stories/en/323153\" target=\"_blank\" rel=\"noopener\">reported</a> US acquiescence. The apparent turnaround has fed talk in Baghdad that the Trump administration might do for the Khazali brothers what it did for Syrian President Ahmed Al-Sharaa. Like the leader of Asa’ib Ahl Al-Haq, Sharaa also built his career in armed resistance, fighting in Iraq with Al-Qaeda before eventually leading forces that overthrew the Iran-backed Syrian government in Dec. 2024. He has since been warmly welcomed to the White House, largely due to his focus on ending Iranian influence in the Levant."},{"t":"p","html":"Khazali’s challenge to gain US recognition is different, particularly as he has no apparent interest in directly confronting Iran. Yet, forging a working relationship with Washington would likely require him to further distance himself from the Tehran-aligned ecosystem that has enabled his rise. Although it may appear counterintuitive, Iran may not oppose the rise of an Iraqi Shiite leader who can act as a bridge to the United States. More importantly, the presence of an actor such as Asa’ib Ahl Al-Haq within the Iraqi government could serve as a template for other ‘resistance’ factions to become, rather than having to confront, the Iraqi state."},{"t":"h","text":"Rival heirs"},{"t":"p","html":"Few Shiite armed factions in Iraq have since the 2003 US-led invasion traveled as far as Asa'ib Ahl Al-Haq."},{"t":"p","html":"The group’s founder <a href=\"https://mappingmilitants.org/profiles/asaib-ahl-al-haq\" target=\"_blank\" rel=\"noopener\">studied</a> in Najaf under Grand Ayatollah Muhammad Muhammad Sadiq Al-Sadr, whose assassination in 1999 was widely blamed on former Iraqi president Saddam Hussein (1979–2003). In 2006, Khazali founded Asa'ib Ahl Al-Haq as an <a href=\"https://amwaj.media/en/article/deep-dive-while-politically-excluded-asaib-ahl-al-haqs-game-plan-endures\" target=\"_blank\" rel=\"noopener\">offshoot</a> of the movement led by the ayatollah's son, Shiite cleric and politician Muqtada Al-Sadr. Some <a href=\"https://mappingmilitants.org/profiles/asaib-ahl-al-haq\" target=\"_blank\" rel=\"noopener\">analysts</a> say Iran's Islamic Revolutionary Guard Corps (IRGC) quickly recruited the breakaway faction, while others <a href=\"https://ctc.westpoint.edu/iranian-resources-shia-militant-cohesion-insights-khazali-papers/\" target=\"_blank\" rel=\"noopener\">note</a> that Khazali served as Sadr's channel to Iran following the invasion of Iraq."},{"t":"p","html":"Ali Mamouri, a research fellow at Deakin University who advised former Iraqi prime minister Mustafa Al-Kadhimi (2020-22), told Amwaj.media that Khazali has sought to establish himself as \"the authentic political representative\" of the Sadrist Movement. Mamouri explained that \"adopting the language of statesmanship serves that ambition, even when his decisions resemble Sadr's.\""},{"t":"p","html":"The Iraqi government’s campaign to monopolize control over arms, which Prime Minister Ali Al-Zaidi <a href=\"https://asharq.com/politics/198082/%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82-%D8%B3%D9%84%D8%A7%D8%AD-%D9%88%D8%A7%D8%AD%D8%AF-%D8%A8%D9%8A%D8%AF-%D8%A7%D9%84%D8%AF%D9%88%D9%84%D8%A9-%D9%88%D9%84%D8%A7-%D9%82%D8%B1%D8%A7%D8%B1-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A-%D8%AE%D8%A7%D8%B1%D8%AC-%D9%85%D8%A4%D8%B3%D8%B3%D8%A7%D8%AA%D9%87%D8%A7/\" target=\"_blank\" rel=\"noopener\">summed</a> up on Sept. 30 as \"one weapon in the hands of the state,\" has become the latest test of Khazali's dynamic with Sadr. On May 27, the latter <a href=\"https://amwaj.media/en/media-monitor/pledge-to-put-armed-sadrists-under-state-control-sharpens-iraqi-debate-on-securit\" target=\"_blank\" rel=\"noopener\">announced</a> the \"complete separation\" of Saraya Al-Salam, a Shiite armed group, from his movement and its transfer to state control. Less than a week later, on June 2, Asa'ib Ahl Al-Haq <a href=\"https://www.aljazeera.net/news/2026/6/2/%D8%B9%D8%B5%D8%A7%D8%A6%D8%A8-%D8%A3%D9%87%D9%84-%D8%A7%D9%84%D8%AD%D9%82-%D8%AA%D9%81%D9%83-%D8%A7%D9%84%D8%A7%D8%B1%D8%AA%D8%A8%D8%A7%D8%B7-%D8%A8%D9%80%D8%A7%D9%84%D8%AD%D8%B4%D8%AF\" target=\"_blank\" rel=\"noopener\">said</a> it would <a href=\"https://shafaq.com/en/Report/Asaib-Ahl-Al-Haq-joins-Iraq-s-cabinet-as-hardliners-reject-disarmament-deadline\" target=\"_blank\" rel=\"noopener\">leave</a> the PMU, a state-funded umbrella force that gathers mainly Shiite factions, and would join other elements of the Iraqi armed forces."},{"t":"p","html":"Asa'ib Ahl Al-Haq has also built a base at the ballot box. Its political wing, the Sadiqoon bloc, has <a href=\"https://shafaq.com/en/Report/Asa-ib-Ahl-al-Haq-and-al-Fatah-the-dynamics-and-strategy-of-Iran-s-allies-in-the-upcoming-elections\" target=\"_blank\" rel=\"noopener\">grown</a> from a single parliamentary seat in 2014 to 15 in 2018 and 27 in the Nov. 2025 <a href=\"https://www.thenationalnews.com/news/mena/2025/11/18/iran-aligned-parties-unite-to-form-largest-iraqi-parliamentary-bloc\" target=\"_blank\" rel=\"noopener\">elections</a>, its best result yet. These successes have made it the largest single party in the ruling Shiite Coordination Framework."},{"t":"p","html":"The Khazali-Sadr dynamic has now entered the government. In August, political sources told Baghdad-based +964 Media that Sadr had <a href=\"https://964media.com/707130/\" target=\"_blank\" rel=\"noopener\">objected</a> to Laith Al-Khazali's candidacy for the deputy premiership, suggesting that his competence was untested \"at this stage.\" Following the apparent end to US objections two months later, Laith eventually took the post all the same."},{"t":"h","text":"A reward for disarmament"},{"t":"p","html":"Asa'ib Ahl Al-Haq's first attempt to join the Iraqi cabinet appears to have run into opposition from the Trump administration. Days before the federal parliament was set to vote to confirm ministers in May, a senior US State Department official <a href=\"https://www.arabnews.pk/node/2642511\" target=\"_blank\" rel=\"noopener\">stated</a> that American support for the new Iraqi government would start when Baghdad <a href=\"https://www.arabnews.pk/node/2642511\" target=\"_blank\" rel=\"noopener\">expels</a> \"terrorist militias from any state institution.\""},{"t":"p","html":"When most of Zaidi's cabinet was confirmed, the Sadiqoon bloc did not get its anticipated quota of ministries. Rather than being filled by other parties, the positions were left vacant."},{"t":"p","html":"Asa’ib Ahl Al-Haq’s declaration of a break with the PMU in early June appears to have given power brokers in Baghdad something to sell in Washington. Victoria Taylor, director of the Atlantic Council's Iraq Initiative and a former senior US State Department official overseeing Iraq, told Amwaj.media that Iraqi officials and politicians \"lobbied the United States heavily\" to accept Laith Al-Khazali as deputy prime minister. Their case, she said, was \"that there had to be some sort of recognition for [Asa'ib Ahl Al-Haq's] steps toward disarmament.\""},{"t":"graph","id":"30904094"},{"t":"p","html":"Zaidi reportedly made that case to US Special Presidential Envoy to Iraq Thomas Barrack, arguing that factions giving up their arms must be <a href=\"https://alhurra.com/en/47664\" target=\"_blank\" rel=\"noopener\">rewarded</a> to draw others after them. American acquiescence reportedly came during Zaidi's visit to Washington in September, in return for pledges to press ahead with the disarmament of ‘resistance factions’ and guarantees that such actors will not attack US interests."},{"t":"p","html":"Mamouri sees the reported nod to Khazali from the Trump administration as \"the culmination of a longer process rather than a sudden change between May and October,\" but cautioned that it \"does not establish that there was a specific bargain.\" Lahib Higel, deputy program director for the Middle East and North Africa at the International Crisis Group, sees more action behind the scenes, telling Amwaj.media that \"months of indirect negotiations between the US and Sadiqoon through Iraqi intermediaries bore fruit for Qais Al-Khazali.\" Against this backdrop, political insiders indicated that beyond Zaidi, Supreme Judicial Council President Faiq Zidan played a key role in helping broker the arrangement, reflecting the rising role of the top judge."},{"t":"p","html":"What Asa’ib Ahl Al-Haq has actually surrendered under any quid pro quo remains unclear. Taylor noted that observers have suggested that the group \"has hedged by holding onto some of [its] weaponry.\" In August, an anonymous security source told Iraqi media that the weapons <a href=\"https://shafaq.com/ar/%D8%B3%DB%8C%D8%A7%D8%B3%D8%A9/%D9%85%D8%B3%D9%8A-%D8%B1%D8%A7%D8%AA-%D9%85%D8%AD%D9%84%D9%8A%D8%A9-%D9%88-%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D9%81%D8%A7%D8%B5%D9%8A%D9%84-%D8%AA%D8%B3%D9%84%D9%8A%D9%85-%D8%B3%D9%84%D8%A7%D8%AD-%D8%B9%D8%B5%D8%A7-%D8%A8-%D9%87%D9%84-%D8%A7%D9%84%D8%AD%D9%82-%D9%84%D9%84%D8%AF%D9%88%D9%84%D8%A9-%D8%AD%D8%B5%D8%B1%D9%8A\" target=\"_blank\" rel=\"noopener\">handed</a> over from two of Khazali’s three PMU brigades included fewer than ten drones, all without munitions, and no missiles. Higel called the weapons inventory in Baghdad’s possession \"far from complete.\""},{"t":"p","html":"The government committee overseeing the handover of weapons has a <a href=\"https://shafaq.com/en/Report/Asaib-Ahl-Al-Haq-joins-Iraq-s-cabinet-as-hardliners-reject-disarmament-deadline\" target=\"_blank\" rel=\"noopener\">benchmark</a> for missiles, specified at a range of at least 300 km (186.4 miles). Per the latest inventory in late October, no such projectile had been collected, though Zaidi’s disarmament deadline is not until June 30, 2027."},{"t":"h","text":"Tolerated, not engaged"},{"t":"p","html":"Whether any arrangement with Washington exists or not, Iraq now has a deputy prime minister who is a terrorist under American law."},{"t":"p","html":"In early 2020, following the American assassination of Iranian Quds Force commander Qasem Soleimani and PMU deputy chief Abu Mahdi Al-Muhandis in Baghdad, the US State Department <a href=\"https://www.govinfo.gov/content/pkg/FR-2020-01-10/pdf/2020-00244.pdf\" target=\"_blank\" rel=\"noopener\">listed</a> both of the Khazali brothers as “Specially Designated Global Terrorists.” In addition, Asa'ib Ahl Al-Haq was <a href=\"https://www.state.gov/foreign-terrorist-organizations\" target=\"_blank\" rel=\"noopener\">blacklisted</a> as a “Foreign Terrorist Organization.” As part of its pressure campaign against Iran and its regional alliance network, Washington as recently as May 2026 <a href=\"https://home.treasury.gov/news/press-releases/sb0492\" target=\"_blank\" rel=\"noopener\">accused</a> Laith of being involved in illicit oil smuggling."},{"t":"graph","id":"21630429"},{"t":"p","html":"\"The US legal prohibitions on providing material support to a terrorist entity will remain a limiting factor in cooperation,\" Taylor explained. Treasury Department <a href=\"https://ofac.treasury.gov/faqs/840\" target=\"_blank\" rel=\"noopener\">guidance</a> holds that sanctioning an official does not block the body he serves, but bars US persons from dealing with him. That status could complicate the role Laith says he will play as deputy prime minister. He has presented the position as a job focused on providing services, listing housing projects and a ring road for Baghdad as part of his <a href=\"https://almasalah.com/archives/144166\" target=\"_blank\" rel=\"noopener\">portfolio</a>, areas where American firms and international aid programs are likely to be involved."},{"t":"p","html":"\"While the United States has accepted Khazali as deputy PM as long as he remains sanctioned, the US government will not be able to work with him just as it could not work with the Ministry of Higher Education in the previous government,\" Taylor said. When the Sadiqoon bloc held the higher education ministry under former prime minister Muhammad Shia' Al-Sudani (2022-26), two sources told Axios in Nov. 2022 that Washington had <a href=\"https://shafaq.com/en/Report/The-U-S-tells-Iraq-it-won-t-work-with-some-Iraqi-officials-Asa-ib-Ahl-Al-Haq-responds\" target=\"_blank\" rel=\"noopener\">decided</a> not to work with the minister, Naim Al-Aboudi."},{"t":"p","html":"As the time of writing, no meeting between the Iraqi deputy premier and a US official has been reported."},{"t":"h","text":"The Sharaa template"},{"t":"p","html":"Iraqi commentators have pointed to the US shift towards Syria as proof that American red lines can move. On Oct. 18, one Iraqi outlet <a href=\"https://almadapaper.net/457204/\" target=\"_blank\" rel=\"noopener\">described</a> what it saw as Shiite armed factions' effective advance into Zaidi's government as a \"Sharaa scenario.\""},{"t":"p","html":"\"There are important differences, however,\" Taylor cautioned. \"Sharaa was already in charge of Syria and there were no other clear alternative leaders. Sharaa also benefited from the strong support from Turkiye and Saudi Arabia.\" In contrast, Iran has historically been Asa'ib Ahl Al-Haq's main patron, and the group has no regional backer aligned with Washington. Above all, the new Sunni-dominated administration in Damascus immediately cut ties with Tehran—a key US objective."},{"t":"p","html":"Asa'ib Ahl Al-Haq has made no such break with the Islamic Republic, and its record against US forces runs deep. Back in 2007, American military officials <a href=\"https://www.army.mil/article/3890/iran_arming_training_directing_terror_groups_in_iraq_us_official_says\" target=\"_blank\" rel=\"noopener\">said</a> Qais Al-Khazali had authorized a raid in Karbala in which five US soldiers were killed, a role he <a href=\"https://www.kurdistan24.net/ar/story/844612\" target=\"_blank\" rel=\"noopener\">described</a> in a May 2025 interview as an “honorable” mission."},{"t":"p","html":"\"Even as [Asa'ib Ahl Al-Haq] takes steps to disarm, it remains part of the Iranian financial network,\" Taylor argued, adding that steps toward exiting the American terrorist blacklist \"would be politically controversial in the United States, particularly at a moment when the US remains locked in conflict with Iran.\""},{"t":"p","html":"A flaring-up of the Iran-US confrontation may put Khazali to the greatest test of his career. Iraqi media <a href=\"https://almadapaper.net/460204/\" target=\"_blank\" rel=\"noopener\">reported</a> in November that President Trump has warned Zaidi that any Iraqi faction entering a renewed clash with Iran will be targeted. \"In case of full-scale war, the resistance groups are not likely to remain on the sidelines,\" Higel cautioned. \"Even groups that have agreed to integrate may join the fray.\""},{"t":"h","text":"Inside the tent"},{"t":"p","html":"Iraq's recent history suggests that the bigger question is what Baghdad may ask of armed factions in exchange for brokering political recognition from the United States. \"Successive Iraqi governments have accommodated the militias by allowing them to enter the state in official positions and to participate in parliament without requiring any commitment from these groups to the Iraqi state,\" Taylor said."},{"t":"p","html":"For Higel, Laith Al-Khazali’s securing of the deputy prime minister position follows a pattern of \"continuity\" rather than \"change of the system.\" She pointed to the Badr Organization, led by Hadi Al-Ameri, whose rank and file and commanders \"became an integral part of the interior ministry\" in the mid-2000s."},{"t":"p","html":"Laith's appointment could break that record only if it is tied to steps that can be checked, from a verified inventory of Asa’ib Ahl Al-Haq’s weapons to the handover of strategic capabilities such as any missile stockpile it holds. \"A senior appointment alone is insufficient,\" Mamouri told Amwaj.media. \"The test is whether political inclusion produces an actual transfer of weapons, command and decision making to state institutions.\""},{"t":"p","html":"The deputy prime minister’s own words offer a starting point. In May, he <a href=\"https://amwaj.media/en/media-monitor/most-of-iraqs-new-cabinet-approved-in-stormy-parliamentary-session\" target=\"_blank\" rel=\"noopener\">said</a> that any move to restrict weapons must come from the ruling political alliance and the supreme Shiite religious authority in Najaf. After the Coordination Framework <a href=\"https://shafaq.com/en/Report/Asaib-Ahl-Al-Haq-joins-Iraq-s-cabinet-as-hardliners-reject-disarmament-deadline\" target=\"_blank\" rel=\"noopener\">endorsed</a> Zaidi's June 2027 timetable for disarmament in early October, Laith Al-Khazali <a href=\"https://almasalah.com/archives/144166\" target=\"_blank\" rel=\"noopener\">referred</a> to state control of weapons as constitutional and \"beyond discussion.”"},{"t":"p","html":"Mamouri reads the apparent shift in the Khazali brothers’ discourse as a sign of \"pragmatism,\" but cautioned that the language alone does not show \"who is driving the process or whether implementation will follow.\" Holding Asa'ib Ahl Al-Haq to that position is a task for the Baghdad government, not Washington."},{"t":"p","html":"The apparent bargain of political recognition in exchange for disarmament does not seem to extend to the ‘resistance’ factions which are literally sticking to their guns. \"Groups like Kata'ib Hezbollah and [Harakat Hezbollah] Al-Nujaba do not believe in borders and they do not believe in the state,\" Taylor warned. Over time, Higel expects integration to \"either isolate the resistance groups or encourage them to join the trend of integration.\""},{"t":"p","html":"For its part, Tehran has little reason to expect Asa'ib Ahl Al-Haq to cut ties. Mamouri does not \"expect that relationship to break in the near future,\" and in Higel's view, \"Iran has sufficient levers in Iraq to pull when and if it needs it.\""},{"t":"p","html":"For Qais Al-Khazali, the path to becoming the preeminent face of Iraq’s political establishment—and to achieve the statesman status Sharaa now enjoys—seems to run through Washington via Tehran. Getting there need not mean a rupture with the Islamic Republic; but it would require stepping out of the crossfire between Iran and the United States. If not, the deputy premiership may be restricted to a reward for restraint rather than a new beginning for the Khazalis."}],"words":2476},{"type":"Media Monitor","region":"Iran","category":"Politics","title":"In Iran, hardline fringe targets military as anti-diplomacy protests intensify","authors":["Amwaj.media Staff"],"date":"2026-11-13","url":"https://amwaj.media/en/media-monitor/in-iran-hardline-fringe-targets-military-as-anti-diplomacy-protests-intensify","img":"img/02.jpg","iw":1400,"ih":788,"alt":"Demonstrators hold signs against US President Donald Trump during a pro-establishment rally in Tehran, Iran on Nov. 4, 2026. (Photo by Zahra Ostadzadeh via Jamaran)","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> In Iran, hardline factions opposed to diplomacy with the United States have intensified their attacks on the pro-reform government of President Masoud Pezeshkian and conservative Parliament Speaker Mohammad Baqer Qalibaf. This comes as protesters wearing white burial shrouds are turning on military commanders over what they see as an inadequate response to American attacks."},{"t":"p","html":"The backlash has also exposed divisions within hardline ranks, as prominent members of the camp distance themselves from the increasingly confrontational campaign."},{"t":"p","html":"<strong>The coverage:</strong> Women in white burial shrouds, linked to a group calling itself Tow'eh, have widened their protests against negotiations with the US to target senior military officials."},{"t":"ul","items":["After earlier demonstrations outside government buildings and the Ministry of Foreign Affairs in downtown Tehran, the protesters <a href=\"https://tabnak.ir/fa/news/4200462/%D8%AA%D8%B5%D8%A7%D9%88%DB%8C%D8%B1-%D8%AA%D8%B8%D8%A7%D9%87%D8%B1%D8%A7%D8%AA-%DA%AF%D8%B1%D9%88%D9%87-%D8%B3%D9%88%D9%BE%D8%B1%D8%A7%D9%86%D9%82%D9%84%D8%A7%D8%A8%DB%8C-%D9%85%D9%82%D8%A7%D8%A8%D9%84-%D9%86%D9%87%D8%A7%D8%AF%D9%87%D8%A7%DB%8C-%D9%86%D8%B8%D8%A7%D9%85%DB%8C-e8c4f3c3eab44921ad01aa8f\" target=\"_blank\" rel=\"noopener\">gathered</a> by the headquarters of the Armed Forces General Staff and, more recently, the Islamic Revolutionary Guard Corps (IRGC).","At a Nov. 5 gathering outside the main compound of the IRGC in the Iranian capital, demonstrators accused the armed forces of failing to carry out Supreme Leader Ayatollah Mojtaba Khamenei's Oct. 31 <a href=\"https://rahbar.ir/news?cid=2283\" target=\"_blank\" rel=\"noopener\">instruction</a> that any threat be met with an \"immediate\" and \"effective\" response \"without geographic limits.\"","Chanting against the IRGC and the regular Army (Artesh), hardline protesters accused commanders of failing to defend the supreme leader. Their criticism comes amid a string of recent US <a href=\"https://www.aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">strikes</a> on Iranian air defenses."]},{"t":"p","html":"Some hardline demonstrators have also <a href=\"https://www.instagram.com/reels/Dfm85CQpgxs/\" target=\"_blank\" rel=\"noopener\">targeted</a> President Pezeshkian, Speaker Qalibaf, Foreign Minister Abbas Araghchi and other figures associated with diplomatic efforts to end the war."},{"t":"ul","items":["Placards and displays at pro-establishment gatherings have featured symbolic executions of former presidents Hassan Rouhani (2013–21) and Mohammad Khatami (1997–2005) as well as ex-foreign minister Mohammad Javad Zarif (2013-21)."]},{"t":"graph","id":"12568468"},{"t":"p","html":"This comes as several Iranian media outlets have in recent days openly criticized the protesters."},{"t":"ul","items":["Reformist daily Etemad <a href=\"https://www.etemadonline.com/%D8%A8%D8%AE%D8%B4-%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-9/798990-%D8%AA%D8%AC%D9%85%D8%B9-%D8%B2%D9%86%D8%A7%D9%86-%DA%A9%D9%81%D9%86-%D9%BE%D9%88%D8%B4\" target=\"_blank\" rel=\"noopener\">highlighted</a> the protesters' widening of their targets to military commanders, while Rooz-e No daily <a href=\"https://roozno.com/fa/news/774999/\" target=\"_blank\" rel=\"noopener\">asked</a> whether other Iranians would be given the same freedom to voice their views on war, peace and negotiations.","Pro-reform daily Shargh <a href=\"https://www.sharghdaily.com/%D8%A8%D8%AE%D8%B4-%D8%B1%D9%88%D8%B2%D9%86%D8%A7%D9%85%D9%87-100/1141090-%D8%A8%D9%84%D9%86%D8%AF%DA%AF%D9%88%DB%8C-%D9%85%DB%8C%D8%AF%D8%A7%D9%86-%D8%AF%D8%B3%D8%AA-%DA%A9%DB%8C%D8%B3%D8%AA\" target=\"_blank\" rel=\"noopener\">quoted</a> Rasool Montajabnia, leader of the Reformist Jomhuriyat Party, linking the protesters to currents close to prominent hardliner Saeed Jalili."]},{"t":"p","html":"Notably, both hardline and conservative outlets have also joined the criticism."},{"t":"ul","items":["Conservative Khorasan newspaper <a href=\"https://sarasari.khorasanonline.ir/Newspaper/Item/161173\" target=\"_blank\" rel=\"noopener\">questioned</a> who was feeding the women demonstrators \"selective information\" and directing their activities, and called on the judiciary to clarify the role of possible organizers and backers.","A column in moderate conservative Ettelaat <a href=\"https://www.ettelaat.com/news/177215/\" target=\"_blank\" rel=\"noopener\">went</a> further, describing the protesters as a \"noisy minority\" exploiting national and revolutionary values to pursue political influence. The column called for a \"change in approach\" toward Tow’eh, warning that its activities had gone from an irritating spectacle to a disruption."]},{"t":"p","html":"Criticism on Iranian social media has been just as sharp."},{"t":"ul","items":["Hossein Soleimani, editor of hardline Mashregh News, <a href=\"https://x.com/HS_Soleimani/status/2118642572331511927\" target=\"_blank\" rel=\"noopener\">accused</a> the protesters of spreading a \"virus of paranoia,\" suggesting they had come to believe that virtually everyone in the political establishment apart from the supreme leader had betrayed the country. Soleimani warned that the movement's organizers and ideological backers could face consequences for their actions.","A conservative commentator <a href=\"https://x.com/HosseinGhatib/status/2120415309865636068\" target=\"_blank\" rel=\"noopener\">criticized</a> the use of nightly gatherings in support of the Islamic Republic for factional score-settling, arguing that events meant to promote national unity were becoming platforms for internal division."]},{"t":"p","html":"Jalili's appearances at the nightly rallies have meanwhile drawn attention among his supporters."},{"t":"ul","items":["After the hardline politician <a href=\"https://x.com/DrSaeedJalili/status/2119542553913524473\" target=\"_blank\" rel=\"noopener\">shared</a> a photograph of himself smiling in a crowd, one supporter sarcastically <a href=\"https://x.com/sadra_dev/status/2119557695535796718\" target=\"_blank\" rel=\"noopener\">invited</a> Qalibaf to take a similar picture.","Jalili's supporters and the wider hardline faction have <a href=\"https://amwaj.media/en/media-monitor/raisis-legacy-emerges-as-proxy-for-debate-over-direction-of-iran\" target=\"_blank\" rel=\"noopener\">intensified</a> their criticism of the parliament speaker since he earlier this year emerged as a lead negotiator with the US during talks to end the war with Israel and the US."]},{"t":"p","html":"Others have come to the defense of the Iranian officials under fire."},{"t":"ul","items":["Foreign policy analyst Ehsan Taqaddosi <a href=\"https://x.com/demokracy/status/2119694175490707653\" target=\"_blank\" rel=\"noopener\">countered</a> that Qalibaf, Pezeshkian and other senior government officials face serious security constraints, unlike Jalili who can seemingly move freely between public gatherings."]},{"t":"p","html":"<strong>The context/analysis:</strong> The Tow’eh demonstrations reflect an intensifying <a href=\"https://amwaj.media/en/media-monitor/hardline-mp-handed-jail-term-as-iran-navigates-divisions-over-us-talks\" target=\"_blank\" rel=\"noopener\">struggle</a> over Iran's direction, and particularly how far diplomacy should be used to consolidate military gains and ease economic pressure."},{"t":"ul","items":["Pezeshkian and Qalibaf have defended negotiations with the Donald Trump administration as a means of securing national interests, while their opponents portray engagement with Washington as an unacceptable compromise."]},{"t":"p","html":"The radicalization of an already fringe movement also marks an unusual inversion of Iran's political dynamics."},{"t":"ul","items":["Factions traditionally associated with defending the political establishment are increasingly casting themselves as its critics, <a href=\"https://www.aljazeera.com/news/2026/10/26/irans-anti-negotiation-hardliners-turn-against-president-pezeshkian\" target=\"_blank\" rel=\"noopener\">questioning</a> the loyalty and competence of elected officials and, now, military commanders.","The demands for harsher retaliation against US strikes and rejection of negotiations are not new. What stands out about the current protests is the willingness to <a href=\"https://www.iranintl.com/en/202609290361\" target=\"_blank\" rel=\"noopener\">challenge</a> the institutions responsible for the country's foreign and security policies."]},{"t":"p","html":"The backlash from conservative outlets is additionally revealing."},{"t":"ul","items":["Ettelaat, Khorasan and Mashregh have not simply disagreed with the protesters' tactics. The outlets have openly questioned the political forces behind them.","The distancing of the outlets suggests that even within Iran’s conservative camp, there is concern that the confrontational approach could undermine the very establishment it claims to defend.","Yet this does not necessarily signal a broader conservative shift toward supporting negotiations."]},{"t":"graph","id":"14624735"},{"t":"p","html":"The judiciary's announcement earlier this month that it had <a href=\"https://www.mizanonline.ir/fa/news/4927069/\" target=\"_blank\" rel=\"noopener\">arrested</a> an unnamed woman accused of trying to infiltrate and redirect the nightly gatherings is another sign of official concern."},{"t":"ul","items":["The judiciary alleged that the detained woman had sought to steer slogans away from foreign adversaries and toward Iranian officials, and to organize gatherings outside designated times. It also alleged that the purported current behind her had foreign links.","The episode <a href=\"https://amwaj.media/en/media-monitor/irans-post-war-pivot-to-economy-first-stirs-hardline-backlash\" target=\"_blank\" rel=\"noopener\">recalls</a> warnings by Deputy Interior Minister Mohammad Bathaei, who confirmed in June that the authorities had cautioned individuals and groups protesting the Islamabad Memorandum of Understanding (MoU) <a href=\"https://amwaj.media/en/media-monitor/document-a-historic-iran-us-memorandum-of-understanding\" target=\"_blank\" rel=\"noopener\">signed</a> by Iran and the US.","The authorities' apparent concern is not simply the expression of opposition to diplomacy, but losing control over the messaging and direction of gatherings originally promoted as shows of national unity."]},{"t":"p","html":"<strong>The future:</strong> Tensions are likely to persist as long as negotiations remain contentious and Iran faces continued military and economic pressure from Washington."},{"t":"ul","items":["Whether Iranian authorities move beyond warnings and the Nov. 2 arrest to action against organizers of the hardliner demonstrations will be an important indicator of tolerance for increasingly assertive radical factions.","Any new US strikes could give hardline protesters fresh grounds to accuse Iranian military commanders of failing to act on the supreme leader's instruction, keeping the armed forces in their sights.","The response to the protests in Iran could also expose further divisions within conservative ranks over the limits of street mobilization and political dissent."]}],"words":296},{"type":"Article","region":"Peninsula","category":"Security","title":"Would a Turkish base in Saudi Arabia be more symbol than shield?","authors":["Paul Iddon"],"date":"2026-11-10","url":"https://amwaj.media/en/article/would-a-turkish-base-in-saudi-arabia-be-more-symbol-than-shield","img":"img/03.jpg","iw":1400,"ih":921,"alt":"","bottomLine":["Saudi Arabia is reportedly seeking a Turkish base like the one in Qatar, a presence it <a href=\"https://www.aljazeera.com/news/2017/6/18/saudis-reject-turkey-offer-to-build-base-in-kingdom\" target=\"_blank\" rel=\"noopener\">rejected</a> in 2017. The Kingdom appears to see it as a deterrent against Iran and the Houthis. Qatar's experience suggests the protection may fall well short of Riyadh's hopes.","The claim rests on one Oct. 27 report in the pro-government daily Turkiye Gazetesi, which <a href=\"https://www.turkiyegazetesi.com.tr/dunya/suudlar-katar-modelinin-aynisini-istiyor-turkler-gelsin-bizi-de-korusun-1825388?s=2\" target=\"_blank\" rel=\"noopener\">cited</a> security sources. According to the daily, Turkish forces would keep a purely defensive posture. Any deployment would still need a separate mandate from the Turkish parliament.","The reported request follows the Mecca Joint Defense Agreement, which Pakistan, Saudi Arabia and Turkiye <a href=\"https://www.aljazeera.com/news/2026/10/20/turkiye-moves-to-ratify-mecca-joint-defence-agreement\" target=\"_blank\" rel=\"noopener\">concluded</a> on Aug. 7. An attack on one member counts as one on all, though Suleyman Ozeren of American University notes that no mechanism sets out how that commitment would be triggered.","Qatar's record undercuts the idea that a Turkish presence deters attacks. Iran and Israel both struck the emirate in 2025, and it faced repeated <a href=\"https://s.thepeninsula.qa/article/01/03/2026/qatar-defense-ministry-says-65-ballistic-missiles,-12-drones-detected\" target=\"_blank\" rel=\"noopener\">barrages</a> after the Israeli-US war on Iran began on Feb. 28. Turkiye lacks an anti-ballistic missile <a href=\"https://www.forbes.com/sites/pauliddon/2026/03/30/iran-war-displays-anti-ballistic-deficiencies-in-turkeys-air-defense/\" target=\"_blank\" rel=\"noopener\">capability</a> even at home.","Ryan Bohl of risk intelligence firm RANE expects any base to be limited to training and defensive support, not a trip-wire force. The analyst sees little deterrent value beyond where Turkish forces are deployed, but some deterrence against anyone challenging Saudi Crown Prince Mohammed bin Salman's authority.","Ozeren sees only limited deterrence for now. Should the Israeli-US war on Iran resume and turn existential for Tehran, any base in the region could become a legitimate target, he warns. Whether the Mecca pact develops into an active military alliance remains to be seen."],"pull":"","blocks":[{"t":"p","html":"Saudi Arabia is reportedly seeking the kind of Turkish military presence it refused nine years ago. The Kingdom appears to be calculating that such a deployment, modeled on the base Ankara set up in neighboring Qatar a decade ago, could bolster its deterrence against <a href=\"https://amwaj.media/en/article/riyadh-aims-for-air-superiority-as-houthi-missiles-test-its-defenses\" target=\"_blank\" rel=\"noopener\">threats</a> like Iran and the Houthis in Yemen. Yet if the Qatar base is any precedent, the defense such a presence can realistically provide may prove far more limited than Riyadh hopes."},{"t":"p","html":"In an Oct. 27 report, the pro-government Turkish daily Turkiye Gazetesi <a href=\"https://www.turkiyegazetesi.com.tr/dunya/suudlar-katar-modelinin-aynisini-istiyor-turkler-gelsin-bizi-de-korusun-1825388?s=2\" target=\"_blank\" rel=\"noopener\">stated</a> that Saudi Arabia is seeking a Turkish base on the Qatar model, citing security sources. According to the daily, Turkish forces stationed there would not take part in any operations against the Houthis or engage in combat, and would keep a posture based entirely on defense and deterrence."},{"t":"p","html":"The daily argued that the emirate has not been attacked since Turkish forces arrived there, and described collective deterrence as the foundation of the new defense pact between Pakistan, Saudi Arabia and Turkiye. While both points underpin the case for a base, the first does not seem to survive the Iranian and Israeli strikes Qatar has faced since 2025, and the second has yet to be tested."},{"t":"h","text":"A reversal in Riyadh"},{"t":"p","html":"The reported request comes as the regional security order is shifting rapidly. With the Israeli-US war on Iran, which began on Feb. 28, and Houthi strikes now testing Gulf Arab states' defenses, Riyadh appears to be widening the circle of partners it relies on. Pakistan, Saudi Arabia and Turkiye <a href=\"https://www.aljazeera.com/news/2026/10/20/turkiye-moves-to-ratify-mecca-joint-defence-agreement\" target=\"_blank\" rel=\"noopener\">signed</a> the Mecca Joint Defense Agreement on Aug. 7 in the eponymous Islamic holy city. At an Oct. 5 meeting in Riyadh, their defense and foreign <a href=\"https://www.aljazeera.com/news/2026/10/5/mecca-alliance-agrees-to-activate-collective-deterrence-measures\" target=\"_blank\" rel=\"noopener\">ministers</a> agreed to provide the forces and capabilities set out under the pact and to ensure their rapid deployment to the Kingdom."},{"t":"chart","src":"img/c-5Zsm9.png","w":1220,"h":1238,"title":"Turkey's foreign military presence, 2021 ","link":"https://datawrapper.dwcdn.net/5Zsm9/"},{"t":"p","html":"Ankara submitted the agreement to the Turkish parliament for ratification on Oct. 20, and a parliamentary committee <a href=\"https://apnews.com/article/turkey-parliamentary-committee-approves-pact-saudi-pakistan-b75b3e02240f55d364b3072c2300ad36\" target=\"_blank\" rel=\"noopener\">approved</a> it a week later. Lawmakers began voting on Nov. 4 and <a href=\"https://www.turkiyetoday.com/nation/turkish-parliament-approves-mecca-defense-pact-with-pakistan-and-saudi-arabia-3231816\" target=\"_blank\" rel=\"noopener\">ratified</a> it the following day, by 279 votes to 119. However, as Reuters has <a href=\"https://www.reuters.com/world/asia-pacific/turkeys-parliament-set-ratify-defence-pact-with-saudi-arabia-pakistan-houthi-2026-11-04/\" target=\"_blank\" rel=\"noopener\">noted</a> in its coverage, sending Turkish forces to the Kingdom will require a separate parliamentary mandate."},{"t":"p","html":"A Turkish base would also mark a striking reversal for Riyadh. In June 2017, days after Saudi Arabia led a blockade of Qatar, a Saudi official told the state-run Saudi Press Agency that the Kingdom would not <a href=\"https://www.aljazeera.com/news/2017/6/18/saudis-reject-turkey-offer-to-build-base-in-kingdom\" target=\"_blank\" rel=\"noopener\">allow</a> Turkiye to establish military bases on its territory. Earlier that month, in an interview with Portuguese broadcaster RTP, Turkish President Recep Tayyip Erdogan said he had previously offered King Salman bin Abdulaziz Al Saud a similar base."},{"t":"h","text":"The Qatar test"},{"t":"p","html":"Turkiye already has soldiers in Qatar, and six Turkish F-16 fighter jets have been <a href=\"https://www.turkiyetoday.com/region/turkish-f-16s-in-qatar-surpass-1000-flight-hours-in-joint-military-operations-3202246\" target=\"_blank\" rel=\"noopener\">stationed</a> at the emirate's Dukhan Air Base since July 2024. The Turkiye Gazetesi report's assertion that the Gulf Arab state has not been attacked since Turkish troops arrived does not hold."},{"t":"p","html":"On June 23, 2025, Iran <a href=\"https://www.reuters.com/world/middle-east/iran-weighs-retaliation-against-us-strikes-nuclear-sites-2025-06-23/\" target=\"_blank\" rel=\"noopener\">fired</a> missiles at the sprawling Al-Udeid Air Base, which hosts US forces, during its 12-day war with Israel and the US. On Sept. 9 that year, Israel targeted the Hamas political leadership in the Qatari capital, Doha. According to a US defense official, Israeli fighter jets over the Red Sea <a href=\"https://www.newarab.com/news/israeli-fighter-jets-launched-ballistic-missiles-red-sea-qatar-strike-official-says\" target=\"_blank\" rel=\"noopener\">launched</a> ballistic missiles in that strike. And after the Israeli-US war on Iran began on Feb. 28 this year, Qatar <a href=\"https://s.thepeninsula.qa/article/01/03/2026/qatar-defense-ministry-says-65-ballistic-missiles,-12-drones-detected\" target=\"_blank\" rel=\"noopener\">came</a> under repeated Iranian aerial attacks. By the next day, Qatari forces had intercepted 65 ballistic missiles and 12 drones."},{"t":"chart","src":"img/c-BLXMz.png","w":1220,"h":1144,"title":"Israel targets Hamas leadership in Qatar","link":"https://datawrapper.dwcdn.net/BLXMz/"},{"t":"p","html":"Turkish forces in Qatar are ill-equipped to stop projectiles of that kind. Turkiye currently <a href=\"https://www.forbes.com/sites/pauliddon/2026/03/30/iran-war-displays-anti-ballistic-deficiencies-in-turkeys-air-defense/\" target=\"_blank\" rel=\"noopener\">lacks</a> anti-ballistic missile capabilities to defend its own airspace. Ankara has been <a href=\"https://turkishminute.com/2026/05/18/erdogan-macron-negotiating-major-air-defense-deal-before-nato-summit-report/\" target=\"_blank\" rel=\"noopener\">weighing</a> the Franco-Italian <a href=\"https://www.reuters.com/business/aerospace-defense/technical-work-ongoing-with-turkey-italy-over-samp-t-air-defence-macron-says-2026-07-08/\" target=\"_blank\" rel=\"noopener\">SAMP/T</a> air defense system since a 2017 letter of intent with Paris and Rome, and is also looking at later versions of its <a href=\"https://turdef.com/article/siper-2-air-defence-missile-enters-serial-production\" target=\"_blank\" rel=\"noopener\">homegrown</a> Siper long-range missiles to close the gap."},{"t":"p","html":"Turkiye's military presence may have helped deter Saudi Arabia and the United Arab Emirates (UAE) when they led the blockade of Qatar beginning in June 2017. On June 7 that year, the Turkish parliament <a href=\"https://aa.com.tr/en/turkey/turkeys-president-ratifies-qatar-military-deals/837704\" target=\"_blank\" rel=\"noopener\">passed</a> a bill to deploy troops to the nascent Turkish base in Qatar, in a show of support for Doha. Riyadh may now look to Ankara to play a similar role for its own security as it faces threats from the Houthis to its south and Iran to its east."},{"t":"h","text":"Training, not a trip-wire"},{"t":"p","html":"While a single newspaper report does not mean a Turkish base in Saudi Arabia is imminent, analysts do not rule out the possibility. Ryan Bohl, a senior Middle East and North Africa analyst at the risk intelligence company RANE, believes a base for training and defensive support would at least be viable. \"The credibility issue boils down to sourcing, which right now I am not seeing anything firm from Saudi sources,\" Bohl told Amwaj.media."},{"t":"p","html":"\"The viability would be because Saudi Arabia could certainly use greater training cooperation with Turkiye, NATO's [second-largest] army, and Turkish troops would help backstop the monarchy's internal security forces in crisis scenarios.\""},{"t":"p","html":"Nevertheless, the analyst also noted that the Kingdom most likely remains wary of Ankara's \"long-term intentions\" for the Arab world. If Turkiye does establish a base, Bohl explained, it would likely be \"limited to training and defensive support, not a trip-wire force like the US tries to serve as.\" As a result, the analyst suggested that such an outpost would not serve as \"a substantial deterrence to Iran or the Houthis except for where they are specifically deployed.\""},{"t":"p","html":"Bohl anticipates that air defenses are the most likely assets Turkiye would deploy at any Saudi base. \"If Turkish air assets are deployed, I would imagine they would function similarly to how US forces do, as essentially guests on Saudi bases rather than on US-run bases in the Kingdom, in contrast to Qatar's Al Udeid base,\" he explained."},{"t":"p","html":"Turkish forces would be unlikely to handle Saudi internal security except in extreme circumstances, the analyst suggested, but \"their presence on the ground creates a layer of internal deterrence for actors that might seek to target the monarchy itself, or for rivals within the monarchy who might seek to undermine [Saudi Crown Prince] Mohammed bin Salman's authority.\""},{"t":"h","text":"A pact still untested"},{"t":"p","html":"Suleyman Ozeren, a professorial lecturer at American University in Washington and senior fellow at the Orion Policy Institute, believes the report could be credible, since the reported Saudi request broadly aligns with what the pact's members agreed in Riyadh on Oct. 5. Under the pact, an armed assault on any member counts as one on all of them. In the scholar's view, that gives Ankara and Riyadh legitimate grounds for a Turkish presence on Saudi soil."},{"t":"p","html":"\"Deploying military forces in Saudi Arabia might provide limited deterrence against Iran and the Houthis for now, depending on the level of conflict escalation in the region,\" Ozeren told Amwaj.media. \"For now, they would avoid any military confrontation with Turkiye and refrain from direct military engagement, but this may not stop them from targeting Saudi Arabia.\""},{"t":"graph","id":"30544790"},{"t":"p","html":"\"However, if the Saudi-led conflict expands or the US and Israel war against Iran resumes and escalates into an all-out war and Tehran faces an existential conflict, then any military base in the region could become a legitimate target for Iran,\" the scholar warned."},{"t":"p","html":"Ozeren anticipates that Turkish security and defense support for Saudi Arabia will align with the Mecca pact and include intelligence sharing, joint training and logistics. Whether the Mecca pact develops into what he called a \"NATO-like active military defense alliance\" remains to be seen."},{"t":"p","html":"If the report is broadly accurate, a Turkish military base in Saudi Arabia would amount to more than the Qatar model. The arrangement with Doha includes no explicit commitment for Ankara to come to Qatar's defense if it is attacked. The Mecca pact, by contrast, makes collective defense and deterrence its central objective. At the same time, Ozeren points to the caveat that no mechanism has been set out for how that commitment would be triggered."},{"t":"p","html":"The scholar also noted that earlier tensions between Saudi Arabia and Turkiye, beginning with the 2017 blockade of Qatar that was lifted in 2021, ultimately did not escalate into military conflict. Relations sank further after Saudi journalist Jamal Khashoggi was killed at his country's consulate in Istanbul in Oct. 2018. Ties began to recover in 2022, and in June that year the crown prince visited Turkiye for the first time since the killing."},{"t":"p","html":"\"The current situation in the region is fundamentally and strategically different, which could potentially put Ankara in a very peculiar situation with Iran and the Houthis, for that matter,\" Ozeren said."}],"words":1417},{"type":"Article","region":"Iraq","category":"Politics","title":"Inside story: Iran’s next envoy to Iraq? Meet Commander Masgarian","authors":["Ali Mamouri"],"date":"2026-11-12","url":"https://amwaj.media/en/article/inside-story-irans-next-envoy-to-iraq-meet-commander-masgarian","img":"img/04.jpg","iw":1400,"ih":933,"alt":"","bottomLine":["Iran has reportedly nominated Abdolreza Masgarian, a commander associated with the Islamic Revolutionary Guard Corps (IRGC) Quds Force, as its next ambassador to Iraq. Tehran has yet to officially confirm the choice, which would extend its practice of placing security figures at the center of relations with Baghdad.","Masgarian has served as commander of the Quds Force’s Ramadan Headquarters. More recently, he has led delegations discussing implementation of the 2023 Iran–Iraq bilateral security agreement with Baghdad as well as the Kurdistan Regional Government (KRG).","In meetings with former prime minister Mustafa Al-Kadhimi (2020–22), Masgarian appeared alongside Quds Force commander Esmail Qa’ani and showed a detailed grasp of Iraqi politics that extended beyond Shiite parties to Kurdish and Sunni figures.","One Iranian source told Amwaj.media that Tehran recognizes how regional dynamics have shifted since Oct. 2023 but sees no grounds for a strategic reversal in Iraq. The appointment of a figure like Masgarian would point to continuity in Iran’s strategic objectives, with possible changes in tactics.","One source in the Iraqi Prime Minister’s Office told Amwaj.media that Ali Al-Zaidi is studying whether to reject the nomination amid US pressure. Yet a majority of Shiite Coordination Framework members will likely oppose such a rejection, making stalling appear more probable than refusal.","If confirmed, Masgarian’s ambassadorship could give Iraqi officials a channel to the institutions that shape Tehran’s Iraq policy, including in talks with Erbil over border security and exiled Iranian Kurdish opposition groups. Accepting him could also become a test of how far Baghdad is prepared to accommodate Washington’s demands."],"pull":"","blocks":[{"t":"p","html":"Iran appears set to firmly keep its relations with Iraq in the hands of its security establishment. <a href=\"https://alhurra.com/en/53500\" target=\"_blank\" rel=\"noopener\">Reports</a> that Tehran has nominated Abdolreza Masgarian, a commander of the Islamic Revolutionary Guard Corps (IRGC) Quds Force, as its next ambassador to Baghdad have yet to be officially confirmed."},{"t":"p","html":"If the nomination goes ahead, the choice would come as no surprise as Iran faces the prospect of a third war with Israel and the United States in little over a year. In many ways, it would extend Iran’s longstanding practice of placing figures with security backgrounds at the center of its ties with Iraq, and suggest continuity in Tehran’s strategic objectives even as its tactics evolve."},{"t":"p","html":"At the same time, US pressure on the Iraqi government could cause procedural issues whereby, if Masgarian is officially nominated, the conditions of his presence in Baghdad may not be clear cut. In this respect, Iran’s recent experiences in Lebanon offer a poignant precedent for a possible “gray” diplomatic presence in Iraq."},{"t":"h","text":"Why might Tehran choose Masgarian?"},{"t":"p","html":"Masgarian’s public profile is rooted in Iran’s security establishment and its long involvement in Iraq. Among other senior military positions, he has served as <a href=\"https://www.tasnimnews.ir/fa/news/1403/04/20/3119833/%D9%85%D8%B3%DA%AF%D8%B1%DB%8C%D8%A7%D9%86-%D9%82%D8%B1%D8%A7%D8%B1%DA%AF%D8%A7%D9%87-%D8%B1%D9%85%D8%B6%D8%A7%D9%86-%D8%A7%D9%86%D8%AF%D8%A7%D8%B2%D9%87-%DB%8C%DA%A9-%D8%AF%D9%88%D9%84%D8%AA-%DB%8C%D8%A7-%D8%A7%D8%B1%D8%AA%D8%B4-%D8%A7%D8%AB%D8%B1%DA%AF%D8%B0%D8%A7%D8%B1-%D8%A8%D9%88%D8%AF%D9%87-%D8%A7%D8%B3%D8%AA\" target=\"_blank\" rel=\"noopener\">commander</a> of the Quds Force’s Ramadan Headquarters, working closely with the slain former head of the elite unit, Qasem Soleimani."},{"t":"p","html":"This author personally encountered Masgarian in official meetings with former Iraqi prime minister Mustafa Al-Kadhimi (2020–22). There, Masgarian appeared alongside Quds Force commander Esmail Qa’ani, former ambassador to Iraq Hassan Danaeifar and other senior Quds Force commanders. His presence and role in those discussions clearly indicated that he held a significant position on the Iraq dossier in Tehran. It also suggested that he was being positioned for a possible future ambassadorship in Baghdad."},{"t":"p","html":"What stood out in those sessions was Masgarian’s comprehensive grasp of Iraqi politics. Reportedly hailing from Iran’s Kurdish-majority west and fluent in Arabic, his knowledge extended beyond the Shiite parties most commonly associated with Tehran’s influence to the Kurdish and Sunni figures whose decisions matter just as much to governing Iraq. He appeared to understand the relationships, competing interests and sensitivities that shape their dealings with one another. The impression was of a figure who treats Iraq as a complex political arena demanding detailed knowledge and a wide network of contacts, and who can work beyond Iran’s established allies with politicians who hold different priorities and views of Tehran."},{"t":"graph","id":"9376014"},{"t":"p","html":"Masgarian’s presence in Iraq has recently grown more visible. He has <a href=\"https://shafaq.com/amp/ar/%D8%A3%D9%85%D9%80%D9%86/%D8%A8%D8%AD%D8%B6%D9%88%D8%B1-%D8%AF%D8%A7%D8%AE%D9%84%D9%8A%D8%A9-%D9%83%D9%88%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D8%AA%D8%B3%D8%AA%D8%B6%D9%8A%D9%81-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9-%D8%AA%D9%86%D9%81%D9%8A%D8%B0-%D8%A7%D9%84%D8%A7%D8%AA%D9%81%D8%A7%D9%82-%D8%A7%D9%84-%D9%85%D9%86%D9%8A-%D9%85%D8%B9-%D9%8A%D8%B1%D8%A7%D9%86\" target=\"_blank\" rel=\"noopener\">headed</a> Iranian delegations discussing implementation of the 2023 Iran–Iraq security agreement with Baghdad as well as the Kurdistan Regional Government (KRG). Those contacts help explain why Tehran might consider him as diplomatic envoy. He would bring established relationships and experience of the overlapping political and security questions that shape Iran’s engagement with Iraq. His reported nomination would be a plausible progression from an established role, particularly in conditions where the security dimension to the bilateral relationship is growing more prominent."},{"t":"h","text":"Continuity in strategy, change in tactics?"},{"t":"p","html":"Masgarian’s reported selection is best understood against Tehran’s enduring objectives in Iraq. These are to maintain a friendly government in Baghdad, protect security and economic interests, preserve relationships across the political establishment and prevent Iraq from becoming a platform for threats against Iran. Most importantly, Tehran seeks to preserve the position of allied ‘resistance’ factions in Iraq in the face of US pressure to weaken them."},{"t":"p","html":"Such objectives leave room for changes in personnel, political relationships and negotiating methods without a change in strategy. The question is therefore whether Masgarian’s appointment would serve a different policy or bring an experienced figure into the diplomatic management of an existing one."},{"t":"p","html":"One Iranian source with close knowledge of the Islamic Republic’s policy toward Iraq told Amwaj.media that Iranian decision makers recognize how regional dynamics have shifted since Oct. 2023, but do not see those changes as grounds for a strategic reversal—especially in Iraq. According to the source, Tehran remains confident that its influence there is substantial and that Baghdad will not turn decisively toward Washington, despite tactical adjustments in Iraqi policy."},{"t":"p","html":"That helps explain why Iran would keep drawing its ambassadors to Baghdad from the same security establishment. From the Iranian perspective, changing circumstances call for adaptation within an established approach. Seen in this light, Masgarian’s military background and his experience with Iraqi political actors and Kurdish officials could make him useful in preserving Iranian influence under more difficult conditions."},{"t":"h"
