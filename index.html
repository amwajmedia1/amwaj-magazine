,"text":"Will Baghdad accept Masgarian?"},{"t":"p","html":"Tehran’s reported choice does not settle whether Baghdad will accept him. Under diplomatic <a href=\"https://legal.un.org/ilc/texts/instruments/english/conventions/9_1_1961.pdf\" target=\"_blank\" rel=\"noopener\">rules</a>, Iraq can withhold consent to a proposed ambassador without explaining its reasons. No decision approving or rejecting Masgarian has been made public."},{"t":"p","html":"There are nevertheless signs of hesitation within the Iraqi government. One source in the Iraqi Prime Minister’s Office told Amwaj.media that Ali Al-Zaidi is studying the possibility of rejecting the nomination. According to the source, Washington is pressing Iraq’s premier to refuse any Iranian ambassador with an IRGC background."},{"t":"p","html":"Notably, the Islamic Republic’s envoys to sensitive posts such as Afghanistan, Iraq, Lebanon and Syria are customarily either card-carrying Quds Force officers, or enjoy close working relationships with the expeditionary unit. Amid the current intense US pressure on Iran, this dynamic is turning out to be problematic."},{"t":"p","html":"Named as Iran’s ambassador to Beirut earlier this year, Mohammad Reza Raouf Sheibani reportedly never got a chance to present his credentials. Meanwhile, Lebanon’s Prime Minister Nawaf Salam in early March <a href=\"https://www.newarab.com/news/will-irans-ambassador-lebanon-leave-when-his-visa-expires\" target=\"_blank\" rel=\"noopener\">asked</a> authorities to identify IRGC officers in the country and \"take firm and immediate action to prevent any security or military activity or operation they may carry out from Lebanese territory, regardless of their status or the cover under which they operate, and to arrest them under the supervision of the competent judiciary in preparation for their deportation.\""},{"t":"p","html":"A few weeks later, on Mar. 24, the Lebanese government withdrew Sheibani’s accreditation and declared him persona non grata. The diplomat, who served as ambassador to Syria between 2011 and 2016—at the height of the Iranian military intervention in support of the Syrian government—was <a href=\"https://www.newarab.com/news/will-irans-ambassador-lebanon-leave-when-his-visa-expires\" target=\"_blank\" rel=\"noopener\">given</a> five days to leave over \"Tehran's violation of the established norms and rules governing diplomatic relations between the two countries.\" However, with the support of Hezbollah, Sheibani remained in Lebanon. Five months later, as an apparent compromise, the authorities there <a href=\"https://allisraelnews.com/brief/lebanon-extends-stay-of-iranian-ambassador-six-months-after-expulsion-order\" target=\"_blank\" rel=\"noopener\">issued</a> him a six-month residency permit as a “former diplomat,”letting him remain in Beirut without diplomatic status or immunity."},{"t":"p","html":"In this context, the Iraqi government’s rejection of Masgaran as ambassador would likely face strong opposition from a majority of the members of the ruling Shiite Coordination Framework, many of whom have longstanding relationships with the Iranian commander. According to the source in the Iraqi Prime Minister’s Office, the nomination has become a point of contention between external pressure and the political relationships underpinning the Baghdad government, rather than a routine diplomatic decision."},{"t":"graph","id":"18081279"},{"t":"p","html":"Indeed, the comparison with Lebanon illustrates one possible response. But Iraq’s political circumstances differ substantially. In Baghdad, the opposition described by the Iraqi source would make outright rejection politically costly. Masgarian’s established connections within the Coordination Framework give influential Iraqi actors their own reasons to support his appointment."},{"t":"p","html":"On that reading, stalling appears more likely than rejection. In other words, Prime Minister Zaidi could leave the approval process unresolved while managing US pressure and negotiating with his political partners."},{"t":"h","text":"The meaning for Iraq and the region"},{"t":"p","html":"If officially confirmed, Masgarian’s appointment would place an experienced security interlocutor at the center of Iran’s formal relationship with Iraq. His familiarity with Baghdad and Erbil’s political establishments could give him access and influence from the outset. For Iraqi officials, that could make him a useful channel to the institutions that shape Tehran’s decisions on Iraq. This matters especially amid the ongoing dispute between the Iraqi federal government and some elements of the Popular Mobilization Units (PMU) that refuse to integrate fully with the state and hand over all their military capabilities."},{"t":"p","html":"But access cuts both ways. The same relationships that could help resolve disagreements would also give Iran an experienced advocate for its interests when they conflict with Baghdad’s priorities."},{"t":"p","html":"Relations with Erbil would be another important task. Masgarian’s experience with Kurdish officials and the Iran-Iraq bilateral security agreement could help sustain negotiations over border security and the exiled Iranian Kurdish opposition groups that have come under repeated IRGC <a href=\"https://www.rudaw.net/english/kurdistan/06052026\" target=\"_blank\" rel=\"noopener\">bombardment</a> since the Israeli-US war on Iran began in February. His contacts may ease communication, but they would not remove the underlying differences over what Tehran demands and what Iraqi Kurdish authorities are willing or able to deliver. The measure of his effectiveness would be whether those relationships produce workable compromises or become channels for additional pressure."},{"t":"p","html":"Masgarian’s dealings with armed factions would carry greater consequences for Iraqi sovereignty. A diplomat familiar with these networks might help convey Iranian preferences or mediate disputes. The consequential question is whether Tehran would use his relationships to support restraint and accommodation with the Iraqi government, or to preserve Shiite armed factions’ ability to operate beyond its authority."},{"t":"p","html":"For Baghdad’s relationship with Washington, a dispute over Masgarian’s nomination may prove revealing before the Iranian official even arrives in the Iraqi capital. If the US pressure described by the source in the Iraqi Prime Minister’s Office continues, accepting Masgarian could become a test of how far Zaidi is prepared to accommodate the Donald Trump administration’s demands."}],"words":1529},{"type":"Media Monitor","region":"Iraq","category":"Security","title":"Khor Mor attack darkens Iraqi Kurdistan’s divided, one-field grid","authors":["Amwaj.media Staff"],"date":"2026-11-12","url":"https://amwaj.media/en/media-monitor/khor-mor-attack-darkens-iraqi-kurdistans-divided-one-field-grid","img":"img/05.jpg","iw":1400,"ih":933,"alt":"An Iraqi man is seen operating a private electric generator, in Baghdad on July 17, 2021. (Photo via Getty Images)","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Iraqi media has erupted in recrimination after a single Nov. 8 drone strike on a gas storage unit was enough to plunge most of Iraqi Kurdistan into darkness. The <a href=\"https://www.rudaw.net/english/categories/kurdistan/1080076\" target=\"_blank\" rel=\"noopener\">attack</a> halted production at the Khor Mor gas field and cut up to 2,800 megawatts (MW) of generation. Coverage has turned on why one strike could black out the semi-autonomous region, who launched the drone and whether the growing rift between the Kurdistan Democratic Party (KDP) and the Patriotic Union of Kurdistan (PUK) invited it."},{"t":"p","html":"<strong>The coverage:</strong> Within hours of the Nov. 8 strike on Khor Mor’s liquefied petroleum gas (LPG) unit, Kurdistan Regional Government (KRG) electricity ministry spokesperson Omed Ahmed <a href=\"https://www.kurdistan24.net/en/story/951712\" target=\"_blank\" rel=\"noopener\">told</a> KDP-affiliated Kurdistan24 that recovery “depends entirely” on the field."},{"t":"ul","items":["Output fell from more than 3,700 MW to around 1,000, down to about 27% of normal operating levels, another ministry source said."]},{"t":"p","html":"Opinion split over whether the Kurdish divide had invited the strike. Late on Nov. 8, senior PUK official Mahmoud Khoshnaw <a href=\"https://x.com/zi_khd/status/2119525531427213383\" target=\"_blank\" rel=\"noopener\">warned</a> on Twitter/X that the strained relationship had “whetted the appetite” of those targeting Khor Mor."},{"t":"ul","items":["Former Kurdistan Parliament member Abdul Salam Barwari <a href=\"https://almadapaper.net/460527/\" target=\"_blank\" rel=\"noopener\">dismissed</a> as “laughable” claims that either party was behind the strike, noting in the leftist newspaper Al-Mada on Nov. 10 that both depend on the field.","On Nov. 11, Iraq's National Security Service head Basim Al-Badri <a href=\"https://www.kurdistan24.net/ar/story/952425\" target=\"_blank\" rel=\"noopener\">told</a> a Chatham House session in London that the attack was tied to the Kurdistan region’s internal politics, without ruling out a Kurdish party’s involvement."]},{"t":"chart","src":"img/c-ugDYx.png","w":1220,"h":1110,"title":"Key gas field in Iraqi Kurdistan under attack again","link":"https://datawrapper.dwcdn.net/ugDYx/"},{"t":"p","html":"Baghdad has framed the assault in national terms. On Nov. 10, Sabah Al-Numan, who speaks for Prime Minister Ali Al-Zaidi as commander-in-chief of the armed forces, <a href=\"https://www.rudawarabia.net/arabic/categories/iraq/1369103\" target=\"_blank\" rel=\"noopener\">described</a> it to KDP-affiliated Rudaw as an attempt to undermine the semi-autonomous region’s unity and social peace."},{"t":"ul","items":["Numan also <a href=\"https://en.964media.com/55070/\" target=\"_blank\" rel=\"noopener\">claimed</a> in comments to the official Iraqi News Agency the same day that the government had identified those responsible, without naming them.","A day earlier, Iraqi security sources had <a href=\"https://www.kurdistan24.net/en/story/951711/iraqi-sources-say-drone-that-hit-khor-mor-was-launched-from-tuz-khurmatu\" target=\"_blank\" rel=\"noopener\">pointed</a> to Tuz Khurmatu, a disputed district in Salah Al-Din Governorate, as a possible launch area."]},{"t":"p","html":"The gas field had already been drawn into the Zaidi government’s mounting <a href=\"https://amwaj.media/en/media-monitor/warrant-and-smuggling-claims-widen-iraqi-pms-kataib-hezbollah-feud\" target=\"_blank\" rel=\"noopener\">feud</a> with the Iran-backed armed group Kata’ib Hezbollah."},{"t":"ul","items":["On Nov. 7, the eve of the strike, Kata’ib Hezbollah security official Abu Mujahid Al-Assaf <a href=\"https://rudaw.net/english/categories/iraq/1080062\" target=\"_blank\" rel=\"noopener\">accused</a> people around the premier of inciting attacks on Khor Mor. The aim, he claimed, was to extort the United Arab Emirates (UAE), home to the field’s operator Dana Gas."]},{"t":"p","html":"<strong>The context/analysis:</strong> A safety system at the field turned a single strike into a region-wide blackout. A site source <a href=\"https://peregraf.com/en/news/12915\" target=\"_blank\" rel=\"noopener\">told</a> independent outlet Peregraf that an automated mechanism halts production and exports whenever the field is attacked."},{"t":"ul","items":["Khor Mor fuels more than <a href=\"https://en.964media.com/54956/\" target=\"_blank\" rel=\"noopener\">80%</a> of the semi-autonomous region’s generation, its operators say. The shutdown has revived the private generators that the KRG’s 24-hour <a href=\"https://amwaj.media/en/media-monitor/late-night-attack-on-iraqi-gas\" target=\"_blank\" rel=\"noopener\">Runaki</a> power program aims to <a href=\"https://rudaw.net/english/categories/kurdistan/953206\" target=\"_blank\" rel=\"noopener\">retire</a> by the end of 2026.","The grid has gone dark before without a strike. In July, Dana Gas <a href=\"https://www.kurdistan24.net/ar/story/926172\" target=\"_blank\" rel=\"noopener\">suspended</a> work over “credible security threats,” and generation <a href=\"https://en.964media.com/50752/\" target=\"_blank\" rel=\"noopener\">fell</a> by about 2,500 MW."]},{"t":"graph","id":"24694257"},{"t":"p","html":"Attacks on the field have repeatedly drawn federal pledges of protection, but none has yet kept a drone out of its skies. After two drones hit a gas storage tank on Nov. 26, 2025, Baghdad <a href=\"https://www.rudaw.net/english/kurdistan/280220262\" target=\"_blank\" rel=\"noopener\">ordered</a> the federal defense ministry to shield the site from aerial attack."},{"t":"ul","items":["One Iraqi Kurdish official <a href=\"https://en.964media.com/53168/\" target=\"_blank\" rel=\"noopener\">claimed</a> in September that a British anti-drone system had reached the field in Nov. 2025 but was never used, as Baghdad would not issue the end-user certificate London required.","Nearly a year on, Khor Mor’s radar spotted the Nov. 8 drone, but the site had no air defense able to stop it, the Peregraf source added."]},{"t":"p","html":"The grid depends on one field under the control of the PUK, which <a href=\"https://en.964media.com/54798/\" target=\"_blank\" rel=\"noopener\">announced</a> on Nov. 5 that it is leaving the KRG. The Sulaimaniyah-based party holds the ground around the site that powers the KDP’s strongholds of Duhok and Erbil."},{"t":"ul","items":["The PUK has long guarded Chamchamal, the district around the field, against KDP-linked ventures. In 2022 it blocked pipeline work by the KDP-connected firm KAR Group after PUK leader Bafel Talabani <a href=\"https://www.shafaq.com/en/Report/Kurdish-tensions-stymie-Iraqi-region-s-gas-export-ambitions\" target=\"_blank\" rel=\"noopener\">complained</a> the contract had been awarded without a tender."]},{"t":"p","html":"After the KDP <a href=\"https://amwaj.media/en/media-monitor/kurdish-power-sharing-in-iraq-shatters-over-parliament-dispute\" target=\"_blank\" rel=\"noopener\">reactivated</a> the Kurdistan Parliament without its rival on Nov. 4, dozens of KAR Group employees were <a href=\"https://www.al-monitor.com/originals/2026/11/puk-leader-talabani-withdraws-regional-government-deals-blow-kurds-globally\" target=\"_blank\" rel=\"noopener\">expelled</a> from their offices in Chamchamal with no reason given."},{"t":"ul","items":["The firm was extending a gas pipeline from Khor Mor toward Erbil.","According to PUK-affiliated Channel8, Talabani <a href=\"https://www.channel8.com/english/news/d0cb2fce-79a3-482d-a31d-11a84d870d75\" target=\"_blank\" rel=\"noopener\">told</a> party lawmakers on Nov. 7 that Chamchamal fuels the Kurdistan region yet lacks services."]},{"t":"p","html":"<strong>The future:</strong> The lights may return before the problems behind the blackout are resolved. Supply had <a href=\"https://www.kurdistan24.net/en/story/952371\" target=\"_blank\" rel=\"noopener\">recovered</a> to about 1,500 MW by Nov. 11 on hydropower and other fuels, and Sulaimaniyah will <a href=\"https://shafaq.com/en/Kurdistan/Al-Sulaymaniyah-generators-to-restart-after-Khor-Mor-attack\" target=\"_blank\" rel=\"noopener\">review</a> private-generator hours on Nov. 13."},{"t":"ul","items":["The outage comes seven weeks before Runaki’s year-end <a href=\"https://www.shafaq.com/en/Kurdistan/Runaki-24-hour-electricity-to-cover-Kurdistan-by-year-end\" target=\"_blank\" rel=\"noopener\">deadline</a> for round-the-clock power across Iraqi Kurdistan, a pledge now hinging on Dana Gas, which has set no restart date.","On Nov. 11, Zaidi <a href=\"https://en.964media.com/55113/\" target=\"_blank\" rel=\"noopener\">ordered</a> the joint federal-KRG investigation he had launched two days earlier to report “as quickly as possible,” and the federal parliament set up a temporary <a href=\"https://www.shafaq.com/en/Kurdistan/Iraqi-Parliament-forms-committee-to-review-Khor-Mor-attack\" target=\"_blank\" rel=\"noopener\">committee</a> the same day. Whether investigators look to Tuz Khurmatu or to Kurdish rivals may shape how far the PUK and Baghdad cooperate on protecting the field."]},{"t":"p","html":"The KDP may govern without the PUK, but it cannot easily keep the lights on without Chamchamal."},{"t":"ul","items":["Baghdad may also stand to gain from the KDP-PUK dispute. Its <a href=\"https://amwaj.media/en/media-monitor/iraqs-budget-stalls-over-oil-erbil-says-it-cannot-deliver\" target=\"_blank\" rel=\"noopener\">2027</a> draft budget seeks tighter federal control over the Kurdistan region’s energy revenues and gas, and on Nov. 9 Zaidi <a href=\"https://www.kurdistan24.net/en/story/951893\" target=\"_blank\" rel=\"noopener\">ordered</a> the federal oil ministry to supply Kurdish households with cooking gas until Khor Mor restarts.","Whether KAR Group’s staff return may show if the parties can keep energy out of their rivalry, as the KDP <a href=\"https://www.shafaq.com/en/Kurdistan/KDP-ready-for-PUK-talks-on-KRI-crisis\" target=\"_blank\" rel=\"noopener\">signals</a> readiness for talks. Khor Mor’s operators <a href=\"https://en.964media.com/50752/\" target=\"_blank\" rel=\"noopener\">began</a> supplying gas to Iraq’s electricity ministry in August, over <a href=\"https://gov.krd/mnr-en/activities/news-and-press-releases/2026/august/statement-by-the-kurdistan-regional-government/\" target=\"_blank\" rel=\"noopener\">objections</a> from the KRG. Closer PUK dealings with Baghdad could leave the KDP with less say over its own power supply."]}],"words":429},{"type":"Article","region":"Peninsula","category":"Security","title":"Old News: Wary of Iran’s battlefield advances, Gulf Arab monarchies close ranks","authors":["Amwaj.media Staff"],"date":"2026-11-13","url":"https://amwaj.media/en/article/old-news-wary-of-irans-battlefield-advances-gulf-arab-monarchies-close-ranks","img":"img/06.jpg","iw":1400,"ih":938,"alt":"Gulf cooperation council leaders meet in Doha, Qatar on Nov. 10th,1983. (Photo via Getty Images)","bottomLine":["The Gulf Cooperation Council (GCC)—comprising Bahrain, Kuwait, Oman, Qatar, Saudi Arabia and the United Arab Emirates (UAE)—has agreed at its third summit to enhance military coordination and collective security. This comes in response to regional instability stemming from the 1979 Islamic Revolution in Iran and the ongoing Iran-Iraq War.","During the Nov. 1982 summit in Bahrain, member states committed to building self-reliance, approved defense recommendations from their defense ministers to jointly deter outside aggression, and agreed to set up a 2.1B USD Gulf Investment Corporation to fund joint development projects.","Regional security dominated the summit's communique, with leaders expressing grave concern over Iranian military advances into Iraqi territory, affirming support for a peaceful settlement to end the war, and urging Tehran to respond to international mediation.","On the Arab-Israeli conflict, GCC leaders maintained a unified stance calling for Israel's complete withdrawal from all occupied Arab territories, including Jerusalem, and the removal of all “Zionist” settlements.","GCC member states maintain divergent policies on the Iran-Iraq War, with Oman officially maintaining neutrality, and the UAE internally split while Kuwait and Saudi Arabia are providing substantial financial assistance and logistical backing to Iraq.","Fears of Shiite Arab vulnerability to Iranian infiltration have been underscored by a foiled coup attempt in Bahrain, prompting closer defense cooperation and growing security ties with the United States. However, this has raised concerns about compromising the bloc's official non-aligned status."],"pull":"","blocks":[{"t":"p","html":"<strong><em>Old News is a new initiative by Amwaj.media to connect the past to the present. Through “reporting” on pivotal moments in history, we aim to provide a richer backdrop for current dynamics in the region.</em></strong>"},{"t":"p","html":"<strong>The story:</strong> The Gulf Cooperation Council (GCC) has agreed to step up military coordination among its six members. The decision signals the nascent alliance’s commitment to collective security amid mounting fears that the ongoing Iran-Iraq War could spill into the Arabian Peninsula. The move towards Gulf Arab coordination came at the end of the new bloc’s third summit, held in Manama. Bahrain’s role as host carries important symbolism, as the island nation last year foiled a coup attempt by the Islamic Front for the Liberation of Bahrain, a group with reported ties to Tehran."},{"t":"p","html":"<strong>The coverage:</strong> The third GCC summit was <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">held</a> in Manama on Nov. 9–11, 1982. Member states committed to adopting <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">measures</a> “aimed at building their own strength” at a time when the region is in turmoil."},{"t":"ul","items":["The summit was <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">attended</a> by Bahrain’s Emir Sheikh Isa bin Salman Al Khalifa, Kuwait’s Emir Sheikh Jaber Al-Ahmad Al-Jaber Al-Sabah, Oman’s Sultan Qaboos bin Said Al Said, Qatar’s Emir Sheikh Khalifa bin Hamad Al Thani, Saudi Arabia’s King Fahd bin Abdulaziz Al Saud and President Sheikh Zayed bin Sultan Al Nahyan of the United Arab Emirates (UAE).","The six leaders also <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">agreed</a> to set up the Gulf Investment Corporation, with capital of 2.1B USD, to fund joint development projects."]},{"t":"graph","id":"30903087"},{"t":"p","html":"The Supreme Council, the GCC’s highest authority, <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">approved</a> recommendations drawn up by the bloc’s defense ministers over the past year to jointly deter outside aggression."},{"t":"ul","items":["The final statement <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">says</a> the recommendations are “aimed at building the member states’ own strength and coordinating among them, so that the region’s states rely on themselves to protect their security and preserve their stability.”","The leaders in attendance put off a decision on a comprehensive security agreement, <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">accepting</a> a request from their interior ministers, who met in Riyadh on Oct. 17, for more time to complete their studies."]},{"t":"p","html":"Regional security dominated the <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">communique</a> issued at the end of the three-day summit, in which the six states took a unified stance on the conflicts in the region."},{"t":"ul","items":["On the Arab-Israeli conflict, Gulf Arab leaders <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">called</a> for “Israel’s withdrawal from all the occupied Arab territories, including Holy Jerusalem, and the removal of all the Zionist settlements that have been established and are being established on the occupied Arab territories.”"]},{"t":"p","html":"GCC leaders also voiced alarm at Iran’s advance into Iraq, after Tehran’s initial setbacks in the face of the Iraqi invasion in Sept. 1980. Iranian forces have reportedly <a href=\"https://trove.nla.gov.au/newspaper/article/130828272?searchTerm=GCC%3B%20Gulf%3B%20Arab\" target=\"_blank\" rel=\"noopener\">pushed</a> as far as ten kilometers (six miles) into Iraqi territory."},{"t":"ul","items":["Referring to the Iranian <a href=\"https://www.nytimes.com/1982/11/08/world/iranians-drive-6-miles-into-iraq-baghdad-confirms-fierce-fighting.html?searchResultPosition=2\" target=\"_blank\" rel=\"noopener\">offensive</a>, the communique says the GCC Supreme Council <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">discussed</a> the war “with grave concern” and <a href=\"https://www.nytimes.com/1982/11/12/world/around-the-world-gulf-countries-support-iraq-on-ending-the-war.html?searchResultPosition=1\" target=\"_blank\" rel=\"noopener\">that</a> “Iran’s trespassing over its borders with Iraq endangered the safety of the Arab nation and also threatened its security and sovereignty.”","The GCC <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">affirmed</a> its support for Iraq’s efforts to end the war by peaceful means, and urged Iran to respond to mediation by the non-aligned countries, the Organization of the Islamic Conference and the UN."]},{"t":"chart","src":"img/c-WRn1W.png","w":1220,"h":1468,"title":"Gulf Cooperation Council and the Iran-Iraq War, Nov. 1982","link":"https://datawrapper.dwcdn.net/WRn1W/"},{"t":"p","html":"On the day the summit opened, Iranian President Ali Khamenei <a href=\"https://paperspast.natlib.govt.nz/newspapers/CHP19821110.2.54.12\" target=\"_blank\" rel=\"noopener\">told</a> foreign journalists in Tehran that the war will not end <a href=\"https://trove.nla.gov.au/newspaper/article/130828272?searchTerm=GCC%3B%20Gulf%3B%20Arab\" target=\"_blank\" rel=\"noopener\">until</a> his Iraqi counterpart, Saddam Hussein, is removed from office."},{"t":"ul","items":["Tehran <a href=\"https://journals.lib.unb.ca/index.php/JCS/article/view/14646\" target=\"_blank\" rel=\"noopener\">views</a> the GCC as a pro-western alliance. This is while the bloc <a href=\"https://www.jstor.org/stable/82f5edee-d857-33ec-b6d5-70f3dffad5ed?googleloggedin=true&amp;seq=5&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">insists</a> on its political non-alignment, though there are growing <a href=\"https://time.com/archive/6699283/gulf-states-stay-just-on-the-horizon-please/\" target=\"_blank\" rel=\"noopener\">reports</a> of military ties forming between its members and the United States."]},{"t":"p","html":"<strong>The context/analysis:</strong> Bahrain, Kuwait, Oman, Qatar, Saudi Arabia and the UAE <a href=\"https://treaties.un.org/doc/Publication/UNTS/Volume%201288/volume-1288-I-21244-English.pdf\" target=\"_blank\" rel=\"noopener\">founded</a> the GCC as a political and economic alliance in May last year."},{"t":"ul","items":["The bloc’s charter states that the aim is “to <a href=\"https://treaties.un.org/doc/Publication/UNTS/Volume%201288/volume-1288-I-21244-English.pdf\" target=\"_blank\" rel=\"noopener\">effect</a> coordination, integration and interconnection between member states…to achieve unity between them.”","The founding document <a href=\"https://treaties.un.org/doc/Publication/UNTS/Volume%201288/volume-1288-I-21244-English.pdf\" target=\"_blank\" rel=\"noopener\">designates</a> the Saudi capital Riyadh as the GCC’s headquarters."]},{"t":"p","html":"Although its charter does not explicitly spell it out, Gulf Arab monarchies have been frightened by the 1979 downfall of Iranian Shah Mohammad Reza Pahlavi and the subsequent war between Iraq and Iran."},{"t":"ul","items":["At the GCC’s first <a href=\"https://www.zawya.com/en/business/gcc-summit-in-retrospect-1452764\" target=\"_blank\" rel=\"noopener\">summit</a>, held in Abu Dhabi last year, regional security and economic prosperity <a href=\"https://www.thenationalnews.com/uae/1981-the-dawn-of-the-gcc-1.417681\" target=\"_blank\" rel=\"noopener\">topped</a> the agenda. Leaders <a href=\"https://www.alkhaleej.ae/2010-12-07/%D9%85%D9%86-%D9%82%D9%85%D8%A9-1981-%D8%A5%D9%84%D9%89-%D9%82%D9%85%D8%A9-2010/%D9%82%D9%85%D8%A9-%D8%A7%D9%84%D8%AA%D8%B9%D8%A7%D9%88%D9%86/%D8%A7%D9%84%D8%AE%D9%84%D9%8A%D8%AC\" target=\"_blank\" rel=\"noopener\">affirmed</a> their political non-alignment and rejected foreign intervention in the region, while discussing the Israeli-Palestinian conflict and the threats posed by the ongoing war next door."]},{"t":"graph","id":"30901382"},{"t":"p","html":"GCC member states are divided in their positions on the conflict between Iran and Iraq. Officially, the bloc <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">calls</a> for a peaceful settlement."},{"t":"ul","items":["Oman officially <a href=\"https://international-review.org/the-iran-iraq-war-omans-foreign-policy-part-2/\" target=\"_blank\" rel=\"noopener\">maintains</a> neutrality whereas the UAE is internally split, with Abu Dhabi <a href=\"https://countrystudies.us/persian-gulf-states/91.htm\" target=\"_blank\" rel=\"noopener\">tilting</a> towards Baghdad as the emirate of Dubai <a href=\"https://www.csmonitor.com/1982/1209/120953.html\" target=\"_blank\" rel=\"noopener\">maintains</a> trade with Tehran.","Individual GCC member states such as Kuwait and Saudi Arabia almost immediately <a href=\"https://www.washingtonpost.com/archive/politics/1981/04/23/arab-loans-helping-iraq-stay-at-war-arab-loans-aid-iraqi-war-effort-boost-economy/7c6e4209-353f-4fb9-8f36-6ff167b202ba/\" target=\"_blank\" rel=\"noopener\">backed</a> the invasion of Iran, and have <a href=\"https://www.merip.org/2011/01/guilty-bystanders/\" target=\"_blank\" rel=\"noopener\">provided</a> large-scale loans and logistical support to help Iraq sustain its war effort and maintain oil exports. The scale of the financial assistance so far has been <a href=\"https://www.csmonitor.com/1982/1213/121343.html\" target=\"_blank\" rel=\"noopener\">estimated</a> at 30B USD.","As fighting has <a href=\"https://countrystudies.us/iraq/84.htm\" target=\"_blank\" rel=\"noopener\">shut down</a> Iraq’s highly limited Gulf ports, Jordan and Kuwait have <a href=\"https://www.merip.org/2011/01/guilty-bystanders/\" target=\"_blank\" rel=\"noopener\">opened</a> their facilities to Baghdad—including for the maritime <a href=\"https://content.time.com/time/subscriber/article/0,33009,951576-6,00.html\" target=\"_blank\" rel=\"noopener\">import</a> of military goods."]},{"t":"p","html":"Fears that sympathy for Iran’s Islamic Revolution could spread to the Arabian Peninsula gained greater urgency last December, when authorities in Manama <a href=\"https://www.jstor.org/stable/82f5edee-d857-33ec-b6d5-70f3dffad5ed?googleloggedin=true&amp;seq=4&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">foiled</a> a coup attempt by the allegedly Tehran-backed Islamic Front for the Liberation of Bahrain."},{"t":"ul","items":["Observers say Bahrain’s Shiite-majority population is <a href=\"https://www.jstor.org/stable/4284442?searchText=&amp;searchUri=&amp;ab_segments=&amp;searchKey=&amp;refreqid=fastly-default%3A2f252165b44e8f7f9d2837863d0cdb55&amp;initiator=recommender&amp;seq=4\" target=\"_blank\" rel=\"noopener\">susceptible</a> to Iranian attempts at infiltration. The thwarted coup in Bahrain has <a href=\"https://www.jstor.org/stable/82f5edee-d857-33ec-b6d5-70f3dffad5ed?googleloggedin=true&amp;seq=4&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">sent</a> alarm bells ringing among the Gulf Arab monarchies. Notably, Saudi Arabia’s oil-rich Eastern Province is also home to a sizable Shiite community.","GCC defense ministers began <a href=\"https://www.jstor.org/stable/82f5edee-d857-33ec-b6d5-70f3dffad5ed?googleloggedin=true&amp;seq=4&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">meeting</a> the month after the coup attempt in Bahrain to devise a strategy for closer defense cooperation. Meetings in Riyadh in January and again in <a href=\"https://time.com/archive/6699283/gulf-states-stay-just-on-the-horizon-please/\" target=\"_blank\" rel=\"noopener\">October</a> this year form the basis of what has been announced at the bloc’s recent third summit in Manama."]},{"t":"p","html":"<strong>The future:</strong> Although the GCC has not made any announcement about the creation of a joint military force, observers say that prospect is highly <a href=\"https://www.researchgate.net/publication/316666885_Gulf_Security_Peninsula_Shield_Force_and_Iran\" target=\"_blank\" rel=\"noopener\">likely</a>. Where such a force may be based and which capabilities it may be endowed are, however, unclear."},{"t":"ul","items":["Several GCC states have been forging closer defense ties with the US amid the Iran-Iraq War. A joint Gulf Arab force could invite reliance on American arms and military trainers—a prospect some <a href=\"https://www.jstor.org/stable/82f5edee-d857-33ec-b6d5-70f3dffad5ed?googleloggedin=true&amp;seq=5&amp;googleloggedin=true\" target=\"_blank\" rel=\"noopener\">fear</a> may compromise the bloc’s non-aligned position."]},{"t":"p","html":"While united in calling for a peaceful end to the Iran-Iraq War and in opposing what they <a href=\"https://www.gcc-sg.org/ar/AboutUs/Data/SupremeData/Pages/Thefinalstatementforthethirdse2.aspx\" target=\"_blank\" rel=\"noopener\">consider</a> the “growing Zionist aggression,” GCC members <a href=\"https://studies.aljazeera.net/en/dossiers/2015/03/201533011258831763.html\" target=\"_blank\" rel=\"noopener\">diverge</a> on ties with the Soviet Union and the US."},{"t":"ul","items":["Time magazine <a href=\"https://time.com/archive/6699283/gulf-states-stay-just-on-the-horizon-please/\" target=\"_blank\" rel=\"noopener\">reports</a> that Bahrain, Oman and Saudi Arabia are closer to the United States, and are considering closer military cooperation with Washington.","On the other hand, Kuwait continues to be the only GCC member to <a href=\"https://www.jstor.org/stable/4284442?searchText=&amp;searchUri=&amp;ab_segments=&amp;searchKey=&amp;refreqid=fastly-default%3A2f252165b44e8f7f9d2837863d0cdb55&amp;initiator=recommender&amp;seq=3\" target=\"_blank\" rel=\"noopener\">maintain</a> diplomatic relations with the Soviet Union, further muddling the waters in terms of the bloc’s non-alignment.","Though mutually aligned against Iran, the GCC and the US hold fundamentally opposing views on the Israeli-Palestinian conflict. It is unclear whether this will remain a point of contention in bilateral relationships."]},{"t":"p","html":"There has been significant <a href=\"https://www.csmonitor.com/1981/0528/052857.html\" target=\"_blank\" rel=\"noopener\">skepticism</a> about the GCC’s ability to forge a unified approach and to endure. For now, the threats posed by the Iran-Iraq War appear to have united the young alliance."},{"t":"ul","items":["The question is how any potential joint Gulf Arab force might operate and react, and whether it can provide a meaningful defense in the event of an attack on the Arabian Peninsula.","It is also unclear what a US military presence would mean for GCC states caught in the rising enmity between America and Iran. Some observers charge that closer ties with Washington may bring greater protection from Iranian attack, while others argue that it may invite aggression from Tehran and exposure to crossfire."]}],"words":513}]};
