k\" rel=\"noopener\">Non-NATO</a> ally of the United States since 2022 and has held a US <a href=\"https://www.khaleejtimes.com/world/us-security-guarantees-qatar-israel-strikes\" target=\"_blank\" rel=\"noopener\">executive-order</a> security guarantee since September 2025."},{"t":"p","html":"Kayaoglu said Badr could link Turkiye’s bilateral projects into one network by “adding Qatari financing and partner production capacity without new defense obligations.”"},{"t":"p","html":"Meanwhile, Jufairi describes the Badr MOU as part of an emerging network of “functional security collaboration”—partnerships built around specific operational needs that do not require identical threat perceptions. That suits a state that <a href=\"https://www.euronews.com/2026/10/19/qatar-plans-new-defence-partnership-and-warns-of-energy-crisis-peak\" target=\"_blank\" rel=\"noopener\">kept</a> channels open with Tehran throughout the war, even while under fire. Jufairi expects joint procurement, training, maintenance and common interoperability standards. Anything further would require “political agreement on shared responsibilities as well as the rules governing cooperation during crises,” he said."},{"t":"p","html":"Looking ahead, as benchmarks for the MOU’s operationalization, Aslam highlighted funded feasibility studies, prototype demonstrations and signed production contracts, and Kayaoglu a project involving all four partners."}],"words":1357},{"type":"Article","region":"Peninsula","category":"Security","title":"Why GCC states are outing alleged Iranian intelligence networks","authors":["Saoud Al-Eshaq"],"date":"2026-11-04","url":"https://amwaj.media/en/article/why-gcc-states-are-outing-alleged-iranian-intelligence-networks","img":"img/05.jpg","iw":1400,"ih":829,"alt":"","bottomLine":["Since the Israeli-US war on Iran began on Feb. 28, Gulf Arab states have announced the dismantling of at least nine alleged espionage networks linked to the Islamic Revolutionary Guard Corps (IRGC) and Lebanese Hezbollah. In countries like Bahrain, several people have been handed down life sentences.","A Kuwaiti court in late October sentenced three men to death for allegedly spying for Iran, collaborating with Hezbollah and plotting to assassinate Interior Minister Sheikh Fahad Yousef Saud Al-Sabah. Kuwait also summoned Iran’s ambassador after Tehran’s embassy denied that an Iranian national among them had been involved.","Publicizing espionage cases, once relatively rare, reflects a calculation that disclosure deters adversaries, reassures the public and projects stability, despite the risks of exposing intelligence sources and straining ties with Tehran.","The United Arab Emirates (UAE) has used dramatic arrest footage and on occasion framing that can be seen as sectarian, while Bahrain and Kuwait have tied disclosures to debates over citizenship and national loyalty, including Bahrain’s citizenship revocation of 69 people in April.","Qatar has named neither the nationalities nor the identities of suspects, while Oman and Saudi Arabia have largely refrained from public disclosures. At least in the case of Doha and Muscat, this reflects their roles as mediators and their efforts to preserve diplomatic channels with Tehran.","Disclosures may bolster deterrence and public confidence in the short term, but where they deepen sectarian suspicion, broaden punitive measures or complicate diplomacy, their longer-term costs could grow, and their contribution to preventing future intelligence operations remains hard to measure."],"pull":"","blocks":[{"t":"p","html":"Since the launch of the Israeli-US war on Iran in late February, Gulf Arab states have announced the dismantling of at least <a href=\"https://english.aawsat.com/gulf/5258222-gulf-states-pursue-irgc-hezbollah-cells-amid-ongoing-attacks\" target=\"_blank\" rel=\"noopener\">nine</a> purported espionage networks linked to the Islamic Revolutionary Guard Corps (IRGC) and Lebanese Hezbollah. Courts have handed down lengthy prison terms for spying and planning sabotage, including life sentences, and some governments have revoked citizenships and tightened rules for foreign nationals. On Oct. 26, a Kuwaiti court went further, <a href=\"https://alhurra.com/en/49653\" target=\"_blank\" rel=\"noopener\">sentencing</a> three men to death for allegedly spying for Iran and Hezbollah."},{"t":"p","html":"Such disclosures were relatively uncommon before the war. Their frequency now raises an important question: why have some Gulf Cooperation Council (GCC) member states chosen to publicize them, and why have they differed in their methods?"},{"t":"p","html":"On the one hand, the disclosures reflect longstanding concerns about alleged Iranian interference in the <a href=\"https://www.aljazeera.com/features/2026/3/5/a-long-and-troubled-trail-qatars-irgc-cell-arrests-strain-iran-relations\" target=\"_blank\" rel=\"noopener\">internal</a> affairs of its southern neighbors. At the same time, the divergent approaches reflect each Gulf Arab state’s foreign policy and domestic political calculations, alongside differing assessments of the benefits and risks of going public."},{"t":"chart","src":"img/c-8Q8jh.png","w":1220,"h":1272,"title":"Gulf Cooperation Council member states","link":"https://datawrapper.dwcdn.net/8Q8jh/"},{"t":"h","text":"Iranian intelligence in the Gulf"},{"t":"p","html":"Iranian intelligence operations in the Gulf predate the 1979 Islamic Revolution. SAVAK, Iran’s first modern centralized intelligence service, relied partly on extensive human networks, including merchant families of Iranian descent, frequent travelers, religious officials and diplomatic personnel."},{"t":"p","html":"Profiles emerging from arrests carried out this year suggest that some of the recruitment environments that Iranian intelligence exploited under the late Shah Mohammad Reza Pahlavi (1941-79) remain relevant, even though the organizations responsible and their strategic goals have changed substantially."},{"t":"p","html":"Beyond making use of intelligence sharing with <a href=\"https://www.wsj.com/world/china/chinese-satellites-over-mideast-battlefield-put-u-s-on-edge-39e0d305\" target=\"_blank\" rel=\"noopener\">China</a> and <a href=\"https://www.wsj.com/world/russia-is-sharing-satellite-imagery-and-drone-technology-with-iran-0dd95e49\" target=\"_blank\" rel=\"noopener\">Russia</a> to hit US interests, recent <a href=\"https://www.reuters.com/investigates/special-report/iran-crisis-infrastructure-attacks/\" target=\"_blank\" rel=\"noopener\">reporting</a> suggests that Iran’s networks of informants in the region have played an important role in identifying targets that would not be visible in satellite imagery."},{"t":"p","html":"The first alleged Iranian cell was reported in <a href=\"https://qna.org.qa/en/news/news-details?date=4%2F03%2F2026&amp;id=state-security-announces-apprehension-of-two-cells-linked-to-iranian-revolutionary-guard\" target=\"_blank\" rel=\"noopener\">Qatar</a>, less than four days into the war. The Qatari State Security Bureau (SSB) on Mar. 3 announced the arrest of ten suspects in two cells allegedly working for the IRGC, saying that they had communication devices, the coordinates of critical infrastructure and technological equipment. Recruits reportedly <a href=\"https://al-sharq.com/article/11/04/2026/%D8%A3%D9%88%D9%84-%D9%88%D8%A7%D8%AD%D8%AF-%D8%AA%D9%85-%D8%AA%D8%AC%D9%86%D9%8A%D8%AF%D9%87-2024-%D9%85%D8%B9%D9%84%D9%88%D9%85%D8%A7%D8%AA-%D8%AA%D9%83%D8%B4%D9%81-%D9%84%D8%A3%D9%88%D9%84-%D9%85%D8%B1%D8%A9-%D8%B9%D9%86-%D8%AE%D9%84%D9%8A%D8%AA%D9%8A-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%81%D9%8A-%D9%82%D8%B7%D8%B1\" target=\"_blank\" rel=\"noopener\">traveled</a> to Tehran, where they are accused of having received training in using drones."},{"t":"graph","id":"29948616"},{"t":"p","html":"<a href=\"https://qna.org.qa/en/news/news-details?id=bahrain-authorities-arrest-four-nationals-on-charges-of-spying-for-irgc&amp;date=12/03/2026\" target=\"_blank\" rel=\"noopener\">Bahrain</a>, <a href=\"https://www.thenationalnews.com/news/gulf/2026/03/26/kuwait-foils-hezbollah-plot-to-assassinate-leaders-of-the-state/\" target=\"_blank\" rel=\"noopener\">Kuwait</a> and the United Arab <a href=\"https://www.arabnews.com/node/2640593/middle-east\" target=\"_blank\" rel=\"noopener\">Emirates</a> (UAE) have made similar announcements with broadly the same accusations. However, the way in which those cases have been publicly approached has differed. In Kuwait, an appeals <a href=\"https://www.aljarida.com/article/138827\" target=\"_blank\" rel=\"noopener\">court</a> in July lengthened one citizen’s ten-year sentence for allegedly spying for Iran and joining Hezbollah to life in prison. According to state security investigators cited in the ruling, the man was purportedly trained in weapons and combat in the Iranian holy city of Qom and met Hezbollah members during repeated visits to Iran, and was caught with a camera drone."},{"t":"h","text":"Different playbooks"},{"t":"p","html":"States use intelligence disclosures as a <a href=\"https://www.lawfaremedia.org/article/the-strategic-disclosure-of-intelligence-requires-stronger-guardrails\" target=\"_blank\" rel=\"noopener\">strategic</a> tool to deter foreign and domestic adversaries, foster national unity and signal coming measures. But any public release of intelligence carries considerable risks, including the exposure of sources and methods. It can also strain diplomatic relations, particularly when other countries are named."},{"t":"p","html":"That GCC states have foiled Iran-linked cells for decades, both before and after the fall of the Shah, is not surprising. The decision to disclose such purported networks now, and so frequently—rather than addressing such matters quietly—reflects a calculation that going public offers more advantages than private diplomacy."},{"t":"p","html":"In foreign policy terms, the strategy shows how the Israeli-US war on the Islamic Republic has prompted a reassessment of established diplomatic norms in GCC member state dealings with Iran. Yet, how each state has disclosed intelligence cannot be understood without grasping domestic socio-political dynamics. Indeed, domestically, the disclosures help Gulf Arab authorities project stability amid unprecedented tensions, and could also be used to justify a broader securitization of certain socio-political dynamics at home."},{"t":"p","html":"The UAE, which absorbed by far the largest <a href=\"https://www.csis.org/analysis/unpacking-irans-drone-campaign-gulf-early-lessons-future-drone-warfare\" target=\"_blank\" rel=\"noopener\">volume</a> of Iranian drones and missile strikes among GCC states in the first weeks of the war, has made its disclosures <a href=\"https://x.com/ssd_gov_ae/status/2046209891212419484\" target=\"_blank\" rel=\"noopener\">dramatic</a>, with flashing lights, special operators and an armed officer detaining a suspect in a basement. The official Twitter/X account of the Emirati State Security Department (SSD) posted <a href=\"https://x.com/ssd_gov_ae/status/2046209891212419484\" target=\"_blank\" rel=\"noopener\">footage</a> of the arrests with the hashtag “The_Secret_Shiite_Terrorist_Organization,” while the names and photographs of those arrested were made public."},{"t":"graph","id":"10118267"},{"t":"p","html":"One explanation for this approach is the Emirati desire to demonstrate security capabilities and project stability, as the war challenges the region’s reputation as a safe destination for tourism and investment. The explicit emphasis on “Shiite terrorism” may also be aimed at domestic audiences, highlighting concerns about foreign ideological influence and loyalty to the state."},{"t":"p","html":"Kuwait has adopted a somewhat different approach. Initial announcements of arrests named the suspects’ nationalities, including <a href=\"https://x.com/i/status/2043024734380495089\" target=\"_blank\" rel=\"noopener\">Kuwaiti</a> citizens. That detail mattered because the detentions took place in the context of heated domestic <a href=\"https://arabic.cnn.com/middle-east/article/2024/11/08/kuwait-citizenship-930-cases\" target=\"_blank\" rel=\"noopener\">debate</a> over mass citizenship revocations and national loyalty. The later conviction of a <a href=\"https://www.aljarida.com/article/138827\" target=\"_blank\" rel=\"noopener\">Kuwaiti</a> national for allegedly spying for Iran and Hezbollah gave a judicial outcome to allegations first made in security-related announcements."},{"t":"p","html":"In <a href=\"https://www.aljazeera.com/news/2026/5/12/kuwait-says-it-foils-infiltration-operation-by-irans-irgc\" target=\"_blank\" rel=\"noopener\">May</a>, Kuwait said it had foiled an alleged IRGC infiltration of Bubiyan Island by men aboard a fishing boat. Four suspects were arrested and referred for prosecution. Unlike the earlier espionage cases, the incident involved allegations of armed infiltration and direct threats to military and sovereign facilities. <a href=\"https://www.reuters.com/world/middle-east/kuwait-says-four-people-affiliated-with-irans-irgc-arrested-trying-enter-by-sea-2026-05-12\" target=\"_blank\" rel=\"noopener\">Tehran</a> rejected the charges, saying that the men had entered Kuwaiti waters because their navigation system had malfunctioned. If anything, the episode shows how public disclosures can produce competing narratives and further complicate diplomatic relations."},{"t":"p","html":"More recently, on Oct. 26, Kuwait’s Criminal Court <a href=\"https://alhurra.com/en/49653\" target=\"_blank\" rel=\"noopener\">sentenced</a> three men to death for spying for Iran, collaborating with Hezbollah and plotting to assassinate First Deputy Prime Minister and Interior Minister Sheikh Fahad Yousef Saud Al-Sabah. It sentenced eight others to five years in prison with hard labor. Those sentenced to death include Hussein Al-Maatouq, a Shiite cleric and former secretary-general of the National Islamic Alliance—Kuwait’s main Shiite political bloc—whom investigators in the earlier case named as the convicted citizen’s Hezbollah contact."},{"t":"p","html":"The Iranian embassy has <a href=\"https://middleeastmonitor.com/20261029-kuwait-summons-iranian-ambassador-after-tehran-denies-assassination-plot\" target=\"_blank\" rel=\"noopener\">denied</a> that an Iranian national sentenced to death was involved, saying that he had not been in Kuwait for a decade. In reaction, Kuwait <a href=\"https://www.thenationalnews.com/news/gulf/2026/10/29/kuwait-summons-iranian-ambassador-in-dispute-over-death-sentence/\" target=\"_blank\" rel=\"noopener\">summoned</a> Iran’s ambassador on Oct. 28 over what it called “blatant interference” in its internal affairs and judiciary. Since the death sentences can be appealed, there could be an element of diplomacy involved in shaping the ultimate outcome."},{"t":"p","html":"Bahrain offers an even clearer example of how disclosures can turn into broader domestic security measures. After initial arrests, its High Criminal <a href=\"https://www.reuters.com/world/bahrain-court-jails-nine-life-collaborating-with-irans-revolutionary-guards-2026-05-24\" target=\"_blank\" rel=\"noopener\">Court</a> handed life sentences to suspects convicted of collaborating with the IRGC. Moreover, in April, authorities revoked the citizenship of 69 people over allegations ranging from espionage to <a href=\"https://www.thenationalnews.com/news/gulf/2026/04/27/bahrain-revokes-citizenship-of-69-people-over-support-for-iranian-attacks\" target=\"_blank\" rel=\"noopener\">sympathy</a> for Iranian attacks on sites in Bahrain in retaliation for Israeli-US bombings. The line between espionage and political sympathy is particularly relevant in Bahrain. While authorities have framed the crackdown as a matter of national security, their scope shows how far the war has heightened sensitivities over national loyalty and political expression."},{"t":"graph","id":"13048858"},{"t":"p","html":"Qatar, which remains actively involved in mediating an end to the Iran-Israel-US war, has been notably restrained, naming neither the nationalities nor identities of those detained. Doha’s role in Iran-US mediation is one possible explanation for its restraint. Within a month of the initial arrests after the outbreak of the war, however, it suspended visas on arrival for <a href=\"https://taxnews.ey.com/news/2026-0813-qatar-suspends-visa-on-arrival-facility-for-nationals-of-lebanon\" target=\"_blank\" rel=\"noopener\">Lebanese</a> and <a href=\"https://www.khaleejtimes.com/world/asia/qatar-suspends-visa-on-arrival-for-pakistanis-amid-middle-east-conflict\" target=\"_blank\" rel=\"noopener\">Pakistani</a> nationals."},{"t":"p","html":"The absence of comparable announcements from <a href=\"https://www.fm.gov.om/en/50726/\" target=\"_blank\" rel=\"noopener\">Oman</a> and <a href=\"https://www.spa.gov.sa/en/N2642332\" target=\"_blank\" rel=\"noopener\">Saudi Arabia</a> also deserves attention. Both have faced security concerns linked to Iran, directly or through aligned non-state actors, yet neither has featured as prominently in public disclosures of alleged domestic intelligence networks."},{"t":"p","html":"For Oman, its longstanding role as an intermediary for Tehran and ongoing <a href=\"https://www.fm.gov.om/en/53722\" target=\"_blank\" rel=\"noopener\">discussions</a> on shipping through the Strait of Hormuz may raise the cost of public confrontation. Saudi Arabia must similarly balance its security concerns, including the renewed threat posed by Yemen’s Ansarullah movement—also known as the <a href=\"https://amwaj.media/en/article/houthi-strikes-shut-riyadh-airport-as-saudi-arabia-weighs-its-responsevnew\" target=\"_blank\" rel=\"noopener\">Houthis</a>—against efforts to preserve diplomatic <a href=\"https://amwaj.media/en/article/iran-steps-up-regional-outreach-as-houthi-saudi-war-widens\" target=\"_blank\" rel=\"noopener\">channels</a> with Tehran. At the same time, the Kingdom must remain mindful of domestic sectarian sensitivities that resurfaced during earlier periods of heightened Iranian-Saudi tensions."},{"t":"h","text":"Beyond the disclosures"},{"t":"p","html":"The effectiveness of intelligence disclosure depends on what a country wants to achieve. Public announcements may reinforce deterrence and confidence at home in the short term, although their contribution to preventing future intelligence operations is difficult to establish. Where disclosures encourage sectarian suspicion, broaden punitive measures or complicate diplomacy, their longer-term costs may grow."},{"t":"p","html":"The contrasting approaches of Gulf Arab states suggest that the political value of disclosure ultimately depends on how governments balance immediate security goals with longer-term domestic and diplomatic considerations. In practical terms, it remains to be seen where that dynamic may leave things for networks and individuals perceived as close to Iran once the war comes to an end."}],"words":1447},{"type":"Article","region":"Iran","category":"Politics","title":"US sanctions on Iran put Armenia’s balancing act to the test","authors":["Rovshan Mammadli"],"date":"2026-11-04","url":"https://amwaj.media/en/article/us-sanctions-on-iran-put-armenias-balancing-act-to-the-test","img":"img/06.jpg","iw":1400,"ih":934,"alt":"","bottomLine":["Amid rising pressure to comply with US aviation sanctions targeting Iran, Armenian Prime Minister Nikol Pashinyan has said that Yerevan is transparent with all its partners, including Tehran. However, he also emphasized that Armenia will not cross one line—the risk of becoming subject to US sanctions.","US sanctions on Iran’s civil aviation sector have been fully in force since Sept. 23. Neighboring Georgia and Azerbaijan have both halted Iranian flights under US pressure, leaving Armenia the only South Caucasus state still allowing them. Going forward, Armenia could, like Iraq and Turkiye, seek a middle ground such as restricting only specific Iranian carriers or asking Washington for a waiver on selected routes or services.","Iran has long been an economic and strategic lifeline for Armenia, with bilateral trade of around 770M USD in 2025. Grounding Iranian flights could signal that Yerevan is willing to accommodate US pressure at the expense of a key regional partner.","As Iran’s air links shrink, Armenia could become an alternative gateway for Iranian travelers and goods heading to Georgia, the Black Sea and beyond. Iranians were the third-largest group of foreign tourists in Armenia in 2025, after Russians and Georgians.","Overland ties are already deepening. Iranian firms are building the Kajaran tunnel in Armenia’s southern Syunik Province, the two countries signed a customs protocol on Sept. 14 and Armenian Foreign Minister Ararat Mirzoyan discussed a second border bridge in Tehran on Oct. 5.","Armenian compliance with US sanctions could harden Iran’s opposition to the transit corridor brokered by US President Donald Trump, the Trump Route for International Peace and Prosperity (TRIPP). Armenia’s parliament recently ratified the initiative for Azerbaijan to reach its Nakhchivan exclave via Armenian territory."],"pull":"The US gains a direct presence in the region, particularly along the border with Iran, in a strategically crucial area,","blocks":[{"t":"p","html":"Armenia is now the only country in the South Caucasus still letting Iranian airlines fly in. New US sanctions on Iran’s civil aviation sector are testing how long that can last. “We are very transparent with all our partners. We will do our best to ensure that relations remain this way, especially with friendly countries. However, there is a line we cannot cross—that is the risk of Armenia itself becoming subject to sanctions,” Prime Minister Nikol Pashinyan <a href=\"https://en.apa.az/cis-countries/pm-pashinyan-does-not-rule-out-armenia-joining-us-sanctions-against-iran-527599\" target=\"_blank\" rel=\"noopener\">said</a> at a briefing on Oct. 1."},{"t":"p","html":"The unilateral US <a href=\"https://home.treasury.gov/news/press-releases/sb0623\" target=\"_blank\" rel=\"noopener\">sanctions</a> were announced on Sept. 8 and have been fully in force since Sept. 23, when a wind-down period ended. They threaten any entity providing services to Iranian carriers. <a href=\"https://civil.ge/archives/750668\" target=\"_blank\" rel=\"noopener\">Georgia</a> and <a href=\"https://report.az/en/infrastructure/new-us-sanctions-lead-to-suspension-of-iranian-flights-to-azerbaijan\" target=\"_blank\" rel=\"noopener\">Azerbaijan</a> have moved to comply with US demands to halt flights to and from Iran, and Armenia is now one of the few countries where Iranian airlines still operate."},{"t":"p","html":"Armenia relies heavily on its southern neighbor for transit, energy and trade, with bilateral trade <a href=\"https://arka.am/en/news/economy/armenia-and-iran-amid-new-us-sanctions-threats-reuters-describes-e-two-countries-economic-ties/\" target=\"_blank\" rel=\"noopener\">reaching</a> around 770M USD in 2025. Iran has long been an economic and strategic lifeline for Yerevan, particularly when Armenia was cut off from Azerbaijan and Turkiye during the Nagorno-Karabakh conflict."},{"t":"p","html":"Tehran’s importance grew after the 2020 war, as relations between Baku and Yerevan deteriorated and Iran positioned itself as a counterweight to what it saw as threats to the regional balance of power in the South Caucasus. Suspending Iranian flights would therefore mean more than a change in the civil aviation sector. It could signal that Yerevan is willing to accommodate US pressure at the expense of one of its most important regional partnerships."},{"t":"graph","id":"8404042"},{"t":"h","text":"A new gateway for Iran?"},{"t":"p","html":"The new US restrictions could reshape Iran’s regional connectivity. If direct flights to neighboring countries keep shrinking, Armenia may become more important as an alternative gateway into the South Caucasus."},{"t":"p","html":"That matters most for Iranian travelers. The number of Iranian tourists visiting Armenia <a href=\"https://arka.am/en/news/tourism/number-of-tourists-visiting-armenia-in-2025-increased-by-2-5-reaching-2-26-million/\" target=\"_blank\" rel=\"noopener\">increased</a> from 176,453 in 2024 to 182,364 in 2025, a rise of about 3.3%. Iranians made up around 8.1% of all foreign tourists in Armenia last year, the third-largest group after Russians and Georgians."},{"t":"p","html":"Yerevan could also become a transit point for passengers heading on to Georgia and beyond, now that Tbilisi has stopped direct Iranian flights. If air links from Iran shrink further, some travelers may fly to Armenia and continue overland, while others cross the Iran-Armenia border by road. That could lift demand for Armenia’s passenger transport, border infrastructure and logistics services."},{"t":"p","html":"The same could apply to trade. Restrictions on Iranian aviation do not remove demand for regional movement. Indeed, if anything, they could shift some traffic to land corridors. In that vein, Armenia could become a more important route for Iranian goods and passengers seeking access to the South Caucasus and the Black Sea, even though Turkiye remains Iran’s more established overland link to Europe."},{"t":"h","text":"Building the land route"},{"t":"p","html":"The groundwork for expanded land connections is already being laid. Iranian firms are <a href=\"https://storychase.co/news/iranian-companies-begin-construction-on-7-2-kilometer-kajaran-tunnel-to-bypass-western-sanctions/\" target=\"_blank\" rel=\"noopener\">working</a> on the Kajaran tunnel, a key section of the North-South highway in Armenia’s southern Syunik Province."},{"t":"p","html":"On Sept. 14, Eduard Hakobyan, chairman of Armenia’s State Revenue Committee, met Foroud Asgari, Iran’s deputy minister of economic affairs and finance and head of its customs administration. The two <a href=\"https://armenpress.am/en/article/1260362\" target=\"_blank\" rel=\"noopener\">signed</a> a protocol on exchanging advance information about goods and vehicles moving through both countries under the “Simplified Customs Corridor.” Under the agreement, cargo inspected on one side of the border will reportedly not undergo another thorough inspection on the other side, which may greatly facilitate trade."},{"t":"p","html":"At a visit to Tehran on Oct. 5, Armenian Foreign Minister Ararat Mirzoyan also <a href=\"https://www.aa.com.tr/en/eurasia/armenian-iranian-foreign-ministers-discuss-cooperation-in-energy-transport-infrastructure-development/4078763\" target=\"_blank\" rel=\"noopener\">discussed</a> plans for a second bridge on the Armenia-Iran border and measures to ease freight transport with his Iranian counterpart, Abbas Araghchi."},{"t":"graph","id":"24994997"},{"t":"h","text":"The TRIPP factor"},{"t":"p","html":"The picture is further complicated by a new <a href=\"https://amwaj.media/en/article/can-the-trump-route-in-the-south-caucasus-succeed-without-irans-buy-in\" target=\"_blank\" rel=\"noopener\">corridor</a> brokered by US President Donald Trump—the Trump Route for International Peace and Prosperity (TRIPP). The initiative seeks to link mainland Azerbaijan with its Nakhchivan exclave through Armenian territory along the Iranian border. Armenian officials have presented the route as a chance for Iran to join an emerging regional network, rather than as a project aimed against Tehran."},{"t":"p","html":"On Oct. 28, Armenia’s parliament <a href=\"https://jam-news.net/armenian-parliament-ratifies-framework-agreement-on-trump-route-tripp-project/\" target=\"_blank\" rel=\"noopener\">ratified</a> the framework agreement with the US on TRIPP by 63 votes to 32, with only the ruling Civil Contract faction voting in favor. A joint development company will run the route, with the US holding a 74% stake and Armenia 26% for an initial 49 years. If the deal is extended by another 50 years, Armenia’s stake would rise to 49%. The company’s charter and shareholders’ agreement have yet to be agreed."},{"t":"p","html":"Foreign Minister Mirzoyan <a href=\"https://horizonweekly.ca/en/armenian-parliament-ratifies-tripp-agreement-despite-opposition-objections/\" target=\"_blank\" rel=\"noopener\">insisted</a> that all infrastructure on Armenian territory would remain under Armenia’s sovereignty and jurisdiction. The opposition was not convinced. “The US gains a direct presence in the region, particularly along the border with Iran, in a strategically crucial area,” said Anna Grigoryan, head of the opposition Armenia faction."},{"t":"graph","id":"11866857"},{"t":"p","html":"The Islamic Republic opposes TRIPP, particularly over the presence of US personnel and the potential erosion of its strategic position along the border. In September, Iran reportedly <a href=\"https://eurasianet.org/start-date-for-tripp-trade-corridor-connecting-armenia-and-azerbaijan-pushed-back\" target=\"_blank\" rel=\"noopener\">warned</a> Pashinyan that American personnel deployed along the route would be considered “legitimate targets” in the event of a conflict."},{"t":"p","html":"Armenian compliance with US sanctions could harden Iran’s position on TRIPP further. As such, for Yerevan, the question of whether to sidestep Washington’s aviation restrictions is not simply about whether to let Iranian airlines keep flying in. It is about managing ties with Tehran while seeking closer integration with the US and greater western involvement in its regional infrastructure."},{"t":"p","html":"Other countries trying not to antagonize the Trump administration while keeping some air links with Iran have opted for targeted arrangements rather than blanket bans. Turkiye has <a href=\"https://www.middleeasteye.net/news/turkey-halts-iran-mahan-air-flights-over-us-sanctions-risk\" target=\"_blank\" rel=\"noopener\">suspended</a> Mahan Air flights but refrained from banning all Iranian commercial carriers. Iraq initially <a href=\"https://amwaj.media/en/article/deep-dive-iraq-caught-in-middle-as-trump-pursues-air-blockade-of-iran\" target=\"_blank\" rel=\"noopener\">halted</a> Iranian flights but later secured a US exemption allowing Iranian airlines, except Mahan Air, to fly to the holy city of Najaf."},{"t":"p","html":"Armenia could seek a similar middle ground if US pressure grows—for example, by restricting flights by specific carriers while letting other Iranian airlines keep serving Yerevan, or by seeking a US waiver for selected routes or services. That would reduce exposure to US secondary sanctions without severing an important channel to Tehran. But the broader dilemma would remain. The more Iran’s regional air links are disrupted, the more valuable Armenia becomes as an alternative gateway. Yet this puts greater pressure on Yerevan to choose between keeping that role and avoiding a confrontation with Washington"}],"words":1070},{"type":"Article","region":"Iran","category":"Society","title":"War and sanctions squeeze Iran's medicine supply by sea and air","authors":["A correspondent on the ground"],"date":"2026-11-03","url":"https://amwaj.media/en/article/war-and-sanctions-squeeze-irans-medicine-supply-by-sea-and-air","img":"img/07.jpg","iw":1400,"ih":926,"alt":"","bottomLine":["Iran makes most of its own medicine but depends on imports for the ingredients, the hard currency to buy them and the ships and planes that carry them. War, a US naval <a href=\"https://amwaj.media/en/media-monitor/deep-dive-as-diplomacy-falters-us-announces-naval-blockade-of-iran\" target=\"_blank\" rel=\"noopener\">blockade</a> and a widening sanctions campaign are squeezing all three.","Officials say the shortage is easing. Health Minister Mohammad Reza Zafarghandi <a href=\"https://www.tasnimnews.ir/fa/news/1405/06/23/3696187/\" target=\"_blank\" rel=\"noopener\">put</a> the number of essential medicines in short supply at 32 in September, about half the 63 before the Israeli-US strikes of Feb. 28. Pharmacists describe a far wider gap, with their association <a href=\"https://dailybuzz.ir/news/%D8%A8%D8%AF%D9%87%DB%8C-%DB%B7%DB%B7-%D9%87%D9%85%D8%AA%DB%8C-%D8%A8%DB%8C%D9%85%D9%87-%D8%A8%D9%87-%D8%AF%D8%A7%D8%B1%D9%88%D8%AE%D8%A7%D9%86%D9%87%D9%87%D8%A7-%D8%B1%DB%8C%D8%B4%D9%87-%DA%A9%D9%85%D8%A8%D9%88%D8%AF%D9%87%D8%A7%DB%8C-%D8%AF%D8%A7%D8%B1%D9%88%DB%8C%DB%8C-%DA%A9%D8%B4%D9%88%D8%B1/\" target=\"_blank\" rel=\"noopener\">reporting</a> about 70 vital medicines short in late August.","The blockade and Hormuz disruption have pushed imports onto costlier air and land routes. Washington then <a href=\"https://home.treasury.gov/news/press-releases/sb0623\" target=\"_blank\" rel=\"noopener\">sanctioned</a> 27 Iranian airlines on Sept. 8, hitting a route that already <a href=\"https://www.bourseandbazaar-substack.org/p/trumps-new-aviation-sanctions-threaten\" target=\"_blank\" rel=\"noopener\">carried</a> more than 60% of Iran's medical imports.","Tehran has <a href=\"https://tgju.live/news/3891344/%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%DB%B3%DB%B5-%D8%AF%D8%B1%D8%B5%D8%AF%DB%8C-%D9%BE%D8%B1%D8%AF%D8%A7%D8%AE%D8%AA%DB%8C-%D8%A8%DB%8C%D9%85%D8%A7%D8%B1%D8%A7%D9%86-%D8%A7%D8%B1%D8%B2-%D8%AA%D8%B1%D8%AC%DB%8C%D8%AD%DB%8C-%D8%AF%D8%A7%D8%B1%D9%88-%DB%B9%DB%B0%DB%B0-%D9%85%DB%8C%D9%84%DB%8C%D9%88%D9%86-%D8%AF%D9%84%D8%A7%D8%B1-%DA%A9%D8%A7%D9%87%D8%B4-%DB%8C%D8%A7%D9%81%D8%AA\" target=\"_blank\" rel=\"noopener\">cut</a> the subsidized foreign currency it sells to medicine importers from about 3.5B USD to 3B USD this year, down about 14%. The dollars drug makers buy outside the scheme have more than doubled in price, shifting costs from the state to companies and then to patients.","A Mehr News Agency price check <a href=\"https://www.mehrnews.com/news/6935132/\" target=\"_blank\" rel=\"noopener\">found</a> two common drugs, the painkiller acetaminophen-codeine and the antibiotic amoxicillin, up 374% and 284% in a year. Insulin has in some cases <a href=\"https://www.euronews.com/2026/09/11/war-sanctions-and-inflation-leave-iran-short-of-hundreds-of-medicines\" target=\"_blank\" rel=\"noopener\">reached</a> six times last year's price, and patients with chronic conditions are among the most exposed.","US sanctions do not formally <a href=\"https://ofac.treasury.gov/faqs/830\" target=\"_blank\" rel=\"noopener\">target</a> medicine. In practice, banking <a href=\"https://www.euronews.com/2026/09/11/war-sanctions-and-inflation-leave-iran-short-of-hundreds-of-medicines\" target=\"_blank\" rel=\"noopener\">restrictions</a> can still stop Iranian companies buying abroad. As long as shipping, flights and payments stay constrained, the cost will likely fall on pharmacies and patients rather than company balance sheets."],"pull":"","blocks":[{"t":"p","html":"While Iran <a href=\"https://insights.niacouncil.org/p/irans-drug-costs-rise-as-the-rial\" target=\"_blank\" rel=\"noopener\">produces</a> most of the medicine its population consumes, the ingredients, the hard currency to buy them and the ships and planes that carry them all come from abroad. Successive rounds of war with Israel and the US over recent years and now a US naval <a href=\"https://amwaj.media/en/media-monitor/deep-dive-as-diplomacy-falters-us-announces-naval-blockade-of-iran\" target=\"_blank\" rel=\"noopener\">blockade</a> alongside a widening sanctions campaign are squeezing all three at once."},{"t":"p","html":"The result is an acute pharmaceutical shortage that Iranian officials have said is easing. Despite this, pharmacists have increasingly complained that the scarcity runs far wider than the official count. Reports in Iranian media also <a href=\"https://www.mehrnews.com/news/6935132/\" target=\"_blank\" rel=\"noopener\">suggest</a> that the price of some common drugs has multiplied severalfold over the last year. Patients who depend on insulin, cancer treatments and vaccines are among the most exposed to the crisis."},{"t":"p","html":"What seems to set the current crisis apart from previous shortages is that the fallback routes are narrowing too. Medical cargo that previously arrived by sea has shifted to air, and Washington has now <a href=\"https://home.treasury.gov/news/press-releases/sb0623\" target=\"_blank\" rel=\"noopener\">sanctioned</a> Iran's airline sector. With subsidized foreign currency for medicine importers also being cut, the cost of keeping pharmacies stocked is moving from the state to drug makers, with Iranian patients bearing the brunt."},{"t":"h","text":"Counting the gaps"},{"t":"p","html":"Iranian pharmacists have been sounding the alarm over critical shortages since late August. Shahram Kalantari, head of the Iranian Pharmacists Association, <a href=\"https://dailybuzz.ir/news/%D8%A8%D8%AF%D9%87%DB%8C-%DB%B7%DB%B7-%D9%87%D9%85%D8%AA%DB%8C-%D8%A8%DB%8C%D9%85%D9%87-%D8%A8%D9%87-%D8%AF%D8%A7%D8%B1%D9%88%D8%AE%D8%A7%D9%86%D9%87%D9%87%D8%A7-%D8%B1%DB%8C%D8%B4%D9%87-%DA%A9%D9%85%D8%A8%D9%88%D8%AF%D9%87%D8%A7%DB%8C-%D8%AF%D8%A7%D8%B1%D9%88%DB%8C%DB%8C-%DA%A9%D8%B4%D9%88%D8%B1/\" target=\"_blank\" rel=\"noopener\">reported</a> at an Aug. 26 press conference that about 70 vital medicines were short out of about 3,000 formulations. Around 400 products were hard to find, he added, or about 800 once specific brands are counted."},{"t":"p","html":"By contrast, weeks later officials began describing a crisis that was easing. Health Minister Mohammad Reza Zafarghandi <a href=\"https://www.tasnimnews.ir/fa/news/1405/06/23/3696187/\" target=\"_blank\" rel=\"noopener\">told</a> a government meeting on Sept. 14 that prior to the Feb. 28 Israeli-US strikes on Iran, 63 essential medicines were in short supply, with 43 midway through the fighting before an April ceasefire, and 32 at the time of the meeting. Mehdi Pirsalehi, the deputy health minister who heads Iran's Food and Drug Administration (FDA), <a href=\"https://tgju.live/news/3891344/%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%DB%B3%DB%B5-%D8%AF%D8%B1%D8%B5%D8%AF%DB%8C-%D9%BE%D8%B1%D8%AF%D8%A7%D8%AE%D8%AA%DB%8C-%D8%A8%DB%8C%D9%85%D8%A7%D8%B1%D8%A7%D9%86-%D8%A7%D8%B1%D8%B2-%D8%AA%D8%B1%D8%AC%DB%8C%D8%AD%DB%8C-%D8%AF%D8%A7%D8%B1%D9%88-%DB%B9%DB%B0%DB%B0-%D9%85%DB%8C%D9%84%DB%8C%D9%88%D9%86-%D8%AF%D9%84%D8%A7%D8%B1-%DA%A9%D8%A7%D9%87%D8%B4-%DB%8C%D8%A7%D9%81%D8%AA\" target=\"_blank\" rel=\"noopener\">said</a> at a Sept. 15 press conference that shortages of essential medicines were at a low."},{"t":"p","html":"The two counts appear to measure different things. The ministry's figures track shortages on its list of essential medicines, while Kalantari's tally covers what pharmacies cannot supply across some 3,000 formulations. Even the 70 or so vital medicines he listed are more than twice the 32 the minister cited nearly three weeks later. By the ministry's count the shortage is shrinking, while the pharmacists' wider count describes a far larger one."},{"t":"p","html":"Kalantari put the pharmacies' shortages down to money rather than the war itself, citing a lack of liquidity, with insurers owing pharmacies some 770T IRR (282.8M USD). The war has nonetheless damaged production directly. Israeli-US strikes on Mar. 31 <a href=\"https://www.aljazeera.com/news/2026/3/31/cancer-drug-facility-religious-site-hit-in-israeli-us-strikes-on-iran\" target=\"_blank\" rel=\"noopener\">hit</a> Tofigh Daru, a large Tehran maker of anesthetics and cancer drugs, the Iranian government said. The firm was among several pharmaceutical plants reportedly <a href=\"https://amwaj.media/en/media-monitor/iran-war-sitrep-32-debate-on-deterring-israel-heats-up-as-iranian-pharmaceuticals\" target=\"_blank\" rel=\"noopener\">struck</a> during the war."},{"t":"h","text":"From sea to sky"},{"t":"p","html":"The US naval blockade of Iranian ports, <a href=\"https://www.euronews.com/2026/09/11/war-sanctions-and-inflation-leave-iran-short-of-hundreds-of-medicines\" target=\"_blank\" rel=\"noopener\">imposed</a> in April and only briefly lifted since, has cut into the seaborne pharmaceutical import route. With shipping through the Strait of Hormuz also disrupted, importers have turned to air and land routes that carry less and cost more."},{"t":"graph","id":"18143559"},{"t":"p","html":"India, one of the countries Iran buys pharmaceutical raw materials from, has become a point of public dispute in Tehran. In remarks <a href=\"https://parsi.euronews.com/2026/08/11/zafarghandi-india-conditioned-medicine-iran-war-passage-ships-hormuz\" target=\"_blank\" rel=\"noopener\">carried</a> by Euronews Persian on Aug. 11, Zafarghandi said India had not sent a single shipload of pharmaceutical ingredients during the war and had made deliveries conditional on Indian vessels being allowed through Hormuz."},{"t":"p","html":"Pirsalehi <a href=\"https://nournews.ir/fa/news/337900/%D9%87%D9%85%DA%A9%D8%A7%D8%B1%DB%8C-%D8%A8%D8%A7-%D9%87%D9%86%D8%AF-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AA%D8%A3%D9%85%DB%8C%D9%86-%D8%AF%D8%A7%D8%B1%D9%88\" target=\"_blank\" rel=\"noopener\">offered</a> a different account the same day. India's cooperation had been notable, the FDA chief said in comments published by Nournews, and the main obstacles were the lack of a direct land route, the blockade and refusals to accept Iranian flights on some routes."},{"t":"p","html":"However the cargo travels, freight has become far costlier. A ship can carry several thousand tons of raw materials while an aircraft takes 40 tons at most, Zafarghandi noted in the same report. On Sept. 14, Zafarghandi put the rise in transport costs at tenfold as cargo shifted to aircraft. Pirsalehi <a href=\"https://farsnews.ir/TM3827/1786869393704890158/%D9%BE%DB%8C%D8%B1%D8%B5%D8%A7%D9%84%D8%AD%DB%8C-%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%D9%87%D8%B2%DB%8C%D9%86%D9%87-%D8%AD%D9%85%D9%84-%D9%88-%D9%86%D9%82%D9%84-%D9%82%DB%8C%D9%85%D8%AA-%D8%AF%D8%A7%D8%B1%D9%88-%D8%B1%D8%A7-%D8%A8%D8%A7%D9%84%D8%A7-%D8%A8%D8%B1%D8%AF\" target=\"_blank\" rel=\"noopener\">stated</a> on Aug. 16 that the cost of shipping a container from China or India, about 2,000-3,000 USD before the war, had at times reached some 30,000 USD."},{"t":"p","html":"Air freight is now under pressure too. On Aug. 24, the US Treasury <a href=\"https://home.treasury.gov/news/press-releases/sb0613\" target=\"_blank\" rel=\"noopener\">launched</a> 'Operation Economic Outcast', describing it as \"an unprecedented, whole-of-government, economic campaign\" against Iran. On Sept. 8, the department sanctioned 27 Iranian airlines and <a href=\"https://home.treasury.gov/news/press-releases/sb0623\" target=\"_blank\" rel=\"noopener\">suspended</a> authorizations that had allowed foreign carriers to fly US-origin aircraft into Iran."},{"t":"graph","id":"24994997"},{"t":"p","html":"The timing matters because medicine already depended on air cargo far more than other goods. Customs data <a href=\"https://www.bourseandbazaar-substack.org/p/trumps-new-aviation-sanctions-threaten\" target=\"_blank\" rel=\"noopener\">cited</a> on Sept. 17 by the London-based think tank Bourse &amp; Bazaar show that slightly more than 60% of Iran's medical imports arrive by air, against 8.4% of imports overall."},{"t":"p","html":"The same data show that more than 30% of the medical cargo passing through Tehran's Imam Khomeini International Airport in the 10 months to Feb. 2026 was hormone medicines, a category that includes insulin and some cancer treatments, while vaccines accounted for slightly more than 10% and blood products for 6%."},{"t":"p","html":"US sanctions do not formally target medicine. Standing US Treasury <a href=\"https://ofac.treasury.gov/faqs/830\" target=\"_blank\" rel=\"noopener\">guidance</a> from 2020 states that those selling food, medicine or medical devices to Iran \"will not be subject to sanctions\" under the executive order now used against the airlines. Yet in practice, banking <a href=\"https://www.euronews.com/2026/09/11/war-sanctions-and-inflation-leave-iran-short-of-hundreds-of-medicines\" target=\"_blank\" rel=\"noopener\">restrictions</a> can stop Iranian companies from buying drugs and raw materials abroad even where the trade is formally legal, Euronews reported on Sept. 11. The airline measures now constrain the planes too."},{"t":"graph","id":"22440358"},{"t":"h","text":"Who foots the bill"},{"t":"p","html":"Tehran has long shielded medicine prices by selling importers foreign currency at a subsidized rate. That cushion is shrinking. Pirsalehi told the same Sept. 15 press conference that the allocation for medicine and medical equipment had fallen from about 3.5B USD in the last Iranian year to 3B USD in the current budget, down about 14%. A further 400M USD has been withdrawn since the year began in March, at his own agency's proposal, leaving the sector with about 900M USD less in subsidized currency."},{"t":"p","html":"The dollars that drug makers buy outside that scheme have become dearer too. Iranian companies obtained about 1.5B USD last year at 600,000-700,000 IRR to the dollar, Pirsalehi said, and that rate has since reached about 1.7M IRR, up roughly 140-180%."},{"t":"p","html":"For raw materials moved off the subsidized rate onto the second tier of Iran's official currency exchange, the cost of a dollar has jumped from 285,000 IRR to about 1.6M IRR, up about 460%, Hadi Ahmadi, spokesman of the Iranian Pharmacists Association, <a href=\"https://www.radiozamaneh.com/900415/\" target=\"_blank\" rel=\"noopener\">noted</a> in remarks reported by the Amsterdam-based, independent Persian-language outlet Radio Zamaneh on Sept. 13. That rate is still well below the open market's."},{"t":"p","html":"At the pharmacy counter, a price check <a href=\"https://www.mehrnews.com/news/6935132/\" target=\"_blank\" rel=\"noopener\">published</a> by Mehr News Agency on Sept. 4 found that acetaminophen-codeine had risen in a year from 1.37M IRR to 6.5M IRR (2.39 USD), up 374%, and amoxicillin from 3.2M IRR to 12.3M IRR (4.52 USD), up 284%. Insulin, which many diabetic patients need daily, has in some cases <a href=\"https://www.euronews.com/2026/09/11/war-sanctions-and-inflation-leave-iran-short-of-hundreds-of-medicines\" target=\"_blank\" rel=\"noopener\">reached</a> six times last year's price, according to the same Sept. 11 Euronews report."},{"t":"p","html":"Patients who cannot switch to another brand bear the greatest risk. \"Advanced therapies are especially vulnerable to sanctions barriers,\" the Bourse &amp; Bazaar report noted, since a few specialist manufacturers make them for small numbers of patients."},{"t":"p","html":"This season's influenza vaccine shows how late orders and blocked payments can keep a product out. Ahmadi <a href=\"https://farhikhteganonline.ir/news/249291\" target=\"_blank\" rel=\"noopener\">explained</a> to the daily Farhikhtegan on Sept. 6 that orders must be placed about eight months ahead and were not placed in time, and that a bank in Europe which handled the transfers had stopped processing them about six months earlier."},{"t":"p","html":"Iranian authorities are trying to secure more inputs at home. A trial crop of oleifera, a poppy variety, on nearly 10 hectares of state land, <a href=\"https://www.tasnimnews.ir/fa/news/1405/06/07/3683118/%DA%A9%D8%B4%D8%AA-%D8%A2%D8%B2%D9%85%D8%A7%DB%8C%D8%B4%DB%8C-%D8%B4%D9%82%D8%A7%DB%8C%D9%82-%D8%A7%D9%8F%D9%84%DB%8C-%D9%81%D8%B1%D8%A7-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AA%D8%A3%D9%85%DB%8C%D9%86-%D9%85%D9%88%D8%B1%D9%81%DB%8C%D9%86-%D9%85%D9%88%D8%B1%D8%AF-%D9%86%DB%8C%D8%A7%D8%B2-%D8%AF%D8%A7%D8%B1%D9%88%DB%8C%DB%8C-%DA%A9%D8%B4%D9%88%D8%B1\" target=\"_blank\" rel=\"noopener\">announced</a> on Aug. 29 by Deputy Agriculture Minister Mohammad-Mehdi Boroumandi, is meant to yield the morphine that drug makers have so far <a href=\"https://www.khabaronline.ir/news/2282123/%D8%A7%D8%B3%D8%AA%D8%A7%D9%85%DB%8C%D9%86%D9%88%D9%81%D9%86-%DA%A9%D8%AF%D8%A6%DB%8C%D9%86-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%DA%A9%D9%85%DB%8C%D8%A7%D8%A8-%D9%85%DB%8C-%D8%B4%D9%88%D8%AF-%D8%AA%D9%88%D8%B6%DB%8C%D8%AD-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D8%BA%D8%B0%D8%A7-%D9%88-%D8%AF%D8%A7%D8%B1%D9%88\" target=\"_blank\" rel=\"noopener\">drawn</a> mainly from narcotics seizures. But as long as shipping, flights and payments remain constrained together, the cost of this crisis will likely be felt less on company balance sheets than in pharmacies and in patients' daily lives."}],"words":1369},{"type":"Media Monitor","region":"Iraq","category":"Politics","title":"Iraq's integration of PKK-linked armed force stirs fight over Yazidi identity","authors":["Amwaj.media Staff"],"date":"2026-11-03","url":"https://amwaj.media/en/media-monitor/iraqs-integration-of-pkk-linked-armed-force-stirs-fight-over-yazidi-identity","img":"img/08.jpg","iw":1400,"ih":935,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> An integration deal on one of Iraq’s thorniest security disputes may be redrawing the political map of the Yazidi heartland of Sinjar. Baghdad has <a href=\"https://www.shafaq.com/en/Iraq/YB-4-000-fighters-join-Iraqi-forces\" target=\"_blank\" rel=\"noopener\">begun</a> folding thousands of fighters from the Kurdistan Workers' Party (PKK)-linked Sinjar Resistance Units (YBS) into Iraqi forces under terms reached at recent <a href=\"https://rudaw.net/english/categories/iraq/1079243\" target=\"_blank\" rel=\"noopener\">talks</a> in the federal capital. The fallout has spilled into a blunt argument among Yazidi and Kurdish voices over identity and representation."},{"t":"p","html":"<strong>The coverage:</strong> The integration was the result of <a href=\"https://rudaw.net/english/categories/iraq/1079243\" target=\"_blank\" rel=\"noopener\">talks</a> in Baghdad on Sept. 11 between Prime Minister Ali Al-Zaidi, the YBS—a Yazidi armed group—and the Yazidi Cause Alliance, a parliamentary bloc led by MP Murad Ismael."},{"t":"ul","items":["The 2020 Sinjar Agreement, a UN-backed deal between Baghdad and Erbil, was meant to <a href=\"https://en.964media.com/41096/\" target=\"_blank\" rel=\"noopener\">hand</a> security in the district to federal and local forces and remove armed groups including the PKK.","In keeping with the terms of the Zaidi-YBS deal, Iraqi troops took over a strategic YBS <a href=\"https://shafaq.com/en/Security/Committees-to-begin-integrating-YB-fighters-into-Iraqi-forces\" target=\"_blank\" rel=\"noopener\">position</a> on Mount Sinjar on Oct. 26, the day the PKK-linked group announced its fighters had joined federal forces."]},{"t":"graph","id":"12764143"},{"t":"p","html":"Even before that takeover, the question of who speaks for the district’s Yazidis had spilled onto the airwaves."},{"t":"ul","items":["During a heated Oct. 25 debate on the pro-PKK Kurdish channel Nuce TV, activist Reham Hassan <a href=\"https://x.com/KurdistanWatch/status/2114336987767353683\" target=\"_blank\" rel=\"noopener\">declared</a>, “We are neither Kurds nor Arabs, we are Yazidis.”"]},{"t":"p","html":"Ismael entered the row on Oct. 29."},{"t":"ul","items":["The Yazidi Cause Alliance leader <a href=\"https://x.com/murad_ismael/status/2115564569712013722\" target=\"_blank\" rel=\"noopener\">wrote</a> in a post to Twitter/X that he had been elected “with 50,000 Yazidi votes,” only to be told by “those who lost those votes” that he did not represent the community.","The MP urged critics to let each Yazidi identify “as Yazidi by ethnicity or Kurdish by ethnicity,” cautioning that the dispute could otherwise cross “the point of no return.”"]},{"t":"p","html":"Among Iraqi Kurdish observers, Ismael’s challenge drew both sympathy and scorn the same day."},{"t":"ul","items":["Journalist Renwar Najm <a href=\"https://x.com/RenwarNajm/status/2115572457037787438\" target=\"_blank\" rel=\"noopener\">argued</a> that Kurds could not deny Yazidis the right to self-identification they demand for themselves.","Serbest Ferhan Sindi, a Duhok-based foreign affairs commentator, <a href=\"https://x.com/serbesttsindi/status/2115739384121016395\" target=\"_blank\" rel=\"noopener\">derided</a> Ismael as a “seat for sale,” dismissing as “an outright lie” his claim that Baghdad, not Erbil, had embraced the Yazidi community."]},{"t":"p","html":"For others, the identity row masked a more concrete loss for the Kurdistan Democratic Party (KDP)."},{"t":"ul","items":["On Oct. 27, prominent X account Kurdistan Watch <a href=\"https://x.com/KurdistanWatch/status/2115123168553869775\" target=\"_blank\" rel=\"noopener\">concluded</a> that the KDP “appears to have been sidelined” from decisions on Sinjar.","Iraqi journalist and analyst Ahmed Al-Hamdani <a href=\"https://x.com/ahmedfaresalham/status/2115839047473955301\" target=\"_blank\" rel=\"noopener\">argued</a> on Oct. 29 that Erbil could not be shut out of Sinjar’s security, since the Peshmerga had liberated it from the Islamic State group (IS) in 2015. Baghdad had instead taken Mount Sinjar “without involving Erbil,” he wrote."]},{"t":"graph","id":"12553796"},{"t":"p","html":"<strong>The context/analysis:</strong> The KDP’s exclusion from the YBS integration appears less a sudden rupture than the culmination of more than a decade of eroding influence in Sinjar, even as it has kept the Yazidi quota seat."},{"t":"ul","items":["That decline began in 2014, when the Erbil-based party’s affiliated Peshmerga <a href=\"https://www.kirkuknow.com/en/news/67580\" target=\"_blank\" rel=\"noopener\">withdrew</a> in the face of the IS advance into northern Iraq. In the ensuing attack on Sinjar, more than 3,100 Yazidis were <a href=\"https://amwaj.media/en/article/yazidi-political-upstarts-look-beyond-quota-seat-in-iraqi-elections\" target=\"_blank\" rel=\"noopener\">killed</a> and upwards of 6,800 abducted.","The YBS was among the groups that moved into the space the KDP had vacated, as <a href=\"https://amwaj.media/en/article/yazidi-political-upstarts-look-beyond-quota-seat-in-iraqi-elections\" target=\"_blank\" rel=\"noopener\">resentment</a> over “Kurdification” pushed Yazidi political identity away from Erbil and toward Baghdad."]},{"t":"p","html":"The KDP has since appeared unable to restore its pre-2014 grip on Sinjar. Kurdish forces including the Peshmerga and PKK fighters <a href=\"https://www.rudaw.net/english/categories/kurdistan/1012141\" target=\"_blank\" rel=\"noopener\">retook</a> Sinjar town in Nov. 2015, then <a href=\"https://www.shafaq.com/en/Report/Iraq-Stabilising-the-Contested-District-of-Sinjar\" target=\"_blank\" rel=\"noopener\">split</a> control of the district. A Peshmerga-aligned force <a href=\"https://rudaw.net/english/kurdistan/040320172\" target=\"_blank\" rel=\"noopener\">clashed</a> with the YBS in Sinjar’s Khanasor on Mar. 3, 2017."},{"t":"ul","items":["The Peshmerga left Sinjar town in Oct. 2017, weeks after the Sept. 25 Iraqi Kurdistan independence referendum, as federal troops and the Popular Mobilization Units (PMU) <a href=\"https://arabnews.com/node/1178846\" target=\"_blank\" rel=\"noopener\">moved</a> in with little fighting. The KDP <a href=\"https://www.shafaq.com/en/Report/Iraq-Stabilising-the-Contested-District-of-Sinjar\" target=\"_blank\" rel=\"noopener\">relocated</a> its Sinjar administrators to Duhok Governorate."]},{"t":"p","html":"In Iraq’s Dec. 2023 governorate-level elections, some observers saw the KDP as having <a href=\"https://amwaj.media/en/article/yazidi-political-upstarts-look-beyond-quota-seat-in-iraqi-elections\" target=\"_blank\" rel=\"noopener\">underperformed</a> in Sinjar. In the Nov. 2025 parliamentary polls, the KDP <a href=\"https://amwaj.media/en/article/how-establishment-parties-continue-to-dominate-minority-politics-in-iraq\" target=\"_blank\" rel=\"noopener\">kept</a> the Yazidi quota seat, which is open to non-Yazidi electors, with 9,687 votes."},{"t":"ul","items":["Ismael’s Yazidi list <a href=\"https://shafaq.com/en/Iraq/IHEC-publishes-final-results-of-Iraq-s-2025-parliamentary-elections\" target=\"_blank\" rel=\"noopener\">took</a> 49,211 votes and a general seat in Nineveh, outside the quota, arguably undercutting the Erbil-based party’s claim to speak for the community."]},{"t":"p","html":"Sinjar’s status also remains formally unsettled. Article 140 of Iraq’s 2005 constitution requires normalization of demographic changes, a census and a referendum to settle territories disputed between Baghdad and Erbil. The 2007 deadline has long since passed without resolution."},{"t":"ul","items":["In a reported late October <a href=\"https://www.kurdistan24.net/en/story/949949/article-140-committee-declares-demographic-changes-in-sinjar-invalid\" target=\"_blank\" rel=\"noopener\">letter</a>, Badr Organization Secretary-General Hadi Al-Ameri, who chairs the Article 140 committee, listed Sinjar as disputed and called any administrative step causing demographic change in Nineveh Governorate “illegal and invalid.”","The KDP’s Nineveh office <a href=\"https://kdp.info/ar/a/116435\" target=\"_blank\" rel=\"noopener\">insisted</a> on Oct. 29 that the party “was and remains the principal defender” of Sinjar, daring critics to hold a referendum among Yazidis on their future."]},{"t":"p","html":"The integration also seems to bear a Turkish imprint. In September, Iraq and Turkiye <a href=\"https://shafaq.com/en/Iraq/Ankara-welcomes-Iraqi-takeover-of-Sinjar-security\" target=\"_blank\" rel=\"noopener\">agreed</a> to restore full federal authority in Sinjar alongside a handover of the Bashiqa-Zilkan base, a Turkish outpost near Mosul."},{"t":"ul","items":["On Oct. 28, Turkiye’s defense ministry <a href=\"https://shafaq.com/en/Iraq/Ankara-welcomes-Iraqi-takeover-of-Sinjar-security\" target=\"_blank\" rel=\"noopener\">said</a> progress in Sinjar had cleared the way for the Bashiqa-Zilkan handover, a step that dovetails with Ankara’s ongoing peace process with the PKK. The armed group’s fighters <a href=\"https://shafaq.com/en/Kurdistan/PKK-fighters-exit-Turkiye\" target=\"_blank\" rel=\"noopener\">withdrew</a> from Turkiye into northern Iraq in Oct. 2025."]},{"t":"p","html":"By beginning to fold the YBS into the state’s armed forces, Baghdad may have deprived the KDP of what was arguably one of its strongest arguments for reclaiming influence in Sinjar, namely that a PKK-linked force remained outside federal control."},{"t":"p","html":"<strong>The future:</strong> With Sinjar’s security order being rewritten without the KDP, the fight is likely to turn to who governs the district."},{"t":"ul","items":["Whether the late October Article 140 letter binds any new local appointment is unclear, since it overturned no specific local decision. The letter’s wording could still give the KDP grounds to challenge an appointment the party did not accept, by framing it as demographic change.","The KDP’s Oct. 29 referendum call, which its statement did not tie to Article 140, would ask Yazidis themselves to settle who speaks for them, after Ismael’s list drew far more votes than the party’s quota winner.","If Baghdad fills Sinjar’s civilian posts without a KDP role, such an approach could form a model of dealing directly with local actors while bypassing Erbil entirely. At the same time, any seemingly unilateral moves could weaken the Baghdad-Erbil framework initially envisaged in the 2020 Sinjar Agreement."]}],"words":418},{"type":"Media Monitor","region":"Iran","category":"Diplomacy","title":"Iran-US diplomacy stepped up amid signs of impending escalation","authors":["Amwaj.media Staff"],"date":"2026-11-02","url":"https://amwaj.media/en/media-monitor/iran-us-diplomacy-stepped-up-amid-signs-of-impending-escalation","img":"img/09.jpg","iw":1400,"ih":932,"alt":"","bottomLine":[],"pull":"","blocks":[{"t":"p","html":"<strong>The story:</strong> Iran and the US are pursuing diplomacy to avert war amid warnings from Tehran that a new attack would draw a response beyond the region. In parallel, Mohsen Rezaee, secretary of the Supreme National Security Council (SNSC), has set out the Islamic Republic’s vision for regional security, its nuclear doctrine and view of US proposals. Meanwhile, Foreign Minister Abbas Araghchi says the Strait of Hormuz could reopen within two days if Iran’s conditions are met, indicating that measures related to the country’s nuclear program will only be taken in a “second phase.”"},{"t":"p","html":"This comes as Qatar is stepping up its efforts to facilitate dialogue. Doha <a href=\"https://x.com/BashaReport/status/2116770594234474721\" target=\"_blank\" rel=\"noopener\">sent</a> a senior delegation to a day-trip to Tehran on Oct. 30. Speaking to Amwaj.media, a senior Iranian political source confirmed that Deputy Foreign Minister Kazem Gharibabadi had traveled to Qatar the following day and returned to Iran late on Nov. 1."},{"t":"p","html":"<strong>The coverage:</strong> In a wide-ranging <a href=\"https://www.irib-news.ir/fa/news/5953780\" target=\"_blank\" rel=\"noopener\">interview</a> on state television on Oct. 31, Rezaee outlined a new regional security framework involving Iran and other major regional powers, including Pakistan, Saudi Arabia and Turkiye."},{"t":"ul","items":["Referring to the four nations’ Oct. 26 <a href=\"https://amwaj.media/en/article/inside-story-will-rare-gathering-in-tehran-help-avert-iran-us-war\" target=\"_blank\" rel=\"noopener\">meeting</a> in Tehran, the SNSC secretary said the talks had focused on security arrangements independent of outside powers.","Rezaee said he found the other nations’ visions for the region “interesting,” adding that in their positions on Israel they had become “more Hezbollahi [zealous] than many of our friends.”","Saudi Defense Minister Prince Khalid bin Salman Al Saud had told him that after Iran, Israel would go after Turkiye and then Saudi Arabia, Rezaee said, a view he indicated that Turkiye’s visiting spy chief shared."]},{"t":"graph","id":"29182722"},{"t":"p","html":"In the Oct. 31 interview, Rezaee also <a href=\"https://www.saat24.news/news/742519\" target=\"_blank\" rel=\"noopener\">confirmed</a> receiving a <a href=\"https://x.com/BarakRavid/status/2115588055021035522\" target=\"_blank\" rel=\"noopener\">letter</a> from US Vice President JD Vance, saying he had read it but had not yet responded."},{"t":"ul","items":["“The tone of the letter has completely changed and is different from [US President Donald] Trump’s previous letter,” Rezaee said, calling the shift a sign that the Iranian nation had consolidated its victory and authority.","Rezaee said Washington had submitted three successive proposals, each better than the last. The first was unacceptable, the second raised suspicions that Washington planned to attack Iran after the US congressional elections, and the third still contained ambiguities.","Iran is still reviewing Vance’s proposal, the security chief said. “We told them that we have no negotiations with you,” he added, saying the Strait of Hormuz would not reopen until Iran’s <a href=\"https://amwaj.media/en/media-monitor/inside-story-iran-sets-conditions-for-talks-amid-warning-of-us-onslaught\" target=\"_blank\" rel=\"noopener\">conditions</a> are met."]},{"t":"p","html":"Araghchi, meanwhile, has <a href=\"https://snn.ir/fa/news/1481449\" target=\"_blank\" rel=\"noopener\">outlined</a> a revised plan to reopen the maritime chokepoint, replacing an earlier seven-day and then five-day timeline with a two-day one following proposals from Qatar."},{"t":"ul","items":["Speaking to Qatari-funded <a href=\"https://www.aljazeera.com/news/2026/10/31/iran-fm-says-us-outreach-a-positive-step-as-delegation-in-qatar-for-talks\" target=\"_blank\" rel=\"noopener\">Al-Jazeera</a> on Oct. 31, the foreign minister described a sequence of reciprocal steps. The United States would take a series of measures on the first day, and on the second, the strait would reopen to normal traffic. Notably, he also suggested that shipping should resume through new routes agreed with Oman.","“Our conditions include lifting the sanctions imposed following the [June 2026] Islamabad memorandum and reducing US forces in the region,” Araghchi elaborated, adding, “We demand the restoration of oil waivers and the release of all our frozen funds, including those held in Qatar.”","Importantly, Araghchi clarified that “mediators have presented proposals concerning the nuclear dossier, which we are currently reviewing as part of the second phase.” This indicates that nuclear-related measures will not be taken prior to the reopening of traffic through Hormuz."]},{"t":"graph","id":"28119382"},{"t":"p","html":"Hours before the Oct. 31 interview, the office of Supreme Leader Ayatollah Mojtaba Khamenei <a href=\"https://rahbar.ir/news?cid=2283\" target=\"_blank\" rel=\"noopener\">issued</a> a statement about his meeting with senior military commanders."},{"t":"ul","items":["Khamenei described “smart combat readiness to forcefully confront adversaries” as a prerequisite for “maximum deterrence,” the statement said. Any threat, whatever its scale or nature, must meet “an immediate and effective response unrestricted by geographic boundaries,” he added.","Building on those remarks, Mohammad Mokhber, a senior advisor to former supreme leader Ayatollah Ali Khamenei, <a href=\"https://x.com/MokhberOfficial/status/2116896535741075514\" target=\"_blank\" rel=\"noopener\">wrote</a> on Twitter/X on Nov. 1 that Iran’s “defensive doctrine is rapidly evolving” and that “the redefined scope of deterrence now extends beyond regional boundaries.”"]},{"t":"p","html":"Separately, Iran on Nov. 1 <a href=\"https://x.com/IranNuances/status/2116796207972630771\" target=\"_blank\" rel=\"noopener\">designated</a> the UK Royal Navy and Royal Air Force as “terrorist organizations” and the MI6 intelligence service a “hostile group.”"},{"t":"ul","items":["Tehran cited Britain’s support for Israel and the United States in the war on Iran and its <a href=\"https://www.tehrantimes.com/news/531732/Iran-designates-MI6-Royal-Navy-and-RAF-under-reciprocal-measures\" target=\"_blank\" rel=\"noopener\">listing</a> of the Islamic Revolutionary Guard Corps (IRGC) under British state threats legislation in July.","Prominent conservative commentator Ali Gholhaki <a href=\"https://x.com/aghplt/status/2116635389519626368\" target=\"_blank\" rel=\"noopener\">speculated</a> on Oct. 31 that by no longer limiting its targets to the region, Iran was sending Europe a message."]},{"t":"p","html":"In his Oct. 31 interview, Rezaee also <a href=\"https://www.asriran.com/fa/news/1202914\" target=\"_blank\" rel=\"noopener\">addressed</a> growing calls inside Iran to reassess the country’s nuclear doctrine after Israeli and US attacks on its nuclear facilities."},{"t":"ul","items":["Rezaee acknowledged that public pressure for change was growing. “There is a public demand for a shift in the nuclear doctrine,” he said, adding that Iranians were asking why the country should keep its approach when its nuclear facilities had been bombed despite its declared peaceful activities.","The SNSC secretary stressed, however, that no official decision had been made and that the council had held no meetings to change the doctrine. “So far, no new decision has been made by the [political] establishment,” he said."]},{"t":"p","html":"Officials and commentators have been <a href=\"https://amwaj.media/en/media-monitor/as-irans-nuclear-chief-is-kept-from-iaea-calls-grow-to-exit-npt\" target=\"_blank\" rel=\"noopener\">debating</a> for months <a href=\"https://x.com/BabakVahdad/status/2116762222005493944\" target=\"_blank\" rel=\"noopener\">whether</a> Iran should withdraw from the Treaty on the Non-Proliferation of Nuclear Weapons (NPT) and acquire atomic bombs. On Oct. 31, outlets across the political spectrum weighed in."},{"t":"ul","items":["IRGC-affiliated Tasnim News Agency <a href=\"https://www.tasnimnews.ir/fa/news/1405/08/09/3736681\" target=\"_blank\" rel=\"noopener\">argued</a> for leaving the NPT. It cited past claims that inspectors from the International Atomic Energy Agency (IAEA) had passed information on assassinated nuclear scientists to enemy intelligence services.","Conservative news website Nour News, close to the late former SNSC secretary Ali Shamkhani, <a href=\"https://nournews.ir/fa/news/356765\" target=\"_blank\" rel=\"noopener\">acknowledged</a> the growing public calls but cautioned that turning them into policy is a “political and strategic decision” requiring expert assessment.","Reformist daily Hammihan <a href=\"https://hammihanonline.ir/fa/tiny/news-76621\" target=\"_blank\" rel=\"noopener\">questioned</a> whether nuclear weapons are a widespread demand, pointing to a fatwa by the late former supreme leader banning weapons of mass destruction."]},{"t":"graph","id":"22963043"},{"t":"p","html":"<strong>The context/analysis:</strong> Araghchi’s two-day plan comes days after Iran reportedly told the Mecca Defense Pact nations—Pakistan, Saudi Arabia and Turkiye—that it would shorten its original seven-day timeline if that would persuade the United States to <a href=\"https://amwaj.media/en/media-monitor/inside-story-iran-sets-conditions-for-talks-amid-warning-of-us-onslaught\" target=\"_blank\" rel=\"noopener\">accept</a> its proposal."},{"t":"ul","items":["According to Ali Baqeri-Kani, deputy for foreign policy and international security at the SNSC secretariat, Rezaee <a href=\"https://x.com/SaraMassoumi/status/2114806826969764218\" target=\"_blank\" rel=\"noopener\">told</a> the visiting delegations that Iran could accept five or even four days instead of seven. Araghchi has now cut that to two.","Iran’s proposal has seven conditions, only some of which have been made public. These include lifting new US sanctions, ending the naval blockade, releasing frozen Iranian assets and restoring Iran’s ability to export oil."]},{"t":"chart","src":"img/c-lob09.png","w":1220,"h":986,"title":"","link":"https://datawrapper.dwcdn.net/lob09/"},{"t":"p","html":"Iranian officials are increasingly <a href=\"https://amwaj.media/en/media-monitor/iran-signals-readiness-for-war-amid-claims-that-strikes-have-already-begun\" target=\"_blank\" rel=\"noopener\">warning</a> that any renewed confrontation with Israel and the United States could have consequences far beyond West Asia."},{"t":"ul","items":["The Qatari mediation is unfolding alongside claims of Israeli-US plans for fresh strikes after the US congressional midterm elections on Nov. 3."]},{"t":"p","html":"The debate on nuclear weapons in Iran has also officially moved into the mainstream. Advocacy for atomic arms was long a political taboo under Ayatollah Ali Khamenei, who had issued a religious edict prohibiting them."},{"t":"ul","items":["Signs of a possible shift emerged as early as 2024, when Iranian officials <a href=\"https://amwaj.media/en/media-monitor/iran-floats-expanded-missile-range-amid-vows-of-crushing-response-to-israel\" target=\"_blank\" rel=\"noopener\">suggested</a> that Tehran could reconsider its self-imposed ban on nuclear weapons if the country faced an existential threat.","Discussion of a nuclear deterrent gained momentum toward the end of the former supreme leader’s rule, particularly after Israeli-US strikes on Iranian nuclear facilities in June 2025.","Ali Khamenei’s death in an Israeli strike on his Tehran compound in late February marked a turning point in the debate. Now even some Friday prayer leaders are using their platform to <a href=\"https://www.bbc.com/persian/articles/cq98zre0j9d1o\" target=\"_blank\" rel=\"noopener\">push</a> for a change in Iran’s nuclear doctrine."]},{"t":"p","html":"<strong>The future:</strong> Diplomacy and military preparation are running in parallel, with no clear sign of which will prevail. Tehran’s answer to the latest US proposal, and Washington’s response to the two-day plan, may show whether talks can head off renewed Israeli-US strikes."},{"t":"ul","items":["The United States has reportedly <a href=\"https://www.aa.com.tr/en/us-israel-iran-war/us-deploys-10-military-cargo-planes-to-israel-amid-preparations-for-possible-strike-on-iran-report/4105548\" target=\"_blank\" rel=\"noopener\">moved</a> military cargo and aerial refueling planes to Israel and <a href=\"https://www.wsj.com/world/middle-east/u-s-warns-gulf-of-possible-short-intense-renewal-of-iran-war-after-midterms-cd1a55e1\" target=\"_blank\" rel=\"noopener\">warned</a> its allies in the region that a “short, intense military campaign” against Iran is possible after the midterms.","When attacked earlier this year, Iran lashed out by striking civilian and military sites in Gulf Arab states and Israel, saying it was targeting US interests.","Iran’s threat now is that renewed conflict would see it expand its targets beyond the region, though what that would entail remains unclear. In addition, top Iranian officials have said that new weapons will be unveiled, leaving ambiguity about what type of capabilities may be deployed."]}],"words":485},{"type":"Article","region":"Iran","category":"Economy","title":"Direct subsidies fall short of addressing social welfare in Iran","authors":["Bijan Khajehpour"],"date":"2026-11-02","url":"https://amwaj.media/en/article/direct-subsidies-fall-short-of-addressing-social-welfare-in-iran","img":"img/10.jpg","iw":1400,"ih":933,"alt":"","bottomLine":["Iran's government increasingly relies on direct cash subsidies to cushion households against high inflation and a weakening currency, while repeatedly changing the eligibility rules as it tries to reach the most vulnerable families.","The 2010 Targeted Subsidies Reform Plan replaced parts of the old price-subsidy system with direct cash handouts. A Jan. 2026 study has found that the reform initially reduced income inequality, but that the gains weakened amid later economic turbulence.","This year, the official annual salary increase was 40% while annual inflation stood around 70%, eroding the real value of transfers. The average family now eats less meat and cuts back on some basic expenses, including healthcare.","Middle-income families are especially exposed. They may earn too much to qualify for the most generous assistance yet struggle to cover rent, healthcare and education, drawing down savings and relying on relatives, including members of the diaspora, as they slide toward the poverty line.","Cash handouts do not address the forces eroding incomes, such as budget deficits, monetary pressures and currency depreciation. Persistent inflation erodes their value, and raising payments to compensate strains an already stretched budget, a cycle that also explains the hesitation over planned fuel subsidy reforms.","This year's budget removed cash subsidies from higher-income deciles and redirected resources to poorer households through electronic cards for essential goods. A sustainable approach would combine well-targeted transfers with regular checks on purchasing power, transparent eligibility criteria, better household data from the upcoming census and measures to ease inflation."],"pull":"","blocks":[{"t":"p","html":"Faced with high inflation and a falling currency, the Iranian government has come to rely on direct subsidies to cushion households against the rising cost of living. As the authorities try to channel cash support to the most vulnerable families and redefine who is eligible, households face continual <a href=\"https://www.eghtesadonline.com/fa/news/2168984/%D9%82%D8%A7%D9%86%D9%88%D9%86-%D9%88%D8%A7%D8%B1%DB%8C%D8%B2-%DA%A9%D8%A7%D9%84%D8%A7%D8%A8%D8%B1%DA%AF-%D8%A7%D9%84%DA%A9%D8%AA%D8%B1%D9%88%D9%86%DB%8C%DA%A9%DB%8C-%D8%AF%DA%AF%D8%B1%DA%AF%D9%88%D9%86-%D8%B4%D8%AF-%D9%85%D8%B9%DB%8C%D8%A7%D8%B1-%D8%AC%D8%AF%DB%8C%D8%AF-%D8%AF%D9%88%D9%84%D8%AA-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%DA%A9%D8%A7%D9%84%D8%A7%D8%A8%D8%B1%DA%AF-%D8%A7%D8%B9%D9%84%D8%A7%D9%85-%D8%B4%D8%AF\" target=\"_blank\" rel=\"noopener\">changes</a> to the rules."},{"t":"p","html":"Yet the effectiveness of these subsidies depends on whether they preserve purchasing power. When food, housing and other essential costs rise faster than incomes, assistance can bring immediate relief without halting a longer-term decline in living standards. For lower-income families, this means ever harder choices over basic consumption. For parts of the middle class, it means a gradual erosion of savings and financial security."},{"t":"p","html":"The question is therefore not how much the government distributes, but whether the payments protect households at all in an economy where persistent inflation, currency depreciation and structural constraints keep undermining their welfare."},{"t":"graph","id":"20029549"},{"t":"h","text":"From price subsidies to cash handouts"},{"t":"p","html":"Iran's subsidy system has evolved through repeated attempts to reconcile social protection with the cost of keeping essential goods and energy artificially cheap. The 2010 Targeted Subsidies <a href=\"https://www.imf.org/en/publications/wp/issues/2016/12/31/iran-the-chronicles-of-the-subsidy-reform-25044\" target=\"_blank\" rel=\"noopener\">Reform</a> Plan replaced parts of the old price-subsidy system with direct cash handouts to households. The rationale was that transferring resources directly to citizens would spread the benefits of public support more fairly than subsidizing production and imports."},{"t":"p","html":"There is evidence that such a model can deliver meaningful redistributive gains. A Jan. 2026 <a href=\"https://www.tandfonline.com/doi/full/10.1080/00036846.2025.2612269\" target=\"_blank\" rel=\"noopener\">study</a> of the reform between 2010 and 2019 found a significant initial reduction in income inequality. However, the gains weakened amid later economic turbulence, underlining the importance of sustainable financing and macroeconomic stability. Cash transfers improve household welfare less and less when essential prices keep rising and payments are not adjusted."},{"t":"graph","id":"18454698"},{"t":"p","html":"This year's figures show the scale of the challenge. The official annual salary <a href=\"https://pishkhanak.com/blog/salary-increase-1405-minimum-wage\" target=\"_blank\" rel=\"noopener\">increase</a> was 40%, while annual <a href=\"https://statisticsoftheworld.com/blog/iran-economy-2026-war-hormuz-crisis-inflation\" target=\"_blank\" rel=\"noopener\">inflation</a> stands around 70%, putting the average family's welfare under severe pressure. Cash handouts should therefore be judged not by the nominal amount distributed, but by the essential goods and services recipients can afford with it. The mismatch explains why the average family now consumes <a href=\"https://thread.news/article/iranian-households-face-declining-consumption-of-red-meat-and-dairy-products-644b34\" target=\"_blank\" rel=\"noopener\">less</a> meat and forgoes some basic expenses such as healthcare."},{"t":"p","html":"The impact on the lower and middle classes also needs to be distinguished. For the poorest households, direct transfers can help prevent an immediate fall in food consumption and other basic needs. For middle-income families, the problem can be less visible but no less serious. Maintaining a modest standard of living becomes increasingly difficult even when household members remain employed."},{"t":"p","html":"A family may earn too much to qualify for the most generous forms of assistance while still struggling to cover rent, healthcare and education. Such households can find themselves squeezed between eligibility criteria that classify them as relatively secure and an economic reality that leaves them little financial resilience."},{"t":"graph","id":"10503019"},{"t":"p","html":"As the government's eligibility criteria suggest, income alone does not reflect a household's capacity to absorb shocks. Assets, r
