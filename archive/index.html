*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sombra",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mh{background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.mh .wrap{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 24px}

.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);white-space:nowrap}
.pill.go{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:900}
main{max-width:1240px;margin:0 auto;padding:40px 24px 64px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--rule);padding-bottom:16px;margin-bottom:28px;position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-2px;width:96px;height:4px;background:var(--teal);border-radius:2px}
h1{margin:0;font-weight:900;font-size:44px;line-height:1;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--ink2);font-size:17px}
.n{color:var(--ink2);font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;padding-bottom:18px}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 6px rgba(20,40,36,.1),0 16px 36px rgba(20,40,36,.14)}
.card:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.shot{position:relative;display:block;overflow:hidden;background:var(--rule);border-bottom:1px solid var(--rule)}
.shot img{width:100%;height:auto;display:block;transition:transform .3s ease;transform-origin:50% 0}
.card:hover .shot img{transform:scale(1.02)}
.latest{position:absolute;right:12px;top:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#FFA333;color:#2A1A05;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
.meta{display:flex;justify-content:space-between;gap:10px;padding:8px 18px 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.meta .no{color:var(--teal-ink);font-weight:900}
.meta .dt{color:var(--ink2)}
.ttl{padding:0 18px;font-weight:900;font-size:21px;line-height:1.2}
.ct{padding:0 18px;color:var(--ink2);font-size:14px}
.empty{color:var(--ink2);font-size:17px}
footer{border-top:1px solid var(--rule);color:var(--ink2);font-size:14px;text-align:center;padding:24px 16px 40px}
@media (max-width:899px){.credit{display:none}.brand{margin-right:auto}.brand svg{width:75px;height:24px}.wm{font-size:18px}.wm .l2{font-size:14px}.mh .wrap{padding:10px 16px;gap:8px}.pill{min-height:40px;padding:0 14px;font-size:13px}
  main{padding:28px 16px 48px}h1{font-size:34px}.top{flex-direction:column;align-items:flex-start}.grid{gap:20px}}
@media (max-width:399px){.pill .t{display:none}.pill{padding:0 11px}}
